<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>端侧部署 · 预览</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;height:100%;background:#2d2d2d;overflow:hidden}
  .deck-viewport{position:fixed;inset:0}
  .deck-stage{position:absolute;width:1920px;height:1080px;transform-origin:0 0;background:#2d2d2d}
  .page{position:absolute;left:80px;top:50px;right:120px;bottom:50px;background:#f8f6f1;border-radius:4px;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden}
  .holes{position:absolute;left:28px;top:80px;bottom:80px;width:18px;display:flex;flex-direction:column;justify-content:space-evenly}
  .holes i{width:18px;height:18px;border-radius:50%;background:#e5e1d8;box-shadow:inset 0 1px 3px rgba(0,0,0,.15)}
  .tabs{position:absolute;right:-44px;top:120px;display:flex;flex-direction:column;gap:14px}
  .tabs span{writing-mode:vertical-rl;transform:rotate(180deg);padding:18px 10px;font:500 14px "DM Sans",sans-serif;border-radius:0 8px 8px 0;color:#1a1a1a}
  .t1{background:#98d4bb}.t2{background:#c7b8ea}.t3{background:#f4b8c5}.t4{background:#a8d8ea}.t5{background:#ffe6a7}
  .content{position:absolute;left:90px;right:70px;top:70px;bottom:60px;font-family:"DM Sans",sans-serif;color:#1a1a1a}
  .eyebrow{font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:#7a756c;margin-bottom:18px}
  h1{font-family:"Bodoni Moda",serif;font-size:72px;font-weight:700;line-height:1.05;margin:0 0 18px;max-width:980px}
  .lead{font-size:24px;color:#4a463f;max-width:820px;line-height:1.45;margin-bottom:48px}
  .tree{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .card{background:#fff;border:1px solid #e6e1d6;padding:22px 20px;min-height:150px}
  .card b{display:block;font-family:"Bodoni Moda",serif;font-size:28px;margin-bottom:10px}
  .card p{margin:0;font-size:16px;color:#5c574f;line-height:1.45}
  .foot{position:absolute;left:90px;bottom:28px;font-size:14px;color:#9a9488}
</style>
</head>
<body>
<div class="deck-viewport"><div class="deck-stage" id="stage">
  <div class="page">
    <div class="holes"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="tabs">
      <span class="t1">底座</span><span class="t2">量化</span><span class="t3">性能</span><span class="t4">平台</span><span class="t5">量产</span>
    </div>
    <div class="content">
      <div class="eyebrow">Edge LLM · Knowledge Map</div>
      <h1>端侧大模型部署<br/>知识导图</h1>
      <p class="lead">从 Roofline 到车规 OTA：①–⑯ 完整三级结构，适合讲解与对照阅读。</p>
      <div class="tree">
        <div class="card"><b>①–②</b><p>底座 · 主链路 · 转换编译运行时</p></div>
        <div class="card"><b>③–④</b><p>量化压缩 · Prefill/Decode · KV</p></div>
        <div class="card"><b>⑤–⑩</b><p>QNN / TRT · 昇腾 · 板端实战</p></div>
        <div class="card"><b>⑬–⑯</b><p>选型 · 工具链 · 门禁 · 编译器</p></div>
      </div>
      <div class="foot">完整三级 · 阅读向 · 教学讲解</div>
    </div>
  </div>
</div></div>
<script>
(function(){const s=document.getElementById('stage');function fit(){const sc=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`translate(${(innerWidth-1920*sc)/2}px,${(innerHeight-1080*sc)/2}px) scale(${sc})`;}fit();addEventListener('resize',fit);})();
</script>
</body>
</html>
