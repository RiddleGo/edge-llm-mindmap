<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每月财务 · Russshare</title>
  <meta name="theme-color" content="#B8860B">
  <link rel="stylesheet" href="kb-theme.css">
  <link rel="stylesheet" href="portal-home.css">
</head>
<body class="kb-body">
  <button type="button" class="kb-hamburger" aria-label="打开菜单">☰</button>

    <nav class="kb-sidebar-nav" aria-label="主导航"></nav>

  <script src="site-nav-data.js"></script>
  <script src="kb-shell.js"></script>
