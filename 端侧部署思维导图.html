const MapApp = {
    open: false,
    path: [],
    layout: "ltr",
    l3Page: 0,
    pageSize: 10,
    view: { x: 0, y: 0, scale: 1 },
    minScale: 0.65,
    maxScale: 2,
    drag: null,
    suppressClick: false,
    init() {
        document.getElementById("rootNode").onclick = () => this.toggleRoot();
        document.getElementById("btnReset").onclick = () => this.reset();
        document.getElementById("btnView").onclick = () => this.resetView();
        document.getElementById("btnLtr").onclick = () => this.setLayout("ltr");
        document.getElementById("btnTtb").onclick = () => this.setLayout("ttb");
        this.bindViewport();
        this.bindSplitter();
        this.applyTransform();
        document.addEventListener("keydown", (e) => {
            if (deck.currentSlide !== 1) return;
            if (e.target && (e.target.isContentEditable || ["INPUT","TEXTAREA"].includes(e.target.tagName))) return;
            if (e.key === "r" || e.key === "R") this.reset();
            if (e.key === "l" || e.key === "L") this.setLayout(this.layout === "ltr" ? "ttb" : "ltr");
            if (e.key === "0") { e.preventDefault(); this.resetView(); }
        });
        window.addEventListener("resize", () => {
            this.clampReaderWidth();
            this.syncCanvasSize();
            this.drawWires();
        });
    },
    setReaderWidth(px) {
        const workspace = document.querySelector(".map-workspace");
        if (!workspace) return;
        const total = workspace.clientWidth || 1920;
        const minR = 280;
        const maxR = Math.max(minR, Math.floor(total * 0.7));
        const w = Math.round(Math.min(maxR, Math.max(minR, px)));
        document.documentElement.style.setProperty("--reader-w", w + "px");
        try { localStorage.setItem("edge-map-reader-w", String(w)); } catch (_) {}
        return w;
    },
    clampReaderWidth() {
        const raw = getComputedStyle(document.documentElement).getPropertyValue("--reader-w").trim();
        const cur = parseInt(raw, 10);
        if (!Number.isFinite(cur)) return;
        this.setReaderWidth(cur);
    },
    bindSplitter() {
        const handle = document.getElementById("splitHandle");
        const workspace = document.querySelector(".map-workspace");
        if (!handle || !workspace) return;
        try {
            const saved = parseInt(localStorage.getItem("edge-map-reader-w") || "", 10);
            if (Number.isFinite(saved)) this.setReaderWidth(saved);
        } catch (_) {}
        let dragging = false;
        const onMove = (e) => {
            if (!dragging) return;
            const rect = workspace.getBoundingClientRect();
            const scale = rect.width / (workspace.clientWidth || rect.width) || 1;
            const x = (e.clientX - rect.left) / scale;
            const readerW = workspace.clientWidth - x;
            this.setReaderWidth(readerW);
            this.syncCanvasSize();
        };
        const onUp = () => {
            if (!dragging) return;
            dragging = false;
            handle.classList.remove("is-dragging");
            workspace.classList.remove("is-resizing");
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
            this.syncCanvasSize();
            this.drawWires();
        };
        handle.addEventListener("pointerdown", (e) => {
            if (e.pointerType === "mouse" && e.button !== 0) return;
            dragging = true;
            handle.classList.add("is-dragging");
            workspace.classList.add("is-resizing");
            try { handle.setPointerCapture(e.pointerId); } catch (_) {}
            window.addEventListener("pointermove", onMove);
            window.addEventListener("pointerup", onUp);
            e.preventDefault();
        });
        handle.addEventListener("dblclick", () => {
            this.setReaderWidth(480);
            this.syncCanvasSize();
            this.drawWires();
        });
    },
    boardScale() {
        const board = document.getElementById("mapBoard");
        const r = board.getBoundingClientRect();
        return r.width / (board.clientWidth || 1920) || 1;
    },
    applyTransform() {
        const el = document.getElementById("mapCanvas");
        el.style.transform = (!this.view.scale || this.view.scale === 1) ? "none" : `scale(${this.view.scale})`;
    },
    resetView() {
        this.view = { x: 0, y: 0, scale: 1 };
        const board = document.getElementById("mapBoard");
        if (board) { board.scrollLeft = 0; board.scrollTop = 0; }
        this.applyTransform();
        this.drawWires();
    },
    syncCanvasSize() {
        const board = document.getElementById("mapBoard");
        const canvas = document.getElementById("mapCanvas");
        const cols = document.getElementById("cols");
        const svg = document.getElementById("wires");
        if (!board || !canvas || !cols || !svg) return;
        const cw = Math.max(board.clientWidth, Math.ceil(cols.scrollWidth + 80));
        const ch = Math.max(board.clientHeight, Math.ceil(cols.scrollHeight + 48));
        canvas.style.width = cw + "px";
        canvas.style.height = ch + "px";
        svg.setAttribute("viewBox", `0 0 ${cw} ${ch}`);
        svg.setAttribute("width", String(cw));
        svg.setAttribute("height", String(ch));
    },
    bindViewport() {
        const board = document.getElementById("mapBoard");
        // Reading-first: native scroll. Space+drag pans the browser pane only.
        let spaceDown = false;
        let drag = null;
        window.addEventListener("keydown", (e) => {
            if (e.code !== "Space" || e.repeat) return;
            const t = e.target;
            if (t && (t.isContentEditable || ["INPUT","TEXTAREA","BUTTON"].includes(t.tagName))) return;
            spaceDown = true;
            board.classList.add("space-pan");
            e.preventDefault();
        });
        window.addEventListener("keyup", (e) => {
            if (e.code === "Space") {
                spaceDown = false;
                board.classList.remove("space-pan");
            }
        });
        board.addEventListener("pointerdown", (e) => {
            if (!spaceDown) return;
            if (e.pointerType === "mouse" && e.button !== 0) return;
            drag = { id: e.pointerId, x: e.clientX, y: e.clientY, sl: board.scrollLeft, st: board.scrollTop };
            board.classList.add("is-panning");
            try { board.setPointerCapture(e.pointerId); } catch (_) {}
            e.preventDefault();
        });
        board.addEventListener("pointermove", (e) => {
            if (!drag || e.pointerId !== drag.id) return;
            board.scrollLeft = drag.sl - (e.clientX - drag.x);
            board.scrollTop = drag.st - (e.clientY - drag.y);
        });
        const endDrag = (e) => {
            if (!drag || e.pointerId !== drag.id) return;
            drag = null;
            board.classList.remove("is-panning");
        };
        board.addEventListener("pointerup", endDrag);
        board.addEventListener("pointercancel", endDrag);
        board.addEventListener("wheel", (e) => {
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                const old = this.view.scale || 1;
                const factor = e.deltaY < 0 ? 1.06 : 1 / 1.06;
                const next = Math.min(this.maxScale || 1.6, Math.max(this.minScale || 0.75, old * factor));
                this.view.scale = next;
                this.view.x = 0; this.view.y = 0;
                this.applyTransform();
            }
            // else: native scroll on board / lists
        }, { passive: false });
    },
    find(id, node = TREE) {
        if (node.id === id) return node;
        for (const k of node.kids || []) {
            const f = this.find(id, k);
            if (f) return f;
        }
        return null;
    },
    toggleRoot() {
        this.open = !this.open;
        if (!this.open) this.path = [];
        this.l3Page = 0;
        this.render();
    },
    reset() {
        this.open = false;
        this.path = [];
        this.l3Page = 0;
        this.resetView();
        this.render();
    },
    setLayout(mode) {
        this.layout = mode;
        document.getElementById("cols").classList.toggle("ttb", mode === "ttb");
        document.getElementById("btnLtr").classList.toggle("on", mode === "ltr");
        document.getElementById("btnTtb").classList.toggle("on", mode === "ttb");
        this.render();
    },
    pick(depth, id) {
        if (depth === 1) this.path = this.path[0] === id ? [] : [id];
        if (depth === 2) this.path = this.path[1] === id ? [this.path[0]] : [this.path[0], id];
        if (depth === 3) this.path = [this.path[0], this.path[1], id];
        this.l3Page = 0;
        this.render();
    },
    fillList(el, nodes, depth, activeId, twoCol) {
        el.innerHTML = "";
        if (twoCol) el.className = "l3-grid";
        nodes.forEach((n, i) => {
            const b = document.createElement("button");
            b.type = "button";
            let cls = "node";
            if (n.kids && n.kids.length) cls += " has-kids";
            if (n.id === activeId) cls += " active";
            if (n.k === 1) cls += " key-1";
            else if (n.k === 2) cls += " key-2";
            b.className = cls;
            b.dataset.id = n.id;
            b.style.transitionDelay = `${Math.min(i, 12) * 0.03}s`;
            b.innerHTML = esc(n.t);
            b.onclick = () => this.pick(depth, n.id);
            el.appendChild(b);
        });
    },
    explainBlock(n, metaLine) {
        const fmt = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        const paras = (s) => String(s || "")
            .split(/\n\n+/)
            .map((p) => p.trim())
            .filter(Boolean)
            .map((p) => `<p>${fmt(p).replace(/\n/g, "<br>")}</p>`)
            .join("") || `<p>${esc("（暂无说明）")}</p>`;
        let badge = "";
        if (n.k === 2) badge = `<span class="key-badge key-2">核心</span>`;
        else if (n.k === 1) badge = `<span class="key-badge key-1">重点</span>`;
        let body = badge;
        body += `<div class="explain-label">讲义正文</div>${paras(n.d)}`;
        if (n.w) body += `<div class="explain-label">起什么作用</div><p>${fmt(n.w)}</p>`;
        if (n.b) body += `<p class="bridge-text">${fmt(n.b)}</p>`;
        if (metaLine) body += `<p class="meta-line">${esc(metaLine)}</p>`;
        return `<div class="explain-block">${body}</div>`;
    },
    render() {
        const col1 = document.getElementById("col1");
        const col2 = document.getElementById("col2");
        const col3 = document.getElementById("col3");
        const list1 = document.getElementById("list1");
        const list2 = document.getElementById("list2");
        const list3 = document.getElementById("list3");
        const rootBtn = document.getElementById("rootNode");
        rootBtn.classList.toggle("active", this.open);

        col1.classList.toggle("show", this.open);
        if (this.open) this.fillList(list1, TREE.kids, 1, this.path[0]);

        const l1 = this.path[0] ? this.find(this.path[0]) : null;
        col2.classList.toggle("show", !!(l1 && l1.kids && l1.kids.length));
        if (l1) this.fillList(list2, l1.kids, 2, this.path[1]);

        const l2 = this.path[1] ? this.find(this.path[1]) : null;
        const leaves = l2 && l2.kids ? l2.kids : [];
        // only show知识点列 when theme actually has children（内容少则停在主题）
        col3.classList.toggle("show", !!(l2 && leaves.length));
        const start = this.l3Page * this.pageSize;
        const page = leaves.slice(start, start + this.pageSize);
        this.fillList(list3, page, 3, this.path[2], true);

        const pager = document.getElementById("pager");
        const pages = Math.max(1, Math.ceil(leaves.length / this.pageSize));
        pager.innerHTML = "";
        if (leaves.length > this.pageSize) {
            const prev = document.createElement("button");
            prev.className = "tool"; prev.textContent = "上页";
            prev.onclick = () => { this.l3Page = Math.max(0, this.l3Page - 1); this.render(); };
            const next = document.createElement("button");
            next.className = "tool"; next.textContent = "下页";
            next.onclick = () => { this.l3Page = Math.min(pages - 1, this.l3Page + 1); this.render(); };
            pager.append(prev, document.createTextNode(` ${this.l3Page + 1}/${pages} `), next);
        }

        const leaf = this.path[2] ? this.find(this.path[2]) : null;
        const detail = document.getElementById("detail");
        if (leaf) {
            detail.innerHTML = `<h3>${esc(leaf.t)}</h3>${this.explainBlock(leaf)}`;
        } else if (l2) {
            const hint = leaves.length ? `右侧 ${leaves.length} 个知识点` : "";
            detail.innerHTML = `<h3>${esc(l2.t)}</h3>${this.explainBlock(l2, hint)}`;
        } else if (l1) {
            detail.innerHTML = `<h3>${esc(l1.t)}</h3>${this.explainBlock(l1, "选择主题继续")}`;
        } else {
            detail.innerHTML = `<h3>从左边开始</h3><p>点根节点 → 选一章 → 再选主题。内容多的主题才会展开知识点；基础小节点到主题即可读全文。</p>`;
        }

        const parts = ["根"];
        if (l1) parts.push(l1.t);
        if (l2) parts.push(l2.t);
        if (leaf) parts.push(leaf.t);
        document.getElementById("crumb").textContent = parts.join("  /  ");

        requestAnimationFrame(() => {
            this.syncCanvasSize();
            this.drawWires();
        });
    },
    drawWires() {
        const svg = document.getElementById("wires");
        svg.innerHTML = "";
        if (!this.open) return;
        const board = svg.getBoundingClientRect();
        const vbW = (svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width) || board.width || 1920;
        const scale = board.width / vbW || 1;
        const pairs = [];
        const root = document.getElementById("rootNode");
        const l1s = [...document.querySelectorAll("#list1 .node")];
        const l2s = [...document.querySelectorAll("#list2 .node")];
        const l3s = [...document.querySelectorAll("#list3 .node")];
        const activeL1 = document.querySelector("#list1 .node.active") || l1s[0];
        const activeL2 = document.querySelector("#list2 .node.active") || l2s[0];
        if (this.layout === "ltr") {
            l1s.forEach((n) => pairs.push([root, n]));
            if (activeL1) l2s.forEach((n) => pairs.push([activeL1, n]));
            if (activeL2) l3s.forEach((n) => pairs.push([activeL2, n]));
        } else {
            l1s.forEach((n) => pairs.push([root, n]));
            if (activeL1) l2s.forEach((n) => pairs.push([activeL1, n]));
            if (activeL2) l3s.forEach((n) => pairs.push([activeL2, n]));
        }
        pairs.forEach(([a, b]) => {
            if (!a || !b) return;
            const ra = a.getBoundingClientRect();
            const rb = b.getBoundingClientRect();
            let x1, y1, x2, y2;
            if (this.layout === "ltr") {
                x1 = (ra.right - board.left) / scale;
                y1 = (ra.top + ra.height / 2 - board.top) / scale;
                x2 = (rb.left - board.left) / scale;
                y2 = (rb.top + rb.height / 2 - board.top) / scale;
            } else {
                x1 = (ra.left + ra.width / 2 - board.left) / scale;
                y1 = (ra.bottom - board.top) / scale;
                x2 = (rb.left + rb.width / 2 - board.left) / scale;
                y2 = (rb.top - board.top) / scale;
            }
            const mx = (x1 + x2) / 2;
            const my = (y1 + y2) / 2;
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", this.layout === "ltr"
                ? `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`
                : `M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`);
            path.setAttribute("fill", "none");
            path.setAttribute("stroke", "rgba(34,197,94,.35)");
            path.setAttribute("stroke-width", "1.2");
            svg.appendChild(path);
        });
    }
};

function esc(s) {
    return String(s || "").replace(/[&<>"']/g, (c) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[c]));
}

const deck = new SlidePresentation();
MapApp.init();

window.__mapApp = MapApp;

/* === Curriculum tab switch === */
(function setupCurrTabs() {
    const tabMain = document.getElementById("tabMain");
    const tabJd = document.getElementById("tabJd");
    if (!tabMain || !tabJd || !window.__mapApp) return;
    const app = window.__mapApp;
    const rootBtn = document.getElementById("rootNode");
    const crumb = document.getElementById("crumb");
    const detail = document.getElementById("detail");
    const hint = document.querySelector(".map-hint");
    function applyTree(which) {
        CURR = which;
        TREE = which === "jd" ? TREE_JD : TREE_MAIN;
        tabMain.classList.toggle("on", which === "main");
        tabJd.classList.toggle("on", which === "jd");
        tabMain.setAttribute("aria-selected", which === "main" ? "true" : "false");
        tabJd.setAttribute("aria-selected", which === "jd" ? "true" : "false");
        if (rootBtn) {
            const sub = which === "jd"
                ? "对标招聘缺口 · 与主线并列"
                : "点开后按 1→2→3… 讲";
            rootBtn.innerHTML = (TREE.t || "知识树") + '<span class="sub">' + sub + "</span>";
        }
        if (crumb) crumb.textContent = TREE.t || "根节点";
        if (detail) {
            detail.innerHTML = which === "jd"
                ? "<h3>JD 补全</h3><p>本页补主线未写透的缺口：指令流水、DeepSeek MLA、框架源码向、TGI、Glow、RISC-V、集合通信、云 Serving。点左边目录阅读。</p>"
                : "<h3>从左边开始</h3><p>点根节点 → 选一章 → 选主题 → 选知识点。目录只负责导航，说明都在右侧阅读。</p>";
        }
        if (hint) {
            hint.textContent = which === "jd"
                ? "当前：JD补全 · 与端侧主线并列 · 不替代连载顺序"
                : "左侧点目录 · 列表内滚动 · 拖中间竖线调左右宽度 · 右侧读讲义";
        }
        if (typeof app.reset === "function") app.reset();
        else if (typeof app.render === "function") {
            app.open = false;
            app.path = [];
            app.render();
        }
    }
    tabMain.onclick = () => applyTree("main");
    tabJd.onclick = () => applyTree("jd");
})();
</script>
