<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>端侧大模型部署 · 思维导图</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+SC:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
<style>
/* === THEME: Terminal Blueprint === */
:root {
    --stage-bg: #05070a;
    --slide-bg: #070b10;
    --bg-primary: #070b10;
    --grid-line: rgba(74, 222, 128, 0.06);
    --accent: #4ade80;
    --accent-bright: #86efac;
    --accent-dim: #166534;
    --accent-glow: rgba(74, 222, 128, 0.32);
    --key-1: #fbbf24;
    --key-2: #fb7185;
    --key-1-bg: rgba(251, 191, 36, 0.12);
    --key-2-bg: rgba(251, 113, 133, 0.12);
    --bridge: #67e8f9;
    --text-primary: #ecfdf5;
    --text-muted: #93a89c;
    --text-leaf: #bbf7d0;
    --node-bg: #0b1218;
    --node-active: #0f2a18;
    --danger: #86efac;
    --font-display: "Syne", "IBM Plex Sans SC", sans-serif;
    --font-body: "IBM Plex Sans SC", "Noto Sans SC", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    --fs-root: 28px;
    --fs-chapter: 16px;
    --fs-topic: 15px;
    --fs-term: 14px;
    --fs-label: 12px;
    --fs-detail-title: 16px;
    --reader-w: 480px;
    --fs-detail-body: 17px;
    --col-gap: 18px;
    --node-gap: 8px;
    --node-inactive-opacity: 0.78;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --duration-normal: 0.45s;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
    font-family: var(--font-body);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* === GRID STAGE === */
.slide {
    font-family: var(--font-body);
    color: var(--text-primary);
    background-color: var(--bg-primary);
    background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 48px 48px;
}

.reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity var(--duration-normal) var(--ease-out-expo),
                transform var(--duration-normal) var(--ease-out-expo);
}
.slide.visible .reveal { opacity: 1; transform: none; }
.slide.visible .reveal:nth-child(1) { transition-delay: 0.05s; }
.slide.visible .reveal:nth-child(2) { transition-delay: 0.14s; }
.slide.visible .reveal:nth-child(3) { transition-delay: 0.24s; }
.slide.visible .reveal:nth-child(4) { transition-delay: 0.34s; }

/* === TITLE SLIDE === */
.title-slide .glow {
    position: absolute;
    width: 720px; height: 720px;
    left: 50%; top: 44%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, var(--accent-glow), transparent 68%);
    pointer-events: none;
}
.title-kicker {
    position: absolute; left: 88px; top: 88px;
    font-family: var(--font-mono);
    letter-spacing: 0.32em; font-size: 14px; font-weight: 500;
    color: var(--accent-bright);
}
.title-slide h1 {
    position: absolute; left: 88px; top: 300px;
    font-family: var(--font-display); font-weight: 800;
    font-size: 96px; line-height: 1.06; letter-spacing: -0.02em;
    max-width: 1200px;
    color: var(--text-primary);
}
.title-lead {
    position: absolute; left: 88px; top: 560px;
    font-family: var(--font-body); font-weight: 400;
    font-size: 26px; color: var(--text-leaf);
    max-width: 920px; line-height: 1.72;
}
.enter-btn {
    position: absolute; left: 88px; bottom: 156px;
    border: 1px solid var(--accent-bright); background: transparent;
    color: var(--accent-bright);
    font: 600 17px/1 var(--font-mono);
    padding: 18px 36px; cursor: pointer; letter-spacing: 0.1em;
    transition: background 0.25s ease, color 0.25s ease;
}
.enter-btn:hover { background: var(--accent); color: #04110a; border-color: var(--accent); }
.title-hint {
    position: absolute; right: 88px; bottom: 96px;
    font-family: var(--font-mono);
    font-size: 13px; line-height: 1.65;
    color: var(--text-muted); max-width: 420px; text-align: right;
}

/* === MAP SLIDE — reading-first === */
.map-top {
    position: absolute; left: 36px; right: 36px; top: 14px; height: 52px;
    display: flex; align-items: center; gap: 10px; z-index: 6;
}
.map-top h2 {
    flex: 0 0 auto;
    font-family: var(--font-display); font-size: 24px; font-weight: 800;
    letter-spacing: -0.01em; margin-right: 10px; color: var(--text-primary);
}
.crumb {
    flex: 1 1 auto; min-width: 0;
    font-family: var(--font-body); font-size: 14px; font-weight: 400;
    color: var(--text-muted); line-height: 1.4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-right: 8px;
}
.tool {
    flex: 0 0 auto; white-space: nowrap;
    border: 1px solid var(--accent-dim); background: var(--node-bg);
    color: var(--text-leaf); font: 500 12px/1 var(--font-mono);
    padding: 8px 12px; cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
}
.tool.on, .tool:hover { border-color: var(--accent-bright); color: var(--accent-bright); }

.map-hint {
    position: absolute; left: 36px; right: 36px; top: 66px;
    font-family: var(--font-mono); font-size: 12px; font-weight: 400;
    color: var(--text-muted); letter-spacing: 0.03em; line-height: 1.4;
    opacity: 0.92; pointer-events: none; z-index: 6;
}

.map-legend {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 11px;
    color: var(--text-muted); white-space: nowrap; margin-right: 4px;
}
.map-legend .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 3px; vertical-align: middle; background: var(--accent);
}
.map-legend .dot.key1 { background: var(--key-1); }
.map-legend .dot.key2 { background: var(--key-2); }

/* Left browser + splitter + right reader */
.map-workspace {
    position: absolute; left: 0; top: 90px; right: 0; bottom: 0;
    display: grid;
    grid-template-columns: minmax(280px, 1fr) 8px var(--reader-w, 480px);
    gap: 0;
    overflow: hidden;
    background: var(--slide-bg);
}
.map-workspace.is-resizing {
    cursor: col-resize;
    user-select: none;
}
.map-workspace.is-resizing * { cursor: col-resize !important; }
.split-handle {
    position: relative;
    z-index: 4;
    width: 8px;
    margin: 0 -1px;
    cursor: col-resize;
    touch-action: none;
    background: transparent;
    border: none;
    padding: 0;
    align-self: stretch;
}
.split-handle::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    width: 1px;
    transform: translateX(-50%);
    background: rgba(74, 222, 128, 0.28);
    transition: background 0.15s ease, box-shadow 0.15s ease, width 0.15s ease;
}
.split-handle:hover::before,
.split-handle.is-dragging::before,
.map-workspace.is-resizing .split-handle::before {
    width: 2px;
    background: var(--accent-bright);
    box-shadow: 0 0 10px rgba(74, 222, 128, 0.35);
}
.split-handle::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 3px; height: 36px;
    transform: translate(-50%, -50%);
    border-radius: 2px;
    background: rgba(74, 222, 128, 0.35);
    opacity: 0;
    transition: opacity 0.15s ease;
}
.split-handle:hover::after,
.split-handle.is-dragging::after {
    opacity: 1;
}
.map-board {
    position: relative;
    overflow: auto;
    cursor: default;
    touch-action: pan-x pan-y;
    user-select: none;
    padding: 10px 16px 28px 36px;
    scrollbar-width: thin;
    scrollbar-color: var(--accent-dim) transparent;
    overscroll-behavior: contain;
    min-width: 0;
}
.map-board.space-pan { cursor: grab; }
.map-board.is-panning { cursor: grabbing; }
.map-board svg { max-width: none; max-height: none; }

#mapCanvas {
    position: relative;
    left: 0; top: 0;
    min-width: 100%;
    min-height: 100%;
    transform-origin: 0 0;
}
#wires {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; overflow: visible; opacity: 0.45;
}
.cols {
    position: relative; left: 0; top: 4px;
    display: flex; flex-direction: row; gap: var(--col-gap); align-items: flex-start;
    width: max-content;
    min-width: calc(100% - 20px);
    height: auto;
    overflow: visible;
    padding-bottom: 16px;
}
.cols.ttb {
    flex-direction: column; gap: 14px;
    width: calc(100% - 20px);
}
.col {
    flex: 0 0 auto; min-width: 220px;
    display: none; flex-direction: column; gap: 8px;
    opacity: 0; pointer-events: none;
    transform: translateX(-14px);
    transition: opacity 0.32s var(--ease-out-expo), transform 0.32s var(--ease-out-expo);
}
.col.show {
    display: flex; opacity: 1; pointer-events: auto; transform: none;
}
#col0.show { width: 250px; min-width: 250px; max-width: 250px; }
#col1.show { width: 292px; min-width: 292px; max-width: 292px; }
#col2.show { width: 292px; min-width: 292px; max-width: 292px; }
#col3.show { width: 400px; min-width: 400px; max-width: 420px; }
.cols.ttb #col0.show,
.cols.ttb #col1.show,
.cols.ttb #col2.show,
.cols.ttb #col3.show { width: 100%; min-width: 0; max-width: none; }
.cols.ttb .col {
    transform: translateY(-10px);
    flex-direction: row; flex-wrap: wrap; align-content: flex-start;
}
.cols.ttb .col.show { transform: none; }

.col-label {
    font-family: var(--font-mono);
    font-size: var(--fs-label); font-weight: 500;
    letter-spacing: 0.1em; color: var(--accent-bright);
    min-height: 18px; flex: 0 0 auto;
    opacity: 0.88; line-height: 1.35; margin-bottom: 2px;
}

/* Directory cards: title only */
.node {
    border: 1px solid rgba(22, 101, 52, 0.7);
    background: var(--node-bg);
    color: var(--text-leaf);
    font-family: var(--font-body);
    font-size: var(--fs-topic); font-weight: 500; line-height: 1.35;
    padding: 10px 28px 10px 12px;
    cursor: pointer;
    text-align: left;
    width: 100%;
    position: relative;
    transition: border-color 0.15s ease, background 0.15s ease, opacity 0.2s ease;
    word-break: break-word;
    box-shadow: none;
}
.col.show .node:not(.active):not(.root-node) { opacity: var(--node-inactive-opacity); }
.cols.ttb .node { width: auto; min-width: 190px; max-width: 320px; }
.node:hover {
    border-color: var(--accent);
    opacity: 1;
}
.node.active {
    opacity: 1;
    background: var(--node-active);
    border-color: var(--accent-bright);
    color: #f0fdf4;
    font-weight: 600;
    box-shadow: inset 0 0 0 1px rgba(134, 239, 172, 0.16);
}
.node.key-1 {
    border-color: rgba(251, 191, 36, 0.45);
    border-left: 3px solid var(--key-1);
}
.node.key-2 {
    border-color: rgba(251, 113, 133, 0.45);
    border-left: 3px solid var(--key-2);
}
.node.key-1:hover { border-color: var(--key-1); }
.node.key-2:hover { border-color: var(--key-2); }
.node.key-1.active {
    background: var(--key-1-bg);
    border-color: var(--key-1);
    color: #fffbeb;
}
.node.key-2.active {
    background: var(--key-2-bg);
    border-color: var(--key-2);
    color: #fff1f2;
}
.node.key-1::before,
.node.key-2::before {
    position: absolute; top: 4px; left: 8px;
    font-family: var(--font-mono);
    font-size: 9px; font-weight: 600; line-height: 1;
    letter-spacing: 0.04em; pointer-events: none; opacity: 0.85;
}
.node.key-1::before { content: "重点"; color: var(--key-1); }
.node.key-2::before { content: "核心"; color: var(--key-2); }
.node.key-1, .node.key-2 { padding-top: 16px; }

.node.root-node {
    font-family: var(--font-display); font-weight: 800;
    font-size: 20px; line-height: 1.28;
    padding: 18px 14px; text-align: center; min-height: 88px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.node.root-node .sub {
    display: block !important;
    margin-top: 8px;
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 400;
    color: var(--text-muted); line-height: 1.4;
}
.node .sub { display: none; }

#list1 .node {
    font-size: var(--fs-chapter); font-weight: 600;
    padding: 10px 28px 10px 12px;
}
#list2 .node {
    font-size: var(--fs-topic); font-weight: 500;
    padding: 9px 28px 9px 12px;
}
#list3 .node {
    font-size: var(--fs-term); font-weight: 400;
    padding: 9px 12px;
    display: block;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#list1 .node.key-1, #list1 .node.key-2,
#list2 .node.key-1, #list2 .node.key-2,
#list3 .node.key-1, #list3 .node.key-2 { padding-top: 16px; }

#list1, #list2, #list3 {
    max-height: calc(1080px - 220px);
    overflow-y: auto; overflow-x: hidden;
    padding-right: 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--accent-dim) transparent;
    overscroll-behavior: contain;
}
.node.has-kids::after {
    content: "▸";
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%);
    color: var(--accent-bright); font-size: 11px;
    font-family: var(--font-mono); opacity: 0.75;
}
.cols.ttb .node.has-kids::after { content: "▾"; top: 10px; transform: none; }
.node, .pager, .tool { cursor: pointer; }
.list {
    display: flex; flex-direction: column; gap: var(--node-gap);
    flex: 0 0 auto; overflow: visible;
}
.cols.ttb .list { flex-direction: row; flex-wrap: wrap; width: 100%; gap: 8px; }
.l3-grid, .l3-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: var(--node-gap);
}
.cols.ttb .l3-grid { grid-template-columns: repeat(3, 1fr); width: 100%; }

/* Reader — primary reading surface */
.reader {
    border-left: none;
    background: linear-gradient(180deg, #0a1210 0%, #070b0c 100%);
    padding: 16px 22px 22px;
    overflow: hidden;
    display: flex; flex-direction: column;
    min-width: 0;
}
.reader-label {
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--accent-bright);
    margin-bottom: 12px;
    opacity: 0.92;
    flex: 0 0 auto;
}
.detail {
    border: none; background: transparent; padding: 0;
    min-height: 0; max-height: none; max-width: 100%;
    overflow-y: auto; overscroll-behavior: contain;
    flex: 1 1 auto;
    scrollbar-width: thin;
    scrollbar-color: var(--accent-dim) transparent;
}
.detail h3 {
    font-family: var(--font-body);
    font-size: var(--fs-detail-title); font-weight: 600;
    line-height: 1.45; margin-bottom: 12px;
    color: var(--text-primary);
    letter-spacing: 0;
}
.detail > p {
    font-family: var(--font-body);
    font-size: var(--fs-detail-body);
    line-height: 1.85; color: var(--text-leaf);
    max-width: 36em;
}
.explain-block { margin-top: 0; max-width: 36em; }
.explain-block strong {
    color: #fde68a;
    font-weight: 600;
}
.key-badge {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    padding: 2px 8px;
    border-radius: 2px;
    margin-bottom: 10px;
}
.key-badge.key-1 {
    color: var(--key-1);
    background: var(--key-1-bg);
    border: 1px solid rgba(251, 191, 36, 0.35);
}
.key-badge.key-2 {
    color: var(--key-2);
    background: var(--key-2-bg);
    border: 1px solid rgba(251, 113, 133, 0.35);
}
.explain-label {
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--accent-bright);
    margin: 22px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(74, 222, 128, 0.18);
}
.explain-label:first-child { margin-top: 0; }
.explain-label.explain-bridge {
    color: var(--bridge);
    border-bottom-color: rgba(103, 232, 249, 0.22);
}
.explain-block p {
    margin: 0 0 1.65em;
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.85;
    color: var(--text-leaf);
}
.explain-block p:last-child {
    margin-bottom: 0;
}
.explain-block .bridge-text {
    color: #a5f3fc;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid rgba(103, 232, 249, 0.22);
}
.explain-block .meta-line {
    margin-top: 22px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
}
.pager {
    display: flex; gap: 8px; align-items: center;
    font-family: var(--font-mono);
    font-size: 12px; color: var(--text-muted);
    margin-top: 4px;
}


.node.key-1 { border-color: rgba(251, 191, 36, 0.45); border-left: 3px solid var(--key-1); }
.node.key-2 { border-color: rgba(251, 113, 133, 0.45); border-left: 3px solid var(--key-2); }
.node.key-1:hover { border-color: var(--key-1); }
.node.key-2:hover { border-color: var(--key-2); }
.node.key-1.active { background: var(--key-1-bg); border-color: var(--key-1); color: #fffbeb; }
.node.key-2.active { background: var(--key-2-bg); border-color: var(--key-2); color: #fff1f2; }
.node.key-1::before, .node.key-2::before {
    position: absolute; top: 4px; left: 8px;
    font-family: var(--font-mono); font-size: 9px; font-weight: 600; line-height: 1;
    letter-spacing: 0.04em; pointer-events: none; opacity: 0.85;
}
.node.key-1::before { content: "重点"; color: var(--key-1); }
.node.key-2::before { content: "核心"; color: var(--key-2); }
.node.key-1, .node.key-2 { padding-top: 16px; }
#list1 .node.key-1, #list1 .node.key-2,
#list2 .node.key-1, #list2 .node.key-2,

const TREE_MAIN = {"id":"root","t":"端侧大模型部署","d":"按岗位画像 → 能力分层 → 五层技能 → 面试考点展开。右侧讲义直接来自《端侧模型部署.md》原文。","kids":[{"id":"c1","t":"1 · 岗位画像：这个岗位到底在做什么？","d":"端侧模型部署与推理优化工程师的核心使命是：**让大模型在手机、车机、机器人、嵌入式设备等资源受限的端侧平台上，跑得快、跑得稳、跑得省。** 综合各公司JD，工作内容可分为六个层次：","kids":[{"id":"c1-2","t":"1.1 · 推理框架开发与引擎定制","d":"**① 推理框架开发与引擎定制** — 参与端侧大模型推理框架的核心模块开发，包括模型解析、计算图优化、算子适配、内存管理、推理调度等。字节跳动进一步要求\"通过CPU/GPU/DSP/NPU的并行计算优化、架构设计、稀疏优化、异构调度等多种高性能优化技术打造业界领先的高性能异构AI推理引擎\"。","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c1-3","t":"1.2 · 模型压缩与轻量化","d":"**② 模型压缩与轻量化** — 主导模型量化（PTQ/QAT）、剪枝、蒸馏、NAS等轻量化技术的落地。中国电信将其细化为\"模型轻量化改造，适配国产芯片\"。德赛西威要求\"理解AI算法网络的计算原理，了解相关模型的计算图优化方法，包括但不限于量化、剪枝、稀疏、蒸馏等\"。","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c1-4","t":"1.3 · 硬件平台适配与部署","d":"**③ 硬件平台适配与部署** — 将AI模型部署至手机、嵌入式装置及定制化NPU平台，执行模型转换、量化、精度验证与效能优化。具体平台覆盖NVIDIA Jetson/Orin、高通8255/8295、地平线征程系列、华为昇腾、自研芯片等。","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c1-5","t":"1.4 · 性能瓶颈分析与极致调优","d":"**④ 性能瓶颈分析与极致调优** — 运用性能分析工具深入剖析推理全过程，精准定位计算、内存、通信瓶颈。腾讯要求\"通过量化、剪枝、蒸馏、算子融合、编译优化、显存与调度优化等手段，将硬件算力发挥到极致，持续降延迟、提吞吐、控功耗\"。上海AI实验室要求\"针对机器人的高频控制闭环需求（如数百Hz的动作输出频率），开展端侧推理性能极致调优\"。","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c1-6","t":"1.5 · 评测体系与工具链建设","d":"**⑤ 评测体系与工具链建设** — 搭建模型性能评测体系，建设自动化模型转换与部署工具链。小鹏要求\"参与模型部署工具链建设，完善模型转换、性能基准、端侧验证和发布流程\"。","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c1-7","t":"1.6 · 端云协同与工程化封装","d":"**⑥ 端云协同与工程化封装** — 华为明确要求\"熟悉端-边缘-云协同架构，能够决策local设备执行任务（低延迟动作），Edge处理任务（视觉语义理解）\"。上海AI实验室要求\"负责推理服务的工程化封装，并与机器人底层控制系统或中间件（如ROS/ROS2, DDS）深度集成\"。","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0}],"w":"给学习路径一个章节锚点。","b":"","k":0},{"id":"c2","t":"2 · 能力分层图谱：从初级到专家的技术进阶","d":"不同级别岗位的技术要求差异显著，以下按纯技术能力分层：","kids":[{"id":"c2-1","t":"2.1 · 初级","d":"维度；典型能力要求\n编程；熟练掌握C/C++或Python，具备良好的数据结构与算法基础\n理论；理解Transformer/LLM基础原理及推理流程，熟悉Attention、KV Cache、Prefill/Decode\n框架；熟悉至少一种推理框架（TensorRT、MNN、ONNX Runtime），有完整的部署项目实践\n特征；能独立完成模型转换、真机部署与基本功能调试；止步于调用转换脚本与工具链API","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c2-2","t":"2.2 · 中级","d":"维度；典型能力要求\n核心能力；独立完成模型适配、功能调试和底层性能问题定位；熟练使用PyTorch，理解计算图、张量处理机制及算子实现\n量化；精通PTQ/QAT，熟悉QNN SDK工具链（模型转换/量化/性能分析），能系统性排查量化精度劣化\n平台；有高通8155/8295、地平线BPU、NVIDIA Jetson等平台实战经验，理解目标硬件的架构约束\n特征；理解算子融合与布局优化原理，能定位\"哪个Pass吃了我的精度/性能\"；能把Roofline分析落地为优化方向选择","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c2-3","t":"2.3 · 高级/专家","d":"维度；典型能力要求\n系统能力；精通\"端-边缘-云\"协同架构；具备编译器/运行时/算子库全栈优化能力\n架构能力；定义边缘智能技术战略与路线，定义推理SLA指标体系；能主导从0到1的产品落地\n技术深度；能编写推理引擎优化Pass并论证等价性；能编写高性能CUDA Kernel/Triton算子、TensorRT Plugin、NPU自定义算子，解决\"最后一公里\"问题\n影响力；有开源项目贡献（vLLM/SGLang等）、顶会论文（MLSys/ASPLOS/OSDI/NeurIPS）、专利布局\n\n**分水岭判据** — 初级只会调框架API和trtexec参数；中级理解融合与布局优化原理；高级能写Pass、写算子、论证等价性。是否内化\"**推理引擎即编译器**\"的心智模型，直接决定问题定位的深度。","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0}],"w":"给学习路径一个章节锚点。","b":"","k":0},{"id":"c3","t":"3 · 技能图谱总览：五层递进结构","d":"端侧推理优化知识有明确的依赖链，建议按以下五层递进掌握：\n\n第一层  大模型推理原理        （知道\"算什么\"）\n第二层  模型压缩与量化        （知道\"怎么变小\"）\n第三层  推理框架与AI编译栈     （知道\"怎么变快\"——软件侧）\n第四层  硬件体系结构与性能方法论（知道\"怎么变快\"——硬件侧）\n第五层  系统工程与前沿方向     （知道\"怎么落地、怎么演进\"）\n\n以下第三至第七节逐一展开。","kids":[],"w":"给学习路径一个章节锚点。","b":"","k":0},{"id":"c4","t":"4 · 大模型推理核心优化技术","d":"这是2025年后新增的核心要求，JD中反复出现的关键词包括Transformer架构、KV Cache、Prefill/Decode分离、投机推理等。但JD只列关键词，实际工作与面试考察的是深层机制。","kids":[{"id":"c4-1","t":"4.1 · Transformer架构与KV Cache基础","d":"","kids":[{"id":"c4-1-1","t":"4.1.1 · Transformer架构","d":"**Transformer架构** — 理解Attention机制（QKV计算、缩放因子）、FFN结构、位置编码","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c4-1-2","t":"4.1.2 · KV Cache","d":"**KV Cache** — 理解自回归解码时K/V的存储与复用机制，以及MQA/GQA等变体对Cache规模的压缩","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c4-1-3","t":"4.1.3 · Prefill/Decode分离","d":"**Prefill/Decode分离** — 地平线要求\"构建UCP加速库并与vLLM等主流框架深度适配，优化KVCache复用与Prefill-Decode分离技术\"","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c4-2","t":"4.2 · KV Cache管理进阶","d":"","kids":[{"id":"c4-2-1","t":"4.2.1 · PagedAttention","d":"**PagedAttention** — 借鉴OS虚拟内存分页机制，将KV Cache按固定大小block（如16 slot）分页管理，逻辑连续、物理离散，近乎消除内部/外部碎片，显存利用率从~30%提升至90%+；block table实现逻辑→物理映射，支持copy-on-write，是Prefix Caching的基础设施","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c4-2-2","t":"4.2.2 · KV Cache量化","d":"**KV Cache量化** — INT8 KV近乎无损，FP8（E4M3）在Hopper/新NPU上是甜点位；per-channel/per-head scale优于per-tensor；K比V对量化更敏感（K含RoPE旋转后的位置信息，幅度波动大）","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c4-2-3","t":"4.2.3 · MLA（Multi-head Latent Attention，DeepSeek）","d":"**MLA（Multi-head Latent Attention，DeepSeek）** — 将K/V投影到低秩latent（如512维），KV Cache只存latent向量+少量解耦RoPE的key，压缩比达~93%；推理时将上投影矩阵\"吸收\"进Wq/Wo，避免解压回显存。深层问题：RoPE对key做位置相关旋转，破坏了latent的低秩可吸收性，故需单独缓存\"解耦RoPE key\"\n**端侧KV预算计算（面试必考）** —\n`KV字节 = 2 × layers × kv_heads × head_dim × dtype_size × seq_len × batch`\n例：7B GQA模型（32层、8 KV头、128维、FP16）1条64K上下文≈1GB——在8GB端侧设备上，KV预算必须与权重、激活、系统驻留统筹排布","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c4-2-4","t":"4.2.4 · CPU offload/swap","d":"**CPU offload/swap** — 以换页方式把冷block移到内存，代价是总线带宽成为新瓶颈","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c4-2-5","t":"4.2.5 · 前沿趋势","d":"**前沿趋势** — KV分层存储（NPU→CPU→SSD，vLLM/SGLang prefix cache + LMCache路线）、FP4/2bit KV（KIVI）、原生稀疏注意力（NSA）直接砍掉Cache增长、端侧\"预算驱动\"的上下文截断策略","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c4-3","t":"4.3 · 调度与批处理","d":"","kids":[{"id":"c4-3-1","t":"4.3.1 · Continuous Batching","d":"**Continuous Batching** — 在iteration级调度，每步完成后新请求立即插入、完成请求立即退出，比static batching吞吐提升数倍；调度器核心是slot管理与抢占策略","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c4-3-2","t":"4.3.2 · Chunked Prefill","d":"**Chunked Prefill** — 将长prompt切成chunk与decode混排，消除\"prefill独占导致decode停顿\"的TPOT毛刺；chunk大小是TTFT与TPOT的权衡旋钮","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c4-3-3","t":"4.3.3 · CUDA Graph静态化","d":"**CUDA Graph静态化** — decode阶段每步只算1 token，kernel launch开销（几十个kernel × μs级launch延迟）占比可达30%+；将整步decode capture成静态图一次launch，前提是形状静态——这是PagedAttention block数必须padding到固定值的原因。局限：动态shape需按shape bucket（batch=1/2/4/8）缓存多张graph或padding；动态控制流需编译期确定","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c4-3-4","t":"4.3.4 · P/D分离的端侧映射","d":"**P/D分离的端侧映射** — 单SoC上NPU负责decode、GPU/CPU协处理prefill，本质是算力/带宽特性错配的利用","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c4-4","t":"4.4 · 注意力与算子优化","d":"","kids":[{"id":"c4-4-1","t":"4.4.1 · FlashAttention核心思想","d":"**FlashAttention核心思想** — tiling分块计算 + online softmax（running max/sum，无需先遍历整行）+ 中间结果全程驻留SRAM，把HBM访问从O(N²)降到O(N²·d/M)，显存从O(N²)降至O(N)——实现精确注意力的IO感知加速，也证明\"**融合可以改变算法复杂度**\"，是fused kernel设计的教科书案例。FA2优化并行度（seq维切分），FA3用Hopper TMA+WGMMA+异步softmax","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c4-4-2","t":"4.4.2 · Prefill/Decode二象性（必须能推导）","d":"**Prefill/Decode二象性（必须能推导）** — prefill批量处理prompt，GEMM大而饱满，compute-bound；decode逐token生成，每步只算1 token却要读全部权重，算术强度≈1 FLOP/byte，严重memory-bound——**decode优化=降字节（量化、投机解码）而非降FLOPs**","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c4-4-3","t":"4.4.3 · 经典估算题","d":"**经典估算题** — 7B模型FP16、batch=1、600GB/s带宽 → 单步decode ≈ 14GB ÷ 600GB/s ≈ 23ms ≈ 43 tok/s","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c4-4-4","t":"4.4.4 · FlashDecoding","d":"**FlashDecoding** — FA在decode（QLen=1）场景收益骤减（无O(N²)中间矩阵可省，瓶颈转为KV加载），需沿KV维切分并行","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c4-4-5","t":"4.4.5 · RoPE优化","d":"**RoPE优化** — 预计算cos/sin表、与QKV投影算子融合（fused RoPE+GEMM）、NTK/YaRN外推时的频率重排","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c4-5","t":"4.5 · 投机解码（Speculative Decoding）","d":"","kids":[{"id":"c4-5-1","t":"4.5.1 · 范式","d":"**范式** — 轻量draft模型/头连发k个候选token，target一次forward并行验证，接受前缀即一次产出多token；验证按target分布校正拒绝后的token，保证分布完全一致（无损）\n**路线对比** —\n- **Medusa**：target模型加多个解码头+tree attention，零额外draft模型但头需微调\n- **EAGLE/EAGLE-2**：在feature层自回归draft，draft树每步基于target反馈重新构建，接受率显著高于token级draft；EAGLE-2引入上下文感知的动态draft树\n- **MTP（Multi-Token Prediction）**：DeepSeek V3原生，训练时即做多token预测，与主干共享表征，draft质量高，正在成为新模型标配（训练-推理协同设计）\n**加速比** — ≈ `E[接受长度] / (1 + draft开销 + 验证开销比)`；接受率α=0.8、k=4时E[len]≈3.4，但draft串行自回归本身也耗时，实际加速2~3×为主流","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c4-5-2","t":"4.5.2 · 关键结论：只在decode（memory-bound）下划算","d":"**关键结论：只在decode（memory-bound）下划算** — —target验证一次forward读一遍权重可验证k个token，字节摊薄；prefill投机毫无意义。batch增大时收益下降（大batch本身已摊薄权重读取，且验证造成负载不均）","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c4-5-3","t":"4.5.3 · 深层考点","d":"**深层考点** — 为什么验证k个token不违反因果性（tree attention mask）；拒绝后如何保证分布等价（从max(0, p_target−q_draft)重采样）","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c4-5-4","t":"4.5.4 · 端侧趋势","d":"**端侧趋势** — draft常驻cache+target间歇唤醒的功耗友好模式、free speculative（n-gram/self-draft免额外模型）、接受率在线自适应","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c4-6","t":"4.6 · MoE模型推理（2026重点）","d":"","kids":[{"id":"c4-6-1","t":"4.6.1 · 核心矛盾","d":"**核心矛盾** — 激活稀疏（每token仅k/总专家数，如8/256）但**权重必须全部可寻址**——router的选择对每个token不可预知，显存占用是dense的数倍。服务端靠Expert Parallelism切多卡，端侧只能走Offload：专家权重驻留CPU内存/SSD，按router预测分层预取，命中率依赖热点专家倾斜的局部性","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c4-6-2","t":"4.6.2 · Shared Expert","d":"**Shared Expert** — 每token必经，承载通用知识，减少路由抖动","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c4-6-3","t":"4.6.3 · 端侧挑战全览","d":"**端侧挑战全览** — 内存墙（权重驻留）、router与专家GEMM的算子切换开销、batch内token路由分散导致专家GEMM变\"瘦矩阵\"（M极小、compute-bound劣化）、量化需按专家粒度做（expert-wise GPTQ/AWQ）","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c4-6-4","t":"4.6.4 · batch=1时MoE的真实优势","d":"**batch=1时MoE的真实优势** — 带宽读取只涉及激活专家，若权重驻留内存则带宽收益真实存在","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c4-6-5","t":"4.6.5 · 趋势","d":"**趋势** — 端侧原生小MoE（激活数百M~几B的edge MoE成为2026端侧标配路线）、专家量化+按热度LRU缓存（hot expert留NPU、cold expert留内存）、MTP×MoE×MLA三件套协同（DeepSeek范式被广泛复制）","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0}],"w":"给学习路径一个章节锚点。","b":"","k":0},{"id":"c5","t":"5 · 模型压缩与量化","d":"","kids":[{"id":"c5-1","t":"5.1 · 基础技术栈","d":"技术；具体要求\nPTQ（训练后量化）；精通INT8/INT4量化流程，熟悉精度对齐方法\nQAT（量化感知训练）；理解伪量化节点插入、梯度缩放、STE（直通估计器）机制\n剪枝；结构化剪枝与非结构化剪枝，稀疏化加速\n知识蒸馏；大模型到小模型的能力迁移\n混合精度；FP16/INT8混合部署策略","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c5-2","t":"5.2 · 权重量化算法谱系（面试深水区）","d":"算法；核心思想；适用场景\nRTN；直接四舍五入映射，无误差补偿；INT8够用；≤4bit误差骤增\nGPTQ；基于Hessian的贪婪误差补偿——量化一个权重后，把误差\"分摊\"到同列未量化权重上（OBS/OBQ思想的批量加速版）；7B模型压到3bit仍可用\nAWQ；观察到约0.1%~1%的\"显著权重通道\"（激活outlier对应）需保护，通过per-channel缩放s在激活侧除以s、权重侧乘以s；不依赖反向传播，量化速度快、泛化性好\nSmoothQuant；将量化难度从激活迁移到权重（数学上等价的缩放变换），实现W8A8全量化推理；LLM INT8部署主力方案\nHQQ；免校准数据，半精度辅助变量直接求解最优投影；快速迭代，比GPTQ快数十倍\n\n**工程要点** — GPTQ的`group_size=128`+`act_order`对低bit精度影响极大；AWQ对校准分布敏感，domain不匹配时需自采校准集；3bit以下GPTQ/AWQ都会明显掉精度，需配合QAT或mixed-precision；GPTQ量化后务必逐层回测下游任务，不能只看perplexity。","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c5-3","t":"5.3 · 低比特格式前沿","d":"","kids":[{"id":"c5-3-1","t":"5.3.1 · FP8","d":"**FP8** — E4M3（精度优先，前向激活/权重）与E5M2（动态范围优先，梯度/FP8 KV）；E4M3在LayerNorm输出后易溢出，需插入动态per-tensor scale节点","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c5-3-2","t":"5.3.2 · MXFP4","d":"**MXFP4** — 基于Microscaling，每32个元素共享一个8bit block scale，硬件友好","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c5-3-3","t":"5.3.3 · NVFP4","d":"**NVFP4** — E2M1数据+FP8 block scale+E4M3 per-tensor scale，是Blackwell上FP4的完整格式；原生FP4张量核心实测吞吐约FP8的2倍","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c5-3-4","t":"5.3.4 · W4A16 vs W4A8","d":"**W4A16 vs W4A8** — W4A16（权重INT4、激活FP16）在batch=1自回归解码中收益最大（decode是memory-bound）；W4A8适合算力受限的端侧NPU，但激活低比特需SmoothQuant类处理outlier。**反直觉考点：W4A16在compute-bound的prefill阶段可能反而不如W8A8快**","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c5-3-5","t":"5.3.5 · Group size经验值","d":"**Group size经验值** — 32/64保精度，128是速度-精度平衡点；端侧NPU对INT4/FP4支持碎片化，ONNX算子转换前必须查target的量化规范","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c5-4","t":"5.4 · 量化精度排查方法论（高级岗核心能力）","d":"","kids":[{"id":"c5-4-1","t":"5.4.1 · 激活outlier的本质","d":"**激活outlier的本质** — 集中在固定通道（与attention sink、RMSNorm放缩、残差累加相关），呈系统性分布而非随机——这是per-channel/per-group比per-tensor有效的原因","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c5-4-2","t":"5.4.2 · 标准排查流程","d":"**标准排查流程** — 逐层量化+逐层恢复FP16对比（二分定位敏感层）→ 敏感层keep FP16（mixed-precision，通常<5%参数保高精度即可追平全FP16）→ 回测","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c5-4-3","t":"5.4.3 · 敏感层清单","d":"**敏感层清单** — LayerNorm/RMSNorm紧邻的线性层输入、首尾几层transformer block、attention out projection（KV Cache入口）","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c5-4-4","t":"5.4.4 · 校准集选择","d":"**校准集选择** — 128条是下限（快速验证），512条使scale统计稳定；**分布比数量更重要**，序列长度需覆盖目标场景；校准集含过长样本会使Hessian估计偏差","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c5-4-5","t":"5.4.5 · 量化粒度选择","d":"**量化粒度选择** — per-tensor（快、硬件支持最广）→ per-channel（权重量化默认）→ per-group（<8bit标配），需与硬件scale计算开销对齐","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c5-5","t":"5.5 · KV Cache量化与长上下文","d":"估算实例：Llama-7B（32层、GQA 8头、head_dim 128）、32K上下文、batch 4、FP16：2×32×8×128×4×32768×2B ≈ 16GB——INT8/FP8量化直接减半\nGQA/MQA模型因KV头数少、cache小，量化绝对收益下降；**小模型（<3B）与长上下文（>32K）组合对KV量化最敏感**（误差占有效信息比例更高）\nINT8 KV量化在检索类长上下文任务上常见\"大海捞针\"失败，**务必跑needle-in-haystack测试**；cache量化与权重量化误差会叠加，联合部署时各自回测\n工程上可做cache分块量化（按token块动态scale）","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c5-6","t":"5.6 · 稀疏化与结构优化","d":"","kids":[{"id":"c5-6-1","t":"5.6.1 · 2:4结构化稀疏","d":"**2:4结构化稀疏** — 理论2倍、实测仅1.2~1.6×（metadata开销+memory-bound）；需配套2:4-aware QAT补偿精度；收益集中在GEMM-bound大batch场景，**batch=1端侧推理基本无收益**\n**非结构化稀疏** — （90%+稀疏度）在端侧NPU上几乎无收益——NPU按稠密tile调度，稀疏索引开销抵消计算节省","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c5-6-2","t":"5.6.2 · channel-level剪枝+蒸馏","d":"**channel-level剪枝+蒸馏** — 端侧主流组合，剪掉整个channel可真实降宽、无硬件支持前提；建议按整层FFN或attention头粒度剪；剪枝后需rebuild模型图（宽度变化导致算子不兼容）","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c5-6-3","t":"5.6.3 · 剪枝与量化的先后顺序（高频考点）","d":"**剪枝与量化的先后顺序（高频考点）** — 先剪枝+蒸馏恢复精度、再PTQ/QAT量化——剪枝改变误差分布，后量化可感知最终结构；反过来剪枝会破坏量化scale","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c5-7","t":"5.7 · 端侧专用轻量化与量化友好设计","d":"","kids":[{"id":"c5-7-1","t":"5.7.1 · SLM设计趋势","d":"**SLM设计趋势** — 参数共享（MobileLLM的immediate block-wise weight sharing复用相邻block权重）；**深度优先于宽度**——同参数量下更深更窄的模型在端侧memory-bound解码中更优；GQA/MLA压缩KV；小词表（32K）降低embedding占比","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c5-7-2","t":"5.7.2 · 量化友好架构设计","d":"**量化友好架构设计** — 激活outlier抑制（Gemma类模型在残差前约束幅值）、避免无界激活函数（Softsign/GELU-tanh替代）、权重分布正则化训练，使模型天生适配W4A8甚至FP4","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c5-7-3","t":"5.7.3 · 选型原则","d":"**选型原则** — 关注\"量化后性能\"而非FP16指标——许多模型FP16领先但INT4崩掉","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c5-7-4","t":"5.7.4 · 端侧落地三件套","d":"**端侧落地三件套** — QAT微调 + 硬件原生格式导出（QDQ ONNX/ExecuTorch/TFLite）+ 真机profiling（算子覆盖率与dequant回退是主要瓶颈）","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0}],"w":"给学习路径一个章节锚点。","b":"","k":0},{"id":"c6","t":"6 · 推理框架与AI编译栈","d":"","kids":[{"id":"c6-1","t":"6.1 · \"推理引擎即编译器\"心智模型（初中级分水岭）","d":"推理引擎本质是\"模型→硬件代码\"的AOT编译器，完整经历四段：\n\n1. **前端**：PyTorch/ONNX导入器，将模型解析为计算图\n2. **中间表示（IR）**：图级IR（DAG，节点=算子、边=张量）；成熟项目采用分层IR（TVM的Relax/TE/TIR、MLIR的dialect栈）\n3. **优化Pass**：常量折叠、代数简化（`x*1→x`、除转乘）、算子融合、布局变换（PyTorch原生NCHW，而TensorCore/SIMD偏好NHWC，需布局传播Pass整体改写）\n4. **后端codegen**：选库算子（cuBLAS/cuDNN）或生成代码（Triton/PTX），配合auto-tuning（Ansor式搜索）\n\n**能力要求** — 能读懂pass pipeline源码，定位\"哪个Pass吃了我的精度/性能\"；自定义算子走plugin注册；能判断哪些变换是图级可证明等价的、哪些依赖shape特化。","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c6-2","t":"6.2 · 主流框架架构对比（第一、第二梯队）","d":"**设计哲学对比**：\n\n框架；设计哲学；核心机制\nvLLM；吞吐优先的服务化系统；PagedAttention（借鉴OS虚拟内存分页）+ continuous batching迭代级调度\nllama.cpp；CPU优先、极致可移植、零第三方依赖；GGUF单文件自包含（超参+tokenizer+量化权重）、mmap加载零拷贝按需page-in秒级冷启动、k-quants/imatrix量化体系、手写SIMD\nMLC-LLM；TVM编译路线；模型离线编译到Vulkan/Metal/WebGPU/CUDA等目标后端，一次IR多端部署\nMNN/NCNN；移动端经典；无依赖自包含、NEON/汇编级微优化、Winograd卷积、INT8重量化；NCNN纯前向推理，MNN扩展至训练与LLM\nTensorRT-LLM；NVIDIA闭源、针对自家架构极限压榨；in-flight batching（continuous batching变体+调度与计算overlap）、FP8/INT4 AWQ、多卡MPI\nSGLang；高吞吐服务+前端DSL；RadixAttention前缀缓存、结构化解码原生支持\n\n**端侧选型决策树** — 数据中心GPU serving→vLLM/TRT-LLM；端侧纯CPU→llama.cpp；异构GPU/NPU跨平台→MLC-LLM；Android/嵌入式CPU→MNN/NCNN。\n\n**第二梯队** — SGLang、TFLite/LiteRT、NCNN。**编译优化工具**：TVM、torch.compile、Triton、TileLang。\n\n腾讯明确要求\"熟悉主流推理框架与工具链（TensorRT、vLLM、SGLang、ONNX Runtime、TVM或其他AI芯片配套推理栈等），理解其优化原理\"。","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c6-3","t":"6.3 · 图优化核心技术","d":"","kids":[{"id":"c6-3-1","t":"6.3.1 · 算子融合策略","d":"**算子融合策略** — Vertical融合（producer-consumer链，典型Conv+BN+ReLU）、Horizontal融合（无依赖同构算子合批共享kernel）、GEMM+Activation属Epilogue融合（cuBLASLt直接支持）","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c6-3-2","t":"6.3.2 · Conv+BN融合原理（面试必考推导）","d":"**Conv+BN融合原理（面试必考推导）** — BN推理期退化为线性变换，可折入Conv权重与bias","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c6-3-3","t":"6.3.3 · FlashAttention的图优化意义","d":"**FlashAttention的图优化意义** — 分块后QKᵀ、softmax、PV全在SRAM完成，避免HBM中materialize N×N注意力矩阵——fused kernel可以改变算法复杂度","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c6-3-4","t":"6.3.4 · 内存优化","d":"**内存优化** — 基于张量生命周期分析（拓扑序中lifetime不重叠即复用）的平面内存池静态复用；in-place操作需保证无并发读者","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c6-3-5","t":"6.3.5 · 等价性验证","d":"**等价性验证** — 浮点非结合性导致重结合（如reduction拆分）有可容忍误差；实践中用逐层数值比对+容差阈值+差分测试，不确定时保守回退","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c6-4","t":"6.4 · AI编译器栈","d":"","kids":[{"id":"c6-4-1","t":"6.4.1 · TVM三层","d":"**TVM三层** — Relax（图级，支持动态shape与跨函数优化）→ TE（compute与schedule分离）→ TIR（循环/缓冲级低级IR，lowering到LLVM/PTX）","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c6-4-2","t":"6.4.2 · MLIR","d":"**MLIR** — 基础设施化路线，dialect分层+渐进lowering；端侧地位由IREE承载（面向移动/edge）；linalg dialect用structured ops统一线性代数类计算，tiling/fusion策略泛化复用","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c6-4-3","t":"6.4.3 · torch.compile","d":"**torch.compile** — Dynamo做symbolic tracing捕获FX图，**graph break是核心痛点**——数据依赖控制流、不支持的操作触发切分成多子图，跨图开销抵消收益；Inductor后端生成Triton（GPU）/C++（CPU）代码","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c6-4-4","t":"6.4.4 · Triton编程模型","d":"**Triton编程模型** — block-level编程（以tile为单位写逻辑，线程分配/同步/shared memory交给编译器），对比CUDA的thread-level手写是抽象层跃迁；TileLang等新DSL保持Python编程的同时显式暴露schedule控制","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c6-4-5","t":"6.4.5 · 对端侧工程师的价值","d":"**对端侧工程师的价值** — 端侧芯片碎片化（NPU/DSP/各GPU后端），手写kernel不可扩展，**编译器+auto-tuning是唯一泛化路径**；能读懂trace、定位graph break是PyTorch 2.x时代的日常技能","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c6-5","t":"6.5 · CUDA Graph与运行时优化","d":"","kids":[{"id":"c6-5-1","t":"6.5.1 · 原理","d":"**原理** — capture将kernel launch序列录制为图，replay一次提交整图，消除CPU侧launch开销（单次约5-10μs）","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c6-5-2","t":"6.5.2 · 为什么decode必须用graph而prefill不需要","d":"**为什么decode必须用graph而prefill不需要** — decode每token的kernel短至μs级且逐层串行，launch/调度开销占比飙升；prefill单kernel计算饱满，launch开销可忽略","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c6-5-3","t":"6.5.3 · 局限","d":"**局限** — 静态拓扑，动态shape需按shape bucket缓存多张graph或padding；batch size需固定；capture对stream与cudaMalloc有限制","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c6-5-4","t":"6.5.4 · 端侧对应","d":"**端侧对应** — NPU天然走\"整网AOT编译+静态shape\"路线（HiAI/CoreML/NNAPI的编译期固化），graph化是NPU能效优势与灵活性劣势的共同根源","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c6-6","t":"6.6 · 模型格式与转换链路","d":"","kids":[{"id":"c6-6-1","t":"6.6.1 · ONNX的定位与三大坑","d":"**ONNX的定位与三大坑** — 是交换格式而非部署格式——①动态shape在runtime支持参差且优化后engine对shape敏感；②If/Loop等control flow语义弱、导出易失败；③自定义算子需runtime侧配套实现，opset版本兼容是长期痛点","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c6-6-2","t":"6.6.2 · safetensors","d":"**safetensors** — 解决pickle反序列化RCE安全问题、支持零拷贝mmap，但只存tensor不存图；**GGUF**：面向llama.cpp生态的单文件自包含格式，版本化metadata","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c6-6-3","t":"6.6.3 · PyTorch 2.x主线","d":"**PyTorch 2.x主线** — torch.export（基于Dynamo、sound的symbolic shape、graph break显著少于legacy ONNX export）→ ATen IR → 对接Inductor/ONNX/ExecuTorch","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c6-6-4","t":"6.6.4 · 精度对齐标准流程（高频实战考点）","d":"**精度对齐标准流程（高频实战考点）** — 固定seed+受控输入（屏蔽dropout随机性）→ 逐层输出比对定位首个发散层 → cosine similarity（对幅值不敏感、反映分布一致性）+相对/绝对误差双阈值 → 区分\"转换误差\"（对FP16基线）与\"量化误差\"（再对FP32）","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0}],"w":"给学习路径一个章节锚点。","b":"","k":0},{"id":"c7","t":"7 · 端侧硬件体系结构与性能优化方法论","d":"","kids":[{"id":"c7-1","t":"7.1 · Roofline性能分析（优化前必须回答的第一问）","d":"","kids":[{"id":"c7-1-1","t":"7.1.1 · 模型","d":"**模型** — `可达FLOPS = min(峰值算力, 带宽 × 算术强度)`，算术强度AI=FLOPs/Byte；AI低于拐点为memory-bound，高于拐点为compute-bound","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c7-1-2","t":"7.1.2 · LLM推理二象性","d":"**LLM推理二象性** — prefill批量处理prompt，GEMM大而饱满，compute-bound；decode逐token生成，每步只算1 token却要读全部权重，AI≈1，严重memory-bound","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c7-1-3","t":"7.1.3 · NPU上的两级roofline","d":"**NPU上的两级roofline** — SRAM级+DDR级；峰值MAC利用率受tiling质量影响，实际用trace工具（高通profiling、昇腾msprof、Nsight）标定","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c7-1-4","t":"7.1.4 · 指导意义","d":"**指导意义** — 先判定bound再选手段——compute-bound用更低精度（W8A8/FP8）、提高MAC占用率、调整tiling；memory-bound用权重压缩（W4）、KV压缩、batching、算子融合减少读写回DDR。**方向选错则优化完全无效**","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c7-2","t":"7.2 · NPU vs GPU的架构本质","d":"","kids":[{"id":"c7-2-1","t":"7.2.1 · GPU","d":"**GPU** — SIMT + 硬件cache自动管理；**主流NPU**：脉动阵列/固定数据流 + **软件显式管理的scratchpad SRAM**——计算确定性换来能效比（TOPS/W通常是GPU数倍）","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c7-2-2","t":"7.2.2 · DMA与double buffering","d":"**DMA与double buffering** — 乒乓两块SRAM使\"搬运k+1层\"与\"计算k层\"重叠；带宽需满足\"搬运时间≤计算时间\"才能隐藏延迟","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c7-2-3","t":"7.2.3 · Tiling","d":"**Tiling** — 大张量必须切成SRAM放得下的块分批处理；工具链的auto-tiling不优时，手工切分和layout调整是最后手段","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c7-2-4","t":"7.2.4 · 量化数据通路","d":"**量化数据通路** — 以INT8 MAC阵列为主（累加INT32、输出可混合精度），新硬件增加FP16/FP8路径；量化需匹配硬件累加精度以避免逐层溢出","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c7-2-5","t":"7.2.5 · 核心认知","d":"**核心认知** — NPU优化≈**内存编排问题**——让每层计算时DMA prefetch下一层（隐含\"静态形状+提前规划\"的架构要求），中间激活尽量驻留SRAM不落DDR","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c7-3","t":"7.3 · 具体硬件平台与架构特点","d":"平台类型；具体芯片/平台；架构要点\nNVIDIA生态；Jetson Orin/Thor、CUDA、TensorRT；SIMT+cache自动管理，生态最完善，CUDA/Triton编程\n高通生态；8255/8295座舱芯片、QNN/SNPE/QAIRT/AIMET；Hexagon：HVX=1024-bit向量单元、HMX=INT8/INT16矩阵单元，要求分块张量布局；HTP是Snapdragon 8系LLM主引擎\n地平线生态；征程Journey系列、BPU架构、UCP加速库；自研BPU指令集，编译器主导，编译期循环优化与布局变换见长\n华为生态；昇腾NPU、CANN架构、鸿鹄语音芯片；达芬奇：Cube矩阵单元（16×16×16分形计算）+Vector+Scalar，标志性5D格式NC1HWC0（C0=16）\nApple生态；ANE（Apple Neural Engine）、CoreML、MPS Graph、Metal；无公开架构文档，靠CoreML编译管线+A/B实验；偏好特定算子组合与通道倍数；不支持的子图静默回退GPU/CPU\nMTK生态；NeuroPilot、APU；—\nARM Ethos-U；Cortex-M级microNPU；仅从SRAM执行、命令流驱动，适合关键词唤醒等超小模型\n自研芯片；小鹏自研芯片、黑芝麻华山系列、昆仑芯；各家均以\"静态图+AOT编译+块状布局+通道对齐\"为核心设计哲学","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c7-4","t":"7.4 · 硬件亲和性清单（面试核心考点）","d":"","kids":[{"id":"c7-4-1","t":"7.4.1 · 通道数对齐","d":"**通道数对齐** — MAC阵列按32/64倍数取数，通道37会浪费近一半算力，需pad到64——把通道从97改成96可能带来显著性能变化","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c7-4-2","t":"7.4.2 · 权重布局","d":"**权重布局** — 分块/交错（NC1HWC0、HVX块格式）+ per-channel/per-block量化粒度对齐硬件要求","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c7-4-3","t":"7.4.3 · 算子白/黑名单","d":"**算子白/黑名单** — conv/GEMM在白名单；动态shape、gather/scatter、控制流、变长序列常在黑名单","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c7-4-4","t":"7.4.4 · 根因","d":"**根因** — NPU依赖AOT编译生成DMA描述符与流水编排，**确定性是前提**——动态控制流打破静态编排，变长靠bucketing+padding近似","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c7-4-5","t":"7.4.5 · 面试答法","d":"**面试答法** — 答\"设计动机+共性\"比背参数更稳；提及NPU对特定通道数（32/64倍数）的对齐支持，比单纯列举剪枝算法更能打动面试官","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c7-5","t":"7.5 · 内存系统（端侧第一瓶颈）","d":"","kids":[{"id":"c7-5-1","t":"7.5.1 · 带宽鸿沟","d":"**带宽鸿沟** — 端侧LPDDR5/5X约40-70GB/s（手机SoC典型值），对比桌面HBM3的~1TB/s差15-20倍——**带宽而非算力决定端侧decode上限**","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c7-5-2","t":"7.5.2 · 快速心算","d":"**快速心算** — 3.5GB（INT4）模型在50GB/s带宽下理论decode上限≈14 tok/s——逼近该上限是优化目标","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c7-5-3","t":"7.5.3 · 统一内存架构（UMA）","d":"**统一内存架构（UMA）** — CPU/GPU/NPU共享物理内存，是端侧LLM的决定性优势；跨设备用ION/dma-buf句柄零拷贝共享buffer，而非memcpy","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c7-5-4","t":"7.5.4 · 内存管理实践","d":"**内存管理实践** — KV cache用PagedAttention式分页内存池（防碎片、支持多请求复用）；权重常驻锁页内存避免换入换出；内存池设计对抗碎片","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c7-6","t":"7.6 · 异构调度","d":"","kids":[{"id":"c7-6-1","t":"7.6.1 · 划分原则","d":"**划分原则** — \"规则大算量进NPU，动态小控制留CPU\"——留CPU：采样（top-k/top-p）、动态mask、变长逻辑、部分LayerNorm/量化反量化；进NPU：GEMM/Conv/规则attention","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c7-6-2","t":"7.6.2 · 切分开销","d":"**切分开销** — 跨设备有fence同步与总线传输开销，子图来回切换可能比单设备慢——避免\"NPU算1ms+搬运2ms\"的伪加速；小算子尽量融合进前后NPU子图（如把量化参数折叠进权重）","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c7-6-3","t":"7.6.3 · Android路线","d":"**Android路线** — NNAPI已被官方弃用（Android 15起），路线收敛到LiteRT（原TFLite）Delegates（NPU/GPU/XNNPACK），按delegate边界做图切分","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c7-6-4","t":"7.6.4 · 实时系统","d":"**实时系统** — 车规QNX/RTOS靠优先级抢占与预算化NPU时间片保障实时性与ASIL隔离","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c7-7","t":"7.7 · 功耗与热设计" roid碎片化（骁龙8系到中端、不同NPU DSP SDK版本），需tiering分级下发策略与CI真机矩阵（云真机+稳定性monkey测试）","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c9-12-4","t":"9.12.4 · 线上工程","d":"**线上工程** — native crash（JNI/驱动层）、ANR、灰度按机型放量、A/B延迟指标护栏、模型OTA热更新的回滚机制","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c9-12-5","t":"9.12.5 · 分水岭","d":"**分水岭** — 能\"把模型跑起来\"的人多，能\"管住百万DAU机型矩阵稳定性\"的人少——工程化段位的分水岭","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0}],"w":"给学习路径一个章节锚点。","b":"","k":0},{"id":"c10","t":"10 · 面试核心考点","d":"","kids":[{"id":"c10-1","t":"10.1 · 硬件亲和性（Hardware Affinity）","d":"面试官不仅关注候选人是否了解剪枝或量化算法，更看重其对推理软件栈的驾驭能力。展示对硬件亲和性的理解——例如提及某些NPU对特定通道数（如32或64的倍数）有更好的对齐支持——会比单纯列举剪枝算法更能打动面试官。","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c10-2","t":"10.2 · 推理软件栈的深度理解","d":"合格的端侧工程师必须熟悉从\"训练框架\"到\"中间表示（IR）\"再到\"推理引擎\"的完整转换链路。资深候选人将推理引擎视为编译器，理解层融合（Layer Fusion）、常量折叠（Constant Folding）等图优化操作。","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c10-3","t":"10.3 · 算子开发能力","d":"最新模型架构往往包含推理引擎尚未原生支持的算子，自定义算子开发能力成为项目落地的关键：如何在TensorRT中编写Plugin、如何用CUDA实现自定义Kernel、如何在TFLite中注册针对NPU优化的自定义算子。","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c10-4","t":"10.4 · 高频题目与深层考点对照表","d":"题目；深层考点（标准答案锚点）\n如何处理PyTorch导出ONNX时的动态轴问题？；动态shape对engine优化的影响、opset兼容、torch.export新路线、bucketing/padding策略\nTensorRT层融合与内核自动调优如何工作？；Conv+BN数学推导（BN推理期退化线性变换）、Epilogue融合、kernel自动调优机制\n如何设计端侧LLM的KV Cache管理策略？；PagedAttention分页、KV量化（K比V敏感）、prefix复用、KV预算公式、与权重/系统的内存统筹\nINT8量化后精度下降，如何排查修复？；逐层二分定位→outlier通道系统性分析→mixed-precision回退→校准集分布检查→needle-in-haystack（KV量化）\n如何在NPU上实现FlashAttention高效计算？；无可编程SRAM时的等价tiling、KV维切分（FlashDecoding）、块对齐与变长页边界处理\n端侧显存/内存优化手段？；张量生命周期分析内存池、in-place安全性、CUDA Graph、zero-copy/dma-buf、权重swap-out\n为什么decode阶段batch=1时W4A16最快？；memory-bound分析+算术强度推导（结合具体带宽数字心算：14GB÷600GB/s≈23ms）\n为什么prefill不需要CUDA Graph？；decode kernel μs级+串行导致launch开销占比飙升；prefill单kernel饱满\nMLA为何要单独存解耦RoPE key？；RoPE位置相关旋转破坏latent低秩可吸收性\n投机解码为什么只在decode划算？；验证一次forward读一遍权重可验证k个token，字节摊薄；大batch下收益下降\nMoE端侧offload预取为何可行？；相邻token路由局部性+热点专家倾斜，top专家承载大量token\n剪枝与量化的先后顺序？；先剪枝+蒸馏恢复精度再量化——反过来剪枝会破坏量化scale\n为什么LSTM难上NPU而Transformer解码可以？；NPU依赖AOT编译的确定性调度，循环依赖的动态控制流打破静态编排\n拿到不支持的算子，处理路径如何决策？；改图（等价替换）/换实现（自定义算子）/切回CPU，按切分开销模型决策","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c10-5","t":"10.5 · 估算类题型（必须能现场心算）","d":"KV Cache占用：`2 × layers × kv_heads × head_dim × seq_len × batch × bytes`\n单步decode时间：`模型权重字节 ÷ 内存带宽`（7B FP16在600GB/s→23ms→43 tok/s；3.5GB INT4在50GB/s→~14 tok/s）\n投机解码加速比：`E[接受长度] / (1 + draft开销 + 验证开销比)`\nRoofline判定：算术强度 vs 硬件拐点（如H100约600:1）","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0}],"w":"给学习路径一个章节锚点。","b":"","k":0},{"id":"c11","t":"11 · 加分项与差异化竞争力","d":"综合各公司JD反复出现的加分项：","kids":[{"id":"c11-1-1","t":"11.1 · 开源项目贡献","d":"**开源项目贡献** — vLLM、SGLang、TensorRT-LLM等项目的源码级贡献经验（如为推理引擎贡献xgrammar式constrained decoding优化，这类贡献含金量极高）","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c11-1-2","t":"11.2 · 顶会论文","d":"**顶会论文** — MLSys、ASPLOS、OSDI、NeurIPS、ICLR、CVPR等系统或AI顶会论文","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c11-1-3","t":"11.3 · 特定平台量产经验","d":"**特定平台量产经验** — 高通8155/8295、地平线征程、NVIDIA Jetson等平台的量产项目经验","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c11-1-4","t":"11.4 · 投机推理经验","d":"**投机推理经验** — 熟悉EAGLE、Medusa、MTP variants等投机推理方案","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c11-1-5","t":"11.5 · 从0到1落地经验","d":"**从0到1落地经验** — 机器人/自动驾驶领域从0到1产品落地经验或竞赛获奖经历","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c11-1-6","t":"11.6 · 全栈能力","d":"**全栈能力** — 同时具备云端训练和端侧部署经验，理解模型设计到部署的完整链路","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c11-1-7","t":"11.7 · 国产化适配经验","d":"**国产化适配经验** — 华为昇腾、寒武纪等国产算力平台的实际适配经验","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c11-1-8","t":"11.8 · 安全推理能力","d":"**安全推理能力** — 权重加密+设备绑定、TEE推理——稀缺差异化窗口","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c11-1-9","t":"11.9 · 评测工程化能力","d":"**评测工程化能力** — 能构建TTFT/TPOT/温控衰减曲线/能效自动采集+机型矩阵报告的开源评测框架","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0}],"w":"给学习路径一个章节锚点。","b":"","k":0},{"id":"c12","t":"12 · 趋势总结与技术学习路径","d":"","kids":[{"id":"c12-1","t":"12.1 · 五大趋势","d":"","kids":[{"id":"c12-1-1","t":"12.1.1 · 一是从CNN向Transformer/LLM全面迁移","d":"**一是从CNN向Transformer/LLM全面迁移** — 2024年之前的端侧部署岗位主要围绕YOLO、DETR等检测模型，2025年之后的JD几乎全部将LLM/VLM/VLA的端侧推理作为核心场景。","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c12-1-2","t":"12.1.2 · 二是系统级优化能力要求显著提升","d":"**二是系统级优化能力要求显著提升** — 单纯会调TensorRT已经不够，JD越来越多要求从模型压缩、算子优化、内存管理到推理调度、功耗优化的全栈能力。","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c12-1-3","t":"12.1.3 · 三是硬件生态多元化加速","d":"**三是硬件生态多元化加速** — 除了NVIDIA生态，高通QNN、地平线BPU、华为CANN、Apple ANE以及各厂商自研芯片的适配经验正在成为差异化竞争力。","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c12-1-4","t":"12.1.4 · 四是端侧与具身智能深度融合","d":"**四是端侧与具身智能深度融合** — VLA模型部署、高频控制闭环优化、diffusion policy蒸馏加速、Sim2Real等具身智能特有需求正在重塑端侧部署的技术栈。","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c12-1-5","t":"12.1.5 · 五是从\"单点kernel调优\"演进为\"训练-推理协同设计\"","d":"**五是从\"单点kernel调优\"演进为\"训练-推理协同设计\"** — MLA/MTP/NSA/量化友好架构在预训练阶段就为推理画像（内存占用、接受率、注意力稀疏度）建模；工程师的价值在于把这套协同设计在具体硬件预算（端侧显存/带宽/功耗）下做全局最优的工程化落地。","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0},{"id":"c12-1-6","t":"12.1.6 · 一句话本质","d":"**一句话本质** — 端侧推理优化 = **在带宽、SRAM、功耗三个硬约束下做确定性调度**——roofline定方向，内存系统定上限，工具链亲和性定落地。","kids":[],"w":"弄清这一点，面试/落地时才知道该动哪一环。","b":"","k":0}],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0},{"id":"c12-2","t":"12.2 · 技术学习路径建议","d":"按五层递进补齐四大板块：**C++高性能编程、Transformer推理原理、量化技术实操（PTQ/QAT）、至少一种端侧推理框架的深度使用经验**。\n\n**闭环项目路线**（校招/转方向）：通过开源项目积累一个完整的\"模型训练→压缩量化（GPTQ/AWQ实操+精度排查）→端侧部署（llama.cpp/MNN/ExecuTorch）→性能分析（roofline+真机profiling+稳态功耗）\"闭环项目。进阶可选高含金量项目：\n\n\"VLM视觉token压缩对prefill延迟与识别精度\"的系统评测（token数 vs TTFT vs 准确率Pareto曲线）\n\"diffusion policy 20步蒸馏到2步\"在Jetson Orin上的延迟对比（含去噪步数-轨迹质量权衡）\n实测\"有/无prefix caching的10轮Agent会话总延迟\"\n端侧embedding+sqlite-vec的本地RAG，测检索延迟与召回\n\"端侧推理崩溃模式分类\"（驱动超时/内存压力OOM/量化算子fallback）深度复盘——此类内容在面试中是降维打击\n\n**平台深耕路线**（社招）：聚焦某一硬件平台（如高通QNN或地平线BPU）做深做透，掌握其架构约束（通道对齐、布局要求、算子黑白名单）与全套工具链；同时保持对vLLM/SGLang等主流框架源码的理解，跟踪KV分层存储、MTP×MoE×MLA协同、FP4格式等前沿演进。","kids":[],"w":"本节对应文档小节，右侧正文来自原稿。","b":"","k":0}],"w":"给学习路径一个章节锚点。","b":"","k":0}]};
const TREE_JD = {"id":"root","t":"JD 能力缺口补全","d":"与端侧主线并列。补指令流水、DSA/内存层次、DeepSeek MLA、框架源码向、TGI、Glow、RISC-V、集合通信、云 Serving。投递缺哪块补哪块；数字写条件。","kids":[{"id":"j1","t":"1 · 体系结构补强 · 内存层次 · 并行度 · 指令流水","d":"投递里写「熟悉 GPU/NPU 架构」却答不上「decode 卡在哪一层」，面试会立刻掉头问带宽。","kids":[{"id":"j1-1","t":"1.1 · CPU / GPU / NPU / DSA 内存层次","d":"DSA（Domain-Specific Accelerator，领域专用加速器）：为某一应用域定制的硬件，靠专用运算、并行与存储层次换性能/能效（Dally et al., CACM 2020）。NPU 是 DSA 在神经网络上的常见形态；别把「有 NPU」自动等同「有通用 CPU 流水线」。","kids":[{"id":"j1-1-1","t":"1.1.1 · 四层对照","d":"CPU/GPU/NPU/DSA：近端快、远端大；瓶颈写在「哪一层打爆」。DSA（Domain-Specific Accelerator，领域专用加速器）：为某一应用域定制的硬件，靠专用运算、并行与存储层次换性能/能效（Dally et al., CACM 2020）。HBM3 带宽量级约 ~3 TB/s（NVIDIA Hopper 架构公开材料）。","kids":[],"w":"弄清「四层对照」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j1-1-2","t":"1.1.2 · DSA≠通用CPU","d":"领域专用；NPU 是其常见形态，勿套五级乱序叙事。Ampere A100：约 108 SM、Shared 最高约 164 KB/SM、HBM2 约 ~1.55 TB/s。Orin / 手机级 SoC 再砍一档：片上 SRAM 更小、LPDDR 带宽更紧，任何「权重常驻」承诺都要拿 footprint 对表，而不是口头「NPU 加速了」。","kids":[],"w":"弄清「DSA≠通用CPU」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j1-1-3","t":"1.1.3 · H100/A100 数量级","d":"Shared/SM/HBM 写清代际；peak≠decode 倍速。Hopper H100（数量级例题，写清代际）：寄存器文件很大。2. 再问：DMA / HBM 通路的 sustained 带宽大概多少，不是 datasheet peak。3. 最后问：BS=1 decode 时算术强度大概几个 FLOPs/byte——多数时候会落到 Roofline 的 memory-bound 区。","kids":[],"w":"弄清「H100/A100 数量级」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j1-1-4","t":"1.1.4 · 端侧落点","d":"SRAM 吃热数据；权重与长 KV 常落 LPDDR；墙在搬。拒收话术：「我们这颗 NPU 有 xx TOPS」却说不清片上 SRAM 容量、权重是否常驻、KV 是否每次都打片外。Shared Memory 最高约 228 KB/SM。约 132 SM、每 SM 4 个第 4 代 Tensor Core；","kids":[],"w":"弄清「端侧落点」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j1-1-5","t":"1.1.5 · 拒收 TOPS-only","d":"无带宽/常驻/温区，数字进不了验收。白皮书「×N 于上一代」是 peak 叙事，不等于端到端 decode 倍速。端侧 NPU：片上 SRAM 吃激活 tile / 热数据。主线〇的访存墙在这里落地——decode 每 token 扫权重，墙在搬。","kids":[],"w":"弄清「拒收 TOPS-only」，对标 JD 时才知道缺口在哪。","b":"","k":0}],"w":"服务「1 · 体系结构补强 · 内存层次 · 并行度 · 指令流水」落地。","b":"补主线未写透的一块。下含：四层对照、DSA≠通用CPU、H100/A100 数量级、端侧落点、拒收 TOPS-only。","k":0},{"id":"j1-2","t":"1.2 · 并行度统一框架","d":"端侧 LLM 对话 BS=1 时，GPU 课上的 occupancy 故事经常失灵：算力单元等带宽。要问的是：有效带宽、权重是否常驻、KV 布局、温区能否 sustained——与主线〇/⑬ 同一把尺。","kids":[{"id":"j1-2-1","t":"1.2.1 · 三层并行","d":"指令级 / 线程核级 / 数据级；别混成「多开线程」。三层分开问： 端侧 LLM 对话 BS=1 时，GPU 课上的 occupancy 故事经常失灵：算力单元等带宽。要问的是：有效带宽、权重是否常驻、KV 布局、温区能否 sustained——与主线〇/⑬ 同一把尺。Decode：逐步依赖上一步 token，算术强度常落到数 FLOPs/byte 量级，memory-bound（Roofline / FlashAttention 文中的 bound 定义可对读）。","kids":[],"w":"弄清「三层并行」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j1-2-2","t":"1.2.2 · BS=1","d":"端侧对话 occupancy 故事常失灵；问有效带宽与 KV 布局。算术强度直觉（数量级，非保证）：一次 decode step 对整模权重做近似「读一遍」量级的访存，算的是一层层 matmul 的少量 FLOPs。这就是为什么「量化档」在端侧常比「多几个 TOPS」更能改体验——量化先砍搬的量。Prefill：长序列矩阵大，更可能靠近 compute-bound。","kids":[],"w":"弄清「BS=1」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j1-2-3","t":"1.2.3 · Prefill vs Decode","d":"前者偏 compute；后者常 memory-bound。⑬ 验收若只报峰值 tok/s、不报量化/常驻/温区，仍按主线拒收。","kids":[],"w":"弄清「Prefill vs Decode」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j1-2-4","t":"1.2.4 · 算术强度","d":"FLOPs/byte；量化先砍搬的量，常比空加 TOPS 更改体验。端侧 LLM 对话 BS=1 时，GPU 课上的 occupancy 故事经常失灵：算力单元等带宽。要问的是：有效带宽、权重是否常驻、KV 布局、温区能否 sustained——与主线〇/⑬ 同一把尺。","kids":[],"w":"弄清「算术强度」，对标 JD 时才知道缺口在哪。","b":"","k":0}],"w":"服务「1 · 体系结构补强 · 内存层次 · 并行度 · 指令流水」落地。","b":"补主线未写透的一块。下含：三层并行、BS=1、Prefill vs Decode、算术强度。","k":0},{"id":"j1-3","t":"1.3 · 指令流水（CPU 微架构）","d":"经典五级直觉：取指 → 译码 → 发射 → 执行 → 写回。冒险三类：结构（争用同一部件）、数据（结果未就绪）、控制（分支未决）。超标量与乱序执行用 ILP 填气泡，缓存层次用命中率藏 DRAM 延迟。","kids":[{"id":"j1-3-1","t":"1.3.1 · 五级直觉","d":"取指→译码→发射→执行→写回；三类冒险填气泡。经典五级直觉：取指 → 译码 → 发射 → 执行 → 写回。和 LLM 的关系（教材类比，勿字面化成「五级导致 LLM 慢」）： NPU 对照：很多 NPU 是静态图 / 数据流调度，不是通用乱序 CPU。要问的是：图是否固定 shape、权重是否预排布、片上 SRAM 是否盖住热路径。","kids":[],"w":"弄清「五级直觉」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j1-3-2","t":"1.3.2 · 带宽冒险","d":"decode 逐步时墙常在搬，不在流水线级数。解释不了 NPU 上「TOPS 高仍慢」——那要看权重/KV 落在哪一层、DMA 是否跟得上。冒险三类：结构（争用同一部件）、数据（结果未就绪）、控制（分支未决）。超标量与乱序执行用 ILP 填气泡，缓存层次用命中率藏 DRAM 延迟。","kids":[],"w":"弄清「带宽冒险」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j1-3-3","t":"1.3.3 · NPU 对照","d":"静态图/数据流居多；勿硬套乱序 CPU。经典五级直觉：取指 → 译码 → 发射 → 执行 → 写回。冒险三类：结构（争用同一部件）、数据（结果未就绪）、控制（分支未决）。超标量与乱序执行用 ILP 填气泡，缓存层次用命中率藏 DRAM 延迟。","kids":[],"w":"弄清「NPU 对照」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j1-3-4","t":"1.3.4 · 最短答法","d":"Prefill 算力题；decode 搬数据题；TOPS 高仍慢先查层次。经典五级直觉：取指 → 译码 → 发射 → 执行 → 写回。冒险三类：结构（争用同一部件）、数据（结果未就绪）、控制（分支未决）。超标量与乱序执行用 ILP 填气泡，缓存层次用命中率藏 DRAM 延迟。","kids":[],"w":"弄清「最短答法」，对标 JD 时才知道缺口在哪。","b":"","k":0}],"w":"服务「1 · 体系结构补强 · 内存层次 · 并行度 · 指令流水」落地。","b":"补主线未写透的一块。下含：五级直觉、带宽冒险、NPU 对照、最短答法。","k":0}],"w":"给 JD 缺口一个章节锚点。","b":"主线之外的补全章。下一步 ② DeepSeek 主架构与 MLA。","k":0},{"id":"j2","t":"2 · DeepSeek 主架构与 MLA","d":"主线〇/⑬ 已覆盖 Qwen/Llama 端侧选型。DeepSeek 主系（V2/V3）的差异在结构，尤其是 MLA；蒸馏小模型（如 R1-Distill-Qwen）≠ 讲得清主架构。简历写「熟悉 DeepSeek」却只能背参数量，会被追问：KV 怎么压、absorption 后 cache 里到底存什么。","kids":[{"id":"j2-1","t":"2.1 · 从 MHA → GQA → MLA","d":"DeepSeek-V2 技术报告（arXiv:2405.04434）：MLA 用低秩联合压缩；相对其设定，每 token KV 元素量可落到约等于「很少 group 的 GQA」量级，同时报告质量可强于 MHA（消融结论，需同设定）。相对自家 67B 基线，文中给出 KV 约 ↓93.3%、生成吞吐 约 ×5.76 等部署数字——基线是 DeepSeek 67B + 其服务配置，不是「对任意 GQA 模型的普适定律」。DeepSeek-V3（arXiv:2412.19437）沿用 MLA；absorption 后推理不必从 cache 重建完整 K/V。","kids":[{"id":"j2-1-1","t":"2.1.1 · MHA→GQA→MLA","d":"KV 从每头全量 → 共享 KV head → 低维 latent。相对其设定，每 token KV 元素量可落到约等于「很少 group 的 GQA」量级，同时报告质量可强于 MHA（消融结论，需同设定）。DeepSeek-V2 技术报告（arXiv:2405.04434）：MLA 用低秩联合压缩。相对自家 67B 基线，文中给出 KV 约 ↓93.3%、生成吞吐 约 ×5.76 等部署数字——基线是 DeepSeek 67B + 其服务配置，不是「对任意 GQA 模型的普适定律」。","kids":[],"w":"弄清「MHA→GQA→MLA」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j2-1-2","t":"2.1.2 · 93.3% / ×5.76","d":"V2 相对自家 67B 的条件数字，勿当普适定律。吸收（absorption）口头版：训练/定义里有「先投影再算 attention」的路径。推理可把部分投影吸进权重，使运行时主要读写压缩后的 latent cache，而不是每步展开完整多头 K/V。细节以论文与目标引擎实现为准——面试能说到「cache 布局变了、引擎要认」，比背公式更有用。","kids":[],"w":"弄清「93.3% / ×5.76」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j2-1-3","t":"2.1.3 · absorption","d":"推理可吸投影；cache 主存 latent 语义。absorption 后推理不必从 cache 重建完整 K/V。导出/实现时若把 RoPE 路径弄丢或错误折叠，会出现「能跑但位置乱、长 ctx 崩」类问题。DeepSeek-V3（arXiv:2412.19437）沿用 MLA；","kids":[],"w":"弄清「absorption」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j2-1-4","t":"2.1.4 · 解耦 RoPE","d":"位置项与内容拆开；导出丢路径会「短通长崩」。解耦 RoPE：MLA 常把位置相关项与内容 latent 拆开处理。验收要有固定长上下文用例，不只看短 prompt 通不通。","kids":[],"w":"弄清「解耦 RoPE」，对标 JD 时才知道缺口在哪。","b":"","k":0}],"w":"服务「2 · DeepSeek 主架构与 MLA」落地。","b":"补主线未写透的一块。下含：MHA→GQA→MLA、93.3% / ×5.76、absorption、解耦 RoPE。","k":0},{"id":"j2-2","t":"2.2 · 算子与部署影响","d":"1. Attention 是否实现 MLA 的 cache 布局与 absorption。面试官要听的是「引擎能不能吃」： 1. Attention 是否实现 MLA 的 cache 布局与 absorption。","kids":[{"id":"j2-2-1","t":"2.2.1 · 算子三问","d":"Attention cache 布局、RoPE/RMSNorm/MoE 核、导出是否保留 latent。面试官要听的是「引擎能不能吃」： 1. Attention 是否实现 MLA 的 cache 布局与 absorption。2. RoPE（解耦项）、RMSNorm、MoE 路由（若有）是否在目标 Runtime 有 kernel。","kids":[],"w":"弄清「算子三问」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j2-2-2","t":"2.2.2 · 端侧门","d":"无 MLA kernel → 退 GQA 小模型或上云；禁静默 CPU fallback。3. 导出路径（ONNX/自有格式）是否保留 latent 语义，而不是被错误展开成稠密 MHA。端侧若强行上 MLA 大模型：先查 QNN / Edge-LLM / TRT 路径有没有对应算子。没有就诚实退回 GQA 小模型或云侧——比硬导出后静默 CPU fallback 强。","kids":[],"w":"弄清「端侧门」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j2-2-3","t":"2.2.3 · Distill ≠ 主系","d":"Distill-Qwen 走 GQA；勿对外吹 MLA 收益。和 Distill 小模型划界： 拒收：「端侧已上 DeepSeek」——模型其实是 Distill-Qwen，却对外讲 MLA 收益。最小自学路径：读 V2 报告 MLA 节 → 对照某一开源引擎（如支持 MLA 的 vLLM/SGLang 版本说明）看 cache 配置项 → 自己用一句话解释「相对 GQA，省的是什么、引擎多实现了什么」。","kids":[],"w":"弄清「Distill ≠ 主系」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j2-2-4","t":"2.2.4 · GQA 默认","d":"端侧友好路径；主线已多用。1. Attention 是否实现 MLA 的 cache 布局与 absorption。面试官要听的是「引擎能不能吃」： 1. Attention 是否实现 MLA 的 cache 布局与 absorption。","kids":[],"w":"弄清「GQA 默认」，对标 JD 时才知道缺口在哪。","b":"","k":0}],"w":"服务「2 · DeepSeek 主架构与 MLA」落地。","b":"补主线未写透的一块。下含：算子三问、端侧门、Distill ≠ 主系、GQA 默认。","k":0}],"w":"给 JD 缺口一个章节锚点。","b":"主线之外的补全章。接 1 · 体系结构补强 · 内存层次 · 并行度 · 指令流水。下一步 ③ 推理框架源码向。","k":0},{"id":"j3","t":"3 · 推理框架源码向","d":"主线有 llama.cpp 的 backend dispatch、TRT-LLM/QNN 的用法与开关。JD 要的是：你能否在源码里指出 谁管 KV 块、谁做 scheduling。本节给读码地图，不替代整仓精读。目标：被追问「PagedAttention 的 block 默认多大」时，能答到版本与文件，而不是「好像是分页」。","kids":[{"id":"j3-1","t":"3.1 · vLLM：PagedAttention 与 BlockManager","d":"PagedAttention 把 KV 切成固定 block（类似操作系统页），按需分配，减少「按最大长度预分配」的碎片。源码里 CacheConfig 常见默认 blocksize = 16 tokens（可用参数改；以你 checkout 的版本为准）。","kids":[{"id":"j3-1-1","t":"3.1.1 · block_size=16","d":"`CacheConfig` 常见默认；以 checkout 版本为准，可改。源码里 CacheConfig 常见默认 blocksize = 16 tokens（可用参数改。PagedAttention 把 KV 切成固定 block（类似操作系统页），按需分配，减少「按最大长度预分配」的碎片。BlockManager / BlockSpaceManager 干的事： Continuous / iteration-level batching：每个 forward 迭代后，完成的序列可以退出、新请求可以进入，不必等静态整批跑完。","kids":[],"w":"弄清「block_size=16」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j3-1-2","t":"3.1.2 · BlockManager","d":"逻辑页↔物理页、池化、引用计数、与 scheduler 协作。这和端侧「单用户 BS=1、固定会话」不是同一套问题——主线强调勿把 vLLM 队列语义搬进车机，就是这个原因。读码入口建议（跟一条路径即可）： 1. config/cache.py（或同级）看 blocksize 默认。2. Block manager：分配 / 释放 / block table 更新。","kids":[],"w":"弄清「BlockManager」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j3-1-3","t":"3.1.3 · iteration-level batching","d":"每步可进可出；≠ 端侧单会话 BS=1。3. Scheduler 主循环：本 iter 选哪些序列进 batch、哪些结束退场。4. Attention kernel 侧：如何用 block table 做 gather（概念层即可）。先跟一条「请求入队 → 分配 block → 跑一步 → 释放」的路径，再谈优化（prefix cache、chunked prefill 等）。","kids":[],"w":"弄清「iteration-level batching」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j3-1-4","t":"3.1.4 · 读码四步","d":"cache 默认 → block 分配释放 → scheduler → attention gather 概念。版本漂移快，以你本地 checkout 为准，面试说「我看的是某某 commit / 某版文档」。","kids":[],"w":"弄清「读码四步」，对标 JD 时才知道缺口在哪。","b":"","k":0}],"w":"服务「3 · 推理框架源码向」落地。","b":"补主线未写透的一块。下含：block_size=16、BlockManager、iteration-level batching、读码四步。","k":0},{"id":"j3-2","t":"3.2 · TensorRT-LLM：IFB 与 plugin（对照 Edge-LLM）","d":"云侧 TRT-LLM 文档中的 In-flight Batching (IFB) ≈ continuous / iteration-level batching：context 与 generation 可交织；效率上常要求 packed、少 padding。Attention 路径可选多种实现（文档中的 FlashInfer / TrtllmAttention 等），面向 inflight + paged KV。","kids":[{"id":"j3-2-1","t":"3.2.1 · IFB","d":"云侧 continuous / inflight batching；context 与 generation 可交织。云侧 TRT-LLM 文档中的 In-flight Batching (IFB) ≈ continuous / iteration-level batching：context 与 generation 可交织；","kids":[],"w":"弄清「IFB」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j3-2-2","t":"3.2.2 · Edge-LLM ≠ 桌面 TRT-LLM","d":"JetPack/DRIVE 列车；数字不可直搬 Orin 验收。Edge 路径要看对应版本是否暴露同等能力——以官方 Edge-LLM 文档为准，勿从桌面 TRT-LLM 文档外推。面试时分开说，避免「我跑过 TRT-LLM」被追问 Edge 路径时露馅。Attention 路径可选多种实现（文档中的 FlashInfer / TrtllmAttention 等），面向 inflight + paged KV。","kids":[],"w":"弄清「Edge-LLM ≠ 桌面 TRT-LLM」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j3-2-3","t":"3.2.3 · 产品隔离","d":"简历分开写路径；追问 Edge 时勿拿桌面文档外推。和 Edge-LLM 的差异（必须会说）： 主线 Orin 表用 Edge-LLM。plugin / custom op 在云侧叙事里常见；","kids":[],"w":"弄清「产品隔离」，对标 JD 时才知道缺口在哪。","b":"","k":0}],"w":"服务「3 · 推理框架源码向」落地。","b":"补主线未写透的一块。下含：IFB、Edge-LLM ≠ 桌面 TRT-LLM、产品隔离。","k":0},{"id":"j3-3","t":"3.3 · SGLang 与 ONNX Runtime","d":"SGLang（RadixAttention）：请求结束后 KV 不丢弃，按 token 序列进 radix tree，新请求做最长前缀匹配复用；配合 cache-aware 调度（NeurIPS 2024）。多轮、共享系统提示时摊 Prefill；无命中时开销目标是可忽略。实现上前缀匹配可按 page 对齐（常见与 16 token 边界同类思路）。","kids":[{"id":"j3-3-1","t":"3.3.1 · RadixAttention","d":"结束后 KV 进 radix tree；最长前缀命中摊 Prefill。SGLang（RadixAttention）：请求结束后 KV 不丢弃，按 token 序列进 radix tree，新请求做最长前缀匹配复用。ONNX Runtime：端侧常卡在 EP 覆盖（QNN / CUDA / CPU），不是「模型文件不会写」。","kids":[],"w":"弄清「RadixAttention」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j3-3-2","t":"3.3.2 · 何时赚","d":"长且稳的系统提示 / 多轮共享前缀；每次全新 prompt 则不赚。何时赚、何时不赚：系统提示长且稳定、多轮共享前缀 → 赚 Prefill。验收要会：指定 EP → 看节点落点 → 发现静默 CPU fallback → 拒收或改图。主线 AI 编译器补全已有 fallback 审计口径，这里强调：源码/日志里要能指出 fallback 发生在哪一层。","kids":[],"w":"弄清「何时赚」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j3-3-3","t":"3.3.3 · ORT EP 落点","d":"指定 EP → 查节点 → 静默 CPU fallback 直接拒收。配合 cache-aware 调度（NeurIPS 2024）。实现上前缀匹配可按 page 对齐（常见与 16 token 边界同类思路）。每次 prompt 几乎全新 → 命中率低，别指望 Radix 救场。","kids":[],"w":"弄清「ORT EP 落点」，对标 JD 时才知道缺口在哪。","b":"","k":0}],"w":"服务「3 · 推理框架源码向」落地。","b":"补主线未写透的一块。下含：RadixAttention、何时赚、ORT EP 落点。","k":0}],"w":"给 JD 缺口一个章节锚点。","b":"主线之外的补全章。接 2 · DeepSeek 主架构与 MLA。下一步 ④ 开源 Serving 对照（含 TGI）。","k":0},{"id":"j4","t":"4 · 开源 Serving 对照（含 TGI）","d":"端侧主线默认不上 vLLM/TGI；JD 仍要你能对照——「为什么不上」也要说得出理由，而不是「没听过」。","kids":[{"id":"j4-1","t":"4.1 · TGI 维护状态与选型更新","d":"TGI 关键状态（2025 官方口径）：Hugging Face 文档标明 TGI 进入 maintenance mode，新部署更推荐 vLLM 或 SGLang。面试若只吹 TGI「生产首选」而不提维护状态，会被认为信息过时。历史能力（continuous batching、TP、流式、量化）仍可作架构对照，但选型结论要更新。","kids":[{"id":"j4-1-1","t":"4.1.1 · TGI maintenance","d":"2025 官方 CAUTION；新部署优先 vLLM/SGLang。TGI 关键状态（2025 官方口径）：Hugging Face 文档标明 TGI 进入 maintenance mode，新部署更推荐 vLLM 或 SGLang。面试若只吹 TGI「生产首选」而不提维护状态，会被认为信息过时。历史能力（continuous batching、TP、流式、量化）仍可作架构对照，但选型结论要更新。","kids":[],"w":"弄清「TGI maintenance」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j4-1-2","t":"4.1.2 · 存量 vs 新开","d":"存量可维护；新开看支持矩阵；端侧默认不上三者。TGI 关键状态（2025 官方口径）：Hugging Face 文档标明 TGI 进入 maintenance mode，新部署更推荐 vLLM 或 SGLang。面试若只吹 TGI「生产首选」而不提维护状态，会被认为信息过时。历史能力（continuous batching、TP、流式、量化）仍可作架构对照，但选型结论要更新。","kids":[],"w":"弄清「存量 vs 新开」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j4-1-3","t":"4.1.3 · 不上车机的理由","d":"队列语义、依赖体积、版本列车与功耗/车规约束。TGI 关键状态（2025 官方口径）：Hugging Face 文档标明 TGI 进入 maintenance mode，新部署更推荐 vLLM 或 SGLang。面试若只吹 TGI「生产首选」而不提维护状态，会被认为信息过时。历史能力（continuous batching、TP、流式、量化）仍可作架构对照，但选型结论要更新。","kids":[],"w":"弄清「不上车机的理由」，对标 JD 时才知道缺口在哪。","b":"","k":0}],"w":"服务「4 · 开源 Serving 对照（含 TGI）」落地。","b":"补主线未写透的一块。下含：TGI maintenance、存量 vs 新开、不上车机的理由。","k":0},{"id":"j4-2","t":"4.2 · 最小云侧实验（补主线弱项）","d":"固定模型与量化 → vLLM 或 SGLang 拉起 → 打一条流式请求 → 记录 TTFT、tok/s、GPU 型号、并发。再拿同系列更小模型在端侧（主线路径）报一组数。目的不是比谁快，而是练习「场景不同尺不同」。","kids":[{"id":"j4-2-1","t":"4.2.1 · 笔记七字段","d":"模型revision、量化、框架版本、GPU、并发、TTFT、tok/s。固定模型与量化 → vLLM 或 SGLang 拉起 → 打一条流式请求 → 记录 TTFT、tok/s、GPU 型号、并发。建议笔记字段（抄进个人仓库即可）： 拒收：只有 Grafana 截图，无上表条件；","kids":[],"w":"弄清「笔记七字段」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j4-2-2","t":"4.2.2 · 对照目的","d":"练「场景不同尺不同」；不是比谁快。固定模型与量化 → vLLM 或 SGLang 拉起 → 打一条流式请求 → 记录 TTFT、tok/s、GPU 型号、并发。再拿同系列更小模型在端侧（主线路径）报一组数。目的不是比谁快，而是练习「场景不同尺不同」。","kids":[],"w":"弄清「对照目的」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j4-2-3","t":"4.2.3 · llama.cpp 锚点","d":"端侧细节回主线 ⑧。固定模型与量化 → vLLM 或 SGLang 拉起 → 打一条流式请求 → 记录 TTFT、tok/s、GPU 型号、并发。再拿同系列更小模型在端侧（主线路径）报一组数。目的不是比谁快，而是练习「场景不同尺不同」。","kids":[],"w":"弄清「llama.cpp 锚点」，对标 JD 时才知道缺口在哪。","b":"","k":0}],"w":"服务「4 · 开源 Serving 对照（含 TGI）」落地。","b":"补主线未写透的一块。下含：笔记七字段、对照目的、llama.c SSA、Pass、LLVM IR 挂在中后端；","kids":[],"w":"弄清「四段链」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j5-2-2","t":"5.2.2 · 前端翻车","d":"动态 shape、丢自定义 op、类型布局与 EP 不一致。端侧量产还多一刀：静态 shape、权重预排布、禁止静默 CPU fallback（见编译器补全文档）。排查顺序：先确认「进了哪张合法 IR」，再谈融合对不对。与主线 ⑨ 分工：主线写 Dialect/Pass/SSA 与端侧门禁；","kids":[],"w":"弄清「前端翻车」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j5-2-3","t":"5.2.3 · 端侧多一刀","d":"静态 shape、权重预排布、禁静默 CPU fallback。2. 前端：解析/校验、类型与 shape、图合法化（不是大学编译原理全套词法作业，但要知道「进不了 IR 的锅在这」）→。对「模型编译」面试，口头一条链即可： 1. 导入：PyTorch/ONNX/厂商图 → 2. 前端：解析/校验、类型与 shape、图合法化（不是大学编译原理全套词法作业，但要知道「进不了 IR 的锅在这」）→ 3. 中端 IR：MLIR diale…","kids":[],"w":"弄清「端侧多一刀」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j5-2-4","t":"5.2.4 · 排查序","d":"先确认进了哪张合法 IR，再谈融合对不对。2. 前端：解析/校验、类型与 shape、图合法化（不是大学编译原理全套词法作业，但要知道「进不了 IR 的锅在这」）→。对「模型编译」面试，口头一条链即可： 1. 导入：PyTorch/ONNX/厂商图 → 2. 前端：解析/校验、类型与 shape、图合法化（不是大学编译原理全套词法作业，但要知道「进不了 IR 的锅在这」）→ 3. 中端 IR：MLIR dialect / TIR / …","kids":[],"w":"弄清「排查序」，对标 JD 时才知道缺口在哪。","b":"","k":0}],"w":"服务「5 · AI 编译器谱系补缺（Glow · 前端 · 与主线衔接）」落地。","b":"补主线未写透的一块。下含：四段链、前端翻车、端侧多一刀、排查序。","k":0}],"w":"给 JD 缺口一个章节锚点。","b":"主线之外的补全章。接 4 · 开源 Serving 对照（含 TGI）。下一步 ⑥ RISC-V NPU 算子与模型。","k":0},{"id":"j6","t":"6 · RISC-V NPU 算子与模型","d":"主线对 IREE→RISCV 只点到名。JD 写「基于 RISC-V NPU 的高性能算子和模型」时，要能描述一条可验证路径，而不是复读「开源友好」。没有板上数字时，诚实讲成熟度与风险，比空吹「已支持 LLM」安全。","kids":[{"id":"j6-1","t":"6.1 · 能说到哪一层（IREE 官方 + 社区进展）","d":"3. llvm-cpu 后端：riscv32 / riscv64；可加 RVV feature（如 +v、+zvl…）走向量路径。1. 主机：IREE compiler 交叉生成 target module。","kids":[{"id":"j6-1-1","t":"6.1.1 · 四层路径","d":"compiler 交叉 → runtime → llvm-cpu(+RVV) → ukernel/tiling。1. 主机：IREE compiler 交叉生成 target module。4. 优化层（2025 仍在合入）：面向 GenAI 的 mmt4d ukernel、VLEN-aware tiling 等——相对纯 LLVM 自动向量化可改善 matmul，但不是「已与 CUDA 栈对等的生产 LLM serving」。","kids":[],"w":"弄清「四层路径」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j6-1-2","t":"6.1.2 · 边界","d":"改善 matmul ≠ 与 CUDA 生产 LLM serving 对等。口头能力边界（建议照抄进笔记再改成自己的话）： 我能把 IREE 的 llvm-cpu 路径指到 riscv64 + RVV feature，能描述 ukernel/tiling 在优化层的位置。真机 LLM 吞吐要以板子与算子覆盖为准，我不会把 QEMU 跑通说成生产 Serving。","kids":[],"w":"弄清「边界」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j6-1-3","t":"6.1.3 · 口头边界","d":"QEMU 跑通≠真机吞吐；无板上数字就讲风险清单。3. llvm-cpu 后端：riscv32 / riscv64。可加 RVV feature（如 +v、+zvl…）走向量路径。没有板上数字时，面试诚实讲：工具链成熟度、算子覆盖、风险清单。","kids":[],"w":"弄清「口头边界」，对标 JD 时才知道缺口在哪。","b":"","k":0}],"w":"服务「6 · RISC-V NPU 算子与模型」落地。","b":"补主线未写透的一块。下含：四层路径、边界、口头边界。","k":0},{"id":"j6-2","t":"6.2 · 算子 → HAL → 板上（最小练习设计）","d":"拒收话术：「我们支持 RISC-V」却说不清 triple、RVV 是否启用、有没有 ukernel、有没有真机。","kids":[{"id":"j6-2-1","t":"6.2.1 · 最小四步","d":"金标 → 可重复编译 → HAL 落点可查 → 板上/模拟数量级。拒收话术：「我们支持 RISC-V」却说不清 triple、RVV 是否启用、有没有 ukernel、有没有真机。风险清单（可写进评审）：向量长度（VLEN）与 tiling 假设不一致；","kids":[],"w":"弄清「最小四步」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j6-2-2","t":"6.2.2 · 拒收空话","d":"说不清 triple / RVV / ukernel / 真机。拒收话术：「我们支持 RISC-V」却说不清 triple、RVV 是否启用、有没有 ukernel、有没有真机。","kids":[],"w":"弄清「拒收空话」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j6-2-3","t":"6.2.3 · 风险清单","d":"VLEN、对齐、算子覆盖、版本漂移。拒收话术：「我们支持 RISC-V」却说不清 triple、RVV 是否启用、有没有 ukernel、有没有真机。","kids":[],"w":"弄清「风险清单」，对标 JD 时才知道缺口在哪。","b":"","k":0}],"w":"服务「6 · RISC-V NPU 算子与模型」落地。","b":"补主线未写透的一块。下含：最小四步、拒收空话、风险清单。","k":0}],"w":"给 JD 缺口一个章节锚点。","b":"主线之外的补全章。接 5 · AI 编译器谱系补缺（Glow · 前端 · 与主线衔接）。下一步 ⑦ NPU Runtime 自研要点。","k":0},{"id":"j7","t":"7 · NPU Runtime 自研要点","d":"主线教的是 用 QNN / CANN / Genie。JD「NPU runtime 开发」要的是你能设计/维护运行时本身。按交付物拆四块。不会写 runtime 没关系——要先会用主线的验收模板卡别人的 runtime。","kids":[{"id":"j7-1","t":"7.1 · 四模块","d":"内存池展开：权重区通常长生命周期；激活区按层/ tile 复用；KV 区随会话增长。三者混在一个裸 malloc 池里，长会话最容易碎到「短 ctx 才活」。对齐按 DMA / 厂商要求来，不是按 CPU cache line 想当然。","kids":[{"id":"j7-1-1","t":"7.1.1 · 内存池三区","d":"权重 / 激活 / KV；混池易碎到「短 ctx 才活」。生产配置应能 禁 fallback：缺核就失败，而不是悄悄跑 CPU 还报「NPU 推理成功」。三者混在一个裸 malloc 池里，长会话最容易碎到「短 ctx 才活」。对齐按 DMA / 厂商要求来，不是按 CPU cache line 想当然。","kids":[],"w":"弄清「内存池三区」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j7-1-2","t":"7.1.2 · 调度纪律","d":"拓扑序、异步队列；回调内再投递是重入坑。算子加载展开：注册表要带版本指纹（引擎 ABI + 核版本）。取消路径要回收 in-flight buffer，否则泄漏成「跑一会必挂」。","kids":[],"w":"弄清「调度纪律」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j7-1-3","t":"7.1.3 · 禁静默 fallback","d":"缺核应失败；生产可关 CPU 路径。内存池展开：权重区通常长生命周期；激活区按层/ tile 复用；KV 区随会话增长。三者混在一个裸 malloc 池里，长会话最容易碎到「短 ctx 才活」。对齐按 DMA / 厂商要求来，不是按 CPU cache line 想当然。","kids":[],"w":"弄清「禁静默 fallback」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j7-1-4","t":"7.1.4 · DMA 同步","d":"完成前禁读；取消必须回收 in-flight。内存池展开：权重区通常长生命周期；激活区按层/ tile 复用；KV 区随会话增长。三者混在一个裸 malloc 池里，长会话最容易碎到「短 ctx 才活」。对齐按 DMA / 厂商要求来，不是按 CPU cache line 想当然。","kids":[],"w":"弄清「DMA 同步」，对标 JD 时才知道缺口在哪。","b":"","k":0}],"w":"服务「7 · NPU Runtime 自研要点」落地。","b":"补主线未写透的一块。下含：内存池三区、调度纪律、禁静默 fallback、DMA 同步。","k":0},{"id":"j7-2","t":"7.2 · 验收口径（可写进门禁）","d":"2. fallback 必须可观测（日志/计数器）；生产配置可禁 fallback。1. 同图同输入两次跑，数值在协议公差内（对齐主线 ⑬-14 思想）。","kids":[{"id":"j7-2-1","t":"7.2.1 · 数值门","d":"同图同输入两次跑，公差内（对齐主线 ⑬-14）。面试最小故事：挑一个事故（静默 fallback 或 KV 池碎片）→ 你怎么观测 → 门禁怎么改。1. 同图同输入两次跑，数值在协议公差内（对齐主线 ⑬-14 思想）。4. 版本指纹：引擎 + 驱动 + 模型哈希进交付清单（对齐主线 ⑮）。","kids":[],"w":"弄清「数值门」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j7-2-2","t":"7.2.2 · 可观测 fallback","d":"日志/计数器；生产可禁。和主线关系：你会用 Genie 不等于你会写 runtime。但主线的「落点审计 / 指纹 / 长稳」是自研 runtime 的验收模板。","kids":[],"w":"弄清「可观测 fallback」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j7-2-3","t":"7.2.3 · OOM 错误码","d":"禁进程被杀无现场。2. fallback 必须可观测（日志/计数器）；生产配置可禁 fallback。1. 同图同输入两次跑，数值在协议公差内（对齐主线 ⑬-14 思想）。","kids":[],"w":"弄清「OOM 错误码」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j7-2-4","t":"7.2.4 · 指纹交付","d":"引擎+驱动+模型哈希（对齐主线 ⑮）。2. fallback 必须可观测（日志/计数器）；生产配置可禁 fallback。1. 同图同输入两次跑，数值在协议公差内（对齐主线 ⑬-14 思想）。","kids":[],"w":"弄清「指纹交付」，对标 JD 时才知道缺口在哪。","b":"","k":0}],"w":"服务「7 · NPU Runtime 自研要点」落地。","b":"补主线未写透的一块。下含：数值门、可观测 fallback、OOM 错误码、指纹交付。","k":0}],"w":"给 JD 缺口一个章节锚点。","b":"主线之外的补全章。接 6 · RISC-V NPU 算子与模型。下一步 ⑧ 集合通信与多卡多 die。","k":0},{"id":"j8","t":"8 · 集合通信与多卡多 die","d":"端侧主线 BS=1、单 die 交付。云侧多卡是加分项：要求概念正确，能解释「为什么多卡不等于单用户更快」。把「8 卡聚合 tok/s」写进车机体验，是主线明确拒收的口径之一。","kids":[{"id":"j8-1","t":"8.1 · 集合通信与 Tensor Parallel","d":"Megatron 式 Tensor Parallel（TP）（arXiv:1909.08053）：层内矩阵切到多卡——列并行与行并行组合；前向在行并行输出处用 AllReduce 汇总分片结果；每个 transformer block 前向大约涉及 两次 这类同步（attention 侧 + MLP 侧，细节随实现变体）。训练/推理里这些集合通信在 GPU 上常走 NCCL（或 NVLS 优先、NCCL fallback）。","kids":[{"id":"j8-1-1","t":"8.1.1 · TP + AllReduce","d":"层内切矩阵；block 前向约两次同步量级（随实现变）。Megatron 式 Tensor Parallel（TP）（arXiv:1909.08053）：层内矩阵切到多卡——列并行与行并行组合。前向在行并行输出处用 AllReduce 汇总分片结果。教学要点：TP 切开了单卡算力/显存，但 decode 每步仍可能频繁同步——互联带宽与延迟变成新墙。","kids":[],"w":"弄清「TP + AllReduce」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j8-1-2","t":"8.1.2 · decode 新墙","d":"步步同步；TP 度宜落 NVLink 域；跨节点 TP 易打穿。每个 transformer block 前向大约涉及 两次 这类同步（attention 侧 + MLP 侧，细节随实现变体）。训练/推理里这些集合通信在 GPU 上常走 NCCL（或 NVLS 优先、NCCL fallback）。EP 路由与 all-to-all 是另一套故事——面试能区分 TP（层内切矩阵）与 EP（专家分卡）即可入门。","kids":[],"w":"弄清「decode 新墙」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j8-1-3","t":"8.1.3 · 原语","d":"AllReduce / AllGather / ReduceScatter；推理 TP/部分 EP 也会碰。常见原语：AllReduce、AllGather、ReduceScatter。简历写「熟悉 NCCL」至少要能说出：集合原语名字、TP 为何对延迟敏感、跨节点 TP 的风险。推理 TP/部分 EP（Expert Parallel）也会碰到。","kids":[],"w":"弄清「原语」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j8-1-4","t":"8.1.4 · EP vs TP","d":"专家分卡 vs 层内切矩阵；别混。具体走 NVLink 还是 PCIe，由拓扑与运行时选择决定。","kids":[],"w":"弄清「EP vs TP」，对标 JD 时才知道缺口在哪。","b":"","k":0}],"w":"服务「8 · 集合通信与多卡多 die」落地。","b":"补主线未写透的一块。下含：TP + AllReduce、decode 新墙、原语、EP vs TP。","k":0},{"id":"j8-2","t":"8.2 · Pipeline Parallel 与多 die","d":"层次：UCIe 等 ≈ 封装内 die-to-die；NVLink/NVSwitch ≈ 服务器内加速器互联；PCIe/CXL 偏通用 I/O。集合通信落在哪一层，决定扩展规模。大模型放不进单 die 时，权重/激活分片跨 chiplet 或跨 GPU；端到端受最慢链路限制。","kids":[{"id":"j8-2-1","t":"8.2.1 · PP 气泡","d":"层间切分；microbatch 填不满就亏。端侧交付时本节的用途：听懂云侧数字从哪来，拒绝把「8 卡聚合 tok/s」写成单用户体验（与主线 Edge-LLM「BS=1」口径一致）。NVLink/NVSwitch ≈ 服务器内加速器互联。大模型放不进单 die 时，权重/激活分片跨 chiplet 或跨 GPU；","kids":[],"w":"弄清「PP 气泡」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j8-2-2","t":"8.2.2 · UCIe vs NVLink","d":"封装内 die-to-die vs 服务器内加速器互联。层次：UCIe 等 ≈ 封装内 die-to-die；NVLink/NVSwitch ≈ 服务器内加速器互联；PCIe/CXL 偏通用 I/O。集合通信落在哪一层，决定扩展规模。大模型放不进单 die 时，权重/激活分片跨 chiplet 或跨 GPU；端到端受最慢链路限制。","kids":[],"w":"弄清「UCIe vs NVLink」，对标 JD 时才知道缺口在哪。","b":"","k":0},{"id":"j8-2-3","t":"8.2.3 · 最慢链路","d":"跨 c /* === SLIDE CONTROLLER === */
class SlidePresentation {
    constructor() {
        this.slides = document.querySelectorAll(".slide");
        this.currentSlide = 0;
        this.stage = document.getElementById("deckStage");
        this.setupStageScale();
        this.setupKeyboardNav();
        this.setupTouchNav();
        this.showSlide(0);
        document.getElementById("prevSlide").onclick = () => this.showSlide(this.currentSlide - 1);
        document.getElementById("nextSlide").onclick = () => this.showSlide(this.currentSlide + 1);
        document.getElementById("enterMap").onclick = () => this.showSlide(1);
    }
    setupStageScale() {
        const scale = () => {
            const factor = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
            const x = (window.innerWidth - 1920 * factor) / 2;
            const y = (window.innerHeight - 1080 * factor) / 2;
            this.stage.style.transform = `translate(${x}px, ${y}px) scale(${factor})`;
        };
        scale();
        window.addEventListener("resize", scale);
    }
    setupKeyboardNav() {
        document.addEventListener("keydown", (e) => {
            if (e.target && (e.target.isContentEditable || ["INPUT","TEXTAREA"].includes(e.target.tagName))) return;
            if (e.key === "e" || e.key === "E") return;
            if (this.currentSlide === 1 && ["ArrowUp","ArrowDown","l","L","r","R","0"].includes(e.key)) return;
            if (["ArrowRight"," ","PageDown"].includes(e.key)) { e.preventDefault(); this.showSlide(this.currentSlide + 1); }
            if (["ArrowLeft","PageUp"].includes(e.key)) { e.preventDefault(); this.showSlide(this.currentSlide - 1); }
        });
    }
    setupTouchNav() {
        let x0 = null;
        this.stage.addEventListener("touchstart", (e) => { x0 = e.changedTouches[0].screenX; }, {passive:true});
        this.stage.addEventListener("touchend", (e) => {
            if (this.currentSlide === 1) { x0 = null; return; }
            if (x0 == null) return;
            const dx = e.changedTouches[0].screenX - x0;
            if (dx < -60) this.showSlide(this.currentSlide + 1);
            if (dx > 60) this.showSlide(this.currentSlide - 1);
            x0 = null;
        });
        this.stage.addEventListener("wheel", (e) => {
            if (this.currentSlide === 1) return;
            if (Math.abs(e.deltaY) < 30) return;
            e.preventDefault();
            this.showSlide(this.currentSlide + (e.deltaY > 0 ? 1 : -1));
        }, {passive:false});
    }
    showSlide(index) {
        this.currentSlide = Math.max(0, Math.min(index, this.slides.length - 1));
        this.slides.forEach((slide, i) => {
            slide.classList.toggle("active", i === this.currentSlide);
            slide.classList.toggle("visible", i === this.currentSlide);
        });
        document.getElementById("pageLabel").textContent = `${this.currentSlide + 1} / ${this.slides.length}`;
        if (this.currentSlide === 1) requestAnimationFrame(() => {
            MapApp.syncCanvasSize();
            MapApp.drawWires();
        });
    }
}
