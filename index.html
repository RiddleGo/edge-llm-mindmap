const TREE = {"id":"root","t":"端侧大模型部署","d":"讲课序号 1→N。点开看「是什么 / 作用」。主题层多一句：这段在链路里补哪一环。高亮：琥珀=重点，珊瑚=核心。","kids":[{"id":"c1","t":"1 · 先认端侧","d":"进技术章前先认方位：端相对近边/云站哪一层、推理为啥挤上设备、从哪级台阶长来、现场用哪把拒收尺、上班交哪种活。转换命令、Runtime API、量化公式不在本章；尺子见 ⑬","kids":[{"id":"c1-1","t":"1.1 · 连载顺序（按这条走，不按编号）","d":"主题「连载顺序（按这条走，不按编号）」管端侧链路里这一段，下含：入门周、主链路周、尺子周、平台周、交付周。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c1-1-1","t":"1.1.1 · 入门周","d":"入门周：〇 → ⑫ → ② → ①硬件 → ③ → ⑦贴读","kids":[],"w":"弄清「入门周」，排障和选型时才知道该动哪一环。","b":""},{"id":"c1-1-2","t":"1.1.2 · 主链路周","d":"主链路周：④ → ⑧贴读 → ⑯合同 → ⑤平台冒烟","kids":[],"w":"弄清「主链路周」，排障和选型时才知道该动哪一环。","b":""},{"id":"c1-1-3","t":"1.1.3 · 尺子周","d":"尺子周：⑬-9 内存 / ⑬-12 TTFT / ⑬-14 对齐，再补读 ①结构","kids":[],"w":"弄清「尺子周」，排障和选型时才知道该动哪一环。","b":""},{"id":"c1-1-4","t":"1.1.4 · 平台周","d":"平台周：落在「连载顺序（按这条走，不按编号）」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「平台周」，排障和选型时才知道该动哪一环。","b":""},{"id":"c1-1-5","t":"1.1.5 · 交付周","d":"交付周：⑪ / ⑥ → ⑮ 门禁 OTA → ⑬其余（RAG/工具/VLM）","kids":[],"w":"弄清「交付周」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「先认端侧」一个可讲可练的切口，让下面的知识点有归属。","b":"先把整本课排成可走的周次，不按编号硬闯。入门、主链路、尺子、平台、交付五周认清，才谈端/边/云边界与四级台阶。"},{"id":"c1-2","t":"1.2 · 端 · 近边 · 云：先把词钉死","d":"「端侧」不是「随便靠边一点」。工程上先问：数据在哪产生、算力归谁管、失败回落哪一层","kids":[{"id":"c1-2-1","t":"1.2.1 · 端（on-device）","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。","kids":[],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":""},{"id":"c1-2-2","t":"1.2.2 · 近边（MEC / access-edge）","d":"接入网边缘的虚拟化宿主（MEC host）：基站旁/园区 PoP 上的算力与编排。时延与主权跟运营商/园区域走，不是手机里的 NPU。（补充：接入网边缘的虚拟化宿主。ETSI GS MEC 003：MEC host = 平台 + 算力/存储/网络。落点：基站旁机。）","kids":[],"w":"部署图要把近边与端侧分开画：RTT、编排主权、失败回落写清，才不会把 MEC 当手机。","b":""},{"id":"c1-2-3","t":"1.2.3 · 云","d":"云：集中式算力与长周期数据面，跳数更多、信任域更广。落点：公有云 Region、中心机房。适合训练、长尾开放域推理、跨用户聚合。Apple Private Cloud Compute 接端上 ~…","kids":[],"w":"弄清「云」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「端 · 近边 · 云：先把词钉死」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"周次有了，先钉术语：端=设备本体，近边=MEC/接入网边缘，云=中心。词钉死，后面「为啥挤上设备」才不会把 MEC 当手机。"},{"id":"c1-3","t":"1.3 · 信任边界 ≠ 物理边界","d":"谁持钥、谁编排、谁审计、故障归谁。物理共址不等于同一信任域：MEC 与 Edge Cloud 可同机房不同域。","kids":[{"id":"c1-3-n","t":"1.3.1 · 信任边界 ≠ 物理边界","d":"谁持钥、谁编排、谁审计、故障归谁。物理共址不等于同一信任域：MEC 与 Edge Cloud 可同机房不同域。（补充：信任边界问的是谁持钥、谁编排、谁审计、故障归谁；物理边界只问机柜在哪。同一机房可以同时有 MEC 宿主与 Edge Cl。）","kids":[],"w":"评审翻车常因 PPT 只画「边缘」说不清主权；部署图强制三列——算力归属/数据驻留/编排主权。","b":""}],"w":"评审翻车常因 PPT 只画「边缘」说不清主权；部署图强制三列——算力归属/数据驻留/编排主权。","b":"三层名字钉死后，再分清信任域与机柜：共址≠可控。信任边界清了，协作切分才写得进部署图。"},{"id":"c1-4","t":"1.4 · 设备–边缘–云是协作面，不是替代关系","d":"Y.4509 把 AI 协作拆成推理协作与训练协作。端不够可以上推边/云，也可以端侧预处理后再传特征。按时延、算力、隐私切，别口号「全部上云」或「全部端侧」","kids":[{"id":"c1-4-n","t":"1.4.1 · 设备–边缘–云是协作面，不是替代关系","d":"设备–边缘–云是协作面，不是替代关系：Y.4509 把 AI 协作拆成推理协作与训练协作。端不够可以上推边/云，也可以端侧预处理后再传特征。按时延、算力、隐私切，别口号「全部上云」或「全部端侧」","kids":[],"w":"弄清「设备–边缘–云是协作面，不是替代关系」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「设备–边缘–云是协作面，不是替代关系」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"信任域分清后，端边云按任务切分，不是互相替代。切分表有了，才谈为啥要把推理挤上设备。"},{"id":"c1-5","t":"1.5 · 边界决策四问","d":"主题「边界决策四问」管端侧链路里这一段，下含：边界决策四问。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c1-5-n","t":"1.5.1 · 边界决策四问","d":"边界决策四问：落在「边界决策四问」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「边界决策四问」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「先认端侧」一个可讲可练的切口，让下面的知识点有归属。","b":"协作原则有了，用四问做现场 checklist。问完再进动机章，避免口号式「上边缘」。"},{"id":"c1-6","t":"1.6 · 为什么要把推理挤上设备","d":"云上顺：机器多、内存大、挂了重启。同一份权重进手机、盒子、车机，常见首帧不出、内存顶满、多路排队。硬顶是算力、内存、带宽、功耗，还要按节拍跑","kids":[{"id":"c1-6-n","t":"1.6.1 · 为什么要把推理挤上设备","d":"为什么要把推理挤上设备：云上顺：机器多、内存大、挂了重启。同一份权重进手机、盒子、车机，常见首帧不出、内存顶满、多路排队。硬顶是算力、内存、带宽、功耗，还要按节拍跑","kids":[],"w":"弄清「为什么要把推理挤上设备」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「为什么要把推理挤上设备」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"三层边界清了，才谈动机：隐私、延迟、成本、离线。动机落到产业锚点，下一步先深挖时延与可用性。"},{"id":"c1-7","t":"1.7 · 时延与可用性","d":"时延拆两段：TTFT（首 token 可展示）与 Decode 稳态 tok/s。可用性：弱网/断网/热降频后还能不能做完或降级。CV 的 FPS 搬不过来；LLM 必须 Prefill / Decode 分表","kids":[{"id":"c1-7-n","t":"1.7.1 · 时延与可用性","d":"时延与可用性：时延拆两段：TTFT（首 token 可展示）与 Decode 稳态 tok/s。可用性：弱网/断网/热降频后还能不能做完或降级。CV 的 FPS 搬不过来；LLM 必须 Prefill / Decode 分表","kids":[],"w":"弄清「时延与可用性」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「时延与可用性」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"动机表看过，先深挖时延：本机测 TTFT/稳态，不抄云 Demo。时延账清了，再谈数据最小化。"},{"id":"c1-8","t":"1.8 · 数据最小化（技术解读，非法条）","d":"只处理目的所必要的数据：少采、少存、少传、少副本。端侧减少外传是手段之一，不等于自动合规。","kids":[{"id":"c1-8-n","t":"1.8.1 · 数据最小化（技术解读，非法条）","d":"只处理目的所必要的数据：少采、少存、少传、少副本。端侧减少外传是手段之一，不等于自动合规。","kids":[],"w":"数据流图要标原始/特征/日志/遥测四级；「本地模型」挡不住全量日志回传的拒收。","b":""}],"w":"数据流图要标原始/特征/日志/遥测四级；「本地模型」挡不住全量日志回传的拒收。","b":"时延约束之后谈隐私手段：少传少存。最小化是设计默认，不是「本地=合规」；再看产业产品线如何把模型挤上设备。"},{"id":"c1-9","t":"1.9 · 产业已把「可挤上设备」做成产品线","d":"选型看参数量、量化位宽、峰值 RSS、最长上下文、授权与安全对齐、失败上云策略。云端大模型分数证明不了手机同款体验","kids":[{"id":"c1-9-1","t":"1.9.1 · Apple","d":"Apple：端上约 ~3B；日常端上，复杂走 PCC。公开自测：iPhone 15 Pro 约 0.6 ms/prompt-token、约 30 tok/s（未 speculat…","kids":[],"w":"弄清「Apple」，排障和选型时才知道该动哪一环。","b":""},{"id":"c1-9-2","t":"1.9.2 · Phi-3-mini","d":"Phi-3-mini：约 3.8B；4-bit 约 1.8 GB；iPhone 14 / A16 离线 >12 tok/s（Microsoft 报告条件）。ONNX Runtime 有移动…","kids":[],"w":"弄清「Phi-3-mini」，排障和选型时才知道该动哪一环。","b":""},{"id":"c1-9-3","t":"1.9.3 · Llama 3.2 1B/3B","d":"Llama 3.2 1B/3B：面向 edge/mobile。量化版（ExecuTorch，OnePlus 12 等）：相对 BF16 约 2–4×，体积约 −56%，RSS 约 −41%。写清引擎…","kids":[],"w":"弄清「Llama 3.2 1B/3B」，排障和选型时才知道该动哪一环。","b":""},{"id":"c1-9-4","t":"1.9.4 · Qwen2.5","d":"Qwen2.5：0.5B / 1.5B / 3B 作端上或 draft；3B 标 mobile 友好。中文业务集 + 工具调用 JSON 合法率；draft+target 投机时两模版本绑定","kids":[],"w":"弄清「Qwen2.5」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「产业已把「可挤上设备」做成产品线」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"约束讲清后，看 Apple/Phi/Llama 把小模型做成可交付路径。选型表有了，才列「何时不要硬挤」。"},{"id":"c1-10","t":"1.10 · 何时不要硬挤上设备","d":"厂商「最高 xx tok/s / xx TOPS」是峰值叙事。课堂只认写清模型、量化、上下文、是否热稳态的数字。细则 ⑬-9 / ⑬-12","kids":[{"id":"c1-10-1","t":"1.10.1 · 开放域长推理、重度工具编排、超大私有库检索，端侧上…","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。","kids":[],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":""},{"id":"c1-10-2","t":"1.10.2 · 模型更新与安全补丁无法在端侧可靠分发与回滚。","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。","kids":[],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":""},{"id":"c1-10-3","t":"1.10.3 · 「隐私」其实是审计/跨境，却无数据分类与驻留策略。","d":"「隐私」其实是审计/跨境，却无数据分类与驻留策略。：「隐私」其实是审计/跨境，却无数据分类与驻留策略","kids":[],"w":"弄清「「隐私」其实是审计/跨境，却无数据分类与驻留策略。」，排障和选型时才知道该动哪一环。","b":""},{"id":"c1-10-4","t":"1.10.4 · 唯一证据是营销对比图，没有同机对照基准。","d":"唯一证据是营销对比图，没有同机对照基准。：唯一证据是营销对比图，没有同机对照基准","kids":[],"w":"弄清「唯一证据是营销对比图，没有同机对照基准。」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「何时不要硬挤上设备」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"能挤的边界认清，再用拒收清单防止硬扛。收束后进访存墙——主矛盾往往在搬而不在算。"},{"id":"c1-11","t":"1.11 · 访存墙：端侧 LLM 的主矛盾","d":"端侧 LLM decode 多为 batch≈1：每 token 重读常驻权重与 KV，算术强度极低，瓶颈在搬字节而非宣传 TOPS。","kids":[{"id":"c1-11-n","t":"1.11.1 · 访存墙：端侧 LLM 的主矛盾","d":"端侧 LLM decode 多为 batch≈1：每 token 重读常驻权重与 KV，算术强度极低，瓶颈在搬字节而非宣传 TOPS。（补充：端侧 LLM 多数时候卡在权重和 KV 搬不动，宣传 TOPS 不够用。）","kids":[],"w":"对话跟手先问有效带宽与 bytes/token，再谈 NPU TOPS；Prefill 与 Decode 必须分表。","b":""}],"w":"对话跟手先问有效带宽与 bytes/token，再谈 NPU TOPS；Prefill 与 Decode 必须分表。","b":"何时不硬挤列完，总览访存墙：主矛盾在搬不在算。总览后先定义「是什么」，再拆为何/怎么量。"},{"id":"c1-12","t":"1.12 · 访存墙是什么","d":"端侧 LLM decode 多为 batch≈1：每 token 重读常驻权重与 KV，算术强度极低，瓶颈在搬字节而非宣传 TOPS。","kids":[{"id":"c1-12-n","t":"1.12.1 · 访存墙是什么","d":"端侧 LLM decode 多为 batch≈1：每 token 重读常驻权重与 KV，算术强度极低，瓶颈在搬字节而非宣传 TOPS。（补充：对话主路径是 batch≈1 的自回归 Decode：每出 1 token，大体要把常驻权重（再加随上下文增长的 KV）。）","kids":[],"w":"对话跟手先问有效带宽与 bytes/token，再谈 NPU TOPS；Prefill 与 Decode 必须分表。","b":""}],"w":"对话跟手先问有效带宽与 bytes/token，再谈 NPU TOPS；Prefill 与 Decode 必须分表。","b":"动机收束后，先定义访存墙：batch≈1 decode 每 token 扫权重。定义清了，才讲为何它是端侧主矛盾。"},{"id":"c1-13","t":"1.13 · 为何访存是主矛盾","d":"Prefill 更像算力墙（矩阵大、可并行），主导 TTFT。Decode 更像带宽墙（每 token 重读权重），主导持续出字。TOPS 宣传主要抬 Prefill，兑不成对话 tok/s","kids":[{"id":"c1-13-n","t":"1.13.1 · 为何访存是主矛盾","d":"为何访存是主矛盾：Prefill 更像算力墙（矩阵大、可并行），主导 TTFT。Decode 更像带宽墙（每 token 重读权重），主导持续出字。TOPS 宣传主要抬 Prefill，兑不成对话 tok/s","kids":[],"w":"弄清「为何访存是主矛盾」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「为何访存是主矛盾」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"定义有了：prefill 吃算力、decode 吃带宽。主矛盾钉死，下一步才谈怎么量，别再用 TOPS 代替 tok/s。"},{"id":"c1-14","t":"1.14 · Prefill 与 Decode：墙的差异","d":"提示词整段一次性进模型、算出首段表示并填满 KV 的阶段。往往决定首字等多久出来，算力更密。","kids":[{"id":"c1-14-1","t":"1.14.1 · Prefill","d":"提示词整段一次性进模型、算出首段表示并填满 KV 的阶段。往往决定首字等多久出来，算力更密。（补充：整段 prompt 一次（或 chunked）前向，填 KV，算力墙，主导 TTFT。Decode — 逐 token，。）","kids":[],"w":"TTFT 差，先看 Prefill：序列长、视觉编码、是否多余重算。","b":""}],"w":"TTFT 差，先看 Prefill：序列长、视觉编码、是否多余重算。","b":"KV 布局之后要把生成拆成 Prefill 与 Decode。首字慢和跟手慢不是同一笔账；阶段认清，TTFT 指标才有意义。"},{"id":"c1-15","t":"1.15 · 访存墙怎么量","d":"端侧 LLM decode 多为 batch≈1：每 token 重读常驻权重与 KV，算术强度极低，瓶颈在搬字节而非宣传 TOPS。","kids":[{"id":"c1-15-n","t":"1.15.1 · 访存墙怎么量","d":"端侧 LLM decode 多为 batch≈1：每 token 重读常驻权重与 KV，算术强度极低，瓶颈在搬字节而非宣传 TOPS。（补充：3B INT4 Decode（理想权重项）：每 token 权重流量 ≈ \\(3\\times10^9 \\times 0.。）","kids":[],"w":"对话跟手先问有效带宽与 bytes/token，再谈 NPU TOPS；Prefill 与 Decode 必须分表。","b":""}],"w":"对话跟手先问有效带宽与 bytes/token，再谈 NPU TOPS；Prefill 与 Decode 必须分表。","b":"主矛盾认清后立表计：算术强度、有效带宽、稳态 tok/s。量表齐了，再列常见误判当红黄牌。"},{"id":"c1-16","t":"1.16 · 访存墙常见误判","d":"端侧 LLM decode 多为 batch≈1：每 token 重读常驻权重与 KV，算术强度极低，瓶颈在搬字节而非宣传 TOPS。","kids":[{"id":"c1-16-n","t":"1.16.1 · 访存墙常见误判","d":"端侧 LLM decode 多为 batch≈1：每 token 重读常驻权重与 KV，算术强度极低，瓶颈在搬字节而非宣传 TOPS。（补充：1. 「NPU xx TOPS → 对话一定快」→ 先问有效带宽与权重是否常驻。）","kids":[],"w":"对话跟手先问有效带宽与 bytes/token，再谈 NPU TOPS；Prefill 与 Decode 必须分表。","b":""}],"w":"对话跟手先问有效带宽与 bytes/token，再谈 NPU TOPS；Prefill 与 Decode 必须分表。","b":"会量之后对照误判：TOPS≠对话快、能加载≠能交付。误判清了，再用带条件的锚点数字钉课堂。"},{"id":"c1-17","t":"1.17 · 访存墙锚点（条件写死）","d":"端侧 LLM decode 多为 batch≈1：每 token 重读常驻权重与 KV，算术强度极低，瓶颈在搬字节而非宣传 TOPS。","kids":[{"id":"c1-17-n","t":"1.17.1 · 访存墙锚点（条件写死）","d":"端侧 LLM decode 多为 batch≈1：每 token 重读常驻权重与 KV，算术强度极低，瓶颈在搬字节而非宣传 TOPS。","kids":[],"w":"对话跟手先问有效带宽与 bytes/token，再谈 NPU TOPS；Prefill 与 Decode 必须分表。","b":""}],"w":"对话跟手先问有效带宽与 bytes/token，再谈 NPU TOPS；Prefill 与 Decode 必须分表。","b":"误判清单之后给锚点：Phi/Orin/骁龙/Tiny，条件写死。锚点只认方位，过门细节进四级台阶。"},{"id":"c1-18","t":"1.18 · 发展：四级台阶（可度量）","d":"主题「发展：四级台阶（可度量）」管端侧链路里这一段，下含：发展：四级台阶（可度量）。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c1-18-n","t":"1.18.1 · 发展：四级台阶（可度量）","d":"发展：四级台阶（可度量）：把「能演示」拆成四道门。营销绿表不算过门","kids":[],"w":"弄清「发展：四级台阶（可度量）」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「先认端侧」一个可讲可练的切口，让下面的知识点有归属。","b":"访存墙提醒你演示≠交付。四级台阶把能力拆成可度量的门；过了哪道门，才谈手机/车机/盒子各用哪把拒收尺。"},{"id":"c1-19","t":"1.19 · L1 能加载（容量门）","d":"四级台阶第一道：权重进设备、能出首帧，且峰值内存低于可用 DRAM。格式对 ≠ 能交付。","kids":[{"id":"c1-19-n","t":"1.19.1 · L1 能加载（容量门）","d":"四级台阶第一道：权重进设备、能出首帧，且峰值内存低于可用 DRAM。格式对 ≠ 能交付。（补充：固定 SoC 冷启动可加载；峰值 < 可用 DRAM（经验留 ≥15–20%）；无系统杀进程。一开即死、只能短 ctx、。）","kids":[],"w":"OOM 比慢更致命；装不进就不要往下谈量化与加速。","b":""}],"w":"OOM 比慢更致命；装不进就不要往下谈量化与加速。","b":"总表看过，先过容量门：装得进、不 OOM。L1 过了才谈量化塞入，否则后面全是空转。"},{"id":"c1-20","t":"1.20 · L2 能量化塞入（体积+精度门）","d":"四级台阶第二道：INT4/W4A16 等路径跑通，体积进预算，业务掉点与速度同表验收。","kids":[{"id":"c1-20-n","t":"1.20.1 · L2 能量化塞入（体积+精度门）","d":"四级台阶第二道：INT4/W4A16 等路径跑通，体积进预算，业务掉点与速度同表验收。（补充：目标档可复现导出；体积进场景预算；任务集掉点在合同阈内；decode 不低于场景 soft 线。塞进了但胡话、仅 PPL。）","kids":[],"w":"塞进去但不能用等于没交付；无校准指纹的量化包当场拒收。","b":""}],"w":"塞进去但不能用等于没交付；无校准指纹的量化包当场拒收。","b":"能加载之后压 bit：体积与业务掉点同表验收。L2 过了才谈工具链指纹，别只交演示 APK。"},{"id":"c1-21","t":"1.21 · L3 工具链可复现（指纹门）","d":"四级台阶第三道：同一 SoC/引擎版本/导出指纹下，转换→Runtime→Profiling 可复跑，算子落点可审计。","kids":[{"id":"c1-21-n","t":"1.21.1 · L3 工具链可复现（指纹门）","d":"四级台阶第三道：同一 SoC/引擎版本/导出指纹下，转换→Runtime→Profiling 可复跑，算子落点可审计。","kids":[],"w":"演示 APK 与「我机器上可以」过不了量产；静默 CPU fallback 不算加速。","b":""}],"w":"演示 APK 与「我机器上可以」过不了量产；静默 CPU fallback 不算加速。","b":"量化过线后钉指纹：同脚本同版本可复跑。L3 过了才谈长稳与 OTA，演示机不算交付。"},{"id":"c1-22","t":"1.22 · L4 交付门禁（长稳+可追溯）","d":"四级台阶第四道：共板、温区 sustained、OTA 可回滚、崩溃/OOM 率可追溯。演示绿 ≠ 门禁绿。","kids":[{"id":"c1-22-1","t":"1.22.1 · Phi-3-mini 3.8B","d":"Phi-3-mini 3.8B：4-bit ≈1.8 GB；iPhone 14 / A16 >12 tok/s（Microsoft 报告）","kids":[],"w":"弄清「Phi-3-mini 3.8B」，排障和选型时才知道该动哪一环。","b":""},{"id":"c1-22-2","t":"1.22.2 · Llama 3.2 1B/3B","d":"Llama 3.2 1B/3B：edge/mobile；量化体积约 −56%、内存约 −41%（厂商博客条件）","kids":[],"w":"弄清「Llama 3.2 1B/3B」，排障和选型时才知道该动哪一环。","b":""},{"id":"c1-22-3","t":"1.22.3 · Qwen2.5","d":"Qwen2.5：3B mobile 友好；0.5B/1.5B 常作端上或 draft","kids":[],"w":"弄清「Qwen2.5」，排障和选型时才知道该动哪一环。","b":""},{"id":"c1-22-4","t":"1.22.4 · 车机/盒","d":"车机/盒：Orin ~200 GB/s、数十 GB DRAM；Edge-LLM 8B INT4、BS=1 约数十 tok/s。TOPS 规格 ≠ 官方 LLM 栈就绪；版本列车见 ⑭ / ⑮","kids":[],"w":"弄清「车机/盒」，排障和选型时才知道该动哪一环。","b":""}],"w":"空调房峰值挡不住座舱投诉；验收看 P95 与热稳态。","b":"指纹齐了才上门禁：P95、热稳态、回滚。L4 过了再按场景选拒收尺，空调房绿表无效。"},{"id":"c1-23","t":"1.23 · 落地场景（选场景 = 选拒收理由）","d":"主题「落地场景（选场景 = 选拒收理由）」管端侧链路里这一段，下含：手机、车机、盒子。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c1-23-1","t":"1.23.1 · 手机","d":"手机：系统推理 API 或厂商 NPU；低 bit 常驻；长尾上云/PCC。翻车：插电冷跑 25+ tok/s，夏天户外 DVFS 掉到个位数，日志还默认回传——体验+隐私双杀。锚点：Phi-3 …","kids":[],"w":"弄清「手机」，排障和选型时才知道该动哪一环。","b":""},{"id":"c1-23-2","t":"1.23.2 · 车机","d":"车机：端上短答 + 近边/云长尾；禁止搬桌面 TRT-LLM 数字。翻车：空调房 30 tok/s，暴晒掉到个位数，VAD 未对齐导致「说完半天才出字」。锚点：Edge-LLM Orin64 Qw…","kids":[],"w":"弄清「车机」，排障和选型时才知道该动哪一环。","b":""},{"id":"c1-23-3","t":"1.23.3 · 盒子","d":"盒子：固定队列与共板排班；崩溃拉起 + 指纹上报。翻车：单路实验室绿，四路相机+ASR+LLM 后 DDR 打满间歇 OOM，换班无法复现——缺 L3 指纹与共板账","kids":[],"w":"弄清「盒子」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「先认端侧」一个可讲可练的切口，让下面的知识点有归属。","b":"台阶认完才谈现场：车上、手机、工控各用哪把拒收尺。场景清楚了，才立现场拒收尺，别把演示当交付。"},{"id":"c1-24","t":"1.24 · 现场拒收尺（先立尺，再进 ⑫）","d":"主题「现场拒收尺（先立尺，再进 ⑫）」管端侧链路里这一段，下含：现场拒收尺（先立尺，再进 ⑫）。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c1-24-n","t":"1.24.1 · 现场拒收尺（先立尺，再进 ⑫）","d":"现场拒收尺（先立尺，再进 ⑫）：「能跑」进不了评审。立项前至少钉五张表（测法见 ⑬）","kids":[],"w":"弄清「现场拒收尺（先立尺，再进 ⑫）」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「先认端侧」一个可讲可练的切口，让下面的知识点有归属。","b":"场景定了才立尺：DRAM、TTFT、稳态 tok/s、掉点、温控。尺立住，三种活才知道各自交哪张表。"},{"id":"c1-25","t":"1.25 · 表 A · DRAM 峰值 / 模型体积","d":"OOM、杀进程、包体超配额、长对话中途崩——都是容量与共板问题；「能聊两句」挡不住。同构建指纹下测：冷/热峰值 RSS；权重+runtime 常驻；KV 随 ctx 曲线；共板叠加；导出哈希与体积一致。挂钩：⑬-9；〇 L1；⑩；⑮","kids":[{"id":"c1-25-n","t":"1.25.1 · 表 A · DRAM 峰值 / 模型体积","d":"表 A · DRAM 峰值 / 模型体积：OOM、杀进程、包体超配额、长对话中途崩——都是容量与共板问题；「能聊两句」挡不住。同构建指纹下测：冷/热峰值 RSS；权重+runtime 常驻；KV 随 ctx 曲线；共板叠加；导出哈希与体积一致。挂钩：⑬-9；〇 L1；⑩；⑮","kids":[],"w":"弄清「表 A · DRAM 峰值 / 模型体积」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「表 A · DRAM 峰值 / 模型体积」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"五张拒收尺从内存开刀：OOM 比慢更致命。表 A 钉住，再测 TTFT，避免首字体验被内存抖动掩盖。"},{"id":"c1-26","t":"1.26 · 表 B · TTFT / Prefill","d":"提示词整段一次性进模型、算出首段表示并填满 KV 的阶段。往往决定首字等多久出来，算力更密。","kids":[{"id":"c1-26-n","t":"1.26.1 · 表 B · TTFT / Prefill","d":"提示词整段一次性进模型、算出首段表示并填满 KV 的阶段。往往决定首字等多久出来，算力更密。（补充：首字迟钝当场失败；长提示卡死；VLM 一帧图拖垮首包。固定 prompt 长（及视觉 token）测 TTFT P50/。）","kids":[],"w":"TTFT 差，先看 Prefill：序列长、视觉编码、是否多余重算。","b":""}],"w":"TTFT 差，先看 Prefill：序列长、视觉编码、是否多余重算。","b":"内存过线后测首字：TTFT/Prefill。首包合格，再验 decode 稳态，别用一个「最高 tok/s」糊弄。"},{"id":"c1-27","t":"1.27 · 表 C · Decode 稳态 tok/s","d":"一个接一个吐 token 的阶段，每步主要吃 KV 与带宽。体感「生成慢不慢」常栽在这里。","kids":[{"id":"c1-27-n","t":"1.27.1 · 表 C · Decode 稳态 tok/s","d":"一个接一个吐 token 的阶段，每步主要吃 KV 与带宽。体感「生成慢不慢」常栽在这里。（补充：演示快、热了趴；吞吐虚高体验仍卡；ctx 越长越爬。固定 past-KV 下 P50/P95；温区/功耗墙内 susta。）","kids":[],"w":"交互跟手度看 Decode；带宽和 KV 布局比盲目加核数更管用。","b":""}],"w":"交互跟手度看 Decode；带宽和 KV 布局比盲目加核数更管用。","b":"首字过后看持续生成与温区。稳态过了，再验量化掉点——快但胡话同样拒收。"},{"id":"c1-28","t":"1.28 · 表 D · 量化精度掉点","d":"塞进了但不能用；能聊不能调用；压 bit 后护栏塌。业务集/锚点集 vs FP16/BF16；校准指纹与复测；工具调用 JSON 合法率；安全拒答/越狱集；逐层/算子误差归因。挂钩：⑬-14；〇 L2；⑬-8","kids":[{"id":"c1-28-n","t":"1.28.1 · 表 D · 量化精度掉点","d":"表 D · 量化精度掉点：塞进了但不能用；能聊不能调用；压 bit 后护栏塌。业务集/锚点集 vs FP16/BF16；校准指纹与复测；工具调用 JSON 合法率；安全拒答/越狱集；逐层/算子误差归因。挂钩：⑬-14；〇 L2；⑬-8","kids":[],"w":"弄清「表 D · 量化精度掉点」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「表 D · 量化精度掉点」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"速度过线必须过精度：业务集与对齐三站。精度立住，最后才验功耗与温控掉速。"},{"id":"c1-29","t":"1.29 · 表 E · 功耗 / 温控掉速","d":"always-on 烫手与续航投诉；无散热掉崖；相机+ASR+LLM 同时炸墙。会话级 mAh 或整机功率；结温–频率–tok/s 三联；共板功率包络；降级策略可测；车规高低温点。挂钩：⑬-16；⑮","kids":[{"id":"c1-29-n","t":"1.29.1 · 表 E · 功耗 / 温控掉速","d":"表 E · 功耗 / 温控掉速：always-on 烫手与续航投诉；无散热掉崖；相机+ASR+LLM 同时炸墙。会话级 mAh 或整机功率；结温–频率–tok/s 三联；共板功率包络；降级策略可测；车规高低温点。挂钩：⑬-16；⑮","kids":[],"w":"弄清「表 E · 功耗 / 温控掉速」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「表 E · 功耗 / 温控掉速」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"精度过线后验热与电：会话级功耗、结温–频率曲线。五表齐了，再分三种活各交哪张单。"},{"id":"c1-30","t":"1.30 · 职业：三种活（交的是产物，不是岗位名）","d":"把训好的模型接到设备上，又准又稳，还能复现交付。算法盯离线分数，嵌入式盯板子和驱动，部署夹在中间：把「实验室能训」收成「现场能交」","kids":[{"id":"c1-30-1","t":"1.30.1 · 交到板上","d":"交到板上：落在「职业：三种活（交的是产物，不是岗位名）」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「交到板上」，排障和选型时才知道该动哪一环。","b":""},{"id":"c1-30-2","t":"1.30.2 · 变轻变快","d":"变轻变快：落在「职业：三种活（交的是产物，不是岗位名）」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「变轻变快」，排障和选型时才知道该动哪一环。","b":""},{"id":"c1-30-3","t":"1.30.3 · Runtime / 算子","d":"Runtime / 算子：落在「职业：三种活（交的是产物，不是岗位名）」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「Runtime / 算子」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「职业：三种活（交的是产物，不是岗位名）」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"拒收尺立住才分活：交到板上、变轻变快、Runtime/算子不是同一份工。职业切口立住，后面技术章才知道自己在交哪一截。"},{"id":"c1-31","t":"1.31 · 出处速查（备课）","d":"数字进合同以板上 profiler 为准；上表只作认方位的产业锚点，不替代 ⑬ / ⑯ 口径","kids":[{"id":"c1-31-n","t":"1.31.1 · 出处速查（备课）","d":"出处速查（备课）：数字进合同以板上 profiler 为准；上表只作认方位的产业锚点，不替代 ⑬ / ⑯ 口径","kids":[],"w":"弄清「出处速查（备课）」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「出处速查（备课）」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"方位、台阶、场景、拒收尺认完，用出处表回查标准与厂商锚点。数字进合同仍以板上 profiler 为准，然后进 ⑫ 动手。"}],"w":"给学习路径一个章节锚点，排障时先回到这一章的目标。","b":"进技术命令之前先认方位：端相对近边/云站哪一层、为啥挤上设备、访存墙、四级台阶、场景拒收尺、交哪种活。方位清了，全栈入门才不是工具堆。"},{"id":"c2","t":"2 · 基础入门 · 全栈技术","d":"深度学习基础、部署核心概念、技术栈全景、三平台工具链、CV全链路与常见问题排错","kids":[{"id":"c2-1","t":"2.1 · 机器学习与深度学习基础概念","d":"训练=前向+反向+优化器；数据集/Epoch/Batch Size/Loss/Learning Rate，以监督学习为主","kids":[{"id":"c2-1-1","t":"2.1.1 · 架构CNN(YOLO/ResNet)/RNN/Tr…","d":"架构CNN(YOLO/ResNet)/RNN/Tr…：架构CNN(YOLO/ResNet)/RNN/Transformer/GCN；激活ReLU/Sigmoid/Softmax","kids":[],"w":"弄清「架构CNN(YOLO/ResNet)/RNN/Tr…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c2-1-2","t":"2.1.2 · 过拟合增数据/正则/早停；Warmup/Cosin…","d":"过拟合增数据/正则/早停；Warmup/Cosin…：过拟合增数据/正则/早停；Warmup/Cosine Annealing/Step Decay","kids":[],"w":"弄清「过拟合增数据/正则/早停；Warmup/Cosin…」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「机器学习与深度学习基础概念」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"进部署前先把训练/推理、过拟合这些词对齐。概念齐了才谈转换、量化、算子；词没齐，30 天路线只是清单。"},{"id":"c2-2","t":"2.2 · 模型部署核心概念：转换、量化、算子与异构硬件","d":"链路PT→ONNX(通用语言)→芯片格式OMC/engine/RKNN/mslite→设备部署","kids":[{"id":"c2-2-1","t":"2.2.1 · 量化FP32→INT8体积4x提速3x，q=rou…","d":"量化FP32→INT8体积4x提速3x，q=rou…：量化FP32→INT8体积4x提速3x，q=round(r/scale)+zero_point；PTQ vs QAT","kids":[],"w":"弄清「量化FP32→INT8体积4x提速3x，q=rou…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c2-2-2","t":"2.2.2 · CPU/GPU/NPU(3D Cube)分工；DD…","d":"CPU/GPU/NPU(3D Cube)分工；DD…：CPU/GPU/NPU(3D Cube)分工；DDK含OMG/TBE/知识库JSON","kids":[],"w":"弄清「CPU/GPU/NPU(3D Cube)分工；DD…」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「模型部署核心概念：转换、量化、算子与异构硬件」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"深度学习词齐了，这段把转换、量化、算子、异构硬件钉成一张图。图立住，后面学习路线才不是周历表。"},{"id":"c2-3","t":"2.3 · 30天端侧部署工程师学习路线图（五阶段路径）","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。","kids":[{"id":"c2-3-1","t":"2.3.1 · 三平台：本地PC+GPU(4×V100)+昇腾座舱…","d":"三平台：本地PC+GPU(4×V100)+昇腾座舱…：三平台：本地PC+GPU(4×V100)+昇腾座舱板分工协作","kids":[],"w":"弄清「三平台：本地PC+GPU(4×V100)+昇腾座舱…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c2-3-2","t":"2.3.2 · 里程碑：YOLOv11 INT8(相似度>99%、…","d":"里程碑：YOLOv11 INT8(相似度>99%、…：里程碑：YOLOv11 INT8(相似度>99%、18.2→4.6MB)；每日检查点+复习清单","kids":[],"w":"弄清「里程碑：YOLOv11 INT8(相似度>99%、…」，排障和选型时才知道该动哪一环。","b":""}],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":"核心概念有了，再排五阶段路径，避免上来就抠平台命令。路线清楚才配三平台环境，CV 全链路才有周次可挂。"},{"id":"c2-4","t":"2.4 · 三平台实验环境与部署工具链（SSH/ADB/Conda）","d":"本地tzone_venv、GPU服务器(CUDA12.1)、KirinV90座舱板(Android12)三端，SSH/ADB操作","kids":[{"id":"c2-4-1","t":"2.4.1 · conda只改自有tzone；SSH须source…","d":"conda只改自有tzone；SSH须source…：conda只改自有tzone；SSH须source conda.sh；pip用阿里云镜像","kids":[],"w":"弄清「conda只改自有tzone；SSH须source…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c2-4-2","t":"2.4.2 · adb push模型+smart_parking_…","d":"adb push模型+smart_parking_…：adb push模型+smart_parking_test测速；ls /vendor/lib64 grep npu","kids":[],"w":"弄清「adb push模型+smart_parking_…」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「三平台实验环境与部署工具链（SSH/ADB/Conda）」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"路线图画完才装 SSH/ADB/Conda。环境通了，CV 那条 PT→ONNX 才有板子可跑；环境是主链路的手，不是目录装饰。"},{"id":"c2-5","t":"2.5 · CV模型部署全链路：PT→ONNX→INT8量化→精度评估","d":"跨框架中间格式，常作训练框架到推理引擎的交接面。图对不对、算子齐不齐，先在这里验。","kids":[{"id":"c2-5-1","t":"2.5.1 · FP32 18.2MB→INT8 4.6MB；余弦…","d":"FP32 18.2MB→INT8 4.6MB；余弦…：FP32 18.2MB→INT8 4.6MB；余弦>99%合格，低于加exclude_nodes","kids":[],"w":"弄清「FP32 18.2MB→INT8 4.6MB；余弦…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c2-5-2","t":"2.5.2 · per-channel/per-tensor粒度权…","d":"一组数共享一套量化参数的范围：整张张量一份（per-tensor）还是每个通道一份（per-channel）。粒度越细通常越准，也更吃存储与算子支持。","kids":[],"w":"精度掉点时先问粒度够不够细，再问校准集；很多「INT8 崩了」其实是 per-tensor 扛不住通道差异。","b":""}],"w":"转换失败优先查 ONNX：动态 shape、自定义算子、opset 版本。","b":"三平台环境通了，先用 CV 把 PT→ONNX→INT8→精度验收走通。同一套量化图后面才换昇腾编译入口，别一上来就上大模型。"},{"id":"c2-6","t":"2.6 · 昇腾NPU部署：OMC转换、DDK/OMG与算子搜索知识库","d":"OMG --target omc --framework 5出model.omc；ENABLE_TUNE_DUMP出op.csv供搜索","kids":[{"id":"c2-6-1","t":"2.6.1 · 流程：测速→check_hit_bank→筛选>1…","d":"流程：测速→check_hit_bank→筛选>1…：流程：测速→check_hit_bank→筛选>1000μs→04_search(20-60h)→05追加→重转","kids":[],"w":"弄清「流程：测速→check_hit_bank→筛选>1…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c2-6-2","t":"2.6.2 · 达芬奇3D Cube做NPU推理；DDK版本匹配K…","d":"达芬奇3D Cube做NPU推理；DDK版本匹配K…：达芬奇3D Cube做NPU推理；DDK版本匹配KirinV90","kids":[],"w":"弄清「达芬奇3D Cube做NPU推理；DDK版本匹配K…」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「昇腾NPU部署：OMC转换、DDK/OMG与算子搜索知识库」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"CV 那条已经把 PT→ONNX→INT8→精度验收走通。昇腾要换成自家 OMC/DDK/OMG 和算子库：同样的量化图，换编译入口。跑通板子后才轮到 LLM 的 GGUF/KV，因为大模型还多一层缓存账。"},{"id":"c2-7","t":"2.7 · LLM端侧部署：llama.cpp、GGUF量化与KV Cac…","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。","kids":[{"id":"c2-7-1","t":"2.7.1 · K-quant Q4_K_M/Q5_K_M/Q8_…","d":"K-quant Q4_K_M/Q5_K_M/Q8_…：K-quant Q4_K_M/Q5_K_M/Q8_0；AWQ(通道保护)vs GPTQ(Hessian)","kids":[],"w":"弄清「K-quant Q4_K_M/Q5_K_M/Q8_…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c2-7-2","t":"2.7.2 · prefill计算密集/decode访存密集；KV…","d":"提示词整段一次性进模型、算出首段表示并填满 KV 的阶段。往往决定首字等多久出来，算力更密。（补充：prefill计算密集/decode访存密集；KV Cache显存瓶颈，GQA共享KV。）","kids":[],"w":"TTFT 差，先看 Prefill：序列长、视觉编码、是否多余重算。","b":""}],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":"昇腾把 CV 图编到板上了。LLM 换 llama.cpp/GGUF，还要单独算 KV 缓存，不能当又一个 INT8 模型套。生成跑通后再看车载引擎全景。"},{"id":"c2-8","t":"2.8 · 车载芯片平台与推理引擎技术栈全景","d":"芯片谱系Orin(FP16/INT8/INT4)/Thor(FP8/NVFP4)/J5/J6 BPU/TDA4 DSP/高通NPU","kids":[{"id":"c2-8-1","t":"2.8.1 · 引擎：TensorRT-LLM/Edge-LLM、…","d":"面向 NVIDIA GPU 的推理栈：图优化、精度策略、引擎构建。车上/工控 GPU 路径常点名它。","kids":[],"w":"GPU 端侧选型时，先确认 TRT 版本与目标芯片是否匹配，再谈插件与精度。","b":""},{"id":"c2-8-2","t":"2.8.2 · 编译器LLVM/MLIR/TVM/XLA；岗位主线…","d":"编译器LLVM/MLIR/TVM/XLA；岗位主线…：编译器LLVM/MLIR/TVM/XLA；岗位主线：端侧LLM部署/AI编译器/量化","kids":[],"w":"弄清「编译器LLVM/MLIR/TVM/XLA；岗位主线…」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「车载芯片平台与推理引擎技术栈全景」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"LLM 的 GGUF/KV 账有了，才对照车载各家引擎栈。选型清楚再下钻编译器与算子，避免一上来绑死某一家宣传页。"},{"id":"c2-9","t":"2.9 · AI编译器、核心算子实现与LLM优化技术","d":"图优化算子融合(Conv+BN/QKV/Flash)+常量折叠+内存池；Attention分块tiling","kids":[{"id":"c2-9-1","t":"2.9.1 · LLM专用：GQA、投机采样、Continuous…","d":"LLM专用：GQA、投机采样、Continuous…：LLM专用：GQA、投机采样、Continuous Batching、结构化输出","kids":[],"w":"弄清「LLM专用：GQA、投机采样、Continuous…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c2-9-2","t":"2.9.2 · 档位FP16~NVFP4；PTQ/QAT(STE)…","d":"训练结束后再量化，基本不动原训练流程。上线快，但对校准和可量化图结构敏感。（补充：档位FP16~NVFP4；PTQ/QAT(STE)+敏感层混合精度；指标TTFT/P99/Jitter。）","kids":[],"w":"端侧赶工默认先 PTQ；精度不够再考虑 QAT 或混合精度，别一上来就重训。","b":""}],"w":"把「AI编译器、核心算子实现与LLM优化技术」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"引擎全景只告诉你有哪些栈。这段讲编译器和算子怎么把图画成能跑的核；排错章要靠这层语言，不能只记报错原文。"},{"id":"c2-10","t":"2.10 · 端侧部署常见问题排错（全链路调试知识库）","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。","kids":[{"id":"c2-10-1","t":"2.10.1 · ONNX：opset降11/onnxsim简化/预…","d":"跨框架中间格式，常作训练框架到推理引擎的交接面。图对不对、算子齐不齐，先在这里验。（补充：ONNX：opset降11/onnxsim简化/预处理HWC-BGR-255一致。）","kids":[],"w":"转换失败优先查 ONNX：动态 shape、自定义算子、opset 版本。","b":""},{"id":"c2-10-2","t":"2.10.2 · OMC：check_hit_bank→04_sea…","d":"OMC：check_hit_bank→04_sea…：OMC：check_hit_bank→04_search→05更新；LLM设HF_ENDPOINT镜像；踩坑记notes周记","kids":[],"w":"弄清「OMC：check_hit_bank→04_sea…」，排障和选型时才知道该动哪一环。","b":""}],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":"前面链路都走过，这段按全链路收口排错。先定位卡在转换、量化还是板上，再回头翻对应主题，别从日志第一行猜。"}],"w":"给学习路径一个章节锚点，排障时先回到这一章的目标。","b":"方位认完，用一条可跑的全栈把转换、量化、CV/昇腾/LLM 摸一遍。主链路章再把其中转换、引擎、运行时拆开深讲。"},{"id":"c3","t":"3 · 部署主链路","d":"训练模型到端侧推理引擎的完整通路：转换 → 编译 → 运行时","kids":[{"id":"c3-1","t":"3.1 · 模型转换","d":"主题「模型转换」管端侧链路里这一段，下含：转换链路、ONNX opset 与动态shape、算子兼容处理、常量折叠。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c3-1-1","t":"3.1.1 · 转换链路","d":"转换链路：PyTorch→ONNX→QNN/TensorRT，或 torch.export 直接导出","kids":[],"w":"弄清「转换链路」，排障和选型时才知道该动哪一环。","b":""},{"id":"c3-1-2","t":"3.1.2 · ONNX opset 与动态shape","d":"跨框架中间格式，常作训练框架到推理引擎的交接面。图对不对、算子齐不齐，先在这里验。","kids":[],"w":"转换失败优先查 ONNX：动态 shape、自定义算子、opset 版本。","b":""},{"id":"c3-1-3","t":"3.1.3 · 算子兼容处理","d":"算子兼容处理：不支持算子拆解/替换/CPU fallback，需评估精度与时延","kids":[],"w":"弄清「算子兼容处理」，排障和选型时才知道该动哪一环。","b":""},{"id":"c3-1-4","t":"3.1.4 · 常量折叠","d":"常量折叠：仅依赖常量的计算提前到转换期，减少运行时开销","kids":[],"w":"弄清「常量折叠」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「部署主链路」一个可讲可练的切口，让下面的知识点有归属。","b":"部署主链路从交接面开始：训练框架出图，先转成引擎吃得下的中间格式。图对了才谈编译和 Runtime，转换失败不要先怪板上。"},{"id":"c3-2","t":"3.2 · 推理引擎与编译","d":"主题「推理引擎与编译」管端侧链路里这一段，下含：引擎选型、图优化、算子映射与plugin、codegen 与打包。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c3-2-1","t":"3.2.1 · 引擎选型","d":"引擎选型：QNN、TensorRT、TensorRT Edge-LLM、onnxruntime 定位取舍","kids":[],"w":"弄清「引擎选型」，排障和选型时才知道该动哪一环。","b":""},{"id":"c3-2-2","t":"3.2.2 · 图优化","d":"图优化：算子融合、重排序、死代码消除、内存复用，离线优化大头","kids":[],"w":"弄清「图优化」，排障和选型时才知道该动哪一环。","b":""},{"id":"c3-2-3","t":"3.2.3 · 算子映射与plugin","d":"算子映射与plugin：节点匹配内置算子，不匹配则自定义kernel或plugin扩展","kids":[],"w":"弄清「算子映射与plugin」，排障和选型时才知道该动哪一环。","b":""},{"id":"c3-2-4","t":"3.2.4 · codegen 与打包","d":"codegen 与打包：权重+执行计划编译成二进制：TensorRT engine / QNN context binary","kids":[],"w":"弄清「codegen 与打包」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「部署主链路」一个可讲可练的切口，让下面的知识点有归属。","b":"转换只交出图。引擎和编译决定融合、精度策略和能跑的 kernel。编出来才有运行时可调度，否则时延账无处落地。"},{"id":"c3-3","t":"3.3 · 运行时与调度","d":"主题「运行时与调度」管端侧链路里这一段，下含：产物加载、Buffer 管理、异步与异构调度、功耗与温控。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c3-3-1","t":"3.3.1 · 产物加载","d":"产物加载：读取engine/so/context binary，反序列化，冷启动与缓存策略","kids":[],"w":"弄清「产物加载」，排障和选型时才知道该动哪一环。","b":""},{"id":"c3-3-2","t":"3.3.2 · Buffer 管理","d":"Buffer 管理：tensor分配/对齐/生命周期，复用缓冲减少内存拷贝","kids":[],"w":"弄清「Buffer 管理」，排障和选型时才知道该动哪一环。","b":""},{"id":"c3-3-3","t":"3.3.3 · 异步与异构调度","d":"异步与异构调度：NPU+GPU+CPU 多核并行，流式管线隐藏等待延迟","kids":[],"w":"弄清「异步与异构调度」，排障和选型时才知道该动哪一环。","b":""},{"id":"c3-3-4","t":"3.3.4 · 功耗与温控","d":"功耗与温控：考虑功耗墙与降频，避免峰值算力致体验抖动","kids":[],"w":"弄清「功耗与温控」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「部署主链路」一个可讲可练的切口，让下面的知识点有归属。","b":"引擎产物要有人加载、排队列、占核。调度不清，转换和编译再漂亮也交不出时延；主链路到这里才算闭环。"}],"w":"给学习路径一个章节锚点，排障时先回到这一章的目标。","b":"全栈走过，把部署收成转换→引擎编译→运行时三截。这三截通了，才回头补模型和硬件底座，量化才有图可压。"},{"id":"c4","t":"4 · 前置底座","d":"结构和硬件没摸清，后面的量化、融合都是碰运气","kids":[{"id":"c4-1","t":"4.1 · 大模型核心原理","d":"主题「大模型核心原理」管端侧链路里这一段，下含：Transformer 架构、多头注意力 MHA、GQA / MQA、FFN 与 SwiGLU、归一化 LayerNorm/RMSNorm、位置编码 RoPE。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c4-1-1","t":"4.1.1 · Transformer 架构","d":"堆叠自注意力 + 前馈块做序列建模的主干。端侧大模型几乎都绕不开它。（补充：Decoder-only 自回归：嵌入→N层Block→LM Head 逐token生成。）","kids":[],"w":"后面量化、编译、KV、算子支持，默认都假设图是 Transformer 族。","b":""},{"id":"c4-1-2","t":"4.1.2 · 多头注意力 MHA","d":"按相关度决定每个位置「看」哪些位置的信息。Transformer 里算力与访存大头之一，后面的融合、KV、量化都围着它转。","kids":[],"w":"性能热点图若扎在 Attention，下一步才是融合、量化或改 GQA/MQA。","b":""},{"id":"c4-1-3","t":"4.1.3 · GQA / MQA","d":"GQA / MQA：多Q头共享少K/V头，降KV-Cache内存带宽，端侧必用","kids":[],"w":"弄清「GQA / MQA」，排障和选型时才知道该动哪一环。","b":""},{"id":"c4-1-4","t":"4.1.4 · FFN 与 SwiGLU","d":"FFN 与 SwiGLU：SwiGLU=Swish(xW₁)·(xW₃)，参数量最大，量化收益最明显","kids":[],"w":"弄清「FFN 与 SwiGLU」，排障和选型时才知道该动哪一环。","b":""},{"id":"c4-1-5","t":"4.1.5 · 归一化 LayerNorm/RMSNorm","d":"归一化 LayerNorm/RMSNorm：RMSNorm仅均方根缩放，常与残差融合为单算子省内存","kids":[],"w":"弄清「归一化 LayerNorm/RMSNorm」，排障和选型时才知道该动哪一环。","b":""},{"id":"c4-1-6","t":"4.1.6 · 位置编码 RoPE","d":"位置编码 RoPE：旋转位置编码注入相对位置，支持长上下文外推，LLM标配","kids":[],"w":"弄清「位置编码 RoPE」，排障和选型时才知道该动哪一环。","b":""},{"id":"c4-1-7","t":"4.1.7 · KV-Cache 原理","d":"生成时把已算过的 Key/Value 存起来复用，Decode 就不用整段重算 Attention。省算力，但占内存，长度一长就胀。","kids":[],"w":"端侧长对话的内存墙多半在这：优化吞吐前先算清 KV 占多少。","b":""},{"id":"c4-1-8","t":"4.1.8 · Tokenizer","d":"Tokenizer：BPE/SentencePiece 子词切分，决定词表与实际tokens/s口径","kids":[],"w":"弄清「Tokenizer」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「前置底座」一个可讲可练的切口，让下面的知识点有归属。","b":"量化、编译默认假设你懂 Transformer。这段把主干原理立住，编程和硬件才接得上，否则后面全是名词。"},{"id":"c4-2","t":"4.2 · 编程与编译基础","d":"主题「编程与编译基础」管端侧链路里这一段，下含：C++ 核心、Python 与 PyTorch、数据布局 NHWC/NCHW、编译基础概念。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c4-2-1","t":"4.2.1 · C++ 核心","d":"C++ 核心：内存指针、RAII、多线程、模板元编程，推理引擎与自定义算子主用C++","kids":[],"w":"弄清「C++ 核心」，排障和选型时才知道该动哪一环。","b":""},{"id":"c4-2-2","t":"4.2.2 · Python 与 PyTorch","d":"Python 与 PyTorch：torch.export / torch.onnx.export 导出模型，编写量化验证脚本","kids":[],"w":"弄清「Python 与 PyTorch」，排障和选型时才知道该动哪一环。","b":""},{"id":"c4-2-3","t":"4.2.3 · 数据布局 NHWC/NCHW","d":"数据布局 NHWC/NCHW：张量内存排布影响访存连续性与NPU算子支持度","kids":[],"w":"弄清「数据布局 NHWC/NCHW」，排障和选型时才知道该动哪一环。","b":""},{"id":"c4-2-4","t":"4.2.4 · 编译基础概念","d":"编译基础概念：静态图vs动态图、中间表示IR、图编译，理解引擎离线优化空间","kids":[],"w":"弄清「编译基础概念」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「前置底座」一个可讲可练的切口，让下面的知识点有归属。","b":"原理懂了还要会读写图、编译产物。编译基础齐了，硬件体系才不是缓存和位宽的名词表。"},{"id":"c4-3","t":"4.3 · 硬件体系结构","d":"主题「硬件体系结构」管端侧链路里这一段，下含：处理器类型、存储层次与带宽、Roofline 模型、SIMD / 向量化、车规嵌入式。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c4-3-1","t":"4.3.1 · 处理器类型","d":"处理器类型：CPU/GPU/NPU/DSP 定位差异，异构系统负载分派","kids":[],"w":"弄清「处理器类型」，排障和选型时才知道该动哪一环。","b":""},{"id":"c4-3-2","t":"4.3.2 · 存储层次与带宽","d":"存储层次与带宽：寄存器→L1/L2→DRAM 逐级延迟，DRAM带宽是端侧最大瓶颈","kids":[],"w":"弄清「存储层次与带宽」，排障和选型时才知道该动哪一环。","b":""},{"id":"c4-3-3","t":"4.3.3 · Roofline 模型","d":"Roofline 模型：算力-带宽屋顶线判定 compute/memory-bound，指引优化方向","kids":[],"w":"弄清「Roofline 模型」，排障和选型时才知道该动哪一环。","b":""},{"id":"c4-3-4","t":"4.3.4 · SIMD / 向量化","d":"SIMD / 向量化：NEON/AVX 单指令多数据，加速逐元素运算与量化解包","kids":[],"w":"弄清「SIMD / 向量化」，排障和选型时才知道该动哪一环。","b":""},{"id":"c4-3-5","t":"4.3.5 · 车规嵌入式","d":"车规嵌入式：交叉编译、RTOS/HAL、ASIL，内存功耗受限的量产边界","kids":[],"w":"弄清「车规嵌入式」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「前置底座」一个可讲可练的切口，让下面的知识点有归属。","b":"软件栈要落到核、缓存、带宽上。硬件账清楚，后面量化位宽和 KV 才有物理上限，主链路的时延才解释得通。"}],"w":"给学习路径一个章节锚点，排障时先回到这一章的目标。","b":"主链路默认你会模型、编译、硬件。这段把三块底座补齐，量化章才有物理和数学上限，不会把位宽当软件开关。"},{"id":"c5","t":"5 · 量化与压缩","d":"在精度、体积、带宽之间取得平衡，端侧部署的核心难点","kids":[{"id":"c5-1","t":"5.1 · 量化基础","d":"主题「量化基础」管端侧链路里这一段，下含：精度位宽、scale 与 zero-point、对称 vs 非对称、量化粒度、量化公式。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c5-1-1","t":"5.1.1 · 精度位宽","d":"用多少比特存一个数：FP16 / INT8 / INT4 等。位宽越低越省内存和带宽，精度也更容易掉。选档要对齐芯片原生算子和业务验收线，别只看体积。（补充：FP16/INT8/INT4/FP4，位宽越低越省内存带宽，精度损失越大。）","kids":[],"w":"这是端侧「塞不塞得下」的第一扳手：位宽定了，后面的 scale、校准、性能账才有意义。","b":""},{"id":"c5-1-2","t":"5.1.2 · scale 与 zero-point","d":"浮点和整数之间的映射参数：scale 管「一格代表多大」，zero-point 管「零点落在哪」。量化对不对，先看这两把尺子稳不稳、有没有通道间乱飘。（补充：真实值 = scale×(量化值−zero)，量化参数决定数值映射。）","kids":[],"w":"尺子歪了，后面 PTQ/QAT 再精也像在歪尺子上雕花——排障优先核对 scale/zp。","b":""},{"id":"c5-1-3","t":"5.1.3 · 对称 vs 非对称","d":"对称量化以 0 为中心、正负共用一套 scale；非对称带 zero-point，更能贴合一边偏的激活分布。实现复杂度和硬件支持不一样。（补充：对称以0为中心、非对称含零点，影响激活分布表示与实现复杂度。）","kids":[],"w":"激活分布偏不偏，决定你能不能省掉 zp、能不能吃到更快的对称 kernel。","b":""},{"id":"c5-1-4","t":"5.1.4 · 量化粒度","d":"一组数共享一套量化参数的范围：整张张量一份（per-tensor）还是每个通道一份（per-channel）。粒度越细通常越准，也更吃存储与算子支持。（补充：per-tensor / per-channel / per-group(128元素组,INT4常用)，越细精度越高。）","kids":[],"w":"精度掉点时先问粒度够不够细，再问校准集；很多「INT8 崩了」其实是 per-tensor 扛不住通道差异。","b":""},{"id":"c5-1-5","t":"5.1.5 · 量化公式","d":"典型形式：实数 ≈ scale × (整数量 − zero-point)。正向量化、反向量化、饱和裁剪都围着这条式子转。（补充：q=round((r/scale)+zp)，误差源于舍入 round 与裁剪 clip。）","kids":[],"w":"公式是共同语言：和工具链、日志、论文对齐时，先把 scale/zp 定义说清楚再比数值。","b":""}],"w":"给「量化与压缩」一个可讲可练的切口，让下面的知识点有归属。","b":"压缩这一章先立尺子：位宽、scale、粒度、对称与否。尺子没立，后面 PTQ 校准就是空转；PTQ 过线才值得上 QAT。"},{"id":"c5-2","t":"5.2 · 后训练量化 PTQ","d":"训练结束后再量化，基本不动原训练流程。上线快，但对校准和可量化图结构敏感。","kids":[{"id":"c5-2-1","t":"5.2.1 · 校准方法","d":"用一小撮代表数据估激活分布，从而定 scale/阈值。校准集不代表线上分布，后面再精的 PTQ 也救不回来。","kids":[],"w":"PTQ 成败大半看校准：集子要覆盖主路径场景，别用「随手抽的几张图」糊弄。","b":""},{"id":"c5-2-2","t":"5.2.2 · 校准集选择","d":"专门用来估分布的小数据集。要覆盖主业务输入，避免只含简单样本导致 scale 偏乐观。","kids":[],"w":"校准集选错，表现为「离线指标还行、上线一碰就糊」——先查集子再查算法。","b":""},{"id":"c5-2-3","t":"5.2.3 · 误差来源","d":"量化误差常见三块：裁剪（clip）砍掉长尾、舍入（round）丢小数、权重/激活分布不对称导致同一套参数顾此失彼。","kids":[],"w":"掉点时按这三类拆账，比盲目换算法快：先看是不是 clip 太狠，再看 round 与粒度。","b":""},{"id":"c5-2-4","t":"5.2.4 · scale 优化目标","d":"浮点和整数之间的映射参数：scale 管「一格代表多大」，zero-point 管「零点落在哪」。量化对不对，先看这两把尺子稳不稳、有没有通道间乱飘。","kids":[],"w":"尺子歪了，后面 PTQ/QAT 再精也像在歪尺子上雕花——排障优先核对 scale/zp。","b":""}],"w":"端侧赶工默认先 PTQ；精度不够再考虑 QAT 或混合精度，别一上来就重训。","b":"尺子立住了才做后训练量化：不动原训练、靠校准定 scale。PTQ 仍卡验收线，下一步才是 QAT 伪量化，别一上来重训。"},{"id":"c5-3","t":"5.3 · 量化感知训练 QAT","d":"训练时插入伪量化，让网络提前适应低比特。精度通常更好，成本和工具链更重。","kids":[{"id":"c5-3-1","t":"5.3.1 · 伪量化算子","d":"伪量化算子：前向插入 fake quant (量化再反量化)，让模型感知量化噪声","kids":[],"w":"弄清「伪量化算子」，排障和选型时才知道该动哪一环。","b":""},{"id":"c5-3-2","t":"5.3.2 · 直通估计器 STE","d":"直通估计器 STE：反传梯度绕过 round，使量化参数可训练","kids":[],"w":"弄清「直通估计器 STE」，排障和选型时才知道该动哪一环。","b":""},{"id":"c5-3-3","t":"5.3.3 · QAT vs PTQ","d":"训练结束后再量化，基本不动原训练流程。上线快，但对校准和可量化图结构敏感。（补充：QAT 精度更高但需训练GPU，用于INT4精度敏感场景。）","kids":[],"w":"端侧赶工默认先 PTQ；精度不够再考虑 QAT 或混合精度，别一上来就重训。","b":""},{"id":"c5-3-4","t":"5.3.4 · 部署一致性","d":"部署一致性：训练伪量化细节须与推理引擎量化对齐，否则精度失真","kids":[],"w":"弄清「部署一致性」，排障和选型时才知道该动哪一环。","b":""}],"w":"当 PTQ 卡在验收线以下、又有训练资源时再上；它不是免费午餐。","b":"PTQ 走不通才插入伪量化重训。QAT 更准也更贵；过了 INT8 舒适区，低比特 INT4/GPTQ 还要另开一档验收。"},{"id":"c5-4","t":"5.4 · 低比特进阶 INT4/GPTQ/AWQ","d":"训练结束后再量化，基本不动原训练流程。上线快，但对校准和可量化图结构敏感。","kids":[{"id":"c5-4-1","t":"5.4.1 · INT4 量化","d":"INT4 量化：4bit 权重 per-group 量化，内存/带宽降为1/4，朴素量化损伤大","kids":[],"w":"弄清「INT4 量化」，排障和选型时才知道该动哪一环。","b":""},{"id":"c5-4-2","t":"5.4.2 · GPTQ","d":"训练结束后再量化，基本不动原训练流程。上线快，但对校准和可量化图结构敏感。（补充：Hessian 二阶信息逐层最小二乘补偿，主流INT4后训练方法。）","kids":[],"w":"端侧赶工默认先 PTQ；精度不够再考虑 QAT 或混合精度，别一上来就重训。","b":""},{"id":"c5-4-3","t":"5.4.3 · AWQ","d":"AWQ：激活感知权重缩放，仅保护显著通道，无需重训","kids":[],"w":"弄清「AWQ」，排障和选型时才知道该动哪一环。","b":""},{"id":"c5-4-4","t":"5.4.4 · SmoothQuant","d":"SmoothQuant：激活离群值平滑迁移至权重，解决激活难量化，配INT8激活","kids":[],"w":"弄清「SmoothQuant」，排障和选型时才知道该动哪一环。","b":""},{"id":"c5-4-5","t":"5.4.5 · LLM.int8() 与混合精度","d":"LLM.int8() 与混合精度：离群列分精度处理，敏感层(attention)留高精度其余压缩","kids":[],"w":"弄清「LLM.int8() 与混合精度」，排障和选型时才知道该动哪一环。","b":""}],"w":"端侧赶工默认先 PTQ；精度不够再考虑 QAT 或混合精度，别一上来就重训。","b":"尺子立住了才做后训练量化：不动原训练、靠校准定 scale。PTQ 仍卡验收线，下一步才是 QAT 伪量化，别一上来重训。"},{"id":"c5-5","t":"5.5 · 精度评估","d":"主题「精度评估」管端侧链路里这一段，下含：困惑度 Perplexity、任务指标、逐层误差分析、异常值处理。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c5-5-1","t":"5.5.1 · 困惑度 Perplexity","d":"困惑度 Perplexity：语言生成通用指标，越低越好，量化退化常用它衡量","kids":[],"w":"弄清「困惑度 Perplexity」，排障和选型时才知道该动哪一环。","b":""},{"id":"c5-5-2","t":"5.5.2 · 任务指标","d":"任务指标：MMLU/GSM8K/问答/代码等下游任务准确率对比","kids":[],"w":"弄清「任务指标」，排障和选型时才知道该动哪一环。","b":""},{"id":"c5-5-3","t":"5.5.3 · 逐层误差分析","d":"逐层误差分析：对比量化前后同输入输出，定位精度损失热点层","kids":[],"w":"弄清「逐层误差分析」，排障和选型时才知道该动哪一环。","b":""},{"id":"c5-5-4","t":"5.5.4 · 异常值处理","d":"异常值处理：识别隔离影响巨大的权重/激活离群值 outlier","kids":[],"w":"弄清「异常值处理」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「量化与压缩」一个可讲可练的切口，让下面的知识点有归属。","b":"低比特有没有掉点，要有任务级尺子，不能只看 loss。评估过了才谈蒸馏剪枝等轻量化，否则在已经糊的模型上继续压。"},{"id":"c5-6","t":"5.6 · 轻量化技术","d":"主题「轻量化技术」管端侧链路里这一段，下含：剪枝、N:M 稀疏、知识蒸馏、低秩分解、组合拳。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c5-6-1","t":"5.6.1 · 剪枝","d":"剪枝：结构化(通道/头/层)与非结构化稀疏，结构化更适合端侧加速","kids":[],"w":"弄清「剪枝」，排障和选型时才知道该动哪一环。","b":""},{"id":"c5-6-2","t":"5.6.2 · N:M 稀疏","d":"N:M 稀疏：每M个权重保留N非零，配合硬件稀疏加速器","kids":[],"w":"弄清「N:M 稀疏」，排障和选型时才知道该动哪一环。","b":""},{"id":"c5-6-3","t":"5.6.3 · 知识蒸馏","d":"用大模型教小模型学分布或中间特征，换更小体积仍够用的效果。常与量化、剪枝搭着用。","kids":[],"w":"体积还差一截、精度又不能再砍时，蒸馏是「换结构」而不是「换比特」。","b":""},{"id":"c5-6-4","t":"5.6.4 · 低秩分解","d":"低秩分解：落在「轻量化技术」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「低秩分解」，排障和选型时才知道该动哪一环。","b":""},{"id":"c5-6-5","t":"5.6.5 · 组合拳","d":"组合拳：量化+剪枝/蒸馏+结构化联合优化，端侧量产常用","kids":[],"w":"弄清「组合拳」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「量化与压缩」一个可讲可练的切口，让下面的知识点有归属。","b":"比特砍完体积还不够，才蒸馏、剪枝并与量化协同。轻量化是换结构，不是再拧一次 scale；组合拳打完这章才收口。"}],"w":"给学习路径一个章节锚点，排障时先回到这一章的目标。","b":"底座齐了才动比特。先立量化尺子，再 PTQ/QAT/低比特，最后用精度评估和轻量化收口，附录才摊公式。"},{"id":"c6","t":"6 · 附录 · 量化数学与校准细则","d":"「附录 · 量化数学与校准细则」这一章回答端侧部署里一块完整问题；先立章目标，再进主题。","kids":[{"id":"c6-1","t":"6.1 · 量化基本原理与数学公式","d":"主题「量化基本原理与数学公式」管端侧链路里这一段，下含：量化映射、核心公式、对称 zp=0、范围[-128,127]、scal…、非对称 zp≠0、范围[0,255]，适合 ReL…、round 不可导与 STE、scale 决定误差。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c6-1-1","t":"6.1.1 · 量化映射","d":"典型形式：实数 ≈ scale × (整数量 − zero-point)。正向量化、反向量化、饱和裁剪都围着这条式子转。（补充：FP32→INT8内存缩4倍，整数运算加速2-4倍。）","kids":[],"w":"公式是共同语言：和工具链、日志、论文对齐时，先把 scale/zp 定义说清楚再比数值。","b":""},{"id":"c6-1-2","t":"6.1.2 · 核心公式","d":"核心公式：q=round(r/scale)+zero_point，反量化 r=(q-zero_point)×scale","kids":[],"w":"弄清「核心公式」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-1-3","t":"6.1.3 · 对称 zp=0、范围[-128,127]、scal…","d":"对称量化以 0 为中心、正负共用一套 scale；非对称带 zero-point，更能贴合一边偏的激活分布。实现复杂度和硬件支持不一样。（补充：对称 zp=0、范围[-128,127]、scale=r_max/127。）","kids":[],"w":"激活分布偏不偏，决定你能不能省掉 zp、能不能吃到更快的对称 kernel。","b":""},{"id":"c6-1-4","t":"6.1.4 · 非对称 zp≠0、范围[0,255]，适合 ReL…","d":"对称量化以 0 为中心、正负共用一套 scale；非对称带 zero-point，更能贴合一边偏的激活分布。实现复杂度和硬件支持不一样。（补充：非对称 zp≠0、范围[0,255]，适合 ReLU/激活单侧分布。）","kids":[],"w":"激活分布偏不偏，决定你能不能省掉 zp、能不能吃到更快的对称 kernel。","b":""},{"id":"c6-1-5","t":"6.1.5 · round 不可导与 STE","d":"量化误差常见三块：裁剪（clip）砍掉长尾、舍入（round）丢小数、权重/激活分布不对称导致同一套参数顾此失彼。（补充：round 斜率处处为0，QAT 需借助 STE 直通估计器反向传播。）","kids":[],"w":"掉点时按这三类拆账，比盲目换算法快：先看是不是 clip 太狠，再看 round 与粒度。","b":""},{"id":"c6-1-6","t":"6.1.6 · scale 决定误差","d":"浮点和整数之间的映射参数：scale 管「一格代表多大」，zero-point 管「零点落在哪」。量化对不对，先看这两把尺子稳不稳、有没有通道间乱飘。（补充：round 最多引入 0.5 scale 偏差，异常值经 scale 放大噪声。）","kids":[],"w":"尺子歪了，后面 PTQ/QAT 再精也像在歪尺子上雕花——排障优先核对 scale/zp。","b":""},{"id":"c6-1-7","t":"6.1.7 · 符号约定","d":"符号约定：Int-X-Y 首位为权重位数、次位激活位数","kids":[],"w":"弄清「符号约定」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「附录 · 量化数学与校准细则」一个可讲可练的切口，让下面的知识点有归属。","b":"前面量化章讲怎么做，这段把映射公式摊开。公式清了才谈 per-tensor/per-channel，否则粒度和校准都在瞎调参数。"},{"id":"c6-2","t":"6.2 · Per-tensor 与 Per-channel 量化粒度","d":"一组数共享一套量化参数的范围：整张张量一份（per-tensor）还是每个通道一份（per-channel）。粒度越细通常越准，也更吃存储与算子支持。","kids":[{"id":"c6-2-1","t":"6.2.1 · Per-tensor 共享一组 scale/zp，…","d":"一组数共享一套量化参数的范围：整张张量一份（per-tensor）还是每个通道一份（per-channel）。粒度越细通常越准，也更吃存储与算子支持。","kids":[],"w":"精度掉点时先问粒度够不够细，再问校准集；很多「INT8 崩了」其实是 per-tensor 扛不住通道差异。","b":""},{"id":"c6-2-2","t":"6.2.2 · Per-channel 每输出通道独立 scale…","d":"一组数共享一套量化参数的范围：整张张量一份（per-tensor）还是每个通道一份（per-channel）。粒度越细通常越准，也更吃存储与算子支持。","kids":[],"w":"精度掉点时先问粒度够不够细，再问校准集；很多「INT8 崩了」其实是 per-tensor 扛不住通道差异。","b":""},{"id":"c6-2-3","t":"6.2.3 · 权重 per-channel + 激活 per-t…","d":"一组数共享一套量化参数的范围：整张张量一份（per-tensor）还是每个通道一份（per-channel）。粒度越细通常越准，也更吃存储与算子支持。","kids":[],"w":"精度掉点时先问粒度够不够细，再问校准集；很多「INT8 崩了」其实是 per-tensor 扛不住通道差异。","b":""},{"id":"c6-2-4","t":"6.2.4 · TensorRT、PyTorch QAT 均遵循此…","d":"面向 NVIDIA GPU 的推理栈：图优化、精度策略、引擎构建。车上/工控 GPU 路径常点名它。","kids":[],"w":"GPU 端侧选型时，先确认 TRT 版本与目标芯片是否匹配，再谈插件与精度。","b":""}],"w":"精度掉点时先问粒度够不够细，再问校准集；很多「INT8 崩了」其实是 per-tensor 扛不住通道差异。","b":"公式有了，粒度决定一套参数管多宽。粒度选完，校准集才知道要覆盖什么分布；粒度错了，后面校准方法再精也救不回来。"},{"id":"c6-3","t":"6.3 · 校准集（标定数据）的设计与要求","d":"专门用来估分布的小数据集。要覆盖主业务输入，避免只含简单样本导致 scale 偏乐观。","kids":[{"id":"c6-3-1","t":"6.3.1 · PTQ 前向收集激活 min/max 分布，计算 …","d":"训练结束后再量化，基本不动原训练流程。上线快，但对校准和可量化图结构敏感。","kids":[],"w":"端侧赶工默认先 PTQ；精度不够再考虑 QAT 或混合精度，别一上来就重训。","b":""},{"id":"c6-3-2","t":"6.3.2 · 数量 100-500 张，覆盖真实场景分布","d":"数量 100-500 张，覆盖真实场景分布：数量 100-500 张，覆盖真实场景分布","kids":[],"w":"弄清「数量 100-500 张，覆盖真实场景分布」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-3-3","t":"6.3.3 · np.concatenate 复制填充到目标 ba…","d":"np.concatenate 复制填充到目标 ba…：np.concatenate 复制填充到目标 batch，存 input.bin","kids":[],"w":"弄清「np.concatenate 复制填充到目标 ba…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-3-4","t":"6.3.4 · 海思 DDK 经 config.protxt 指定…","d":"海思 DDK 经 config.protxt 指定…：海思 DDK 经 config.protxt 指定，由 dopt_so.py --cal_conf 加载","kids":[],"w":"弄清「海思 DDK 经 config.protxt 指定…」，排障和选型时才知道该动哪一环。","b":""}],"w":"校准集选错，表现为「离线指标还行、上线一碰就糊」——先查集子再查算法。","b":"粒度定了，校准集必须代表线上分布。集子歪了，MinMax/KL 再精也定不出可用 scale，PTQ 流程会整段空转。"},{"id":"c6-4","t":"6.4 · 校准方法：MinMax、KL 散度、Percentile、En…","d":"用一小撮代表数据估激活分布，从而定 scale/阈值。校准集不代表线上分布，后面再精的 PTQ 也救不回来。","kids":[{"id":"c6-4-1","t":"6.4.1 · MinMax","d":"MinMax：落在「校准方法：MinMax、KL 散度、Percentile、En…」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「MinMax」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-4-2","t":"6.4.2 · 找阈值使量化前后 KL(P||Q) 最小，Tens…","d":"找阈值使量化前后 KL(P||Q) 最小，Tens…：找阈值使量化前后 KL(P||Q) 最小，TensorRT 默认采用","kids":[],"w":"弄清「找阈值使量化前后 KL(P||Q) 最小，Tens…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-4-3","t":"6.4.3 · KL(P||Q)=ΣP(x)·log(P(x)/Q…","d":"KL(P||Q)=ΣP(x)·log(P(x)/Q…：KL(P||Q)=ΣP(x)·log(P(x)/Q(x))","kids":[],"w":"弄清「KL(P||Q)=ΣP(x)·log(P(x)/Q…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-4-4","t":"6.4.4 · Percentile/Entropy","d":"Percentile/Entropy：Percentile 取百分位阈值跳过极端尾部，Entropy 与 KL 同族","kids":[],"w":"弄清「Percentile/Entropy」，排障和选型时才知道该动哪一环。","b":""}],"w":"PTQ 成败大半看校准：集子要覆盖主路径场景，别用「随手抽的几张图」糊弄。","b":"有了合格校准集，才选 MinMax、KL、百分位。方法定了，PTQ 才能按步复现；方法没选稳，完整流程只是把错误跑一遍。"},{"id":"c6-5","t":"6.5 · PTQ 训练后量化完整流程","d":"训练结束后再量化，基本不动原训练流程。上线快，但对校准和可量化图结构敏感。","kids":[{"id":"c6-5-1","t":"6.5.1 · 训练后直接量化，速度快、INT8 常掉 1-3%","d":"训练后直接量化，速度快、INT8 常掉 1-3%：训练后直接量化，速度快、INT8 常掉 1-3%","kids":[],"w":"弄清「训练后直接量化，速度快、INT8 常掉 1-3%」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-5-2","t":"6.5.2 · 标准流程：FP32→标定→统计分布→算 scale…","d":"浮点和整数之间的映射参数：scale 管「一格代表多大」，zero-point 管「零点落在哪」。量化对不对，先看这两把尺子稳不稳、有没有通道间乱飘。（补充：标准流程：FP32→标定→统计分布→算 scale/zp→量化→精度评估。）","kids":[],"w":"尺子歪了，后面 PTQ/QAT 再精也像在歪尺子上雕花——排障优先核对 scale/zp。","b":""},{"id":"c6-5-3","t":"6.5.3 · gpu_quant.py 配置→input.bin…","d":"gpu_quant.py 配置→input.bin…：gpu_quant.py 配置→input.bin→config.protxt→dopt_so.py→修重名→OMC","kids":[],"w":"弄清「gpu_quant.py 配置→input.bin…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-5-4","t":"6.5.4 · dopt_so.py 关键参数 --framewo…","d":"dopt_so.py 关键参数 --framewo…：dopt_so.py 关键参数 --framework 5(--cal_conf/--compress_conf)","kids":[],"w":"弄清「dopt_so.py 关键参数 --framewo…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-5-5","t":"6.5.5 · 精度修复清单","d":"精度修复清单：保准好数据→KL 校准→per-channel→敏感层留 FP16/INT16→QAT→蒸馏","kids":[],"w":"弄清「精度修复清单」，排障和选型时才知道该动哪一环。","b":""}],"w":"端侧赶工默认先 PTQ；精度不够再考虑 QAT 或混合精度，别一上来就重训。","b":"先把校准方法的验收做实，这段把PTQ 训练后量化完整流程补上；下一步才动QAT 量化感知训练那层，否则容易跳步。"},{"id":"c6-6","t":"6.6 · QAT 量化感知训练：STE 与 FakeQuant","d":"训练时插入伪量化，让网络提前适应低比特。精度通常更好，成本和工具链更重。","kids":[{"id":"c6-6-1","t":"6.6.1 · STE 直通估计器","d":"STE 直通估计器：前向真实量化、反向梯度直接传回（视为1而非0）","kids":[],"w":"弄清「STE 直通估计器」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-6-2","t":"6.6.2 · FakeQuant 伪量化","d":"训练时插入伪量化，让网络提前适应低比特。精度通常更好，成本和工具链更重。（补充：训练时量化再反量化，让模型提前适应 INT8 误差。）","kids":[],"w":"当 PTQ 卡在验收线以下、又有训练资源时再上；它不是免费午餐。","b":""},{"id":"c6-6-3","t":"6.6.3 · PyTorch 官方 QAT 采用 STE；BN …","d":"训练时插入伪量化，让网络提前适应低比特。精度通常更好，成本和工具链更重。","kids":[],"w":"当 PTQ 卡在验收线以下、又有训练资源时再上；它不是免费午餐。","b":""},{"id":"c6-6-4","t":"6.6.4 · 学习率取原 1/10，训练 3-10 epoch，…","d":"学习率取原 1/10，训练 3-10 epoch，…：学习率取原 1/10，训练 3-10 epoch，mAP early stopping","kids":[],"w":"弄清「学习率取原 1/10，训练 3-10 epoch，…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-6-5","t":"6.6.5 · 导出需去 FakeQuant、固化 scale、真…","d":"训练时插入伪量化，让网络提前适应低比特。精度通常更好，成本和工具链更重。（补充：导出需去 FakeQuant、固化 scale、真量化为 INT8。）","kids":[],"w":"当 PTQ 卡在验收线以下、又有训练资源时再上；它不是免费午餐。","b":""}],"w":"当 PTQ 卡在验收线以下、又有训练资源时再上；它不是免费午餐。","b":"PTQ 流程跑通仍掉点，才上伪量化与 STE。QAT 会把尺子也卷进训练，后面 LSQ/PACT 才有地方接，低比特另算。"},{"id":"c6-7","t":"6.7 · scale 选择与学习式量化：LSQ、PACT、混合精度","d":"浮点和整数之间的映射参数：scale 管「一格代表多大」，zero-point 管「零点落在哪」。量化对不对，先看这两把尺子稳不稳、有没有通道间乱飘。","kids":[{"id":"c6-7-1","t":"6.7.1 · 长尾分布问题","d":"长尾分布问题：少数异常值拉大 scale，使主体量化粗糙","kids":[],"w":"弄清「长尾分布问题」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-7-2","t":"6.7.2 · LSQ","d":"LSQ：scale 作为 nn.Parameter 梯度下降，通常提升 0.5-1% mAP","kids":[],"w":"弄清「LSQ」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-7-3","t":"6.7.3 · PACT","d":"PACT：激活裁剪到可学习阈值 α，砍异常尾部换取主体精细","kids":[],"w":"弄清「PACT」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-7-4","t":"6.7.4 · 量化坍陷与敏感度","d":"量化坍陷与敏感度：误差层层放大致 mAP 崩塌；BRECQ 逐层余弦相似度敏感度分析","kids":[],"w":"弄清「量化坍陷与敏感度」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-7-5","t":"6.7.5 · 混合精度","d":"混合精度：敏感层 FP16、不敏感层 INT8；跳过首层 Conv 与末6层检测头","kids":[],"w":"弄清「混合精度」，排障和选型时才知道该动哪一环。","b":""}],"w":"尺子歪了，后面 PTQ/QAT 再精也像在歪尺子上雕花——排障优先核对 scale/zp。","b":"QAT 里 scale 不再手估。学习式量化把尺子也训进去，激活长尾的难点才会暴露，下一步才轮到 SmoothQuant 挪难度。"},{"id":"c6-8","t":"6.8 · 激活量化的难点与 SmoothQuant","d":"主题「激活量化的难点与 SmoothQuant」管端侧链路里这一段，下含：激活量化难点、SmoothQuant、激活层选择。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c6-8-1","t":"6.8.1 · 激活量化难点","d":"激活量化难点：激活 per-tensor 精度低，且有长尾离群值拉大 scale","kids":[],"w":"弄清「激活量化难点」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-8-2","t":"6.8.2 · SmoothQuant","d":"SmoothQuant：量化迁移：数学等价变换把激活难度迁到权重侧，适配 W8A8","kids":[],"w":"弄清「SmoothQuant」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-8-3","t":"6.8.3 · 激活层选择","d":"激活层选择：ReLU 适合非对称量化；SiLU/Sigmoid 值域窄需更细 scale","kids":[],"w":"弄清「激活层选择」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「附录 · 量化数学与校准细则」一个可讲可练的切口，让下面的知识点有归属。","b":"scale 可学之后，激活长尾仍会打爆 INT8。SmoothQuant 把难度挪到权重，Weight-only/GPTQ 那条才接得上。"},{"id":"c6-9","t":"6.9 · Weight-only 量化：GPTQ（Hessian 补偿）…","d":"训练结束后再量化，基本不动原训练流程。上线快，但对校准和可量化图结构敏感。","kids":[{"id":"c6-9-1","t":"6.9.1 · Weight-only 路线","d":"Weight-only 路线：只压权重如 W4A16/W8A16，激活保高精度，LLM 减内存主流","kids":[],"w":"弄清「Weight-only 路线」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-9-2","t":"6.9.2 · GPTQ","d":"训练结束后再量化，基本不动原训练流程。上线快，但对校准和可量化图结构敏感。","kids":[],"w":"端侧赶工默认先 PTQ；精度不够再考虑 QAT 或混合精度，别一上来就重训。","b":""},{"id":"c6-9-3","t":"6.9.3 · AWQ","d":"AWQ：激活感知，保护约 1% 关键通道，为其单独选 scale","kids":[],"w":"弄清「AWQ」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-9-4","t":"6.9.4 · 部署配套","d":"部署配套：与 KV Cache 显存优化联合；配 llama.cpp/GGUF、MindIE 落地","kids":[],"w":"弄清「部署配套」，排障和选型时才知道该动哪一环。","b":""}],"w":"端侧赶工默认先 PTQ；精度不够再考虑 QAT 或混合精度，别一上来就重训。","b":"尺子立住了才做后训练量化：不动原训练、靠校准定 scale。PTQ 仍卡验收线，下一步才是 QAT 伪量化，别一上来重训。"},{"id":"c6-10","t":"6.10 · 精度评估：余弦相似度、平均绝对偏差与任务级指标","d":"主题「精度评估：余弦相似度、平均绝对偏差与任务级指标」管端侧链路里这一段，下含：三层评估体系、余弦相似度 cos=(A·B)/(||A||·||…、ave_diff=Σ|A-B|/Σ|A|×100%…、YOLO 用 IoU=0.45、conf=0.4 …、综合标准：cos>99%、偏差<5%、mAP 降<…。","kids":[{"id":"c6-10-1","t":"6.10.1 · 三层评估体系","d":"三层评估体系：张量级逐层输出、特征级中间图、任务级 mAP","kids":[],"w":"弄清「三层评估体系」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-10-2","t":"6.10.2 · 余弦相似度 cos=(A·B)/(||A||·||…","d":"余弦相似度 cos=(A·B)/(||A||·||…：余弦相似度 cos=(A·B)/(||A||·||B||)，>99% 达标","kids":[],"w":"弄清「余弦相似度 cos=(A·B)/(||A||·||…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-10-3","t":"6.10.3 · ave_diff=Σ|A-B|/Σ|A|×100%…","d":"ave_diff=Σ|A-B|/Σ|A|×100%…：ave_diff=Σ|A-B|/Σ|A|×100%，<5% 良好","kids":[],"w":"弄清「ave_diff=Σ|A-B|/Σ|A|×100%…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-10-4","t":"6.10.4 · YOLO 用 IoU=0.45、conf=0.4 …","d":"YOLO 用 IoU=0.45、conf=0.4 …：YOLO 用 IoU=0.45、conf=0.4 跑验证集，下降应 <3%","kids":[],"w":"弄清「YOLO 用 IoU=0.45、conf=0.4 …」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-10-5","t":"6.10.5 · 综合标准：cos>99%、偏差<5%、mAP 降<…","d":"综合标准：cos>99%、偏差<5%、mAP 降<…：综合标准：cos>99%、偏差<5%、mAP 降<3%、检测头>99.5%","kids":[],"w":"弄清「综合标准：cos>99%、偏差<5%、mAP 降<…」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「附录 · 量化数学与校准细则」一个可讲可练的切口，让下面的知识点有归属。","b":"低比特有没有掉点，要有任务级尺子，不能只看 loss。评估过了才谈蒸馏剪枝等轻量化，否则在已经糊的模型上继续压。"},{"id":"c6-11","t":"6.11 · LLM 精度评估：Perplexity 与 MMLU 等在生成…","d":"主题「LLM 精度评估：Perplexity 与 MMLU 等在生成…」管端侧链路里这一段，下含：LLM 专用指标、部署指标、评估纪律。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c6-11-1","t":"6.11.1 · LLM 专用指标","d":"LLM 专用指标：Perplexity 度量建模能力、PPL 越低越好；MMLU/GSM8K 看 accuracy 跌幅","kids":[],"w":"弄清「LLM 专用指标」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-11-2","t":"6.11.2 · 部署指标","d":"部署指标：TTFT/TPOT/tokens/s 吞吐/KV Cache 显存，Prefill 计算密集、Decode 访存密集","kids":[],"w":"弄清「部署指标」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-11-3","t":"6.11.3 · 评估纪律","d":"评估纪律：固定 seed、eval 模式与统一预处理/后处理","kids":[],"w":"弄清「评估纪律」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「附录 · 量化数学与校准细则」一个可讲可练的切口，让下面的知识点有归属。","b":"CV 的 top-1 看不准生成质量。PPL/MMLU 才是 LLM 量化验收；过了这层，蒸馏剪枝协同才有资格上，否则在糊输出上继续压。"},{"id":"c6-12","t":"6.12 · 轻量化组合：知识蒸馏、剪枝与量化的协同","d":"用大模型教小模型学分布或中间特征，换更小体积仍够用的效果。常与量化、剪枝搭着用。","kids":[{"id":"c6-12-1","t":"6.12.1 · 三术定位","d":"三术定位：剪枝减参数、蒸馏提小模型精度、量化降比特（FP32→INT8 省75%内存）","kids":[],"w":"弄清「三术定位」，排障和选型时才知道该动哪一环。","b":""},{"id":"c6-12-2","t":"6.12.2 · 蒸馏分类","d":"用大模型教小模型学分布或中间特征，换更小体积仍够用的效果。常与量化、剪枝搭着用。（补充：Logit-based/Feature-based/Relation-based；回归用 L1、分类用 KL/NKD。）","kids":[],"w":"体积还差一截、精度又不能再砍时，蒸馏是「换结构」而不是「换比特」。","b":""},{"id":"c6-12-3","t":"6.12.3 · 结构化剪枝→蒸馏→量化→ONNX→OMC→部署","d":"跨框架中间格式，常作训练框架到推理引擎的交接面。图对不对、算子齐不齐，先在这里验。（补充：结构化剪枝→蒸馏→量化→ONNX→OMC→部署。）","kids":[],"w":"转换失败优先查 ONNX：动态 shape、自定义算子、opset 版本。","b":""},{"id":"c6-12-4","t":"6.12.4 · 剪枝按 L1 范数，通道数对齐 4/8/16 倍数","d":"剪枝按 L1 范数，通道数对齐 4/8/16 倍数：剪枝按 L1 范数，通道数对齐 4/8/16 倍数","kids":[],"w":"弄清「剪枝按 L1 范数，通道数对齐 4/8/16 倍数」，排障和选型时才知道该动哪一环。","b":""}],"w":"体积还差一截、精度又不能再砍时，蒸馏是「换结构」而不是「换比特」。","b":"比特砍完体积还不够，才蒸馏、剪枝并与量化协同。轻量化是换结构，不是再拧一次 scale；组合拳打完这章才收口。"}],"w":"给学习路径一个章节锚点，排障时先回到这一章的目标。","b":"量化流程章讲怎么做，附录把公式、粒度、校准数学摊开。数学清了，性能优化才不会在糊模型上抠时延。"},{"id":"c7","t":"7 · 推理性能优化","d":"「推理性能优化」这一章回答端侧部署里一块完整问题；先立章目标，再进主题。","kids":[{"id":"c7-1","t":"7.1 · 性能分析定位瓶颈","d":"主题「性能分析定位瓶颈」管端侧链路里这一段，下含：性能工具、关键指标、Roofline 判断、阶段拆分、回归基准。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c7-1-1","t":"7.1.1 · 性能工具","d":"性能工具：高通QNN Profiler / NVIDIA Nsight / TensorRT Profiler 逐算子耗时","kids":[],"w":"弄清「性能工具」，排障和选型时才知道该动哪一环。","b":""},{"id":"c7-1-2","t":"7.1.2 · 关键指标","d":"关键指标：FLOPs、MACs、实际带宽占用、算子时延、总时延","kids":[],"w":"弄清「关键指标」，排障和选型时才知道该动哪一环。","b":""},{"id":"c7-1-3","t":"7.1.3 · Roofline 判断","d":"Roofline 判断：画算力-带宽屋顶线，判定 compute-bound 或 memory-bound","kids":[],"w":"弄清「Roofline 判断」，排障和选型时才知道该动哪一环。","b":""},{"id":"c7-1-4","t":"7.1.4 · 阶段拆分","d":"阶段拆分：prefill(计算密集)与decode(访存密集)分开分析，手段不同","kids":[],"w":"弄清「阶段拆分」，排障和选型时才知道该动哪一环。","b":""},{"id":"c7-1-5","t":"7.1.5 · 回归基准","d":"回归基准：落在「性能分析定位瓶颈」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「回归基准」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「推理性能优化」一个可讲可练的切口，让下面的知识点有归属。","b":"量化过线才谈快。先 profiler 定位热点，再动融合或 KV，别一上来改 kernel；找错瓶颈，后面每一招都在空转。"},{"id":"c7-2","t":"7.2 · 计算图优化与算子融合","d":"把相邻小算子并成一次 kernel，少写中间结果、少启动开销。编译器/引擎优化的常规招。","kids":[{"id":"c7-2-1","t":"7.2.1 · 算子融合","d":"把相邻小算子并成一次 kernel，少写中间结果、少启动开销。编译器/引擎优化的常规招。（补充：QKV融合、残差+LayerNorm融合、attention整体融合，减少中间张量与kernel启动。）","kids":[],"w":"Profiling 见一串碎算子，优先问能不能融合，再谈换精度。","b":""},{"id":"c7-2-2","t":"7.2.2 · 执行重排序","d":"执行重排序：调整执行顺序优化缓冲区复用与数据局部性","kids":[],"w":"弄清「执行重排序」，排障和选型时才知道该动哪一环。","b":""},{"id":"c7-2-3","t":"7.2.3 · 内存复用","d":"内存复用：落在「计算图优化与算子融合」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「内存复用」，排障和选型时才知道该动哪一环。","b":""}],"w":"Profiling 见一串碎算子，优先问能不能融合，再谈换精度。","b":"瓶颈若在碎算子，先融合少写回。融合完 KV 内存墙才会露出来；没定位就融，容易把精度和动态 shape 一起融坏。"},{"id":"c7-3","t":"7.3 · KV-Cache 动态内存管理","d":"生成时把已算过的 Key/Value 存起来复用，Decode 就不用整段重算 Attention。省算力，但占内存，长度一长就胀。","kids":[{"id":"c7-3-1","t":"7.3.1 · Paged KV Cache","d":"生成时把已算过的 Key/Value 存起来复用，Decode 就不用整段重算 Attention。省算力，但占内存，长度一长就胀。","kids":[],"w":"端侧长对话的内存墙多半在这：优化吞吐前先算清 KV 占多少。","b":""},{"id":"c7-3-2","t":"7.3.2 · KV 量化","d":"KV 量化：KV Cache 降 INT8/INT4 省内存，评估精度损失","kids":[],"w":"弄清「KV 量化」，排障和选型时才知道该动哪一环。","b":""},{"id":"c7-3-3","t":"7.3.3 · GQA 与结构瘦身","d":"GQA 与结构瘦身：落在「KV-Cache 动态内存管理」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「GQA 与结构瘦身」，排障和选型时才知道该动哪一环。","b":""},{"id":"c7-3-4","t":"7.3.4 · 前缀共享","d":"前缀共享：多请求共享 system prompt 前缀 KV，省重复计算存储","kids":[],"w":"弄清「前缀共享」，排障和选型时才知道该动哪一环。","b":""},{"id":"c7-3-5","t":"7.3.5 · 内存池","d":"内存池：预分配大块连续内存按页管理，减少malloc抖动","kids":[],"w":"弄清「内存池」，排障和选型时才知道该动哪一环。","b":""}],"w":"端侧长对话的内存墙多半在这：优化吞吐前先算清 KV 占多少。","b":"图优化省的是计算，长对话吃的是 KV。缓存账管住了再抠 DDR 带宽；KV 没算清，Token 速度优化只是加核空转。"},{"id":"c7-4","t":"7.4 · 内存带宽与 DDR 优化","d":"主题「内存带宽与 DDR 优化」管端侧链路里这一段，下含：数据布局、DDR burst 与对齐、weight 重排、INT4 打包解包、预取与异步。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c7-4-1","t":"7.4.1 · 数据布局","d":"数据布局：NHWC vs NCHW vs tiled，匹配硬件访存模式","kids":[],"w":"弄清「数据布局」，排障和选型时才知道该动哪一环。","b":""},{"id":"c7-4-2","t":"7.4.2 · DDR burst 与对齐","d":"DDR burst 与对齐：访存对齐 burst 长度，避免跨burst低效读写","kids":[],"w":"弄清「DDR burst 与对齐」，排障和选型时才知道该动哪一环。","b":""},{"id":"c7-4-3","t":"7.4.3 · weight 重排","d":"weight 重排：落在「内存带宽与 DDR 优化」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「weight 重排」，排障和选型时才知道该动哪一环。","b":""},{"id":"c7-4-4","t":"7.4.4 · INT4 打包解包","d":"INT4 打包解包：两INT4合成一字节降位宽，配解包kernel","kids":[],"w":"弄清「INT4 打包解包」，排障和选型时才知道该动哪一环。","b":""},{"id":"c7-4-5","t":"7.4.5 · 预取与异步","d":"预取与异步：prefetch/DMA异步隐藏访存延迟，提cache命中率","kids":[],"w":"弄清「预取与异步」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「推理性能优化」一个可讲可练的切口，让下面的知识点有归属。","b":"KV 布局再好也要过总线。带宽账清了，Decode 的 Token 速度才有优化空间，否则生成慢会被误判成算力不够。"},{"id":"c7-5","t":"7.5 · Token 生成速度优化","d":"主题「Token 生成速度优化」管端侧链路里这一段，下含：TTFT 首Token延迟、TPOT 与吞吐、Continuous Batching。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c7-5-1","t":"7.5.1 · TTFT 首Token延迟","d":"从发请求到第一个可用 token 出现的等待。端侧体感里它和 Prefill、视觉编码强绑定，常是验收硬指标。","kids":[],"w":"产品说「慢」，先拆成 TTFT 还是 Decode；两者治法完全不同。","b":""},{"id":"c7-5-2","t":"7.5.2 · TPOT 与吞吐","d":"TPOT 与吞吐：落在「Token 生成速度优化」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「TPOT 与吞吐」，排障和选型时才知道该动哪一环。","b":""},{"id":"c7-5-3","t":"7.5.3 · Continuous Batching","d":"Continuous Batching：落在「Token 生成速度优化」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「Continuous Batching」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「推理性能优化」一个可讲可练的切口，让下面的知识点有归属。","b":"带宽和 KV 有数，才优化 Decode 吞吐。自回归一步一 token 仍慢，下一步才上投机采样，别把算法招提前用。"},{"id":"c7-6","t":"7.6 · 投机采样 Speculative Decoding","d":"主题「投机采样 Speculative Decoding」管端侧链路里这一段，下含：基本原理、Draft 来源、加速比与接受率。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c7-6-1","t":"7.6.1 · 基本原理","d":"基本原理：小draft模型连猜K个token，大模型并行验证纠正","kids":[],"w":"弄清「基本原理」，排障和选型时才知道该动哪一环。","b":""},{"id":"c7-6-2","t":"7.6.2 · Draft 来源","d":"Draft 来源：独立小模型 / 自推测(浅层) / N-gram近似","kids":[],"w":"弄清「Draft 来源」，排障和选型时才知道该动哪一环。","b":""},{"id":"c7-6-3","t":"7.6.3 · 加速比与接受率","d":"加速比与接受率：加速≈平均接受token数；接受率低反而慢","kids":[],"w":"弄清「加速比与接受率」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「推理性能优化」一个可讲可练的切口，让下面的知识点有归属。","b":"自回归太慢才投机：用小模型猜、大模型验。改的是算法，Attention/GEMM kernel 是另一层；两招别搅成一锅。"},{"id":"c7-7","t":"7.7 · Attention / GEMM 内核","d":"按相关度决定每个位置「看」哪些位置的信息。Transformer 里算力与访存大头之一，后面的融合、KV、量化都围着它转。","kids":[{"id":"c7-7-1","t":"7.7.1 · FlashAttention","d":"按相关度决定每个位置「看」哪些位置的信息。Transformer 里算力与访存大头之一，后面的融合、KV、量化都围着它转。","kids":[],"w":"性能热点图若扎在 Attention，下一步才是融合、量化或改 GQA/MQA。","b":""},{"id":"c7-7-2","t":"7.7.2 · Online Softmax","d":"Online Softmax：分块安全计算softmax，数值稳定","kids":[],"w":"弄清「Online Softmax」，排障和选型时才知道该动哪一环。","b":""},{"id":"c7-7-3","t":"7.7.3 · 量化 GEMM","d":"量化 GEMM：INT8/INT4矩阵乘，scale反量化融合","kids":[],"w":"弄清「量化 GEMM」，排障和选型时才知道该动哪一环。","b":""},{"id":"c7-7-4","t":"7.7.4 · 共享内存分块、bank conflict避免、寄存…","d":"共享内存分块、bank conflict避免、寄存…：共享内存分块、bank conflict避免、寄存器tiling","kids":[],"w":"弄清「共享内存分块、bank conflict避免、寄存…」，排障和选型时才知道该动哪一环。","b":""}],"w":"性能热点图若扎在 Attention，下一步才是融合、量化或改 GQA/MQA。","b":"算法招用尽，热点还在 Attention/GEMM，才下钻 kernel。这是性能章最后扳手，前面没定位就改核等于盲拧。"}],"w":"给学习路径一个章节锚点，排障时先回到这一章的目标。","b":"精度过线才谈快。先定位瓶颈，再融合、KV、带宽、Decode，最后才下 kernel；附录再把命令和平台开关补齐。"},{"id":"c8","t":"8 · 附录 · 性能命令与平台开关","d":"KV Cache/投机采样/FlashAttention/性能指标/TensorRT-LLM 与 GGUF 实战","kids":[{"id":"c8-1","t":"8.1 · KV Cache 原理与显存计算","d":"生成时把已算过的 Key/Value 存起来复用，Decode 就不用整段重算 Attention。省算力，但占内存，长度一长就胀。","kids":[{"id":"c8-1-1","t":"8.1.1 · 缓存动机","d":"缓存动机：decode 复用旧 K/V，省掉 O(seq_len²) 重算，每步 O(1) 增长","kids":[],"w":"弄清「缓存动机」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-1-2","t":"8.1.2 · bytes/token=2×num_layers×…","d":"bytes/token=2×num_layers×…：bytes/token=2×num_layers×num_kv_heads×head_dim×precision_bytes","kids":[],"w":"弄清「bytes/token=2×num_layers×…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-1-3","t":"8.1.3 · FP16=2B、INT8=1B、FP8=1B、IN…","d":"FP16=2B、INT8=1B、FP8=1B、IN…：FP16=2B、INT8=1B、FP8=1B、INT4=0.5B；GQA/MQA 是首要杠杆","kids":[],"w":"弄清「FP16=2B、INT8=1B、FP8=1B、IN…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-1-4","t":"8.1.4 · 数值案例","d":"数值案例：Qwen2.5-7B FP16 约 0.128 MiB/token，MHA 为 GQA 的 4 倍","kids":[],"w":"弄清「数值案例」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-1-5","t":"8.1.5 · 显存预算","d":"显存预算：总显存=每序列 token×每 token 字节×并发；杠杆为 max_seq_len、kv_cache 占比、concurrency","kids":[],"w":"弄清「显存预算」，排障和选型时才知道该动哪一环。","b":""}],"w":"端侧长对话的内存墙多半在这：优化吞吐前先算清 KV 占多少。","b":"图优化省的是计算，长对话吃的是 KV。缓存账管住了再抠 DDR 带宽；KV 没算清，Token 速度优化只是加核空转。"},{"id":"c8-2","t":"8.2 · Paged KV / KV Offload / KV 量化","d":"主题「Paged KV / KV Offload / KV 量化」管端侧链路里这一段，下含：KV 按固定 block(128 token)分页…、配合 --enable_chunked_conte…、不活跃 block 换出到 host pinned…、代价：hostdevice 拉回带宽翻倍、kv_cache_quantization i……","kids":[{"id":"c8-2-1","t":"8.2.1 · KV 按固定 block(128 token)分页…","d":"KV 按固定 block(128 token)分页…：KV 按固定 block(128 token)分页；共享 prefix 锁块复用，省 prefill 计算","kids":[],"w":"弄清「KV 按固定 block(128 token)分页…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-2-2","t":"8.2.2 · 配合 --enable_chunked_conte…","d":"配合 --enable_chunked_conte…：配合 --enable_chunked_context 流式 prefill","kids":[],"w":"弄清「配合 --enable_chunked_conte…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-2-3","t":"8.2.3 · 不活跃 block 换出到 host pinned…","d":"不活跃 block 换出到 host pinned…：不活跃 block 换出到 host pinned memory，--kv_cache_host_memory_bytes","kids":[],"w":"弄清「不活跃 block 换出到 host pinned…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-2-4","t":"8.2.4 · 代价：hostdevice 拉回带宽翻倍","d":"代价：hostdevice 拉回带宽翻倍：代价：hostdevice 拉回带宽翻倍","kids":[],"w":"弄清「代价：hostdevice 拉回带宽翻倍」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-2-5","t":"8.2.5 · kv_cache_quantization i…","d":"kv_cache_quantization i…：--kv_cache_quantization int8 降 precision_bytes，decode 带宽双利好","kids":[],"w":"弄清「kv_cache_quantization i…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-2-6","t":"8.2.6 · 代价长上下文精度损失，与权重量化正交、默认不量化","d":"代价长上下文精度损失，与权重量化正交、默认不量化：代价长上下文精度损失，与权重量化正交、默认不量化","kids":[],"w":"弄清「代价长上下文精度损失，与权重量化正交、默认不量化」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-2-7","t":"8.2.7 · Orin 特例","d":"Orin 特例：无独立显存走共享 DRAM/NVMM，nvpmodel -m 0 + jetson_clocks 满频","kids":[],"w":"弄清「Orin 特例」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「附录 · 性能命令与平台开关」一个可讲可练的切口，让下面的知识点有归属。","b":"VLM 时序清了，KV 才能量化、分页、做前缀复用。缓存组合选定，任务级量化验收和 CI 四站门禁才有内存基线。"},{"id":"c8-3","t":"8.3 · prefill 与 decode：两个阶段两个瓶颈","d":"提示词整段一次性进模型、算出首段表示并填满 KV 的阶段。往往决定首字等多久出来，算力更密。","kids":[{"id":"c8-3-1","t":"8.3.1 · prefill 大矩阵乘、compute-boun…","d":"提示词整段一次性进模型、算出首段表示并填满 KV 的阶段。往往决定首字等多久出来，算力更密。","kids":[],"w":"TTFT 差，先看 Prefill：序列长、视觉编码、是否多余重算。","b":""},{"id":"c8-3-2","t":"8.3.2 · decode 逐 token、读几 GB HBM、…","d":"一个接一个吐 token 的阶段，每步主要吃 KV 与带宽。体感「生成慢不慢」常栽在这里。","kids":[],"w":"交互跟手度看 Decode；带宽和 KV 布局比盲目加核数更管用。","b":""},{"id":"c8-3-3","t":"8.3.3 · decode 本质","d":"一个接一个吐 token 的阶段，每步主要吃 KV 与带宽。体感「生成慢不慢」常栽在这里。（补充：稀疏计算被 HBM 带宽卡死；优化靠 KV 量化/投机采样/大 batch。）","kids":[],"w":"交互跟手度看 Decode；带宽和 KV 布局比盲目加核数更管用。","b":""},{"id":"c8-3-4","t":"8.3.4 · 阶段诊断","d":"阶段诊断：trtllm verbose 看 per-iteration；nsys 看 kernel 名；ncu 看 DRAM vs SM throughput","kids":[],"w":"弄清「阶段诊断」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-3-5","t":"8.3.5 · 优化清单","d":"优化清单：prefill: prompt cache、chunked prefill、bF16/FP8；decode: KV 量化、投机采样、GQA","kids":[],"w":"弄清「优化清单」，排障和选型时才知道该动哪一环。","b":""}],"w":"TTFT 差，先看 Prefill：序列长、视觉编码、是否多余重算。","b":"KV 布局之后要把生成拆成 Prefill 与 Decode。首字慢和跟手慢不是同一笔账；阶段认清，TTFT 指标才有意义。"},{"id":"c8-4","t":"8.4 · 投机采样 Speculative Decoding","d":"主题「投机采样 Speculative Decoding」管端侧链路里这一段，下含：小 draft 模型猜 γ 个 token，大模型…、上限快 γ 倍，收益受接受率主导、TensorRT-LLM 配置、Medusa 头、收益与门槛。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c8-4-1","t":"8.4.1 · 小 draft 模型猜 γ 个 token，大模型…","d":"小 draft 模型猜 γ 个 token，大模型…：小 draft 模型猜 γ 个 token，大模型并行验证，拒绝首错并以 target 分布重采样","kids":[],"w":"弄清「小 draft 模型猜 γ 个 token，大模型…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-4-2","t":"8.4.2 · 上限快 γ 倍，收益受接受率主导","d":"上限快 γ 倍，收益受接受率主导：落在「投机采样 Speculative Decoding」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「上限快 γ 倍，收益受接受率主导」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-4-3","t":"8.4.3 · TensorRT-LLM 配置","d":"面向 NVIDIA GPU 的推理栈：图优化、精度策略、引擎构建。车上/工控 GPU 路径常点名它。","kids":[],"w":"GPU 端侧选型时，先确认 TRT 版本与目标芯片是否匹配，再谈插件与精度。","b":""},{"id":"c8-4-4","t":"8.4.4 · Medusa 头","d":"Medusa 头：target 尾部挂多并行预测头省独立 draft 模型","kids":[],"w":"弄清「Medusa 头」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-4-5","t":"8.4.5 · 收益与门槛","d":"收益与门槛：实测常见 1.5×~3× decode 加速；draft 太弱/大 batch/带宽不饱和时无收益","kids":[],"w":"弄清「收益与门槛」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「附录 · 性能命令与平台开关」一个可讲可练的切口，让下面的知识点有归属。","b":"自回归太慢才投机：用小模型猜、大模型验。改的是算法，Attention/GEMM kernel 是另一层；两招别搅成一锅。"},{"id":"c8-5","t":"8.5 · FlashAttention 与算子级认知","d":"按相关度决定每个位置「看」哪些位置的信息。Transformer 里算力与访存大头之一，后面的融合、KV、量化都围着它转。","kids":[{"id":"c8-5-1","t":"8.5.1 · tiling+online softmax+融合，…","d":"把相邻小算子并成一次 kernel，少写中间结果、少启动开销。编译器/引擎优化的常规招。（补充：tiling+online softmax+融合，HBM 读写 O(N²)→O(N)，避免溢出。）","kids":[],"w":"Profiling 见一串碎算子，优先问能不能融合，再谈换精度。","b":""},{"id":"c8-5-2","t":"8.5.2 · prefill 收益巨大，decode 瓶颈在 K…","d":"提示词整段一次性进模型、算出首段表示并填满 KV 的阶段。往往决定首字等多久出来，算力更密。（补充：prefill 收益巨大，decode 瓶颈在 KV 总量而非中间矩阵。）","kids":[],"w":"TTFT 差，先看 Prefill：序列长、视觉编码、是否多余重算。","b":""},{"id":"c8-5-3","t":"8.5.3 · TRT-LLM 开关","d":"TRT-LLM 开关：--gemm_plugin、--attention_plugin(auto/bf16/fp8)、--context_fmha","kids":[],"w":"弄清「TRT-LLM 开关」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-5-4","t":"8.5.4 · DLA 定点只扛规则 GEMM/量化线，atten…","d":"DLA 定点只扛规则 GEMM/量化线，atten…：DLA 定点只扛规则 GEMM/量化线，attention 一律走 GPU","kids":[],"w":"弄清「DLA 定点只扛规则 GEMM/量化线，atten…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-5-5","t":"8.5.5 · 选 Jetson 看带宽而非 TOPS（AGX ~…","d":"选 Jetson 看带宽而非 TOPS（AGX ~…：选 Jetson 看带宽而非 TOPS（AGX ~204.8GB/s）","kids":[],"w":"弄清「选 Jetson 看带宽而非 TOPS（AGX ~…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-5-6","t":"8.5.6 · 算子定位法","d":"算子定位法：三类算子 GEMM/Attention/RMSNorm・RoPE・Softmax，用 ncu 看 DRAM vs SM","kids":[],"w":"弄清「算子定位法」，排障和选型时才知道该动哪一环。","b":""}],"w":"性能热点图若扎在 Attention，下一步才是融合、量化或改 GQA/MQA。","b":"投机采样改算法，FlashAttention 改的是 Attention 实现。算子级认知立住，才谈 TTFT 指标和后面的引擎开关。"},{"id":"c8-6","t":"8.6 · 性能指标定义与权衡 (TTFT/TPOT/ITL/throug…","d":"从发请求到第一个可用 token 出现的等待。端侧体感里它和 Prefill、视觉编码强绑定，常是验收硬指标。","kids":[{"id":"c8-6-1","t":"8.6.1 · 指标定义","d":"用一小撮代表数据估激活分布，从而定 scale/阈值。校准集不代表线上分布，后面再精的 PTQ 也救不回来。（补充：TTFT 首 token，ITL/TPOT 相邻 token，throughput=单位时间生成总量。）","kids":[],"w":"PTQ 成败大半看校准：集子要覆盖主路径场景，别用「随手抽的几张图」糊弄。","b":""},{"id":"c8-6-2","t":"8.6.2 · 加大并发→吞吐↑但 TTFT/ITL 变长；SLO…","d":"从发请求到第一个可用 token 出现的等待。端侧体感里它和 Prefill、视觉编码强绑定，常是验收硬指标。（补充：加大并发→吞吐↑但 TTFT/ITL 变长；SLO(p95) 决定并发上限。）","kids":[],"w":"产品说「慢」，先拆成 TTFT 还是 Decode；两者治法完全不同。","b":""},{"id":"c8-6-3","t":"8.6.3 · llama.cpp: TTFT=prompt ev…","d":"从发请求到第一个可用 token 出现的等待。端侧体感里它和 Prefill、视觉编码强绑定，常是验收硬指标。（补充：llama.cpp: TTFT=prompt eval、TPOT=eval/ generated tokens。）","kids":[],"w":"产品说「慢」，先拆成 TTFT 还是 Decode；两者治法完全不同。","b":""}],"w":"产品说「慢」，先拆成 TTFT 还是 Decode；两者治法完全不同。","b":"算子级认知之后，把体感收成 TTFT/TPOT/吞吐。指标权衡清楚，调参才有基线；没定义就改引擎，绿数字对不上产品。"},{"id":"c8-7","t":"8.7 · 调优实验框架：基线→profiler→逐项改参","d":"主题「调优实验框架：基线→profiler→逐项改参」管端侧链路里这一段，下含：核心纪律、四步闭环、记录模板。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c8-7-1","t":"8.7.1 · 核心纪律","d":"核心纪律：先 nsys/ncu 拿证据再改参，每次只改一个变量","kids":[],"w":"弄清「核心纪律」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-7-2","t":"8.7.2 · 四步闭环","d":"四步闭环：Step0 FP16 基线 → Step1 profiler 定位三类瓶颈 → Step2 逐项改参 → Step3 compare_logits 精度护栏","kids":[],"w":"弄清「四步闭环」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-7-3","t":"8.7.3 · 记录模板","d":"记录模板：日期/GPU/模型量化/参数/TTFT/ITL/throughput/瓶颈算子/收益","kids":[],"w":"弄清「记录模板」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「附录 · 性能命令与平台开关」一个可讲可练的切口，让下面的知识点有归属。","b":"指标定义清楚，才按基线→profiler→逐项改参跑。实验框架有了，TensorRT-LLM 量化选型才不是碰运气。"},{"id":"c8-8","t":"8.8 · TensorRT-LLM 量化选型与命令流","d":"面向 NVIDIA GPU 的推理栈：图优化、精度策略、引擎构建。车上/工控 GPU 路径常点名它。","kids":[{"id":"c8-8-1","t":"8.8.1 · 位宽选型","d":"用多少比特存一个数：FP16 / INT8 / INT4 等。位宽越低越省内存和带宽，精度也更容易掉。选档要对齐芯片原生算子和业务验收线，别只看体积。（补充：端侧 Ampere 推荐 W4A16(AWQ/GPTQ)>INT8 W8A8>FP16；H100 用 FP8。）","kids":[],"w":"这是端侧「塞不塞得下」的第一扳手：位宽定了，后面的 scale、校准、性能账才有意义。","b":""},{"id":"c8-8-2","t":"8.8.2 · 硬件限制","d":"硬件限制：Ampere 无 FP8；LLM 瓶颈在权重带宽 weight-bound，INT4 砍 1/4 搬运","kids":[],"w":"弄清「硬件限制」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-8-3","t":"8.8.3 · 命令流","d":"命令流：convert_checkpoint.py --dtype float16 → trtllm-build → quantize.py --qformat int8_sq/awq/gptq →…","kids":[],"w":"弄清「命令流」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-8-4","t":"8.8.4 · KV Cache 量化","d":"生成时把已算过的 Key/Value 存起来复用，Decode 就不用整段重算 Attention。省算力，但占内存，长度一长就胀。（补充：独立开关 --kv_cache_quantization int8/fp8，先权重量化再单开 KV 量化。）","kids":[],"w":"端侧长对话的内存墙多半在这：优化吞吐前先算清 KV 占多少。","b":""}],"w":"GPU 端侧选型时，先确认 TRT 版本与目标芯片是否匹配，再谈插件与精度。","b":"调参框架有了，才在 TensorRT-LLM 里选量化档和命令流。选型落地后，用精度-资源矩阵收口，再决定要不要转 GGUF。"},{"id":"c8-9","t":"8.9 · 量化精度评估与精度-资源权衡矩阵","d":"主题「量化精度评估与精度-资源权衡矩阵」管端侧链路里这一段，下含：PPL 评估、logits 对比、权衡矩阵、校准坑。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c8-9-1","t":"8.9.1 · PPL 评估","d":"PPL 评估：eval_ppl.py stride=512；PPL 增幅 <0.5 且 top-1 一致率 >0.9 可用","kids":[],"w":"弄清「PPL 评估」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-9-2","t":"8.9.2 · logits 对比","d":"logits 对比：固定同 prompt+seed，比 KL/余弦/L2/top-k，4 铁律可比","kids":[],"w":"弄清「logits 对比」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-9-3","t":"8.9.3 · 权衡矩阵","d":"权衡矩阵：bench_matrix.py 对(模型,位宽)跑 PPL+KL+显存+吞吐，低位宽 ADC 递进验证","kids":[],"w":"弄清「权衡矩阵」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-9-4","t":"8.9.4 · 校准坑","d":"用一小撮代表数据估激活分布，从而定 scale/阈值。校准集不代表线上分布，后面再精的 PTQ 也救不回来。（补充：calib_size≥64 条、校准/评估隔离、max_seq_len 须与部署一致。）","kids":[],"w":"PTQ 成败大半看校准：集子要覆盖主路径场景，别用「随手抽的几张图」糊弄。","b":""}],"w":"给「附录 · 性能命令与平台开关」一个可讲可练的切口，让下面的知识点有归属。","b":"量化改完必须对账：余弦、偏差、任务指标。尺子没过就动轻量化，等于在误差上叠误差；LLM 还要另加生成向指标。"},{"id":"c8-10","t":"8.10 · GGUF 格式与 Q4_K_M / K-quant 量化","d":"主题「GGUF 格式与 Q4_K_M / K-quant 量化」管端侧链路里这一段，下含：GGUF 格式、量化谱系、Q4_K_M 原理、LLM 量化特殊性、转换命令。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c8-10-1","t":"8.10.1 · GGUF 格式","d":"GGUF 格式：llama.cpp 格式，含 Header/Tensor Info/Tokenizer/超参/Tensor Data","kids":[],"w":"弄清「GGUF 格式」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-10-2","t":"8.10.2 · 量化谱系","d":"量化谱系：Q2_K~200MB...Q4_K_M~300MB(推荐甜点)、Q6_K、Q8_0 近无损","kids":[],"w":"弄清「量化谱系」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-10-3","t":"8.10.3 · Q4_K_M 原理","d":"Q4_K_M 原理：4bit+K-quant(重要性分组)+Medium 粒度；super-block(32)→sub-block(16) 算 scale/zp","kids":[],"w":"弄清「Q4_K_M 原理」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-10-4","t":"8.10.4 · LLM 量化特殊性","d":"LLM 量化特殊性：激活离群值用 per-group(32/64/128) 比 CV per-channel 更细","kids":[],"w":"弄清「LLM 量化特殊性」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-10-5","t":"8.10.5 · 转换命令","d":"转换命令：convert_hf_to_gguf.py --outtype q4_k_m，或 convert.py→llama-quantize","kids":[],"w":"弄清「转换命令」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「附录 · 性能命令与平台开关」一个可讲可练的切口，让下面的知识点有归属。","b":"精度-资源权衡有了，才落到 GGUF 档位。Q4_K_M 这类格式决定体积和掉点，下一步才是 llama.cpp 后端怎么把档跑起来。"},{"id":"c8-11","t":"8.11 · llama.cpp/GGML 编译后端与 kernel dis…","d":"主题「llama.cpp/GGML 编译后端与 kernel dis…」管端侧链路里这一段，下含：三层关系、GGML 分层、kernel dispatch、CMake 参数、运行卸载。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c8-11-1","t":"8.11.1 · 三层关系","d":"三层关系：GGUF 存权重、GGML 张量计算库、llama.cpp 上层推理应用","kids":[],"w":"弄清「三层关系」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-11-2","t":"8.11.2 · GGML 分层","d":"GGML 分层：计算层 ggml_compute_forward_ → 后端 CPU(SSE/AVX2/AVX512)/CUDA/Vulkan/Metal/SYCL","kids":[],"w":"弄清「GGML 分层」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-11-3","t":"8.11.3 · kernel dispatch","d":"kernel dispatch：编译期 #if 静态选 AVX512>AVX2>NEON；CUDA 运行时 m==1 走 GEMV、大矩阵走 cuBLAS","kids":[],"w":"弄清「kernel dispatch」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-11-4","t":"8.11.4 · CMake 参数","d":"CMake 参数：-DGGML_CUDA=ON、-DCMAKE_CUDA_ARCHITECTURES=\"75;80;86;89\" 钉架构","kids":[],"w":"弄清「CMake 参数」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-11-5","t":"8.11.5 · 运行卸载","d":"运行卸载：-ngl 32 分层 GPU offload；llama-bench/llama-cli 实测对比","kids":[],"w":"弄清「运行卸载」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「附录 · 性能命令与平台开关」一个可讲可练的切口，让下面的知识点有归属。","b":"LLM 端侧不是再跑一条 CV 量化。llama.cpp/GGUF 管权重，KV 管生成时内存；这两本账清了，才对照各家车载引擎。"},{"id":"c8-12","t":"8.12 · Jetson/Orin 平台特性与端到端工程化交付","d":"主题「Jetson/Orin 平台特性与端到端工程化交付」管端侧链路里这一段，下含：平台认知、engine 强绑定、build 参数、量化纵深、一键化流水线、端侧验收。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c8-12-1","t":"8.12.1 · 平台认知","d":"平台认知：Orin Ampere 无 FP8、共享 DRAM；LLM 直吃 HF 权重绕开 ONNX","kids":[],"w":"弄清「平台认知」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-12-2","t":"8.12.2 · engine 强绑定","d":"engine 强绑定：engine 须 Orin 本地 build；版本铁律 TRT-LLMCUDATRTJP 钉死","kids":[],"w":"弄清「engine 强绑定」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-12-3","t":"8.12.3 · build 参数","d":"build 参数：max_seq_len 是 KV 上界、chunked_context 必开、gemm_plugin float16、context_fmha","kids":[],"w":"弄清「build 参数」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-12-4","t":"8.12.4 · 量化纵深","d":"量化纵深：端侧 INT4 AWQ/GPTQ 首选，KV Cache 默认不量化单独决策","kids":[],"w":"弄清「量化纵深」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-12-5","t":"8.12.5 · 一键化流水线","d":"一键化流水线：stages 独立脚本+YAML 声明+断点续跑+统一退出码+.done.json 失效重跑","kids":[],"w":"弄清「一键化流水线」，排障和选型时才知道该动哪一环。","b":""},{"id":"c8-12-6","t":"8.12.6 · 端侧验收","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。（补充：NPI 思维：内存预留≥20%、引擎 sha256 一致、latency 达标、ppl_delta 可解释、manife。）","kids":[],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":""}],"w":"给「附录 · 性能命令与平台开关」一个可讲可练的切口，让下面的知识点有归属。","b":"高通链看过，英伟达走 TensorRT 图优化与引擎构建。版本和芯片对上，插件和精度才有意义；两家工具不要交叉套命令。"}],"w":"给学习路径一个章节锚点，排障时先回到这一章的目标。","b":"性能方法论有了，附录给出命令、GGUF、TRT-LLM、板上开关。把「快」落成可复现实验，编译器章才能接着讲图为什么被编成那样。"},{"id":"c9","t":"9 · AI 编译器与算子工程","d":"「AI 编译器与算子工程」这一章回答端侧部署里一块完整问题；先立章目标，再进主题。","kids":[{"id":"c9-1","t":"9.1 · torch.export / FX / Dynamo 与…","d":"对照：PyTorch → ONNX → qnn-onnx-converter 仍是高通主路径（见 ⑤⑭），与 ExecuTorch delegate 是 两条出口，不要画成一条","kids":[{"id":"c9-1-1","t":"9.1.1 · `export` 失败：Python 数据依赖控制…","d":"`export` 失败：Python 数据依赖控制…：export 失败：Python 数据依赖控制流、未注册 custom op、data-dependent shape（如 nonzero）","kids":[],"w":"弄清「`export` 失败：Python 数据依赖控制…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-1-2","t":"9.1.2 · 成功但变慢：图被切成多段 GraphBreak，中…","d":"成功但变慢：图被切成多段 GraphBreak，中…：成功但变慢：图被切成多段 GraphBreak，中间回 Python","kids":[],"w":"弄清「成功但变慢：图被切成多段 GraphBreak，中…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-1-3","t":"9.1.3 · ExecuTorch：看 `delegation`…","d":"ExecuTorch：看 `delegation`…：ExecuTorch：看 delegation 表——未委托节点落到 portable CPU，decode 会被拖死","kids":[],"w":"弄清「ExecuTorch：看 `delegation`…」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「torch.export / FX / Dynamo 与…」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"编译器章从导出抓图开始。export/FX 图不对，后面换 IR、配 kernel 都是空的；图稳了才比较 ONNX 与各方言。"},{"id":"c9-2","t":"9.2 · ONNX vs StableHLO vs TOSA vs…","d":"跨框架中间格式，常作训练框架到推理引擎的交接面。图对不对、算子齐不齐，先在这里验。","kids":[{"id":"c9-2-1","t":"9.2.1 · 进 **厂商 SDK**：优先对方官方入口（ONN…","d":"进 **厂商 SDK**：优先对方官方入口（ONN…：进 厂商 SDK：优先对方官方入口（ONNX 或 torch.export），不要为 IR 干净强转三跳","kids":[],"w":"弄清「进 **厂商 SDK**：优先对方官方入口（ONN…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-2-2","t":"9.2.2 · 自研 codegen：StableHLO 或 ML…","d":"自研 codegen：StableHLO 或 ML…：自研 codegen：StableHLO 或 MLIR 比 ONNX 更适合做 pass","kids":[],"w":"弄清「自研 codegen：StableHLO 或 ML…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-2-3","t":"9.2.3 · TOSA","d":"TOSA：静态 INT8 卷积网，而不是 GQA+RoPE 自回归","kids":[],"w":"弄清「TOSA」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-2-4","t":"9.2.4 · 转换损失发生在合同边界","d":"转换损失发生在合同边界：ONNX 把 SDPA 拆成 MatMul+Softmax 后，NPU 融合模式就匹配不上","kids":[],"w":"弄清「转换损失发生在合同边界」，排障和选型时才知道该动哪一环。","b":""}],"w":"转换失败优先查 ONNX：动态 shape、自定义算子、opset 版本。","b":"导出只是第一跳。ONNX、StableHLO、TOSA 各吃不同后端，选错中间格式，后面图匹配失败会整段返工。"},{"id":"c9-3","t":"9.3 · 图模式匹配失败的典型 LLM 算子","d":"编译器「有 fused kernel」≠「你的图能连上」。失败几乎总是 图形状与白皮书模板不一致","kids":[{"id":"c9-3-1","t":"9.3.1 · 手写 `matmul + /sqrt + mask…","d":"手写 `matmul + /sqrt + mask…：手写 matmul + /sqrt + mask + softmax + matmul → 匹配不到 FMHA，多次 DRAM 往返","kids":[],"w":"弄清「手写 `matmul + /sqrt + mask…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-3-2","t":"9.3.2 · mask 加性 `-inf` vs bool vs…","d":"mask 加性 `-inf` vs bool vs…：mask 加性 -inf vs bool vs sliding window，模板只认一种","kids":[],"w":"弄清「mask 加性 `-inf` vs bool vs…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-3-3","t":"9.3.3 · causal 用 `triu` 现算 vs `is…","d":"causal 用 `triu` 现算 vs `is…：causal 用 triu 现算 vs is_causal 属性 → 多一个 Compare+Where 打断融合","kids":[],"w":"弄清「causal 用 `triu` 现算 vs `is…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-3-4","t":"9.3.4 · dropout 训练残留 → 推理模板直接拒。","d":"dropout 训练残留 → 推理模板直接拒。：dropout 训练残留 → 推理模板直接拒","kids":[],"w":"弄清「dropout 训练残留 → 推理模板直接拒。」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-3-5","t":"9.3.5 · 处理","d":"处理：导出前 F.scaled_dot_product_attention(..., is_causal=True)；推理去掉 dropout","kids":[],"w":"弄清「处理」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-3-6","t":"9.3.6 · 手写 `pow2 → mean → add eps…","d":"手写 `pow2 → mean → add eps…：手写 pow2 → mean → add eps → rsqrt → mul γ，axes/keepdims/eps 位置不同则失败","kids":[],"w":"弄清「手写 `pow2 → mean → add eps…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-3-7","t":"9.3.7 · 修复","d":"修复：换成后端登记的 RMSNorm custom op，或与官方 pattern 逐节点一致","kids":[],"w":"弄清「修复」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-3-8","t":"9.3.8 · `cos/sin` 每次 `arange` 现算 …","d":"`cos/sin` 每次 `arange` 现算 …：cos/sin 每次 arange 现算 → 动态 shape + trig，NPU 几乎不融","kids":[],"w":"弄清「`cos/sin` 每次 `arange` 现算 …」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-3-9","t":"9.3.9 · interleaved vs half-split…","d":"interleaved vs half-split…：interleaved vs half-split 两种布局，模板只认一种；YaRN/NTK 额外 Mul 使 pattern 失效","kids":[],"w":"弄清「interleaved vs half-split…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-3-10","t":"9.3.10 · `SiLU(xW_g)*(xW_u)` 中间夹 t…","d":"`SiLU(xW_g)*(xW_u)` 中间夹 t…：SiLU(xW_g)(xW_u) 中间夹 to(dtype)/contiguous/bias → 无法 fused_w1w3","kids":[],"w":"弄清「`SiLU(xW_g)*(xW_u)` 中间夹 t…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-3-11","t":"9.3.11 · 不该融","d":"不该融：gate/up 已是 INT4 分组量化且 group 轴与拼接轴冲突时，强融会 pack 错","kids":[],"w":"弄清「不该融」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-3-12","t":"9.3.12 · `repeat_interleave` / `ex…","d":"`repeat_interleave` / `ex…：repeat_interleave / expand+reshape / broadcast 三种写法；很多 NPU 要 不 repeat、在 attention kerne…","kids":[],"w":"弄清「`repeat_interleave` / `ex…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-3-13","t":"9.3.13 · 图上真 `repeat` 成 MHA 体积，④ 的…","d":"图上真 `repeat` 成 MHA 体积，④ 的…：图上真 repeat 成 MHA 体积，④ 的 KV 带宽优化被编译器做废","kids":[],"w":"弄清「图上真 `repeat` 成 MHA 体积，④ 的…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-3-14","t":"9.3.14 · 通用手法","d":"通用手法：失败子图做 graph dump 对照官方 golden 图；差一个 Squeeze 就整簇 miss","kids":[],"w":"弄清「通用手法」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「图模式匹配失败的典型 LLM 算子」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"IR 选好仍会在 LLM 算子上匹配失败。先认哪些图模式吃不住，再谈自写 kernel，否则 NPU compiler 只能报一串不支持。"},{"id":"c9-4","t":"9.4 · Kernel 库：各吃哪一段","d":"主题「Kernel 库：各吃哪一段」管端侧链路里这一段，下含：优先级。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c9-4-1","t":"9.4.1 · 优先级","d":"优先级：NPU 厂商库 > KleidiAI/XNNPACK > 手写 NEON > 通用 BLAS","kids":[],"w":"弄清「优先级」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「AI 编译器与算子工程」一个可讲可练的切口，让下面的知识点有归属。","b":"匹配失败才知道要补哪段 kernel。库是按图区间分工的，弄清各吃哪一段，端侧 NPU compiler 才有配置语言。"},{"id":"c9-5","t":"9.5 · 端侧 NPU compiler 共性","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。","kids":[{"id":"c9-5-n","t":"9.5.1 · 端侧 NPU compiler 共性","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。（补充：1. 静态 shape 偏好：SRAM/指令按 shape 特化。动态维 → 多份编译、慢速通用核、或拒。）","kids":[],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":""}],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":"kernel 分工清楚了，看各家 NPU 编译器的共性：切图、选核、回落 CPU。共性懂了，动态 shape 的折中才好谈。"},{"id":"c9-6","t":"9.6 · 动态 shape / 动态 seq_len 的工程折中","d":"主题「动态 shape / 动态 seq_len 的工程折中」管端侧链路里这一段，下含：禁止幻想。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c9-6-1","t":"9.6.1 · 禁止幻想","d":"禁止幻想：封闭 NPU 上完全动态 seq 且不损吞吐。torch.export 的 Dim(\"seq\") 能导出，不代表 NPU lowering 能吃","kids":[],"w":"弄清「禁止幻想」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「AI 编译器与算子工程」一个可讲可练的切口，让下面的知识点有归属。","b":"NPU 编译常假设静态形状。动态 seq_len 要在 padding、分档、再编译之间折中；折中定了，融合白名单才不会把动态图融死。"},{"id":"c9-7","t":"9.7 · 算子融合白名单：能融 vs 不该融","d":"把相邻小算子并成一次 kernel，少写中间结果、少启动开销。编译器/引擎优化的常规招。","kids":[{"id":"c9-7-1","t":"9.7.1 · 逐点：`Add+Mul+SiLU/GELU`、QD…","d":"逐点：`Add+Mul+SiLU/GELU`、QD…：逐点：Add+Mul+SiLU/GELU、QDQ 与随后 GEMM 的 scale epilogue","kids":[],"w":"弄清「逐点：`Add+Mul+SiLU/GELU`、QD…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-7-2","t":"9.7.2 · 归一化+残差：`RMSNorm + residua…","d":"归一化+残差：`RMSNorm + residua…：归一化+残差：RMSNorm + residual add","kids":[],"w":"弄清「归一化+残差：`RMSNorm + residua…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-7-3","t":"9.7.3 · Attention 簇：QKVO + scale …","d":"按相关度决定每个位置「看」哪些位置的信息。Transformer 里算力与访存大头之一，后面的融合、KV、量化都围着它转。（补充：Attention 簇：QKVO + scale + mask + softmax（SDPA/FMHA）。）","kids":[],"w":"性能热点图若扎在 Attention，下一步才是融合、量化或改 GQA/MQA。","b":""},{"id":"c9-7-4","t":"9.7.4 · SwiGLU 的 gate/up 同输入、同量化方…","d":"SwiGLU 的 gate/up 同输入、同量化方…：SwiGLU 的 gate/up 同输入、同量化方案时的成对 GEMM","kids":[],"w":"弄清「SwiGLU 的 gate/up 同输入、同量化方…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-7-5","t":"9.7.5 · 跨精度边界：INT4 GEMM 与必须 FP16 …","d":"跨精度边界：INT4 GEMM 与必须 FP16 …：跨精度边界：INT4 GEMM 与必须 FP16 的 RMSNorm 强融","kids":[],"w":"弄清「跨精度边界：INT4 GEMM 与必须 FP16 …」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-7-6","t":"9.7.6 · 跨动态/静态边界：RoPE 动态 `positio…","d":"跨动态/静态边界：RoPE 动态 `positio…：跨动态/静态边界：RoPE 动态 position_ids 拉进静态 SDPA tile","kids":[],"w":"弄清「跨动态/静态边界：RoPE 动态 `positio…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-7-7","t":"9.7.7 · `repeat_kv` 融进 Q 投影：GQA 胀…","d":"`repeat_kv` 融进 Q 投影：GQA 胀…：repeat_kv 融进 Q 投影：GQA 胀成 MHA","kids":[],"w":"弄清「`repeat_kv` 融进 Q 投影：GQA 胀…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-7-8","t":"9.7.8 · 采样/KV append/tokenizer 不应…","d":"采样/KV append/tokenizer 不应…：采样/KV append/tokenizer 不应进 NPU 图","kids":[],"w":"弄清「采样/KV append/tokenizer 不应…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-7-9","t":"9.7.9 · 精度未过就开最高 fusion → layerwi…","d":"精度未过就开最高 fusion → layerwi…：精度未过就开最高 fusion → layerwise dump 无法归因","kids":[],"w":"弄清「精度未过就开最高 fusion → layerwi…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c9-7-10","t":"9.7.10 · 超大 fused kernel 超出 I-cach…","d":"超大 fused kernel 超出 I-cach…：超大 fused kernel 超出 I-cache/SRAM → 应主动解融","kids":[],"w":"弄清「超大 fused kernel 超出 I-cach…」，排障和选型时才知道该动哪一环。","b":""}],"w":"Profiling 见一串碎算子，优先问能不能融合，再谈换精度。","b":"动态形状有折中后，才规定能融与不该融。乱融会藏精度坑，该融不融又把碎算子留给 profiler；下一步用 dump 验证。"},{"id":"c9-8","t":"9.8 · 调试：graph dump、layerwise dump…","d":"导出后、lowering 后、后端分区后 三份图。查：SDPA 是否仍在、哪些 node fallback、QDQ 是否成对、repeat_kv 是否被展开","kids":[{"id":"c9-8-1","t":"9.8.1 · 定位顺序","d":"定位顺序：logits 是否 NaN → 从后往前第一层 NaN → 该层融合核还是分解核 → 关融合/升精度/查 mask。不要先重训","kids":[],"w":"弄清「定位顺序」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「调试：graph dump、layerwise dump…」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"融合和回落是否真按白名单发生，要靠 graph/layerwise dump 核对。编译器章收到这里：能看见图，才能排「能转不能跑」。"}],"w":"给学习路径一个章节锚点，排障时先回到这一章的目标。","b":"引擎好用还要懂图怎么被编译、算子为啥匹配失败。这段给后续平台工具链共同语言，避免只会贴厂商教程。"},{"id":"c10","t":"10 · 平台工具链","d":"二选一主攻：高通骁龙(QNN) 或 英伟达Jetson Orin(TensorRT)","kids":[{"id":"c10-1","t":"10.1 · 高通 QNN 方向","d":"高通侧把模型搬到 Hexagon/NPU 的工具与运行时一环。手机/车机 Qualcomm 方案会反复遇到。","kids":[{"id":"c10-1-1","t":"10.1.1 · 硬件架构","d":"硬件架构：骁龙NPU(HTP)/Hexagon DSP、Qualcomm AI Engine Direct、L2/LLP内存层次","kids":[],"w":"弄清「硬件架构」，排障和选型时才知道该动哪一环。","b":""},{"id":"c10-1-2","t":"10.1.2 · 模型转换","d":"模型转换：qnn-onnx-converter 将 ONNX 等转为 QNN 模型","kids":[],"w":"弄清「模型转换」，排障和选型时才知道该动哪一环。","b":""},{"id":"c10-1-3","t":"10.1.3 · 量化(AIMET)","d":"量化(AIMET)：AIMET 官方QAT/PTQ；适配HTP量化约束与算子支持度","kids":[],"w":"弄清「量化(AIMET)」，排障和选型时才知道该动哪一环。","b":""},{"id":"c10-1-4","t":"10.1.4 · 编译","d":"编译：qnn-context-binary-generator 生成 context binary","kids":[],"w":"弄清「编译」，排障和选型时才知道该动哪一环。","b":""},{"id":"c10-1-5","t":"10.1.5 · 性能分析","d":"性能分析：qnn-profiler 逐层/逐算子耗时与带宽分析","kids":[],"w":"弄清「性能分析」，排障和选型时才知道该动哪一环。","b":""},{"id":"c10-1-6","t":"10.1.6 · 验证与量产","d":"验证与量产：qnn-tester精度比对；context binary 跨cache共享","kids":[],"w":"弄清「验证与量产」，排障和选型时才知道该动哪一环。","b":""}],"w":"高通板上「能转不能跑」多半卡在 DSP/NPU 算子覆盖与上下文配置。","b":"编译器共性讲完，落到高通：图要进 Hexagon/NPU。QNN 跑通，才对比英伟达 TensorRT，两条实链不要混着配。"},{"id":"c10-2","t":"10.2 · 英伟达 TensorRT 方向","d":"面向 NVIDIA GPU 的推理栈：图优化、精度策略、引擎构建。车上/工控 GPU 路径常点名它。","kids":[{"id":"c10-2-1","t":"10.2.1 · 硬件架构","d":"硬件架构：Orin GPU CUDA core + DLA，异构调度","kids":[],"w":"弄清「硬件架构」，排障和选型时才知道该动哪一环。","b":""},{"id":"c10-2-2","t":"10.2.2 · CUDA 编程","d":"CUDA 编程：线程/block/grid、内存层级、共享内存与bank conflict","kids":[],"w":"弄清「CUDA 编程」，排障和选型时才知道该动哪一环。","b":""},{"id":"c10-2-3","t":"10.2.3 · TensorRT 优化","d":"面向 NVIDIA GPU 的推理栈：图优化、精度策略、引擎构建。车上/工控 GPU 路径常点名它。","kids":[],"w":"GPU 端侧选型时，先确认 TRT 版本与目标芯片是否匹配，再谈插件与精度。","b":""},{"id":"c10-2-4","t":"10.2.4 · INT8 量化","d":"INT8 量化：TensorRT calibrator 做 PTQ 校准","kids":[],"w":"弄清「INT8 量化」，排障和选型时才知道该动哪一环。","b":""},{"id":"c10-2-5","t":"10.2.5 · TensorRT Edge-LLM","d":"面向 NVIDIA GPU 的推理栈：图优化、精度策略、引擎构建。车上/工控 GPU 路径常点名它。（补充：边缘LLM/VLM推理框架，内置KV cache管理。）","kids":[],"w":"GPU 端侧选型时，先确认 TRT 版本与目标芯片是否匹配，再谈插件与精度。","b":""},{"id":"c10-2-6","t":"10.2.6 · FP16/INT8/INT4 路径；CUDA Gr…","d":"FP16/INT8/INT4 路径；CUDA Gr…：FP16/INT8/INT4 路径；CUDA Graphs 减少下发开销","kids":[],"w":"弄清「FP16/INT8/INT4 路径；CUDA Gr…」，排障和选型时才知道该动哪一环。","b":""}],"w":"GPU 端侧选型时，先确认 TRT 版本与目标芯片是否匹配，再谈插件与精度。","b":"高通链看过，英伟达走 TensorRT 图优化与引擎构建。版本和芯片对上，插件和精度才有意义；两家工具不要交叉套命令。"}],"w":"给学习路径一个章节锚点，排障时先回到这一章的目标。","b":"编译器共性讲完，先落到高通 QNN 与英伟达 TensorRT 两条实链。两家都摸过，扩展章再铺其它 SoC 和对照表。"},{"id":"c11","t":"11 · LLM / VLM 补全（2024–2026）","d":"基准日 2026-09-15。数字只给公式和数量级，不编未公开实测","kids":[{"id":"c11-1","t":"11.1 · 勘误（相对原文不精确/过时处）","d":"主题「勘误（相对原文不精确/过时处）」管端侧链路里这一段，下含：原文多处写 `2×layers×heads×d×s…、LLaMA-7B「约 512KB/token」对 …、「7B/seq4096 约 2GB」仅在特定 MH…、「H100 用 FP8 / Ampere 无 FP…、「FP4(E2M1)…Blackwell/Hexa……","kids":[{"id":"c11-1-1","t":"11.1.1 · 原文多处写 `2×layers×heads×d×s…","d":"原文多处写 `2×layers×heads×d×s…：原文多处写 2×layers×heads×d×seq×dtype：heads 须为 KV 头数（GQA 的 num_kv_heads），不是 Q 头","kids":[],"w":"弄清「原文多处写 `2×layers×heads×d×s…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-1-2","t":"11.1.2 · LLaMA-7B「约 512KB/token」对 …","d":"LLaMA-7B「约 512KB/token」对 …：LLaMA-7B「约 512KB/token」对 MHA + FP16 量级大致成立；对 GQA 模型（如 Qwen2.5-7B） 应按 num_kv_heads 重算，…","kids":[],"w":"弄清「LLaMA-7B「约 512KB/token」对 …」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-1-3","t":"11.1.3 · 「7B/seq4096 约
