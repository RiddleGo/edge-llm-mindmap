本章补：**选型、新格式、算法边界、Tokeniz…」，排障和选型时才知道该动哪一环。","b":""}],"w":"高通板上「能转不能跑」多半卡在 DSP/NPU 算子覆盖与上下文配置。","b":"编译器共性讲完，落到高通：图要进 Hexagon/NPU。QNN 跑通，才对比英伟达 TensorRT，两条实链不要混着配。"},{"id":"c11-12","t":"11.12 · 并入检查清单（工程用）","d":"主题「并入检查清单（工程用）」管端侧链路里这一段，下含：[ ] 选型：任务×内存×词表×许可证、[ ] 量化：格式有内核？W4A16/W8A8/W…、[ ] 算法：chunked prefill / …、[ ] 模板：chat template + st…、[ ] RAG：embedding 位宽 + sq……","kids":[{"id":"c11-12-1","t":"11.12.1 · [ ] 选型：任务×内存×词表×许可证","d":"[ ] 选型：任务×内存×词表×许可证：[ ] 选型：任务×内存×词表×许可证","kids":[],"w":"弄清「[ ] 选型：任务×内存×词表×许可证」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-12-2","t":"11.12.2 · [ ] 量化：格式有内核？W4A16/W8A8/W…","d":"[ ] 量化：格式有内核？W4A16/W8A8/W…：[ ] 量化：格式有内核？W4A16/W8A8/W4A8 何者真加速？","kids":[],"w":"弄清「[ ] 量化：格式有内核？W4A16/W8A8/W…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-12-3","t":"11.12.3 · [ ] 算法：chunked prefill / …","d":"提示词整段一次性进模型、算出首段表示并填满 KV 的阶段。往往决定首字等多久出来，算力更密。","kids":[],"w":"TTFT 差，先看 Prefill：序列长、视觉编码、是否多余重算。","b":""},{"id":"c11-12-4","t":"11.12.4 · [ ] 模板：chat template + st…","d":"[ ] 模板：chat template + st…：[ ] 模板：chat template + stop 与训练一致","kids":[],"w":"弄清「[ ] 模板：chat template + st…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-12-5","t":"11.12.5 · [ ] RAG：embedding 位宽 + sq…","d":"用多少比特存一个数：FP16 / INT8 / INT4 等。位宽越低越省内存和带宽，精度也更容易掉。选档要对齐芯片原生算子和业务验收线，别只看体积。","kids":[],"w":"这是端侧「塞不塞得下」的第一扳手：位宽定了，后面的 scale、校准、性能账才有意义。","b":""},{"id":"c11-12-6","t":"11.12.6 · [ ] LoRA：常驻套数 + 前缀缓存键含 lo…","d":"[ ] LoRA：常驻套数 + 前缀缓存键含 lo…：[ ] LoRA：常驻套数 + 前缀缓存键含 lora_id","kids":[],"w":"弄清「[ ] LoRA：常驻套数 + 前缀缓存键含 lo…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-12-7","t":"11.12.7 · [ ] VLM：max visual tokens…","d":"[ ] VLM：max visual tokens…：[ ] VLM：max visual tokens + OCR 差异化量化","kids":[],"w":"弄清「[ ] VLM：max visual tokens…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-12-8","t":"11.12.8 · [ ] 采样：量化后重标定；规则+小分类器兜底","d":"用一小撮代表数据估激活分布，从而定 scale/阈值。校准集不代表线上分布，后面再精的 PTQ 也救不回来。","kids":[],"w":"PTQ 成败大半看校准：集子要覆盖主路径场景，别用「随手抽的几张图」糊弄。","b":""},{"id":"c11-12-9","t":"11.12.9 · [ ] 内存：分项公式 + 20% 余量 + 真机…","d":"[ ] 内存：分项公式 + 20% 余量 + 真机…：[ ] 内存：分项公式 + 20% 余量 + 真机 profile","kids":[],"w":"弄清「[ ] 内存：分项公式 + 20% 余量 + 真机…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-12-10","t":"11.12.10 · [ ] 路径：QNN / ExecuTorch /…","d":"高通侧把模型搬到 Hexagon/NPU 的工具与运行时一环。手机/车机 Qualcomm 方案会反复遇到。","kids":[],"w":"高通板上「能转不能跑」多半卡在 DSP/NPU 算子覆盖与上下文配置。","b":""}],"w":"给「LLM / VLM 补全（2024–2026）」一个可讲可练的切口，让下面的知识点有归属。","b":"路径对比有结论，才收成工程检查清单。清单后面才定义 TTFT/TPOT；没有检查项，指标再完整也挂不进门禁。"},{"id":"c11-13","t":"11.13 · LLM 端到端指标（TTFT / TPOT）","d":"从发请求到第一个可用 token 出现的等待。端侧体感里它和 Prefill、视觉编码强绑定，常是验收硬指标。","kids":[{"id":"c11-13-1","t":"11.13.1 · 原则","d":"原则：落在「LLM 端到端指标（TTFT / TPOT）」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「原则」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-13-2","t":"11.13.2 · 时钟从 **请求进入推理热路径** 起，到 **首…","d":"时钟从 **请求进入推理热路径** 起，到 **首…：时钟从 请求进入推理热路径 起，到 首个可展示 token 止 = TTFT；相邻 token 间隔 = ITL / TPOT","kids":[],"w":"弄清「时钟从 **请求进入推理热路径** 起，到 **首…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-13-3","t":"11.13.3 · 端到端必须含：分词、采样、detokenize、上…","d":"端到端必须含：分词、采样、detokenize、上…：端到端必须含：分词、采样、detokenize、上屏。预处理/后处理不进尺子 → 板上绿、产品骂","kids":[],"w":"弄清「端到端必须含：分词、采样、detokenize、上…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-13-4","t":"11.13.4 · 端侧默认 **并发=1**。云侧「加大 batch…","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。（补充：端侧默认 并发=1。云侧「加大 batch 换吞吐」在座舱常是反模式：P50 绿，P99 与壳温一起爆。）","kids":[],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":""},{"id":"c11-13-5","t":"11.13.5 · P50 看体验中枢，P95/P99 看拒收 。稳态…","d":"P50 看体验中枢，P95/P99 看拒收 。稳态…：P50 看体验中枢，P95/P99 看拒收 。稳态 tokens/s 只在功耗墙/温区内测，空调房峰值不当门禁","kids":[],"w":"弄清「P50 看体验中枢，P95/P99 看拒收 。稳态…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-13-6","t":"11.13.6 · `TTFT ≈ T_tokenize + T_pr…","d":"从发请求到第一个可用 token 出现的等待。端侧体感里它和 Prefill、视觉编码强绑定，常是验收硬指标。","kids":[],"w":"产品说「慢」，先拆成 TTFT 还是 Decode；两者治法完全不同。","b":""},{"id":"c11-13-7","t":"11.13.7 · `TPOT ≈ median(ITL)`；`tok…","d":"`TPOT ≈ median(ITL)`；`tok…：TPOT ≈ median(ITL)；tokens/s ≈ 1 / mean(ITL)（须声明是否含首 token）","kids":[],"w":"弄清「`TPOT ≈ median(ITL)`；`tok…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-13-8","t":"11.13.8 · 报表必注：`prompt_tokens`、`gen…","d":"报表必注：`prompt_tokens`、`gen…：报表必注：prompt_tokens、gen_tokens、S_max、量化档、壳温、热/冷启动","kids":[],"w":"弄清「报表必注：`prompt_tokens`、`gen…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-13-9","t":"11.13.9 · 检查清单 / 口径表","d":"检查清单 / 口径表：落在「LLM 端到端指标（TTFT / TPOT）」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「检查清单 / 口径表」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-13-10","t":"11.13.10 · [ ] Prompt 集冻结：短/中/长三档，**…","d":"[ ] Prompt 集冻结：短/中/长三档，**…：[ ] Prompt 集冻结：短/中/长三档，token 数写入报告（勿用「一句话」）","kids":[],"w":"弄清「[ ] Prompt 集冻结：短/中/长三档，**…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-13-11","t":"11.13.11 · [ ] 热启动与冷启动分开报；量产 SLO 通常盯…","d":"[ ] 热启动与冷启动分开报；量产 SLO 通常盯…：[ ] 热启动与冷启动分开报；量产 SLO 通常盯热路径","kids":[],"w":"弄清「[ ] 热启动与冷启动分开报；量产 SLO 通常盯…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-13-12","t":"11.13.12 · [ ] VLM：视觉 token 计入 promp…","d":"[ ] VLM：视觉 token 计入 promp…：[ ] VLM：视觉 token 计入 prompt 长度；OCR 图另列","kids":[],"w":"弄清「[ ] VLM：视觉 token 计入 promp…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-13-13","t":"11.13.13 · [ ] RAG：检索延迟进 TTFT 预算（**⑬…","d":"从发请求到第一个可用 token 出现的等待。端侧体感里它和 Prefill、视觉编码强绑定，常是验收硬指标。（补充：[ ] RAG：检索延迟进 TTFT 预算（⑬-5 / ⑬-19），或明确「生成段另计」。）","kids":[],"w":"产品说「慢」，先拆成 TTFT 还是 Decode；两者治法完全不同。","b":""},{"id":"c11-13-14","t":"11.13.14 · [ ] 与学习地图⑤同一纪律：尺子含前后处理，否则…","d":"[ ] 与学习地图⑤同一纪律：尺子含前后处理，否则…：[ ] 与学习地图⑤同一纪律：尺子含前后处理，否则不算交账","kids":[],"w":"弄清「[ ] 与学习地图⑤同一纪律：尺子含前后处理，否则…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-13-15","t":"11.13.15 · 常见翻车点","d":"常见翻车点：落在「LLM 端到端指标（TTFT / TPOT）」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「常见翻车点」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-13-16","t":"11.13.16 · 停表点漂移","d":"停表点漂移：有的栈停在「首 logit」，有的停在「首 UTF-8 字」；中文一字多 token，体感差一截","kids":[],"w":"弄清「停表点漂移」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-13-17","t":"11.13.17 · Prompt 长度没钉死","d":"Prompt 长度没钉死：演示数十 token 全绿，车上 system+工具前缀数百 token，TTFT 变差属预期","kids":[],"w":"弄清「Prompt 长度没钉死」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-13-18","t":"11.13.18 · Decode 报吞吐、用户骂首包","d":"一个接一个吐 token 的阶段，每步主要吃 KV 与带宽。体感「生成慢不慢」常栽在这里。","kids":[],"w":"交互跟手度看 Decode；带宽和 KV 布局比盲目加核数更管用。","b":""}],"w":"产品说「慢」，先拆成 TTFT 还是 Decode；两者治法完全不同。","b":"算子级认知之后，把体感收成 TTFT/TPOT/吞吐。指标权衡清楚，调参才有基线；没定义就改引擎，绿数字对不上产品。"},{"id":"c11-14","t":"11.14 · Prefill / Decode 分层 Profil…","d":"提示词整段一次性进模型、算出首段表示并填满 KV 的阶段。往往决定首字等多久出来，算力更密。","kids":[{"id":"c11-14-1","t":"11.14.1 · 原则","d":"原则：落在「Prefill / Decode 分层 Profil…」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「原则」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-14-2","t":"11.14.2 · Prefill","d":"提示词整段一次性进模型、算出首段表示并填满 KV 的阶段。往往决定首字等多久出来，算力更密。（补充：整段 prompt 一次（或 chunked）前向 → 更像 算力墙，决定 TTFT。）","kids":[],"w":"TTFT 差，先看 Prefill：序列长、视觉编码、是否多余重算。","b":""},{"id":"c11-14-3","t":"11.14.3 · Decode","d":"一个接一个吐 token 的阶段，每步主要吃 KV 与带宽。体感「生成慢不慢」常栽在这里。（补充：每步扫权重 + 读写 KV → 更像 带宽墙，决定 TPOT。）","kids":[],"w":"交互跟手度看 Decode；带宽和 KV 布局比盲目加核数更管用。","b":""},{"id":"c11-14-4","t":"11.14.4 · 顺序与学习地图⑤同一棵树：**稳态基线 → 阶段耗…","d":"顺序与学习地图⑤同一棵树：**稳态基线 → 阶段耗…：顺序与学习地图⑤同一棵树：稳态基线 → 阶段耗时 → 算子 Top-K → 访存/带宽 → 利用率/降频","kids":[],"w":"弄清「顺序与学习地图⑤同一棵树：**稳态基线 → 阶段耗…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-14-5","t":"11.14.5 · 端侧并发=1 时，不必先上 Continuous …","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。（补充：端侧并发=1 时，不必先上 Continuous Batching；先问慢在算满还是搬满。）","kids":[],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":""},{"id":"c11-14-6","t":"11.14.6 · 检查清单 / 分层表","d":"检查清单 / 分层表：落在「Prefill / Decode 分层 Profil…」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「检查清单 / 分层表」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-14-7","t":"11.14.7 · [ ] Profiling 开关本身有扰动：对比「…","d":"[ ] Profiling 开关本身有扰动：对比「…：[ ] Profiling 开关本身有扰动：对比「关采集」的 TTFT/TPOT","kids":[],"w":"弄清「[ ] Profiling 开关本身有扰动：对比「…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-14-8","t":"11.14.8 · [ ] Chunked Prefill：峰值内存降…","d":"提示词整段一次性进模型、算出首段表示并填满 KV 的阶段。往往决定首字等多久出来，算力更密。","kids":[],"w":"TTFT 差，先看 Prefill：序列长、视觉编码、是否多余重算。","b":""},{"id":"c11-14-9","t":"11.14.9 · [ ] Prefix Cache：命中 / 未命中…","d":"[ ] Prefix Cache：命中 / 未命中…：[ ] Prefix Ca :""},{"id":"c11-17-15","t":"11.17.15 · 常见翻车点","d":"常见翻车点：落在「端云切分 · OTA 整包 · 车规温区对 deco…」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「常见翻车点」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-17-16","t":"11.17.16 · 全端或全云","d":"全端或全云：无网死寂，或事事上云把 TTFT 打穿","kids":[],"w":"弄清「全端或全云」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-17-17","t":"11.17.17 · OTA 只推权重","d":"量产前「不过就不许上车」的检查：精度、性能、指纹、安全等要一起过。演示绿不等于门禁绿。（补充：tokenizer / 模板留旧版 → 第 0 站失配，像「量化坏了」。）","kids":[],"w":"交付周看门禁矩阵，不看单机 demo；少一项都会在 OTA/回滚里爆。","b":""},{"id":"c11-17-18","t":"11.17.18 · 引擎 so 与模型解耦失败","d":"引擎 so 与模型解耦失败：列车版本混用（细节 ⑭）；表现常是随机崩溃，不像精度问题","kids":[],"w":"弄清「引擎 so 与模型解耦失败」，排障和选型时才知道该动哪一环。","b":""}],"w":"交付周看门禁矩阵，不看单机 demo；少一项都会在 OTA/回滚里爆。","b":"门禁矩阵有了，才叠加车规、OTA 整包与合规。发布总清单是把这些检查收成一张表，值班 SOP 再裁成能执行的最短路径。"},{"id":"c11-18","t":"11.18 · 长上下文 · RoPE 外推 · 滑动窗口","d":"主文档 ⑨ 已写 RoPE 原理。本节只谈端侧会炸的工程点。学习地图 ⑥：Prefill 偏算力墙，Decode 偏带宽墙——超长 prompt 先砍峰值与常驻，再谈「支持 128K」","kids":[{"id":"c11-18-1","t":"11.18.1 · 先分清三件事","d":"先分清三件事：落在「长上下文 · RoPE 外推 · 滑动窗口」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「先分清三件事」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-18-2","t":"11.18.2 · 位置外推","d":"位置外推：训练长度 \\(S_{\\mathrm{train}}\\) 不够用，推理想到 \\(S_{\\mathrm{infer}}\\)","kids":[],"w":"弄清「位置外推」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-18-3","t":"11.18.3 · 滑动窗口","d":"滑动窗口：注意力只看最近 \\(W\\) token，KV 常驻可封顶在 \\(W\\)","kids":[],"w":"弄清「滑动窗口」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-18-4","t":"11.18.4 · KV 预算","d":"KV 预算：公式见 ⑬-9；GQA 用 num_kv_heads，不是 Q 头（⑬-0）","kids":[],"w":"弄清「KV 预算」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-18-5","t":"11.18.5 · RoPE 外推（NTK / YaRN）","d":"RoPE 外推（NTK / YaRN）：落在「长上下文 · RoPE 外推 · 滑动窗口」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「RoPE 外推（NTK / YaRN）」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-18-6","t":"11.18.6 · NTK-aware","d":"NTK-aware：落在「长上下文 · RoPE 外推 · 滑动窗口」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「NTK-aware」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-18-7","t":"11.18.7 · YaRN","d":"YaRN：分段插值 + 外推，常再乘注意力温度；编译图多一次 Mul，可能打掉 RoPE fusion（⑯ 同类坑）","kids":[],"w":"弄清「YaRN」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-18-8","t":"11.18.8 · 线性插值","d":"线性插值：简单，长距相对位置更糊，只作对照基线","kids":[],"w":"弄清「线性插值」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-18-9","t":"11.18.9 · `rope_theta`、`rope_scalin…","d":"`rope_theta`、`rope_scalin…：rope_theta、rope_scaling 类型与因子进 manifest，与权重、chat template 同版本发布（⑪ 指纹 / ⑮ OTA 整组）","kids":[],"w":"弄清「`rope_theta`、`rope_scalin…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-18-10","t":"11.18.10 · 无对应 kernel 时外推只是「能生成」，Dec…","d":"无对应 kernel 时外推只是「能生成」，Dec…：无对应 kernel 时外推只是「能生成」，Decode 仍按 ⑬-9 扫 KV；宣称上下文 ≠ 板上可驻上下文","kids":[],"w":"弄清「无对应 kernel 时外推只是「能生成」，Dec…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-18-11","t":"11.18.11 · `position_ids` 必须与 **已写入 …","d":"`position_ids` 必须与 **已写入 …：position_ids 必须与 已写入 KV 的长度 一致；滑窗丢块后仍用绝对 pos，错位会重复/乱码，常被误判为量化坏了（对照 ⑬-4 / ⑬-14）","kids":[],"w":"弄清「`position_ids` 必须与 **已写入 …」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-18-12","t":"11.18.12 · 只对 \\([t-W,t]\\) 做注意力；旧 KV …","d":"按相关度决定每个位置「看」哪些位置的信息。Transformer 里算力与访存大头之一，后面的融合、KV、量化都围着它转。（补充：只对 \\([t-W,t]\\) 做注意力；旧 KV block 可释放。与 ⑬-3 chunked prefill 正交：。）","kids":[],"w":"性能热点图若扎在 Attention，下一步才是融合、量化或改 GQA/MQA。","b":""},{"id":"c11-18-13","t":"11.18.13 · 因果 mask 与 sliding mask **…","d":"因果 mask 与 sliding mask **…：因果 mask 与 sliding mask 模板只认一种；混用即静默错答","kids":[],"w":"弄清「因果 mask 与 sliding mask **…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-18-14","t":"11.18.14 · 长文档场景：滑窗 + 摘要/RAG（⑬-19）往往…","d":"长文档场景：滑窗 + 摘要/RAG（⑬-19）往往…：长文档场景：滑窗 + 摘要/RAG（⑬-19）往往比硬外推更可交板","kids":[],"w":"弄清「长文档场景：滑窗 + 摘要/RAG（⑬-19）往往…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-18-15","t":"11.18.15 · 速查","d":"速查：落在「长上下文 · RoPE 外推 · 滑动窗口」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「速查」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-18-16","t":"11.18.16 · 先算 `KV(S_max)` 与温控 Decode…","d":"一个接一个吐 token 的阶段，每步主要吃 KV 与带宽。体感「生成慢不慢」常栽在这里。（补充：先算 KV(S_max) 与温控 Decode，再开外推。）","kids":[],"w":"交互跟手度看 Decode；带宽和 KV 布局比盲目加核数更管用。","b":""},{"id":"c11-18-17","t":"11.18.17 · 回归集必须含：短上下文、\\(S_{\\mathrm{…","d":"回归集必须含：短上下文、\\(S_{\\mathrm{…：回归集必须含：短上下文、\\(S_{\\mathrm{train}}\\) 边界、\\(S_{\\max}\\) 三条；只绿短 prompt 是假绿（接 ⑬-22）","kids":[],"w":"弄清「回归集必须含：短上下文、\\(S_{\\mathrm{…」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「长上下文 · RoPE 外推 · 滑动窗口」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"OTA 与温区约束之后，长上下文不能无限堆 KV。RoPE 外推和滑动窗口是省缓存的算法，工具调用要在窗口内仍找得到参数。"},{"id":"c11-19","t":"11.19 · 工具调用 / Function Calling 工程链","d":"相对 ⑬-4（模板 / stop）、⑬-3（约束解码）、⑬-8（白名单）：收成一条可交付链，而不是「模型会吐 JSON」","kids":[{"id":"c11-19-1","t":"11.19.1 · 六站（端侧默认串行）","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。","kids":[],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":""},{"id":"c11-19-2","t":"11.19.2 · 与推理算法的冲突","d":"与推理算法的冲突：落在「工具调用 / Function Calling 工程链」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「与推理算法的冲突」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-19-3","t":"11.19.3 · 约束解码每步掩码 logits，CPU 开销上升；…","d":"约束解码每步掩码 logits，CPU 开销上升；…：约束解码每步掩码 logits，CPU 开销上升；与投机采样叠加时草稿易违规——端侧先关投机，再保 JSON 合法率","kids":[],"w":"弄清「约束解码每步掩码 logits，CPU 开销上升；…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-19-4","t":"11.19.4 · stop 只停 EOS、不停工具结束符 → 多说话…","d":"stop 只停 EOS、不停工具结束符 → 多说话…：stop 只停 EOS、不停工具结束符 → 多说话或截断参数（⑬-4）","kids":[],"w":"弄清「stop 只停 EOS、不停工具结束符 → 多说话…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-19-5","t":"11.19.5 · 量化后 logits 变钝（⑬-8）：同样温度更易…","d":"量化后 logits 变钝（⑬-8）：同样温度更易…：量化后 logits 变钝（⑬-8）：同样温度更易出坏 JSON；工具路径 greedy 或低温，温度在任务集上重标定","kids":[],"w":"弄清「量化后 logits 变钝（⑬-8）：同样温度更易…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-19-6","t":"11.19.6 · 验收（不要用闲聊 PPL）","d":"验收（不要用闲聊 PPL）：落在「工具调用 / Function Calling 工程链」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「验收（不要用闲聊 PPL）」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-19-7","t":"11.19.7 · JSON 合法率、必填字段命中、禁工具调用率、端到…","d":"JSON 合法率、必填字段命中、禁工具调用率、端到…：JSON 合法率、必填字段命中、禁工具调用率、端到端「选对工具」","kids":[],"w":"弄清「JSON 合法率、必填字段命中、禁工具调用率、端到…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-19-8","t":"11.19.8 · Schema 版本与权重绑同一 digest（⑪）…","d":"Schema 版本与权重绑同一 digest（⑪）…：Schema 版本与权重绑同一 digest（⑪）；OTA 禁止「只更工具描述、不更模板」","kids":[],"w":"弄清「Schema 版本与权重绑同一 digest（⑪）…」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「工具调用 / Function Calling 工程链」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"上下文策略定了，工具调用要把参数从生成里稳稳拆出。调用链通了，RAG 切块才有工具结果可拼，否则检索和函数各说各话。"},{"id":"c11-20","t":"11.20 · RAG 切块 · 混合检索 · 端侧评测","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。","kids":[{"id":"c11-20-1","t":"11.20.1 · 相对 ⑬-5 的深化","d":"相对 ⑬-5 的深化：⑬-5 管 embedding 位宽、sqlite-vec 规模、rerank 去留。本节补 切块策略、词法+向量混合、评测协议","kids":[],"w":"弄清「相对 ⑬-5 的深化」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-20-2","t":"11.20.2 · 切块","d":"切块：落在「RAG 切块 · 混合检索 · 端侧评测」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「切块」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-20-3","t":"11.20.3 · 按标题 / 句界 / 空行切；代码与表格禁止固定字…","d":"按标题 / 句界 / 空行切；代码与表格禁止固定字…：按标题 / 句界 / 空行切；代码与表格禁止固定字符硬切","kids":[],"w":"弄清「按标题 / 句界 / 空行切；代码与表格禁止固定字…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-20-4","t":"11.20.4 · `chunk_size` 与 `overlap` …","d":"`chunk_size` 与 `overlap` …：chunk_size 与 overlap 直接决定注入 token 数 → Prefill 与 KV(S)（⑬-9）","kids":[],"w":"弄清「`chunk_size` 与 `overlap` …」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-20-5","t":"11.20.5 · 父子块","d":"父子块：检索用短 chunk，注入 LLM 用父块，省 Decode 上下文","kids":[],"w":"弄清「父子块」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-20-6","t":"11.20.6 · 端侧语料常万～十万级：向量 **预计算落盘**；查…","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。（补充：端侧语料常万～十万级：向量 预计算落盘；查询延迟计入 TTFT（⑬-12）。）","kids":[],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":""},{"id":"c11-20-7","t":"11.20.7 · 混合检索","d":"混合检索：落在「RAG 切块 · 混合检索 · 端侧评测」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「混合检索」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-20-8","t":"11.20.8 · 词法（SQLite FTS / BM25）抓专有名…","d":"词法（SQLite FTS / BM25）抓专有名…：词法（SQLite FTS / BM25）抓专有名词、零件号；向量抓同义改写","kids":[],"w":"弄清「词法（SQLite FTS / BM25）抓专有名…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-20-9","t":"11.20.9 · 融合优先 **RRF**，少上重型交叉编码器——车…","d":"把相邻小算子并成一次 kernel，少写中间结果、少启动开销。编译器/引擎优化的常规招。","kids":[],"w":"Profiling 见一串碎算子，优先问能不能融合，再谈换精度。","b":""},{"id":"c11-20-10","t":"11.20.10 · 元数据先过滤 （车型 / 地区 / 权限）再 AN…","d":"元数据先过滤 （车型 / 地区 / 权限）再 AN…：元数据先过滤 （车型 / 地区 / 权限）再 ANN，减少无效召回，也减少越权注入（⑮）","kids":[],"w":"弄清「元数据先过滤 （车型 / 地区 / 权限）再 AN…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-20-11","t":"11.20.11 · 端侧评测（任务级）","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。","kids":[],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":""}],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":"工具调用链通了，RAG 才谈切块、混合检索和端上评测。检索质量没有端侧尺子，VLM 时序再接也是带错上下文。"},{"id":"c11-21","t":"11.21 · VLM 串联时序与异构流水线","d":"相机/解码 → 缩放对齐 → ViT 一次前向 → projector → 视觉 token 拼进 prompt → LLM Prefill → Decode","kids":[{"id":"c11-21-1","t":"11.21.1 · 相对 ⑬-7 的深化","d":"相对 ⑬-7 的深化：⑬-7 管 visual token 压缩、动态分辨率、视频帧、OCR 混精。本节管 端到端时序与 CPU/NPU 流水（对齐学习地图 ② 异构 + ⑥ VLM）","kids":[],"w":"弄清「相对 ⑬-7 的深化」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-21-2","t":"11.21.2 · ️ 串联时序（并发=1）","d":"️ 串联时序（并发=1）：落在「VLM 串联时序与异构流水线」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「️ 串联时序（并发=1）」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-21-3","t":"11.21.3 · \\(\\mathrm{TTFT} \\approx T…","d":"从发请求到第一个可用 token 出现的等待。端侧体感里它和 Prefill、视觉编码强绑定，常是验收硬指标。","kids":[],"w":"产品说「慢」，先拆成 TTFT 还是 Decode；两者治法完全不同。","b":""},{"id":"c11-21-4","t":"11.21.4 · 图像占位 token 数 **必须等于** 视觉塔…","d":"图像占位 token 数 **必须等于** 视觉塔…：图像占位 token 数 必须等于 视觉塔输出个数（⑬-4）；错位会「杯子变碗」，不一定是量化","kids":[],"w":"弄清「图像占位 token 数 **必须等于** 视觉塔…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-21-5","t":"11.21.5 · 视觉 token 计入 \\(S\\)，KV 公式与文…","d":"视觉 token 计入 \\(S\\)，KV 公式与文…：视觉 token 计入 \\(S\\)，KV 公式与文本相同（⑬-9）","kids":[],"w":"弄清「视觉 token 计入 \\(S\\)，KV 公式与文…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-21-6","t":"11.21.6 · 异构流水","d":"异构流水：落在「VLM 串联时序与异构流水线」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「异构流水」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-21-7","t":"11.21.7 · 预处理：CPU / DVPP / HTP 矢量；V…","d":"预处理：CPU / DVPP / HTP 矢量；V…：预处理：CPU / DVPP / HTP 矢量；ViT：NPU INT8；语言塔：W4A16 / HTP GEMM（⑭ Genie 多 binary 常见）","kids":[],"w":"弄清「预处理：CPU / DVPP / HTP 矢量；V…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-21-8","t":"11.21.8 · 分阶段加载","d":"分阶段加载：ViT 激活峰与 LLM 峰值不要叠在同一帧（⑬-9）；共板峰值按加和验收（⑬-15）","kids":[],"w":"弄清「分阶段加载」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-21-9","t":"11.21.9 · 可重叠：下一帧 resize 与当前 Decode…","d":"一个接一个吐 token 的阶段，每步主要吃 KV 与带宽。体感「生成慢不慢」常栽在这里。（补充：可重叠：下一帧 resize 与当前 Decode 并行；profiler 看的是端到端，不是单算子绿（⑬-13）。）","kids":[],"w":"交互跟手度看 Decode；带宽和 KV 布局比盲目加核数更管用。","b":""},{"id":"c11-21-10","t":"11.21.10 · 与 ⑬-7 的衔接（策略落点）","d":"与 ⑬-7 的衔接（策略落点）：落在「VLM 串联时序与异构流水线」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「与 ⑬-7 的衔接（策略落点）」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-21-11","t":"11.21.11 · 动态分辨率：钉 `最长边 / max_tiles …","d":"动态分辨率：钉 `最长边 / max_tiles …：动态分辨率：钉 最长边 / max_tiles / max_visual_tokens；编译 固定上限 shape + 运行时有效长度（⑭ 动态轴敏感）","kids":[],"w":"弄清「动态分辨率：钉 `最长边 / max_tiles …」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-21-12","t":"11.21.12 · 视频：帧数 × 每帧 token ≈ 线性涨 KV…","d":"视频：帧数 × 每帧 token ≈ 线性涨 KV…：视频：帧数 × 每帧 token ≈ 线性涨 KV；实时助手用短窗关键帧，满帧进 LLM 必顶内存","kids":[],"w":"弄清「视频：帧数 × 每帧 token ≈ 线性涨 KV…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-21-13","t":"11.21.13 · OCR：视觉塔 / 连接器偏 INT8，语言塔 W…","d":"OCR：视觉塔 / 连接器偏 INT8，语言塔 W…：OCR：视觉塔 / 连接器偏 INT8，语言塔 W4A16；回归集必须含小字 / 倾斜 / 表格","kids":[],"w":"弄清「OCR：视觉塔 / 连接器偏 INT8，语言塔 W…」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「VLM 串联时序与异构流水线」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"RAG 评测有了，VLM 还要把视觉编码和语言 Decode 串成异构流水。时序清了，KV 量化与前缀缓存才知道该切哪一段。"},{"id":"c11-22","t":"11.22 · KV 量化与 Paged / Prefix 组合","d":"权重量化（③ / ⑬-2）与 KV 量化 正交：单独开关、单独回归（主文档⑧ 常默认不量化 KV）","kids":[{"id":"c11-22-1","t":"11.22.1 · 再写一遍口径","d":"再写一遍口径：落在「KV 量化与 Paged / Prefix 组合」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「再写一遍口径」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-22-2","t":"11.22.2 · 三件套怎么叠","d":"三件套怎么叠：落在「KV 量化与 Paged / Prefix 组合」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「三件套怎么叠」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-22-3","t":"11.22.3 · 速查","d":"速查：落在「KV 量化与 Paged / Prefix 组合」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「速查」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-22-4","t":"11.22.4 · 组合口诀：**GQA 瘦结构 → Paged 管碎…","d":"组合口诀：**GQA 瘦结构 → Paged 管碎…：组合口诀：GQA 瘦结构 → Paged 管碎片 → Prefix 摊 Prefill → KV 量化管常驻","kids":[],"w":"弄清「组合口诀：**GQA 瘦结构 → Paged 管碎…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-22-5","t":"11.22.5 · 必须测：\\(S_{\\max}\\) 满窗 + 前缀命…","d":"必须测：\\(S_{\\max}\\) 满窗 + 前缀命…：必须测：\\(S_{\\max}\\) 满窗 + 前缀命中 / 未命中；短上下文绿不够","kids":[],"w":"弄清「必须测：\\(S_{\\max}\\) 满窗 + 前缀命…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-22-6","t":"11.22.6 · 内存余量仍按 ⑬-9 ×0.8，并进 ⑮ 峰值门禁。","d":"量产前「不过就不许上车」的检查：精度、性能、指纹、安全等要一起过。演示绿不等于门禁绿。（补充：内存余量仍按 ⑬-9 ×0.8，并进 ⑮ 峰值门禁。）","kids":[],"w":"交付周看门禁矩阵，不看单机 demo；少一项都会在 OTA/回滚里爆。","b":""}],"w":"把「KV 量化与 Paged / Prefix 组合」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"VLM 时序清了，KV 才能量化、分页、做前缀复用。缓存组合选定，任务级量化验收和 CI 四站门禁才有内存基线。"},{"id":"c11-23","t":"11.23 · LLM 任务级量化验收与 CI 四站门禁","d":"量产前「不过就不许上车」的检查：精度、性能、指纹、安全等要一起过。演示绿不等于门禁绿。","kids":[{"id":"c11-23-1","t":"11.23.1 · LLM 版四站（对照学习地图 ⑦）","d":"LLM 版四站（对照学习地图 ⑦）：落在「LLM 任务级量化验收与 CI 四站门禁」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「LLM 版四站（对照学习地图 ⑦）」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-23-2","t":"11.23.2 · 与主文档 ⑮ 门禁对齐","d":"量产前「不过就不许上车」的检查：精度、性能、指纹、安全等要一起过。演示绿不等于门禁绿。","kids":[],"w":"交付周看门禁矩阵，不看单机 demo；少一项都会在 OTA/回滚里爆。","b":""},{"id":"c11-23-3","t":"11.23.3 · L0 冒烟出 token；L1 同机 logits…","d":"L0 冒烟出 token；L1 同机 logits…：L0 冒烟出 token；L1 同机 logits 余弦可严、跨平台必须放宽（bit-exact 几乎不可能）","kids":[],"w":"弄清「L0 冒烟出 token；L1 同机 logits…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-23-4","t":"11.23.4 · 硬门禁 = 任务指标 ；余弦只做软告警与归因。","d":"量产前「不过就不许上车」的检查：精度、性能、指纹、安全等要一起过。演示绿不等于门禁绿。（补充：硬门禁 = 任务指标 ；余弦只做软告警与归因。）","kids":[],"w":"交付周看门禁矩阵，不看单机 demo；少一项都会在 OTA/回滚里爆。","b":""},{"id":"c11-23-5","t":"11.23.5 · CI 采样：`temperature=0` / g…","d":"CI 采样：`temperature=0` / g…：CI 采样：temperature=0 / greedy；随机采样只做分布回归","kids":[],"w":"弄清「CI 采样：`temperature=0` / g…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-23-6","t":"11.23.6 · 掉点修复阶梯：校准 → 混精 / 敏感层回退 → …","d":"用一小撮代表数据估激活分布，从而定 scale/阈值。校准集不代表线上分布，后面再精的 PTQ 也救不回来。（补充：掉点修复阶梯：校准 → 混精 / 敏感层回退 → QAT → 改结构；工具/RAG 集要进校准分布。）","kids":[],"w":"PTQ 成败大半看校准：集子要覆盖主路径场景，别用「随手抽的几张图」糊弄。","b":""},{"id":"c11-23-7","t":"11.23.7 · 车规：门禁绿 ≠ ASIL 过；LLM 仍非功能安…","d":"量产前「不过就不许上车」的检查：精度、性能、指纹、安全等要一起过。演示绿不等于门禁绿。","kids":[],"w":"交付周看门禁矩阵，不看单机 demo；少一项都会在 OTA/回滚里爆。","b":""}],"w":"交付周看门禁矩阵，不看单机 demo；少一项都会在 OTA/回滚里爆。","b":"流水线能重复，才上门禁、车规、OTA 与验签。演示绿不等于放行绿；少一项都会在回滚里爆，这是交付收口。"},{"id":"c11-24","t":"11.24 · 2026 选型与趋势对照（补 ⑬-1）","d":"⑬-1 已给「内存墙 → 带宽墙 → 体验墙」与家族速览。本节补 具名族 + 可用性口诀 + 年份对照。下列名称会改版，立项必须核验版本日与模型卡（叙述基准日 2026-09-15）","kids":[{"id":"c11-24-1","t":"11.24.1 · 常见族（尺寸以卡片为准）","d":"常见族（尺寸以卡片为准）：落在「2026 选型与趋势对照（补 ⑬-1）」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「常见族（尺寸以卡片为准）」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-24-2","t":"11.24.2 · Qwen2.5 / Qwen3 小档：中文词表效率…","d":"Qwen2.5 / Qwen3 小档：中文词表效率…：Qwen2.5 / Qwen3 小档：中文词表效率高；钉思考/非思考模板（⑬-4）","kids":[],"w":"弄清「Qwen2.5 / Qwen3 小档：中文词表效率…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-24-3","t":"11.24.3 · Llama 3.2 1B/3B：端侧生态熟；许可证…","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。（补充：Llama 3.2 1B/3B：端侧生态熟；许可证单独过审。）","kids":[],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":""},{"id":"c11-24-4","t":"11.24.4 · Phi-3.5 / Phi-4-mini","d":"Phi-3.5 / Phi-4-mini：短上下文与工具调用密；长文/多语要实测","kids":[],"w":"弄清「Phi-3.5 / Phi-4-mini」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-24-5","t":"11.24.5 · Gemma 2/3 小档：近 Android 生态…","d":"Gemma 2/3 小档：近 Android 生态…：Gemma 2/3 小档：近 Android 生态；架构变更看代际","kids":[],"w":"弄清「Gemma 2/3 小档：近 Android 生态…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-24-6","t":"11.24.6 · MiniCPM 系、SmolLM2、OpenELM…","d":"MiniCPM 系、SmolLM2、OpenELM…：落在「2026 选型与趋势对照（补 ⑬-1）」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「MiniCPM 系、SmolLM2、OpenELM…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-24-7","t":"11.24.7 · DeepSeek-R1-Distill-Qwen …","d":"DeepSeek-R1-Distill-Qwen …：DeepSeek-R1-Distill-Qwen （1.5B/7B 等）：教师推理链会打穿 TTFT/KV；端侧默认关思考或限预算","kids":[],"w":"弄清「DeepSeek-R1-Distill-Qwen …」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-24-8","t":"11.24.8 · Llama / Phi 蒸馏线","d":"用大模型教小模型学分布或中间特征，换更小体积仍够用的效果。常与量化、剪枝搭着用。","kids":[],"w":"体积还差一截、精度又不能再砍时，蒸馏是「换结构」而不是「换比特」。","b":""},{"id":"c11-24-9","t":"11.24.9 · Qwen-VL 小档、InternVL2/2.5 …","d":"Qwen-VL 小档、InternVL2/2.5 …：Qwen-VL 小档、InternVL2/2.5 小档、MiniCPM-V、SmolVLM、Gemma 多模态小档、Moondream / FastVLM / PaliGemma 类","kids":[],"w":"弄清「Qwen-VL 小档、InternVL2/2.5 …」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-24-10","t":"11.24.10 · 11B 级视觉 Llama、大 MoE（总权重）不…","d":"11B 级视觉 Llama、大 MoE（总权重）不…：11B 级视觉 Llama、大 MoE（总权重）不当手机默认；MoE 看 常驻专家内存（⑬-1）","kids":[],"w":"弄清「11B 级视觉 Llama、大 MoE（总权重）不…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-24-11","t":"11.24.11 · 可用性口诀（评审可念）","d":"可用性口诀（评审可念）：落在「2026 选型与趋势对照（补 ⑬-1）」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「可用性口诀（评审可念）」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-24-12","t":"11.24.12 · 装","d":"装：\\(W+\\mathrm{KV}+Vision+Runtime \\le\\) 剩余 DRAM×0.8（⑬-9）","kids":[],"w":"弄清「装」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-24-13","t":"11.24.13 · 扫","d":"扫：Decode 每 token 扫权重；无 INT4/KV kernel 则假瘦（⑬-2 / ⑬-21）","kids":[],"w":"弄清「扫」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-24-14","t":"11.24.14 · 核","d":"核：⑭ 算子表有 Attention / RoPE / 采样，禁止静默 CPU 回落","kids":[],"w":"弄清「核」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-24-15","t":"11.24.15 · 模","d":"模：chat template + 工具 Schema + stop（⑬-4/⑬-18）","kids":[],"w":"弄清「模」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-24-16","t":"11.24.16 · 绿","d":"绿：⑬-22 任务四站，不是 PPL alone","kids":[],"w":"弄清「绿」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-24-17","t":"11.24.17 · 证","d":"证：许可证 + 验签 + OTA 整组（⑮）","kids":[],"w":"弄清「证」，排障和选型时才知道该动哪一环。","b":""},{"id":"c11-24-18","t":"11.24.18 · 趋势对照（方向，非 KPI）","d":"趋势对照（方向，非 KPI）：落在「2026 选型与趋势对照（补 ⑬-1）」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「趋势对照（方向，非 KPI）」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「2026 选型与趋势对照（补 ⑬-1）」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"任务级量化和门禁有了，才对照 2026 选型。趋势要能反推前面的内存、KV、精度约束，否则又是一张宣传表。"}],"w":"给学习路径一个章节锚点，排障时先回到这一章的目标。","b":"工具链之外，把近年模型、RAG、VLM、门禁补进端侧清单。补全是为了教材不停留在旧量化，Transformer 章再把算子讲透。"},{"id":"c12","t":"12 · Transformer/VLM · AI编译器","d":"Transformer 核心算子底层实现、VLM 视觉语言对齐、AI 编译器栈(LLVM/MLIR/TVM/图编译)","kids":[{"id":"c12-1","t":"12.1 · Transformer 编码器-解码器整体架构与核心算子","d":"堆叠自注意力 + 前馈块做序列建模的主干。端侧大模型几乎都绕不开它。","kids":[{"id":"c12-1-1","t":"12.1.1 · 架构组成","d":"架构组成：Encoder 输出上下文表示，Decoder 自回归生成，串接 Cross-Attention","kids":[],"w":"弄清「架构组成」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-1-2","t":"12.1.2 · Self-Attention","d":"按相关度决定每个位置「看」哪些位置的信息。Transformer 里算力与访存大头之一，后面的融合、KV、量化都围着它转。（补充：Attention(Q,K,V)=softmax(Q·K^T/√d_k)·V，除以 √d_k 防梯度消失。）","kids":[],"w":"性能热点图若扎在 Attention，下一步才是融合、量化或改 GQA/MQA。","b":""},{"id":"c12-1-3","t":"12.1.3 · 计算五步","d":"计算五步：线性投影 Q/K/V→Q·K 得分→√d_k 缩放→softmax→加权求和 V","kids":[],"w":"弄清「计算五步」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-1-4","t":"12.1.4 · Multi-Head","d":"Multi-Head：MultiHead(Q,K,V)=Concat(head_1..head_h)·W_O，多子空间增强表达","kids":[],"w":"弄清「Multi-Head」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-1-5","t":"12.1.5 · FFN","d":"FFN：FFN(x)=GELU(xW_1+b_1)·W_2+b_2，隐藏维为 mlp_ratio=4 倍","kids":[],"w":"弄清「FFN」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-1-6","t":"12.1.6 · PyTorch 实现","d":"PyTorch 实现：qkv=nn.Linear(d,d3) 一次投影，split 出 q/k/v，masked_fill 因果 mask","kids":[],"w":"弄清「PyTorch 实现」，排障和选型时才知道该动哪一环。","b":""}],"w":"后面量化、编译、KV、算子支持，默认都假设图是 Transformer 族。","b":"平台对照之前，先把 Transformer 编码器-解码器和核心算子立住。主干不清，Decoder-only 和 KV 变体都像名词卡片。"},{"id":"c12-2","t":"12.2 · Decoder-only 架构与因果注意力（Causal At…","d":"一个接一个吐 token 的阶段，每步主要吃 KV 与带宽。体感「生成慢不慢」常栽在这里。","kids":[{"id":"c12-2-1","t":"12.2.1 · 架构特点","d":"架构特点：GPT/LLaMA/Qwen 用 Decoder-only：RoPE、单向因果、Next Token Prediction","kids":[],"w":"弄清「架构特点」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-2-2","t":"12.2.2 · 因果 mask","d":"因果 mask：上三角 -inf 掩码，代码 torch.tril+masked_fill(float('-inf'))","kids":[],"w":"弄清「因果 mask」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-2-3","t":"12.2.3 · Pre-LayerNorm","d":"Pre-LayerNorm：归一化先于子层：x=x+Attention(LN1(x)); x=x+FFN(LN2(x))","kids":[],"w":"弄清「Pre-LayerNorm」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-2-4","t":"12.2.4 · 完整 Decoder","d":"一个接一个吐 token 的阶段，每步主要吃 KV 与带宽。体感「生成慢不慢」常栽在这里。（补充：embedding→n_layers Block→ln_f→lm_head，可权重绑定、std=0.02 初始化。）","kids":[],"w":"交互跟手度看 Decode；带宽和 KV 布局比盲目加核数更管用。","b":""},{"id":"c12-2-5","t":"12.2.5 · 自回归生成","d":"自回归生成：取最后位置 logits/temperature 后 torch.multinomial 采样拼接","kids":[],"w":"弄清「自回归生成」，排障和选型时才知道该动哪一环。","b":""}],"w":"交互跟手度看 Decode；带宽和 KV 布局比盲目加核数更管用。","b":"KV 布局之后要把生成拆成 Prefill 与 Decode。首字慢和跟手慢不是同一笔账；阶段认清，TTFT 指标才有意义。"},{"id":"c12-3","t":"12.3 · MHA / GQA / MQA 注意力变体与 KV Cache…","d":"生成时把已算过的 Key/Value 存起来复用，Decode 就不用整段重算 Attention。省算力，但占内存，长度一长就胀。","kids":[{"id":"c12-3-1","t":"12.3.1 · 三种变体","d":"三种变体：MHA 每头独立 K/V；GQA 组内共享 KV(LLaMA 2/3)；MQA 全部头共享一组 KV","kids":[],"w":"弄清「三种变体」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-3-2","t":"12.3.2 · KV Cache 复用","d":"生成时把已算过的 Key/Value 存起来复用，Decode 就不用整段重算 Attention。省算力，但占内存，长度一长就胀。","kids":[],"w":"端侧长对话的内存墙多半在这：优化吞吐前先算清 KV 占多少。","b":""},{"id":"c12-3-3","t":"12.3.3 · 显存公式","d":"显存公式：每 token=2×num_layers×num_heads×head_dim×dtype_size，例 LLaMA-7B 约 512KB/token","kids":[],"w":"弄清「显存公式」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-3-4","t":"12.3.4 · 优化方向","d":"优化方向：GQA/MQA 减 KV、INT8/INT4 量化 KV Cache、PageAttention 分页减少碎片","kids":[],"w":"弄清「优化方向」，排障和选型时才知道该动哪一环。","b":""}],"w":"端侧长对话的内存墙多半在这：优化吞吐前先算清 KV 占多少。","b":"图优化省的是计算，长对话吃的是 KV。缓存账管住了再抠 DDR 带宽；KV 没算清，Token 速度优化只是加核空转。"},{"id":"c12-4","t":"12.4 · RoPE 旋转位置编码与 RMSNorm 归一化","d":"主题「RoPE 旋转位置编码与 RMSNorm 归一化」管端侧链路里这一段，下含：q'_m=R_m·q_m、k'_n=R_n·k_n…、相对位置感知、超长外推、不影响向量范数、绝对位置编码、RMSNorm(x)=γ·x/RMS(x)，RMS…、端侧更偏好 RMSNorm，效果与 LayerNo…。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c12-4-1","t":"12.4.1 · q'_m=R_m·q_m、k'_n=R_n·k_n…","d":"q'_m=R_m·q_m、k'_n=R_n·k_n…：q'_m=R_m·q_m、k'_n=R_n·k_n，θ_i=base^(-2i/d)，base=10000","kids":[],"w":"弄清「q'_m=R_m·q_m、k'_n=R_n·k_n…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-4-2","t":"12.4.2 · 相对位置感知、超长外推、不影响向量范数","d":"相对位置感知、超长外推、不影响向量范数：相对位置感知、超长外推、不影响向量范数","kids":[],"w":"弄清「相对位置感知、超长外推、不影响向量范数」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-4-3","t":"12.4.3 · 绝对位置编码","d":"绝对位置编码：PE(pos,2i)=sin(pos/10000^(2i/d_model)) 余弦对，因 Self-Attention 置换不变","kids":[],"w":"弄清「绝对位置编码」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-4-4","t":"12.4.4 · RMSNorm(x)=γ·x/RMS(x)，RMS…","d":"RMSNorm(x)=γ·x/RMS(x)，RMS…：RMSNorm(x)=γ·x/RMS(x)，RMS(x)=√(mean(x²)+ε)，只除 RMS 不中心化","kids":[],"w":"弄清「RMSNorm(x)=γ·x/RMS(x)，RMS…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-4-5","t":"12.4.5 · 端侧更偏好 RMSNorm，效果与 LayerNo…","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。","kids":[],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":""}],"w":"给「Transformer/VLM · AI编译器」一个可讲可练的切口，让下面的知识点有归属。","b":"注意力变体决定 KV 形状，RoPE/RMSNorm 决定位置和数值稳不稳。这两处钉住，FFN 门控变体才好对算子。"},{"id":"c12-5","t":"12.5 · FFN 变体：SwiGLU 激活与门控线性单元","d":"主题「FFN 变体：SwiGLU 激活与门控线性单元」管端侧链路里这一段，下含：SwiGLU、三权重 W_gate/W_up/W_down，中间…、GELU 用于 ViT/标准 Transforme…、编译视角。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c12-5-1","t":"12.5.1 · SwiGLU","d":"SwiGLU：Swish(x·W_gate)·(x·W_up)·W_down，Swish(x)=x·sigmoid(x)","kids":[],"w":"弄清「SwiGLU」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-5-2","t":"12.5.2 · 三权重 W_gate/W_up/W_down，中间…","d":"三权重 W_gate/W_up/W_down，中间…：三权重 W_gate/W_up/W_down，中间维取标准 FFN 的 2/3、效果更好","kids":[],"w":"弄清「三权重 W_gate/W_up/W_down，中间…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-5-3","t":"12.5.3 · GELU 用于 ViT/标准 Transforme…","d":"GELU 用于 ViT/标准 Transforme…：GELU 用于 ViT/标准 Transformer，SwiGLU 属现代 LLM 主流","kids":[],"w":"弄清「GELU 用于 ViT/标准 Transforme…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-5-4","t":"12.5.4 · 编译视角","d":"编译视角：逐元素激活可与 Linear 算子融合(Fusion)减少中间回写","kids":[],"w":"弄清「编译视角」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「Transformer/VLM · AI编译器」一个可讲可练的切口，让下面的知识点有归属。","b":"位置编码稳定后，看 FFN/SwiGLU 吃掉的那截算力。前馈变体认清，VLM 视觉塔和交叉注意力才好接到同一套算子账。"},{"id":"c12-6","t":"12.6 · VLM 视觉语言模型：ViT 视觉编码器与交叉注意力对齐","d":"按相关度决定每个位置「看」哪些位置的信息。Transformer 里算力与访存大头之一，后面的融合、KV、量化都围着它转。","kids":[{"id":"c12-6-1","t":"12.6.1 · Patch Embedding 切 16×16 p…","d":"Patch Embedding 切 16×16 p…：Patch Embedding 切 16×16 patch + [CLS] token + 绝对位置编码 + Encoder Block","kids":[],"w":"弄清「Patch Embedding 切 16×16 p…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-6-2","t":"12.6.2 · 输出 [B,197,768]（224/16=14，…","d":"输出 [B,197,768]（224/16=14，…：输出 [B,197,768]（224/16=14，14²+1 个 CLS）","kids":[],"w":"弄清「输出 [B,197,768]（224/16=14，…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-6-3","t":"12.6.3 · 交叉注意力","d":"按相关度决定每个位置「看」哪些位置的信息。Transformer 里算力与访存大头之一，后面的融合、KV、量化都围着它转。","kids":[],"w":"性能热点图若扎在 Attention，下一步才是融合、量化或改 GQA/MQA。","b":""},{"id":"c12-6-4","t":"12.6.4 · 跨模态对齐","d":"跨模态对齐：ITC 对比学习拉近匹配对、ITM 二分类匹配、LM 以图像为条件生成","kids":[],"w":"弄清「跨模态对齐」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-6-5","t":"12.6.5 · 部署难点","d":"部署难点：patch token 长、cross-attention 二次复杂度，需处理变长与融合访存","kids":[],"w":"弄清「部署难点」，排障和选型时才知道该动哪一环。","b":""}],"w":"性能热点图若扎在 Attention，下一步才是融合、量化或改 GQA/MQA。","b":"平台对照之前，先把 Transformer 编码器-解码器和核心算子立住。主干不清，Decoder-only 和 KV 变体都像名词卡片。"},{"id":"c12-7","t":"12.7 · Swin-style 窗口注意力与 Patch/Mel 频谱前…","d":"按相关度决定每个位置「看」哪些位置的信息。Transformer 里算力与访存大头之一，后面的融合、KV、量化都围着它转。","kids":[{"id":"c12-7-1","t":"12.7.1 · WindowAttention","d":"按相关度决定每个位置「看」哪些位置的信息。Transformer 里算力与访存大头之一，后面的融合、KV、量化都围着它转。","kids":[],"w":"性能热点图若扎在 Attention，下一步才是融合、量化或改 GQA/MQA。","b":""},{"id":"c12-7-2","t":"12.7.2 · PatchEmbed","d":"PatchEmbed：nn.Conv2d 切 patch 映射高维，音频频谱图转 token[B,N,C]","kids":[],"w":"弄清「PatchEmbed」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-7-3","t":"12.7.3 · HTS-AT 链路","d":"HTS-AT 链路：音频→STFT→LogmelFilterBank→Mel 谱[B,1,T,Mel]→PatchEmbed","kids":[],"w":"弄清「HTS-AT 链路」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-7-4","t":"12.7.4 · Swin 五步","d":"Swin 五步：Cyclic Shift→Window Partition→Window Attention(attn_mask)→Reverse→残差 FFN","kids":[],"w":"弄清「Swin 五步」，排障和选型时才知道该动哪一环。","b":""}],"w":"性能热点图若扎在 Attention，下一步才是融合、量化或改 GQA/MQA。","b":"VLM 视觉塔之外，窗口注意力和 Patch/频谱前处理是另一路图。图类认清，编译器前端 IR 才知道要降低什么算子。"},{"id":"c12-8","t":"12.8 · AI 编译器栈：前端 IR / 中端优化 / 后端 Codeg…","d":"主题「AI 编译器栈：前端 IR / 中端优化 / 后端 Codeg…」管端侧链路里这一段，下含：三层流水线、IR 的意义、多层 IR、与工程对应。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c12-8-1","t":"12.8.1 · 三层流水线","d":"三层流水线：前端(AST)→中端(IR+优化 Pass)→后端(指令选择/寄存器分配/机器码)","kids":[],"w":"弄清「三层流水线」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-8-2","t":"12.8.2 · IR 的意义","d":"IR 的意义：前端先到 IR 再接多后端，N×M 组合变 N+M","kids":[],"w":"弄清「IR 的意义」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-8-3","t":"12.8.3 · 多层 IR","d":"多层 IR：TVM: Relay IR(图)→TIR(张量/循环)→目标代码(CUDA/LLVM IR/ARM)","kids":[],"w":"弄清「多层 IR」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-8-4","t":"12.8.4 · 与工程对应","d":"与工程对应：ONNX GraphProto 即框架无关 IR；ONNX 图优化=IR 上 Pass；TensorRT Engine=codegen 产物","kids":[],"w":"弄清「与工程对应」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「Transformer/VLM · AI编译器」一个可讲可练的切口，让下面的知识点有归属。","b":"模型算子齐了，才拆编译器前端 IR、中端优化、后端生成。栈分层清楚，LLVM/MLIR/TVM 才不是三个并列名词。"},{"id":"c12-9","t":"12.9 · LLVM IR、Pass 与后端 Codegen（指令选择/寄…","d":"主题「LLVM IR、Pass 与后端 Codegen（指令选择/寄…」管端侧链路里这一段，下含：LLVM 流程、IR 结构、Pass 本质、后端 Codegen、硬件知识。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c12-9-1","t":"12.9.1 · LLVM 流程","d":"LLVM 流程：Clang→LLVM IR→Pass 优化→Codegen(ARM/x86/NPU 机器码)","kids":[],"w":"弄清「LLVM 流程」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-9-2","t":"12.9.2 · IR 结构","d":"IR 结构：Module→Function→BasicBlock→Instruction；SSA 每变量只赋值一次、phi 节点汇合","kids":[],"w":"弄清「IR 结构」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-9-3","t":"12.9.3 · Pass 本质","d":"Pass 本质：IR 上『读入→改写→吐出』：常量折叠/死代码消除/算子融合(conv+bn)/量化(float→int8)","kids":[],"w":"弄清「Pass 本质」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-9-4","t":"12.9.4 · 后端 Codegen","d":"后端 Codegen：指令选择(SelectionDAG 选目标指令)→指令调度→寄存器分配(L0A/L0B/L0C)","kids":[],"w":"弄清「后端 Codegen」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-9-5","t":"12.9.5 · 硬件知识","d":"硬件知识：ISA、SIMD(ARM NEON/x86 AVX/NPU Vector)、内存层级 L1/L2/L3→DDR 差10倍+","kids":[],"w":"弄清「硬件知识」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「Transformer/VLM · AI编译器」一个可讲可练的切口，让下面的知识点有归属。","b":"模型算子齐了，才拆编译器前端 IR、中端优化、后端生成。栈分层清楚，LLVM/MLIR/TVM 才不是三个并列名词。"},{"id":"c12-10","t":"12.10 · MLIR 多层 IR 与 Dialect / Lowering…","d":"主题「MLIR 多层 IR 与 Dialect / Lowering…」管端侧链路里这一段，下含：多层 IR、Dialect、Lowering、Pattern Rewrite、quant dialect。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c12-10-1","t":"12.10.1 · 多层 IR","d":"多层 IR：Model IR→Tensor IR→Linalg IR→SCF IR→LLVM IR→机器码，信息逐层保留","kids":[],"w":"弄清「多层 IR」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-10-2","t":"12.10.2 · Dialect","d":"Dialect：前缀算子词表：linalg./scf./gpu./vector./arith./func.，编译即翻译 Dialect","kids":[],"w":"弄清「Dialect」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-10-3","t":"12.10.3 · Lowering","d":"Lowering：从高层抽象展开细节，例 conv2d 展开为三层 for 循环嵌套","kids":[],"w":"弄清「Lowering」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-10-4","t":"12.10.4 · Pattern Rewrite","d":"Pattern Rewrite：匹配 IR 模式→替换新模式的优化机制，Add 重结合等","kids":[],"w":"弄清「Pattern Rewrite」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-10-5","t":"12.10.5 · quant dialect","d":"quant dialect：IR 显式表达量化 bit/per-tensor/scale/zero_point，支持混合精度","kids":[],"w":"弄清「quant dialect」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「Transformer/VLM · AI编译器」一个可讲可练的切口，让下面的知识点有归属。","b":"LLVM 之上用 MLIR 多层方言降低。降低路径清了，TVM 的 TE/Schedule 才是「怎么切循环」，不是又一种 IR 口号。"},{"id":"c12-11","t":"12.11 · TVM 计算表达与 Schedule：TE/TIR、Tilin…","d":"主题「TVM 计算表达与 Schedule：TE/TIR、Tilin…」管端侧链路里这一段，下含：端到端链路、TE 表达、Schedule 原语、Tiling 原理、AutoTVM、昇腾类比。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c12-11-1","t":"12.11.1 · 端到端链路","d":"端到端链路：ONNX→Relay IR→TE/TIR→AutoTVM→LLVM/CUDA/NPU 代码生成","kids":[],"w":"弄清「端到端链路」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-11-2","t":"12.11.2 · TE 表达","d":"TE 表达：te.placeholder/te.reduce_axis/te.compute 描述计算；Schedule 描述循环策略","kids":[],"w":"弄清「TE 表达」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-11-3","t":"12.11.3 · Schedule 原语","d":"Schedule 原语：Tiling 分块、reorder 重排、vectorize 向量化、parallel 并行","kids":[],"w":"弄清「Schedule 原语」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-11-4","t":"12.11.4 · Tiling 原理","d":"Tiling 原理：L1 1ns/L2 4ns/主存 100ns，切 32×32 块塞进 L1 反复用","kids":[],"w":"弄清「Tiling 原理」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-11-5","t":"12.11.5 · AutoTVM","d":"AutoTVM：XGBTuner+XGBoost 搜索、tune(n_trial=100) 挑最快、apply_history_best 应用","kids":[],"w":"弄清「AutoTVM」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-11-6","t":"12.11.6 · 昇腾类比","d":"昇腾类比：AutoTVM≈tbe_tune_main 搜算子、Record≈知识库/hit_bank、relay.quantize≈DDK 量化","kids":[],"w":"弄清「昇腾类比」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-11-7","t":"12.11.7 · Roofline","d":"Roofline：计算密度(FLOP/Byte) 判瓶颈：左侧带宽受限、右侧算力受限","kids":[],"w":"弄清「Roofline」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「Transformer/VLM · AI编译器」一个可讲可练的切口，让下面的知识点有归属。","b":"方言能降低，TVM 才谈计算表达和 tiling。调度空间懂了，GPU Warp/共享内存和端侧 OMG/IREE 才能对上硬件。"},{"id":"c12-12","t":"12.12 · GPU 并行模型与异构计算：CUDA/Warp/Shared …","d":"主题「GPU 并行模型与异构计算：CUDA/Warp/Shared …」管端侧链路里这一段，下含：GPU 思维、CUDA 组织、关键概念、Triton、编译关联。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c12-12-1","t":"12.12.1 · GPU 思维","d":"GPU 思维：80+ SM、Warp=32 线程锁步、Shared Memory SM 内高速区、Global 共享仓库","kids":[],"w":"弄清「GPU 思维」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-12-2","t":"12.12.2 · CUDA 组织","d":"CUDA 组织：Grid/Block/Thread，i=blockIdx.xblockDim.x+threadIdx.x","kids":[],"w":"弄清「CUDA 组织」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-12-3","t":"12.12.3 · 关键概念","d":"关键概念：im2col 转矩阵乘、Bank Conflict、warp shuffle、Tensor Core 加速矩阵乘","kids":[],"w":"弄清「关键概念」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-12-4","t":"12.12.4 · Triton","d":"Triton：编译器友好 block-level 语言，@triton.jit、tl.load/tl.store，自动映射 warp/线程","kids":[],"w":"弄清「Triton」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-12-5","t":"12.12.5 · 编译关联","d":"编译关联：Flash Attention=Tiling 算法；Conv+BN+ReLU 融合=Pass 落地；vLLM kernel 与 CUDA 相关","kids":[],"w":"弄清「编译关联」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「Transformer/VLM · AI编译器」一个可讲可练的切口，让下面的知识点有归属。","b":"调度要落到 GPU 并行模型。Warp 和共享内存清楚，端侧图编译（XLA/昇腾 CANN/OMG、IREE）才知道能映射到什么核。"},{"id":"c12-13","t":"12.13 · 端侧图编译与算子编译：XLA/昇腾 CANN/OMG、IREE…","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。","kids":[{"id":"c12-13-1","t":"12.13.1 · 两大任务","d":"两大任务：图编译(图级 Pass)与算子编译(Tiling/向量化/指令选择)","kids":[],"w":"弄清「两大任务」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-13-2","t":"12.13.2 · 昇腾链路","d":"昇腾链路：ONNX→DDK 量化(dopt_so)→OMG→OMC；te_fusion 即 NPU 代码生成器","kids":[],"w":"弄清「昇腾链路」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-13-3","t":"12.13.3 · 实用技巧","d":"实用技巧：OMC 文件大小判断成功(20MB 正常 vs 37MB 异常)；tbe_tune_main 搜最优写 hit_bank","kids":[],"w":"弄清「实用技巧」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-13-4","t":"12.13.4 · IREE/RISCV","d":"IREE/RISCV：IREE 是 MLIR 编译器；Triton→IREE→RISCV 后端，定制写 HAL 驱动","kids":[],"w":"弄清「IREE/RISCV」，排障和选型时才知道该动哪一环。","b":""},{"id":"c12-13-5","t":"12.13.5 · 推理框架","d":"推理框架：llama.cpp(GGML q4_K_M)、vLLM(PagedAttention)、SGLang(prefix caching)、Continuous Batching","kids":[],"w":"弄清「推理框架」，排障和选型时才知道该动哪一环。","b":""}],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":"GPU 并行有概念了，才看端侧图编译和算子编译入口。各家 lowering 不同，平台工具链扩展章才能按厂商对照，而不是抄同一条命令。"}],"w":"给学习路径一个章节锚点，排障时先回到这一章的目标。","b":"补全章偏产品能力，这段把 Transformer/VLM 算子和编译器 IR 讲透。算子清了，平台工具链扩展才能按厂商对得上。"},{"id":"c13","t":"13 · 平台工具链扩展","d":"量产选型公式：芯片代际 × 模型类型(CV/ASR/LLM/VLM) × 约束(功耗/内存/时延/ASIL) → 引擎与产物 → 版本列车与指纹门禁","kids":[{"id":"c13-1","t":"13.1 · 高通：SNPE / QNN / QAIRT / Genie 与…","d":"高通侧把模型搬到 Hexagon/NPU 的工具与运行时一环。手机/车机 Qualcomm 方案会反复遇到。","kids":[{"id":"c13-1-1","t":"13.1.1 · SNPE （Snapdragon Neural P…","d":"高通侧把模型搬到 Hexagon/NPU 的工具与运行时一环。手机/车机 Qualcomm 方案会反复遇到。","kids":[],"w":"高通板上「能转不能跑」多半卡在 DSP/NPU 算子覆盖与上下文配置。","b":""},{"id":"c13-1-2","t":"13.1.2 · QNN / AI Engine Direct","d":"高通侧把模型搬到 Hexagon/NPU 的工具与运行时一环。手机/车机 Qualcomm 方案会反复遇到。","kids":[],"w":"高通板上「能转不能跑」多半卡在 DSP/NPU 算子覆盖与上下文配置。","b":""},{"id":"c13-1-3","t":"13.1.3 · QAIRT （Qualcomm AI Runtim…","d":"QAIRT （Qualcomm AI Runtim…：QAIRT （Qualcomm AI Runtime）：底层统一 Runtime；SNPE/QNN/Genie 最终都落到它；系统集成优先 QAIRT C API（ABI 稳定），应…","kids":[],"w":"弄清「QAIRT （Qualcomm AI Runtim…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-1-4","t":"13.1.4 · Genie / GenAI Inference E…","d":"Genie / GenAI Inference E…：在 QNN 之上做 LLM/VLM 自回归编排（Tokenizer、KV、采样、多 binary）；CLI 常见 genie-t2t-run","kids":[],"w":"弄清「Genie / GenAI Inference E…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-1-5","t":"13.1.5 · 选型口诀","d":"选型口诀：CV/检测快速出包 → SNPE+DLC；要抠算子落点与 HTP 缓存 → QNN+context；要跑生成式 → Genie；要写长期中间件 → QAIRT C","kids":[],"w":"弄清「选型口诀」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-1-6","t":"13.1.6 · Hexagon DSP","d":"高通侧把模型搬到 Hexagon/NPU 的工具与运行时一环。手机/车机 Qualcomm 方案会反复遇到。","kids":[],"w":"高通板上「能转不能跑」多半卡在 DSP/NPU 算子覆盖与上下文配置。","b":""},{"id":"c13-1-7","t":"13.1.7 · HTP （Hexagon Tensor Proce…","d":"高通侧把模型搬到 Hexagon/NPU 的工具与运行时一环。手机/车机 Qualcomm 方案会反复遇到。","kids":[],"w":"高通板上「能转不能跑」多半卡在 DSP/NPU 算子覆盖与上下文配置。","b":""},{"id":"c13-1-8","t":"13.1.8 · HMX","d":"HMX：Hexagon 内矩阵加速，偏 INT4/INT8 GEMM；不是第三个独立 SDK，由 HTP 路径调度","kids":[],"w":"弄清「HMX」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-1-9","t":"13.1.9 · HVX","d":"HVX：矢量扩展，偏逐元素/激活/布局变换；与 HMX 分工「矩阵 vs 矢量」","kids":[],"w":"弄清「HVX」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-1-10","t":"13.1.10 · 工程含义","d":"工程含义：宣传 TOPS 常含 HMX 峰值；若图大量落 CPU/GPU，实测只有纸面几分之一","kids":[],"w":"弄清「工程含义」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-1-11","t":"13.1.11 · 验证","d":"验证：qnn-profiler / 厂商 ADX 看逐算子 backend；目标是敏感大算子（Conv/GEMM/Attention 块）上 HTP","kids":[],"w":"弄清「验证」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-1-12","t":"13.1.12 · 坑","d":"坑：同一 SoC「系统设置开了 AI」≠ 你的 .so 链到了正确 libQnnHtp.so；App 打进了 stub 或旧版 so 会 silent 回落","kids":[],"w":"弄清「坑」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-1-13","t":"13.1.13 · 坑1 · 版本混用","d":"坑1 · 版本混用：DLC 与 QNN 跨小版本 → Load fail 或诡异数值","kids":[],"w":"弄清「坑1 · 版本混用」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-1-14","t":"13.1.14 · 坑2 · 未量化上 HTP","d":"坑2 · 未量化上 HTP：HTP 路径通常要量化图；FP 图硬推会失败或几乎全回落","kids":[],"w":"弄清「坑2 · 未量化上 HTP」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-1-15","t":"13.1.15 · 坑3 · 绑定","d":"坑3 · 绑定：context binary 换芯片代际、大改 DSP 固件、换 HTP 架构必须重建","kids":[],"w":"弄清「坑3 · 绑定」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-1-16","t":"13.1.16 · 坑4 · >2GB 大模型","d":"坑4 · >2GB 大模型：老 SNPE 单 DLC 限制与新 QAIRT 大模型路径不同；LLM 走 Genie 多 binary，勿假设单 DLC 塞 7B","kids":[],"w":"弄清「坑4 · >2GB 大模型」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-1-17","t":"13.1.17 · 量产目录建议","d":"量产目录建议：onnx/ 源、dlc/ 可选中间、ctx/ 发布 serialized、cfg/ Genie JSON、manifest.json 指纹","kids":[],"w":"弄清「量产目录建议」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-1-18","t":"13.1.18 · AIMET","d":"AIMET：PyTorch 友好的 PTQ/QAT、AdaRound、混合精度、逐层敏感度","kids":[],"w":"弄清「AIMET」，排障和选型时才知道该动哪一环。","b":""}],"w":"高通板上「能转不能跑」多半卡在 DSP/NPU 算子覆盖与上下文配置。","b":"编译器共性讲完，落到高通：图要进 Hexagon/NPU。QNN 跑通，才对比英伟达 TensorRT，两条实链不要混着配。"},{"id":"c13-2","t":"13.2 · NVIDIA：TensorRT 家族、Orin/Thor、DL…","d":"面向 NVIDIA GPU 的推理栈：图优化、精度策略、引擎构建。车上/工控 GPU 路径常点名它。","kids":[{"id":"c13-2-1","t":"13.2.1 · 纠正（相对社区传闻）","d":"纠正（相对社区传闻）：Orin 上曾有人折腾 TRT-LLM，不等于官方量产支持；Thor 路线明确转向 Edge-LLM（随 JetPack 版本演进，具体 JP 号需核验）","kids":[],"w":"弄清「纠正（相对社区传闻）」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-2-2","t":"13.2.2 · Edge-LLM 相对桌面 TRT 的本质差异 （…","d":"Edge-LLM 相对桌面 TRT 的本质差异 （…：Edge-LLM 相对桌面 TRT 的本质差异 （与原文⑪对齐并补边界）：内建自回归循环、KV、（视版本）连续批/分页；发布物是设备相关 engine，不是「拷贝服务器 plan 就…","kids":[],"w":"弄清「Edge-LLM 相对桌面 TRT 的本质差异 （…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-2-3","t":"13.2.3 · CV 与 LLM 双轨","d":"CV 与 LLM 双轨：感知用经典 TRT；对话/VLM 用 Edge-LLM；不要试图把 decode 循环塞进单次 enqueue 的静态 engine 硬拧","kids":[],"w":"弄清「CV 与 LLM 双轨」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-2-4","t":"13.2.4 · 收益最大","d":"收益最大：固定 shape 的 decode 步、固定插件组合的 TRT 执行","kids":[],"w":"弄清「收益最大」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-2-5","t":"13.2.5 · 收益很小/负优化","d":"收益很小/负优化：每步动态 shape、图结构变、频繁 capture/destroy","kids":[],"w":"弄清「收益很小/负优化」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-2-6","t":"13.2.6 · 与 Edge-LLM","d":"与 Edge-LLM：部分版本内部已用 Graph；业务层勿重复 capture 导致冲突（需核验当前 SDK 是否暴露开关）","kids":[],"w":"弄清「与 Edge-LLM」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-2-7","t":"13.2.7 · 坑","d":"坑：Graph 与 stream/context 生命周期绑定；热更新 engine、fork 进程后必须重录","kids":[],"w":"弄清「坑」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-2-8","t":"13.2.8 · 关系","d":"关系：落在「NVIDIA：TensorRT 家族、Orin/Thor、DL…」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「关系」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-2-9","t":"13.2.9 · 铁律","d":"铁律：Orin 上 build 的 engine 不能在 Thor 上 load（反之亦然）；ONNX 可迁移，engine 必须目标板重建","kids":[],"w":"弄清「铁律」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-2-10","t":"13.2.10 · Orin 满频验收","d":"Orin 满频验收：sudo nvpmodel -m 0 + sudo jetson_clocks；报表注明模式，否则实验室数字不可比","kids":[],"w":"弄清「Orin 满频验收」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-2-11","t":"13.2.11 · Thor 迁移清单","d":"Thor 迁移清单：重锁 JetPack → 重装 Edge-LLM → 重导量化 → 本机 rebuild → 重跑 PPL/任务集；禁止只换权重文件","kids":[],"w":"弄清「Thor 迁移清单」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-2-12","t":"13.2.12 · 适合","d":"适合：Conv/Pool/激活/BN 融合链；INT8/FP16；固定或有限动态 shape 的视觉骨干","kids":[],"w":"弄清「适合」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-2-13","t":"13.2.13 · 不适合","d":"不适合：LLM Attention/采样循环、大量 Gather/Scatter、自定义 plugin 为主的图、高动态序列","kids":[],"w":"弄清「不适合」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-2-14","t":"13.2.14 · 调度现实","d":"调度现实：TRT 可 GPU+DLA 切分；VLM 里 ViT 或许可切一部分到 DLA，LLM 主干仍在 GPU（与原文⑧一致）","kids":[],"w":"弄清「调度现实」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-2-15","t":"13.2.15 · 反模式","d":"反模式：为刷「DLA 利用率」把图切碎，DRAM 拷贝上涨，端到端反而变慢","kids":[],"w":"弄清「反模式」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-2-16","t":"13.2.16 · 验收拆分","d":"验收拆分：GPU ms / DLA ms / H2D+D2H ms / 端到端 ms；缺拷贝项视为不合格报告","kids":[],"w":"弄清「验收拆分」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-2-17","t":"13.2.17 · 命令线索","d":"命令线索：trtexec 的 DLA 相关开关（如 --useDLACore，确切参数随 TRT 版本需核验）+ Nsight Systems 看拷贝","kids":[],"w":"弄清「命令线索」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-2-18","t":"13.2.18 · 产物","d":"产物：.engine（发布）、导出用 ONNX（源）、校准 cache（INT8）、Edge-LLM 的引擎目录（LLM）","kids":[],"w":"弄清「产物」，排障和选型时才知道该动哪一环。","b":""}],"w":"GPU 端侧选型时，先确认 TRT 版本与目标芯片是否匹配，再谈插件与精度。","b":"高通链看过，英伟达走 TensorRT 图优化与引擎构建。版本和芯片对上，插件和精度才有意义；两家工具不要交叉套命令。"},{"id":"c13-3","t":"13.3 · 华为昇腾：CANN 代际、OM/OMC、ATC vs OMG、…","d":"CANN 是驱动+图编译器+算子+Runtime 的捆绑列车；混搭小版本是昇腾部署第一杀手","kids":[{"id":"c13-3-1","t":"13.3.1 · 逻辑分层","d":"逻辑分层：FE 解析 → GE 图优化/调度 → TBE 或 Ascend C 算子 → Runtime/ACL 执行","kids":[],"w":"弄清「逻辑分层」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-3-2","t":"13.3.2 · 服务器社区/商用 CANN","d":"服务器社区/商用 CANN：版本线常见 5.x/6.x/7.x/8.x 等；具体 LTS 以项目锁定的文档为准（勿写死过期号）","kids":[],"w":"弄清「服务器社区/商用 CANN」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-3-3","t":"13.3.3 · 座舱/麒麟 DDK","d":"座舱/麒麟 DDK：原文 omc0428 一类日期环境与服务器 toolkit 不是同一个安装包；工具名都叫「转模型」，产物与知识库却分家","kids":[],"w":"弄清「座舱/麒麟 DDK」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-3-4","t":"13.3.4 · 匹配检查","d":"匹配检查：板上 npu-smi（若有）或厂商版本查询 主机转换工具版本 模型魔数；缺一不转生产","kids":[],"w":"弄清「匹配检查」，排障和选型时才知道该动哪一环。","b":""},{"id":"c13-3-5","t":"13.3.5 · 坑","d":"坑：用新 ATC 转旧盒子、或旧知识库打新 DDK → Load model failed / 异常体积；先对版本再对图","kids":[], 程。上线快，但对校准和可量化图结构敏感。","kids":[{"id":"c15-3-1","t":"15.3.1 · GPTQ用Hessian二阶补偿；AWQ保sali…","d":"训练结束后再量化，基本不动原训练流程。上线快，但对校准和可量化图结构敏感。","kids":[],"w":"端侧赶工默认先 PTQ；精度不够再考虑 QAT 或混合精度，别一上来就重训。","b":""},{"id":"c15-3-2","t":"15.3.2 · SmoothQuant迁移离群值；FP4(E2M1…","d":"SmoothQuant迁移离群值；FP4(E2M1…：SmoothQuant迁移离群值；FP4(E2M1)零附近最优，Blackwell/Hexagon原生","kids":[],"w":"弄清「SmoothQuant迁移离群值；FP4(E2M1…」，排障和选型时才知道该动哪一环。","b":""}],"w":"端侧赶工默认先 PTQ；精度不够再考虑 QAT 或混合精度，别一上来就重训。","b":"尺子立住了才做后训练量化：不动原训练、靠校准定 scale。PTQ 仍卡验收线，下一步才是 QAT 伪量化，别一上来重训。"},{"id":"c15-4","t":"15.4 · LLM推理性能优化方法论：Prefill/Decode与Roo…","d":"提示词整段一次性进模型、算出首段表示并填满 KV 的阶段。往往决定首字等多久出来，算力更密。","kids":[{"id":"c15-4-1","t":"15.4.1 · Roofline ridge=算力/带宽；Deco…","d":"Roofline ridge=算力/带宽；Deco…：Roofline ridge=算力/带宽；Decode算术强度<50 ops/byte即memory-bound","kids":[],"w":"弄清「Roofline ridge=算力/带宽；Deco…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c15-4-2","t":"15.4.2 · 三层profile：算子>30%、带宽>80%、利…","d":"三层profile：算子>30%、带宽>80%、利…：三层profile：算子>30%、带宽>80%、利用率<50%；Prefill仅占10-20%","kids":[],"w":"弄清「三层profile：算子>30%、带宽>80%、利…」，排障和选型时才知道该动哪一环。","b":""}],"w":"TTFT 差，先看 Prefill：序列长、视觉编码、是否多余重算。","b":"KV 布局之后要把生成拆成 Prefill 与 Decode。首字慢和跟手慢不是同一笔账；阶段认清，TTFT 指标才有意义。"},{"id":"c15-5","t":"15.5 · KV Cache管理与量化（端侧LLM显存关键）","d":"生成时把已算过的 Key/Value 存起来复用，Decode 就不用整段重算 Attention。省算力，但占内存，长度一长就胀。","kids":[{"id":"c15-5-1","t":"15.5.1 · KV INT8(per-token)压2x损失<0…","d":"KV INT8(per-token)压2x损失<0…：KV INT8(per-token)压2x损失<0.5pp；INT4压4x损失1-2pp","kids":[],"w":"弄清「KV INT8(per-token)压2x损失<0…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c15-5-2","t":"15.5.2 · PagedAttention分block按需分配+…","d":"按相关度决定每个位置「看」哪些位置的信息。Transformer 里算力与访存大头之一，后面的融合、KV、量化都围着它转。","kids":[],"w":"性能热点图若扎在 Attention，下一步才是融合、量化或改 GQA/MQA。","b":""}],"w":"端侧长对话的内存墙多半在这：优化吞吐前先算清 KV 占多少。","b":"图优化省的是计算，长对话吃的是 KV。缓存账管住了再抠 DDR 带宽；KV 没算清，Token 速度优化只是加核空转。"},{"id":"c15-6","t":"15.6 · Qualcomm QNN工具链全流程与昇腾经验迁移","d":"高通侧把模型搬到 Hexagon/NPU 的工具与运行时一环。手机/车机 Qualcomm 方案会反复遇到。","kids":[{"id":"c15-6-1","t":"15.6.1 · 对标：converter≈OMG、HMX(INT4…","d":"对标：converter≈OMG、HMX(INT4…：对标：converter≈OMG、HMX(INT4/8)≈Cube、Context Binary≈OMC、ADX混合精度","kids":[],"w":"弄清「对标：converter≈OMG、HMX(INT4…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c15-6-2","t":"15.6.2 · ONNX语言/校准集/三层profiling思路与…","d":"跨框架中间格式，常作训练框架到推理引擎的交接面。图对不对、算子齐不齐，先在这里验。","kids":[],"w":"转换失败优先查 ONNX：动态 shape、自定义算子、opset 版本。","b":""}],"w":"高通板上「能转不能跑」多半卡在 DSP/NPU 算子覆盖与上下文配置。","b":"KV 与 Prefill 方法论有了，把昇腾上的转换-量化-板上验收迁到 QNN。厂商换了，链路角色不能丢，下一步才是 TRT 桌面与车端差异。"},{"id":"c15-7","t":"15.7 · TensorRT Edge-LLM核心机制与桌面版差异","d":"面向 NVIDIA GPU 的推理栈：图优化、精度策略、引擎构建。车上/工控 GPU 路径常点名它。","kids":[{"id":"c15-7-1","t":"15.7.1 · 三大机制：In-flight/Continuous…","d":"三大机制：In-flight/Continuous…：三大机制：In-flight/Continuous Batching、PagedAttention、KV Cache量化","kids":[],"w":"弄清「三大机制：In-flight/Continuous…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c15-7-2","t":"15.7.2 · QNN/Edge-LLM/llama.cpp三足鼎…","d":"高通侧把模型搬到 Hexagon/NPU 的工具与运行时一环。手机/车机 Qualcomm 方案会反复遇到。","kids":[],"w":"高通板上「能转不能跑」多半卡在 DSP/NPU 算子覆盖与上下文配置。","b":""}],"w":"GPU 端侧选型时，先确认 TRT 版本与目标芯片是否匹配，再谈插件与精度。","b":"QNN 迁完，看 TensorRT 在端侧 LLM 上和桌面版差在哪。机制对齐了，才谈车规 OTA 与批次一致性，别拿桌面 demo 当量产。"},{"id":"c15-8","t":"15.8 · 车规量产工程约束与量产思维（ISO 26262/OTA/批次一…","d":"量产前「不过就不许上车」的检查：精度、性能、指纹、安全等要一起过。演示绿不等于门禁绿。","kids":[{"id":"c15-8-1","t":"15.8.1 · 高温-40~85℃降频留余量、功耗5-15W、批次…","d":"高温-40~85℃降频留余量、功耗5-15W、批次…：高温-40~85℃降频留余量、功耗5-15W、批次一致性、寿命10-15年","kids":[],"w":"弄清「高温-40~85℃降频留余量、功耗5-15W、批次…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c15-8-2","t":"15.8.2 · OTA AB分区双备份可回滚；以PP50/P99作…","d":"量产前「不过就不许上车」的检查：精度、性能、指纹、安全等要一起过。演示绿不等于门禁绿。（补充：OTA AB分区双备份可回滚；以PP50/P99作为性能基线。）","kids":[],"w":"交付周看门禁矩阵，不看单机 demo；少一项都会在 OTA/回滚里爆。","b":""}],"w":"交付周看门禁矩阵，不看单机 demo；少一项都会在 OTA/回滚里爆。","b":"门禁矩阵有了，才叠加车规、OTA 整包与合规。发布总清单是把这些检查收成一张表，值班 SOP 再裁成能执行的最短路径。"},{"id":"c15-9","t":"15.9 · 端侧LLM/VLM模型选型与Roofline预筛（内存/带宽/…","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。","kids":[{"id":"c15-9-1","t":"15.9.1 · Roofline预筛：内存→Decode带宽→Pr…","d":"一个接一个吐 token 的阶段，每步主要吃 KV 与带宽。体感「生成慢不慢」常栽在这里。（补充：Roofline预筛：内存→Decode带宽→Prefill算力三步。）","kids":[],"w":"交互跟手度看 Decode；带宽和 KV 布局比盲目加核数更管用。","b":""},{"id":"c15-9-2","t":"15.9.2 · 语音助手Decode>20 token/s；蒸馏+…","d":"一个接一个吐 token 的阶段，每步主要吃 KV 与带宽。体感「生成慢不慢」常栽在这里。（补充：语音助手Decode>20 token/s；蒸馏+量化恢复精度主流。）","kids":[],"w":"交互跟手度看 Decode；带宽和 KV 布局比盲目加核数更管用。","b":""}],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":"先把车规量产工程约束与量产思维的验收做实，这段把端侧LLM/VLM模型选型与补上；下一步才动VLM多模态端侧部署与差异化那层，否则容易跳步。"},{"id":"c15-10","t":"15.10 · VLM多模态端侧部署与差异化精度策略","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。","kids":[{"id":"c15-10-1","t":"15.10.1 · ViT量化敏感留INT8；LLM用W4A16/W4…","d":"ViT量化敏感留INT8；LLM用W4A16/W4…：ViT量化敏感留INT8；LLM用W4A16/W4A8，LM Head/Embedding FP16、KVCache INT8","kids":[],"w":"弄清「ViT量化敏感留INT8；LLM用W4A16/W4…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c15-10-2","t":"15.10.2 · 量化致特征对齐偏移/幻觉↑，需整体精度验证","d":"量化致特征对齐偏移/幻觉↑，需整体精度验证：量化致特征对齐偏移/幻觉↑，需整体精度验证","kids":[],"w":"弄清「量化致特征对齐偏移/幻觉↑，需整体精度验证」，排障和选型时才知道该动哪一环。","b":""}],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":"模型预筛过了，VLM 要对视觉塔和语言塔用不同精度。策略定了，语音等其它模态才能复用同一套端侧纪律。"},{"id":"c15-11","t":"15.11 · 语音降噪与增强的端侧实现（RNNNoise/DCCRN/Ful…","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。","kids":[{"id":"c15-11-1","t":"15.11.1 · RNNNoise：Bark 22维+3层GRU约7…","d":"RNNNoise：Bark 22维+3层GRU约7…：RNNNoise：Bark 22维+3层GRU约70K参数，可跑Cortex-M7","kids":[],"w":"弄清「RNNNoise：Bark 22维+3层GRU约7…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c15-11-2","t":"15.11.2 · DCCRN复数卷积+LSTM；FullSubNet…","d":"DCCRN复数卷积+LSTM；FullSubNet…：DCCRN复数卷积+LSTM；FullSubNet全带+子带双路径最优","kids":[],"w":"弄清「DCCRN复数卷积+LSTM；FullSubNet…」，排障和选型时才知道该动哪一环。","b":""}],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":"VLM 精度策略之后，语音降噪是另一条端侧网。模型选对了，流式与动态量化才接得上，别把 LLM 的 KV 账抄过来。"},{"id":"c15-12","t":"15.12 · 语音增强端侧部署优化：流式推理与INT8动态量化","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。","kids":[{"id":"c15-12-1","t":"15.12.1 · OnnxWrapper展平h/c为输入输出，ops…","d":"跨框架中间格式，常作训练框架到推理引擎的交接面。图对不对、算子齐不齐，先在这里验。（补充：OnnxWrapper展平h/c为输入输出，opset14+dynamic_axes。）","kids":[],"w":"转换失败优先查 ONNX：动态 shape、自定义算子、opset 版本。","b":""},{"id":"c15-12-2","t":"15.12.2 · MCU限GRU+INT8参数<200K；INT8后…","d":"MCU限GRU+INT8参数<200K；INT8后…：MCU限GRU+INT8参数<200K；INT8后PESQ降<0.1可接受","kids":[],"w":"弄清「MCU限GRU+INT8参数<200K；INT8后…」，排障和选型时才知道该动哪一环。","b":""}],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":"语音增强模型定了，再做流式和 INT8 动态量化。实时链路跑稳，算子级 profiling 才有音频路径可对，不跟 LLM 抢同一套指标。"},{"id":"c15-13","t":"15.13 · 算子级性能调优与三层Profiling方法论","d":"ENABLE_TUNE_DUMP→op.csv测速→筛>1000μs→tbe_tune_main→知识库→重转","kids":[{"id":"c15-13-1","t":"15.13.1 · 先确认工具链正常(OMC 20MB正常vs 37M…","d":"先确认工具链正常(OMC 20MB正常vs 37M…：先确认工具链正常(OMC 20MB正常vs 37MB异常)再优化","kids":[],"w":"弄清「先确认工具链正常(OMC 20MB正常vs 37M…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c15-13-2","t":"15.13.2 · 双层评估：逐层余弦>99%+任务级mAP；敏感层诊…","d":"双层评估：逐层余弦>99%+任务级mAP；敏感层诊…：双层评估：逐层余弦>99%+任务级mAP；敏感层诊断量化坍陷","kids":[],"w":"弄清「双层评估：逐层余弦>99%+任务级mAP；敏感层诊…」，排障和选型时才知道该动哪一环。","b":""}],"w":"把「算子级性能调优与三层Profiling方法论」落到可验收信号上，再下钻子点；细节以正文段落为准。","b":"语音和 LLM 路径都有了，用三层 profiling 把热点钉到算子。这一层是量产优化的收口，前面 Roofline 没有算子证据就还是估计。"}],"w":"给学习路径一个章节锚点，排障时先回到这一章的目标。","b":"板子会跑了，把 LLM/VLM 从训练到车机、QNN/TRT 迁移、车规约束串成量产路径。路径有了，再收流水线与门禁。"},{"id":"c16","t":"16 · 工程化与量产","d":"「工程化与量产」这一章回答端侧部署里一块完整问题；先立章目标，再进主题。","kids":[{"id":"c16-1","t":"16.1 · 自动化流水线","d":"主题「自动化流水线」管端侧链路里这一段，下含：编排脚本、CI/CD、版本管理、参数化配置。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c16-1-1","t":"16.1.1 · 编排脚本","d":"编排脚本：Shell/Python 串联 转换→量化→编译→验证，一键跑通","kids":[],"w":"弄清「编排脚本」，排障和选型时才知道该动哪一环。","b":""},{"id":"c16-1-2","t":"16.1.2 · CI/CD","d":"CI/CD：提交触发 编译+精度+性能回归，早发现退化","kids":[],"w":"弄清「CI/CD」，排障和选型时才知道该动哪一环。","b":""},{"id":"c16-1-3","t":"16.1.3 · 版本管理","d":"版本管理：模型/量化配置/引擎产物统一版本与哈希追溯","kids":[],"w":"弄清「版本管理」，排障和选型时才知道该动哪一环。","b":""},{"id":"c16-1-4","t":"16.1.4 · 参数化配置","d":"参数化配置：量化选项/shape 抽成配置，批量矩阵实验","kids":[],"w":"弄清「参数化配置」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「工程化与量产」一个可讲可练的切口，让下面的知识点有归属。","b":"量产路径走过，收成可重复流水线。流水线稳了才谈回归；手点绿不能当交付，后面资源评估才有输入。"},{"id":"c16-2","t":"16.2 · 回归验证","d":"主题「回归验证」管端侧链路里这一段，下含：精度回归、性能回归、看板阈值。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c16-2-1","t":"16.2.1 · 精度回归","d":"精度回归：大量用例 baseline vs 新版对比，超阈值告警","kids":[],"w":"弄清「精度回归」，排障和选型时才知道该动哪一环。","b":""},{"id":"c16-2-2","t":"16.2.2 · 性能回归","d":"性能回归：时延/吞吐/TTFT/内存基准测试并出报告","kids":[],"w":"弄清「性能回归」，排障和选型时才知道该动哪一环。","b":""},{"id":"c16-2-3","t":"16.2.3 · 看板阈值","d":"看板阈值：落在「回归验证」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「看板阈值」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「工程化与量产」一个可讲可练的切口，让下面的知识点有归属。","b":"流水线能复现，回归才有意义：精度、性能、指纹一起看。回归绿了，资源评估才不是拍脑袋。"},{"id":"c16-3","t":"16.3 · 资源评估","d":"主题「资源评估」管端侧链路里这一段，下含：内存预算、算力与时延、带宽与功耗。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c16-3-1","t":"16.3.1 · 内存预算","d":"内存预算：权重+激活+KV-Cache+运行时分项估算","kids":[],"w":"弄清「内存预算」，排障和选型时才知道该动哪一环。","b":""},{"id":"c16-3-2","t":"16.3.2 · 算力与时延","d":"算力与时延：TOPS×算子效率 与目标时延换算定平台","kids":[],"w":"弄清「算力与时延」，排障和选型时才知道该动哪一环。","b":""},{"id":"c16-3-3","t":"16.3.3 · 带宽与功耗","d":"带宽与功耗：decode权重带宽 vs DDR上限；峰值/平均功耗预算","kids":[],"w":"弄清「带宽与功耗」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「工程化与量产」一个可讲可练的切口，让下面的知识点有归属。","b":"回归证明还能再跑，才评估内存、算力、带宽。资源账清了，文档才能当交接，门禁才能设硬阈值。"},{"id":"c16-4","t":"16.4 · 落地沉淀与文档","d":"主题「落地沉淀与文档」管端侧链路里这一段，下含：技术文档、SOP 标准化、问题排查清单、知识传递。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c16-4-1","t":"16.4.1 · 技术文档","d":"技术文档：部署方案、量化策略、性能调优报告、工具说明","kids":[],"w":"弄清「技术文档」，排障和选型时才知道该动哪一环。","b":""},{"id":"c16-4-2","t":"16.4.2 · SOP 标准化","d":"SOP 标准化：沉淀 部署→量化→编译→验证→发布 流程","kids":[],"w":"弄清「SOP 标准化」，排障和选型时才知道该动哪一环。","b":""},{"id":"c16-4-3","t":"16.4.3 · 问题排查清单","d":"问题排查清单：OOM、精度崩溃、算子不支持、数据对齐等坑位","kids":[],"w":"弄清「问题排查清单」，排障和选型时才知道该动哪一环。","b":""},{"id":"c16-4-4","t":"16.4.4 · 知识传递","d":"知识传递：经验沉淀为checklist，可复现可培训","kids":[],"w":"弄清「知识传递」，排障和选型时才知道该动哪一环。","b":""}],"w":"给「工程化与量产」一个可讲可练的切口，让下面的知识点有归属。","b":"资源账和回归结果要沉成文档才能交接。沉淀完，下一章才用门禁把「不许上车」写死，否则纪律没有附件可挂。"}],"w":"给学习路径一个章节锚点，排障时先回到这一章的目标。","b":"量产路径走过，收成流水线、回归、资源评估和文档。附件齐了，门禁章才能写「不过就不许上车」。"},{"id":"c17","t":"17 · 工程化：门禁、车规、OTA、安全","d":"「工程化：门禁、车规、OTA、安全」这一章回答端侧部署里一块完整问题；先立章目标，再进主题。","kids":[{"id":"c17-1","t":"17.1 · 量产门禁与运行纪律","d":"量产前「不过就不许上车」的检查：精度、性能、指纹、安全等要一起过。演示绿不等于门禁绿。","kids":[{"id":"c17-1-1","t":"17.1.1 · 从「能跑」到「量产」的门禁矩阵","d":"量产前「不过就不许上车」的检查：精度、性能、指纹、安全等要一起过。演示绿不等于门禁绿。","kids":[],"w":"交付周看门禁矩阵，不看单机 demo；少一项都会在 OTA/回滚里爆。","b":""},{"id":"c17-1-2","t":"17.1.2 · 「能跑」= 单机 demo 出 token；「量产…","d":"「能跑」= 单机 demo 出 token；「量产…：「能跑」= 单机 demo 出 token；「量产」= 矩阵机型 × 全温区 × OTA 可回滚 × 指标可拦发布","kids":[],"w":"弄清「「能跑」= 单机 demo 出 token；「量产…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c17-1-3","t":"17.1.3 · 每道门禁必须有：**指标名 / 基线 / 阈值 /…","d":"量产前「不过就不许上车」的检查：精度、性能、指纹、安全等要一起过。演示绿不等于门禁绿。","kids":[],"w":"交付周看门禁矩阵，不看单机 demo；少一项都会在 OTA/回滚里爆。","b":""},{"id":"c17-1-4","t":"17.1.4 · CI：golden logits、确定性与跨平台容差","d":"CI：golden logits、确定性与跨平台容差：落在「量产门禁与运行纪律」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数。","kids":[],"w":"弄清「CI：golden logits、确定性与跨平台容差」，排障和选型时才知道该动哪一环。","b":""},{"id":"c17-1-5","t":"17.1.5 · L0 冒烟：加载成功 + 1 条短 prompt …","d":"L0 冒烟：加载成功 + 1 条短 prompt …：L0 冒烟：加载成功 + 1 条短 prompt 出 token","kids":[],"w":"弄清「L0 冒烟：加载成功 + 1 条短 prompt …」，排障和选型时才知道该动哪一环。","b":""},{"id":"c17-1-6","t":"17.1.6 · L1 精度：固定 prompt×seed → lo…","d":"L1 精度：固定 prompt×seed → lo…：L1 精度：固定 prompt×seed → logits / top-k / 采样轨迹摘要","kids":[],"w":"弄清「L1 精度：固定 prompt×seed → lo…」，排障和选型时才知道该动哪一环。","b":""},{"id":"c17-1-7","t":"17.1.7 · L2 性能：固定 shape 压测 TTFT/TP…","d":"从发请求到第一个可用 token 出现的等待。端侧体感里它和 Prefill、视觉编码强绑定，常是验收硬指标。（补充：L2 性能：固定 shape 压测 TTFT/TPOT/内存。）","kids":[],"w":"产品说「慢」，先拆成 TTFT 还是 Decode；两者治法完全不同。","b":""},{"id":"c17-1-8","t":"17.1.8 · L3 夜间：机型矩阵 + 长稳（热/内存泄漏）。","d":"L3 夜间：机型矩阵 + 长稳（热/内存泄漏）。：L3 夜间：机型矩阵 + 长稳（热/内存泄漏）","kids":[],"w":"弄清「L3 夜间：机型矩阵 + 长稳（热/内存泄漏）。」，排障和选型时才知道该动哪一环。","b":""},{"id":"c17-1-9","t":"17.1.9 · 端侧跨 NPU/GPU/CPU、跨驱动版本，**b…","d":"数据产生/消费处的终端或嵌入式节点上的推理：权重进本机 DRAM，默认不依赖跨城回程。杀进程、温控、前台保活都是硬约束。本仓库「端侧」专指这一层，勿与近边/MEC 混称。","kids":[],"w":"认清落点才能选验收尺：端侧看本机峰值与离线，不看云端 Demo 延迟。","b":""},{"id":"c17-1-10","t":"17.1.10 · CI 目标改为：**同平台可复现 + 跨平台容差带…","d":"四级台阶第三道：同一 SoC/引擎版本/导出指纹下，转换→Runtime→P
