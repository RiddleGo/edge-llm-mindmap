<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>端侧大模型部署 · 思维导图</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+SC:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
<style>
/* === THEME: Terminal Blueprint === */
:root {
    --stage-bg: #05070a;
    --slide-bg: #070b10;
    --bg-primary: #070b10;
    --grid-line: rgba(74, 222, 128, 0.06);
    --accent: #4ade80;
    --accent-bright: #86efac;
    --accent-dim: #166534;
    --accent-glow: rgba(74, 222, 128, 0.32);
    --key-1: #fbbf24;
    --key-2: #fb7185;
    --key-1-bg: rgba(251, 191, 36, 0.12);
    --key-2-bg: rgba(251, 113, 133, 0.12);
    --bridge: #67e8f9;
    --text-primary: #ecfdf5;
    --text-muted: #93a89c;
    --text-leaf: #bbf7d0;
    --node-bg: #0b1218;
    --node-active: #0f2a18;
    --danger: #86efac;
    --font-display: "Syne", "IBM Plex Sans SC", sans-serif;
    --font-body: "IBM Plex Sans SC", "Noto Sans SC", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    --fs-root: 28px;
    --fs-chapter: 16px;
    --fs-topic: 15px;
    --fs-term: 14px;
    --fs-label: 12px;
    --fs-detail-title: 16px;
    --reader-w: 480px;
    --fs-detail-body: 17px;
    --col-gap: 18px;
    --node-gap: 8px;
    --node-inactive-opacity: 0.78;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --duration-normal: 0.45s;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
    font-family: var(--font-body);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* === GRID STAGE === */
.slide {
    font-family: var(--font-body);
    color: var(--text-primary);
    background-color: var(--bg-primary);
    background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 48px 48px;
}

.reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity var(--duration-normal) var(--ease-out-expo),
                transform var(--duration-normal) var(--ease-out-expo);
}
.slide.visible .reveal { opacity: 1; transform: none; }
.slide.visible .reveal:nth-child(1) { transition-delay: 0.05s; }
.slide.visible .reveal:nth-child(2) { transition-delay: 0.14s; }
.slide.visible .reveal:nth-child(3) { transition-delay: 0.24s; }
.slide.visible .reveal:nth-child(4) { transition-delay: 0.34s; }

/* === TITLE SLIDE === */
.title-slide .glow {
    position: absolute;
    width: 720px; height: 720px;
    left: 50%; top: 44%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, var(--accent-glow), transparent 68%);
    pointer-events: none;
}
.title-kicker {
    position: absolute; left: 88px; top: 88px;
    font-family: var(--font-mono);
    letter-spacing: 0.32em; font-size: 14px; font-weight: 500;
    color: var(--accent-bright);
}
.title-slide h1 {
    position: absolute; left: 88px; top: 300px;
    font-family: var(--font-display); font-weight: 800;
    font-size: 96px; line-height: 1.06; letter-spacing: -0.02em;
    max-width: 1200px;
    color: var(--text-primary);
}
.title-lead {
    position: absolute; left: 88px; top: 560px;
    font-family: var(--font-body); font-weight: 400;
    font-size: 26px; color: var(--text-leaf);
    max-width: 920px; line-height: 1.72;
}
.enter-btn {
    position: absolute; left: 88px; bottom: 156px;
    border: 1px solid var(--accent-bright); background: transparent;
    color: var(--accent-bright);
    font: 600 17px/1 var(--font-mono);
    padding: 18px 36px; cursor: pointer; letter-spacing: 0.1em;
    transition: background 0.25s ease, color 0.25s ease;
}
.enter-btn:hover { background: var(--accent); color: #04110a; border-color: var(--accent); }
.title-hint {
    position: absolute; right: 88px; bottom: 96px;
    font-family: var(--font-mono);
    font-size: 13px; line-height: 1.65;
    color: var(--text-muted); max-width: 420px; text-align: right;
}

/* === MAP SLIDE — reading-first === */
.map-top {
    position: absolute; left: 36px; right: 36px; top: 14px; height: 52px;
    display: flex; align-items: center; gap: 10px; z-index: 6;
}
.map-top h2 {
    flex: 0 0 auto;
    font-family: var(--font-display); font-size: 24px; font-weight: 800;
    letter-spacing: -0.01em; margin-right: 10px; color: var(--text-primary);
}
.crumb {
    flex: 1 1 auto; min-width: 0;
    font-family: var(--font-body); font-size: 14px; font-weight: 400;
    color: var(--text-muted); line-height: 1.4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-right: 8px;
}
.tool {
    flex: 0 0 auto; white-space: nowrap;
    border: 1px solid var(--accent-dim); background: var(--node-bg);
    color: var(--text-leaf); font: 500 12px/1 var(--font-mono);
    padding: 8px 12px; cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
}
.tool.on, .tool:hover { border-color: var(--accent-bright); color: var(--accent-bright); }

.map-hint {
    position: absolute; left: 36px; right: 36px; top: 66px;
    font-family: var(--font-mono); font-size: 12px; font-weight: 400;
    color: var(--text-muted); letter-spacing: 0.03em; line-height: 1.4;
    opacity: 0.92; pointer-events: none; z-index: 6;
}

.map-legend {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 11px;
    color: var(--text-muted); white-space: nowrap; margin-right: 4px;
}
.map-legend .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 3px; vertical-align: middle; background: var(--accent);
}
.map-legend .dot.key1 { background: var(--key-1); }
.map-legend .dot.key2 { background: var(--key-2); }

/* Left browser + splitter + right reader */
.map-workspace {
    position: absolute; left: 0; top: 90px; right: 0; bottom: 0;
    display: grid;
    grid-template-columns: minmax(280px, 1fr) 8px var(--reader-w, 480px);
    gap: 0;
    overflow: hidden;
    background: var(--slide-bg);
}
.map-workspace.is-resizing {
    cursor: col-resize;
    user-select: none;
}
.map-workspace.is-resizing * { cursor: col-resize !important; }
.split-handle {
    position: relative;
    z-index: 4;
    width: 8px;
    margin: 0 -1px;
    cursor: col-resize;
    touch-action: none;
    background: transparent;
    border: none;
    padding: 0;
    align-self: stretch;
}
.split-handle::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    width: 1px;
    transform: translateX(-50%);
    background: rgba(74, 222, 128, 0.28);
    transition: background 0.15s ease, box-shadow 0.15s ease, width 0.15s ease;
}
.split-handle:hover::before,
.split-handle.is-dragging::before,
.map-workspace.is-resizing .split-handle::before {
    width: 2px;
    background: var(--accent-bright);
    box-shadow: 0 0 10px rgba(74, 222, 128, 0.35);
}
.split-handle::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 3px; height: 36px;
    transform: translate(-50%, -50%);
    border-radius: 2px;
    background: rgba(74, 222, 128, 0.35);
    opacity: 0;
    transition: opacity 0.15s ease;
}
.split-handle:hover::after,
.split-handle.is-dragging::after {
    opacity: 1;
}
.map-board {
    position: relative;
    overflow: auto;
    cursor: default;
    touch-action: pan-x pan-y;
    user-select: none;
    padding: 10px 16px 28px 36px;
    scrollbar-width: thin;
    scrollbar-color: var(--accent-dim) transparent;
    overscroll-behavior: contain;
    min-width: 0;
}
.map-board.space-pan { cursor: grab; }
.map-board.is-panning { cursor: grabbing; }
.map-board svg { max-width: none; max-height: none; }

#mapCanvas {
    position: relative;
    left: 0; top: 0;
    min-width: 100%;
    min-height: 100%;
    transform-origin: 0 0;
}
#wires {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; overflow: visible; opacity: 0.45;
}
.cols {
    position: relative; left: 0; top: 4px;
    display: flex; flex-direction: row; gap: var(--col-gap); align-items: flex-start;
    width: max-content;
    min-width: calc(100% - 20px);
    height: auto;
    overflow: visible;
    padding-bottom: 16px;
}
.cols.ttb {
    flex-direction: column; gap: 14px;
    width: calc(100% - 20px);
}
.col {
    flex: 0 0 auto; min-width: 220px;
    display: none; flex-direction: column; gap: 8px;
    opacity: 0; pointer-events: none;
    transform: translateX(-14px);
    transition: opacity 0.32s var(--ease-out-expo), transform 0.32s var(--ease-out-expo);
}
.col.show {
    display: flex; opacity: 1; pointer-events: auto; transform: none;
}
#col0.show { width: 250px; min-width: 250px; max-width: 250px; }
#col1.show { width: 292px; min-width: 292px; max-width: 292px; }
#col2.show { width: 292px; min-width: 292px; max-width: 292px; }
#col3.show { width: 400px; min-width: 400px; max-width: 420px; }
.cols.ttb #col0.show,
.cols.ttb #col1.show,
.cols.ttb #col2.show,
.cols.ttb #col3.show { width: 100%; min-width: 0; max-width: none; }
.cols.ttb .col {
    transform: translateY(-10px);
    flex-direction: row; flex-wrap: wrap; align-content: flex-start;
}
.cols.ttb .col.show { transform: none; }

.col-label {
    font-family: var(--font-mono);
    font-size: var(--fs-label); font-weight: 500;
    letter-spacing: 0.1em; color: var(--accent-bright);
    min-height: 18px; flex: 0 0 auto;
    opacity: 0.88; line-height: 1.35; margin-bottom: 2px;
}

/* Directory cards: title only */
.node {
    border: 1px solid rgba(22, 101, 52, 0.7);
    background: var(--node-bg);
    color: var(--text-leaf);
    font-family: var(--font-body);
    font-size: var(--fs-topic); font-weight: 500; line-height: 1.35;
    padding: 10px 28px 10px 12px;
    cursor: pointer;
    text-align: left;
    width: 100%;
    position: relative;
    transition: border-color 0.15s ease, background 0.15s ease, opacity 0.2s ease;
    word-break: break-word;
    box-shadow: none;
}
.col.show .node:not(.active):not(.root-node) { opacity: var(--node-inactive-opacity); }
.cols.ttb .node { width: auto; min-width: 190px; max-width: 320px; }
.node:hover {
    border-color: var(--accent);
    opacity: 1;
}
.node.active {
    opacity: 1;
    background: var(--node-active);
    border-color: var(--accent-bright);
    color: #f0fdf4;
    font-weight: 600;
    box-shadow: inset 0 0 0 1px rgba(134, 239, 172, 0.16);
}
.node.key-1 {
    border-color: rgba(251, 191, 36, 0.45);
    border-left: 3px solid var(--key-1);
}
.node.key-2 {
    border-color: rgba(251, 113, 133, 0.45);
    border-left: 3px solid var(--key-2);
}
.node.key-1:hover { border-color: var(--key-1); }
.node.key-2:hover { border-color: var(--key-2); }
.node.key-1.active {
    background: var(--key-1-bg);
    border-color: var(--key-1);
    color: #fffbeb;
}
.node.key-2.active {
    background: var(--key-2-bg);
    border-color: var(--key-2);
    color: #fff1f2;
}
.node.key-1::before,
.node.key-2::before {
    position: absolute; top: 4px; left: 8px;
    font-family: var(--font-mono);
    font-size: 9px; font-weight: 600; line-height: 1;
    letter-spacing: 0.04em; pointer-events: none; opacity: 0.85;
}
.node.key-1::before { content: "重点"; color: var(--key-1); }
.node.key-2::before { content: "核心"; color: var(--key-2); }
.node.key-1, .node.key-2 { padding-top: 16px; }

.node.root-node {
    font-family: var(--font-display); font-weight: 800;
    font-size: 20px; line-height: 1.28;
    padding: 18px 14px; text-align: center; min-height: 88px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.node.root-node .sub {
    display: block !important;
    margin-top: 8px;
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 400;
    color: var(--text-muted); line-height: 1.4;
}
.node .sub { display: none; }

#list1 .node {
    font-size: var(--fs-chapter); font-weight: 600;
    padding: 10px 28px 10px 12px;
}
#list2 .node {
    font-size: var(--fs-topic); font-weight: 500;
    padding: 9px 28px 9px 12px;
}
#list3 .node {
    font-size: var(--fs-term); font-weight: 400;
    padding: 9px 12px;
    display: block;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#list1 .node.key-1, #list1 .node.key-2,
#list2 .node.key-1, #list2 .node.key-2,
#list3 .node.key-1, #list3 .node.key-2 { padding-top: 16px; }

#list1, #list2, #list3 {
    max-height: calc(1080px - 220px);
    overflow-y: auto; overflow-x: hidden;
    padding-right: 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--accent-dim) transparent;
    overscroll-behavior: contain;
}
.node.has-kids::after {
    content: "▸";
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%);
    color: var(--accent-bright); font-size: 11px;
    font-family: var(--font-mono); opacity: 0.75;
}
.cols.ttb .node.has-kids::after { content: "▾"; top: 10px; transform: none; }
.node, .pager, .tool { cursor: pointer; }
.list {
    display: flex; flex-direction: column; gap: var(--node-gap);
    flex: 0 0 auto; overflow: visible;
}
.cols.ttb .list { flex-direction: row; flex-wrap: wrap; width: 100%; gap: 8px; }
.l3-grid, .l3-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: var(--node-gap);
}
.cols.ttb .l3-grid { grid-template-columns: repeat(3, 1fr); width: 100%; }

/* Reader — primary reading surface */
.reader {
    border-left: none;
    background: linear-gradient(180deg, #0a1210 0%, #070b0c 100%);
    padding: 16px 22px 22px;
    overflow: hidden;
    display: flex; flex-direction: column;
    min-width: 0;
}
.reader-label {
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--accent-bright);
    margin-bottom: 12px;
    opacity: 0.92;
    flex: 0 0 auto;
}
.detail {
    border: none; background: transparent; padding: 0;
    min-height: 0; max-height: none; max-width: 100%;
    overflow-y: auto; overscroll-behavior: contain;
    flex: 1 1 auto;
    scrollbar-width: thin;
    scrollbar-color: var(--accent-dim) transparent;
}
.detail h3 {
    font-family: var(--font-body);
    font-size: var(--fs-detail-title); font-weight: 600;
    line-height: 1.45; margin-bottom: 12px;
    color: var(--text-primary);
    letter-spacing: 0;
}
.detail > p {
    font-family: var(--font-body);
    font-size: var(--fs-detail-body);
    line-height: 1.85; color: var(--text-leaf);
    max-width: 36em;
}
.explain-block { margin-top: 0; max-width: 36em; }
.explain-label {
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--accent-bright);
    margin: 22px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(74, 222, 128, 0.18);
}
.explain-label:first-child { margin-top: 0; }
.explain-label.explain-bridge {
    color: var(--bridge);
    border-bottom-color: rgba(103, 232, 249, 0.22);
}
.explain-block p {
    margin: 0;
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.85;
    color: var(--text-leaf);
}
.explain-block .bridge-text {
    color: #a5f3fc;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid rgba(103, 232, 249, 0.22);
}
.explain-block .meta-line {
    margin-top: 22px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
}
.pager {
    display: flex; gap: 8px; align-items: center;
    font-family: var(--font-mono);
    font-size: 12px; color: var(--text-muted);
    margin-top: 4px;
}


.node.key-1 { border-color: rgba(251, 191, 36, 0.45); border-left: 3px solid var(--key-1); }
.node.key-2 { border-color: rgba(251, 113, 133, 0.45); border-left: 3px solid var(--key-2); }
.node.key-1:hover { border-color: var(--key-1); }
.node.key-2:hover { border-color: var(--key-2); }
.node.key-1.active { background: var(--key-1-bg); border-color: var(--key-1); color: #fffbeb; }
.node.key-2.active { background: var(--key-2-bg); border-color: var(--key-2); color: #fff1f2; }
.node.key-1::before, .node.key-2::before {
    position: absolute; top: 4px; left: 8px;
    font-family: var(--font-mono); font-size: 9px; font-weight: 600; line-height: 1;
    letter-spacing: 0.04em; pointer-events: none; opacity: 0.85;
}
.node.key-1::before { content: "重点"; color: var(--key-1); }
.node.key-2::before { content: "核心"; color: var(--key-2); }
.node.key-1, .node.key-2 { padding-top: 16px; }
#list1 .node.key-1, #list1 .node.key-2,
#list2 .node.key-1, #list2 .node.key-2,
#list3 .node.key-1, #list3 .node.key-2 { padding-top: 16px; }
.node.has-kids::after {
    content: "▸";
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%);
    color: var(--accent-bright); font-size: 11px;
    font-family: var(--font-mono); opacity: 0.75;
}
.l3-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: var(--node-gap);
}

.edit-hotzone { position: fixed; top: 0; left: 0; width: 80px; height: 80px; z-index: 10000; cursor: pointer; }
.edit-toggle {
    position: fixed; top: 16px; left: 16px;
    opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    z-index: 10001; border: 1px solid var(--accent); background: #04110a;

uant Q4_K_M/Q5_K_M/Q8_0」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c2-7-2","t":"2.7.2 · prefill计算密集/decode访存密集；KV","d":"提示词整段一次性进模型、算出首段表示并填满 KV 的阶段。往往决定首字等多久出来，算力更密。","kids":[],"w":"TTFT 差，先看 Prefill：序列长、视觉编码、是否多余重算。","b":"","k":2}],"w":"给「基础入门 · 全栈技术」一个可讲可练的切口，让下面的知识点有归属。","b":"昇腾把 CV 图编到板上了。LLM 换 llama.cpp/GGUF，还要单独算 KV 缓存，不能当又一个 INT8 模型套。生成跑通后再看车载引擎全景。","k":1},{"id":"c2-8","t":"2.8 · 车载芯片平台与推理引擎技术栈全景","d":"主题「车载芯片平台与推理引擎技术栈全景」管端侧链路里这一段，下含：引擎：TensorRT-LLM/Edge-LLM、v、编译器LLVM/MLIR/TVM/XLA；岗位主线：。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c2-8-1","t":"2.8.1 · 引擎：TensorRT-LLM/Edge-LLM、v","d":"面向 NVIDIA GPU 的推理栈：图优化、精度策略、引擎构建。车上/工控 GPU 路径常点名它。","kids":[],"w":"GPU 端侧选型时，先确认 TRT 版本与目标芯片是否匹配，再谈插件与精度。","b":"","k":2},{"id":"c2-8-2","t":"2.8.2 · 编译器LLVM/MLIR/TVM/XLA；岗位主线：","d":"编译器LLVM/MLIR/TVM/XLA；岗位主线：：编译器LLVM/MLIR/TVM/XLA；岗位主线：端侧LLM部署/AI编译器/量化","kids":[],"w":"削掉多余访存与启动开销，常是性能优化的杠杆。","b":"","k":1}],"w":"给「基础入门 · 全栈技术」一个可讲可练的切口，让下面的知识点有归属。","b":"LLM 的 GGUF/KV 账有了，才对照车载各家引擎栈。选型清楚再下钻编译器与算子，避免一上来绑死某一家宣传页。","k":1},{"id":"c2-9","t":"2.9 · AI编译器、核心算子实现与LLM优化技术","d":"主题「AI编译器、核心算子实现与LLM优化技术」管端侧链路里这一段，下含：LLM专用：GQA、投机采样、Continuous、档位FP16~NVFP4；PTQ/QAT(STE)+。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c2-9-1","t":"2.9.1 · LLM专用：GQA、投机采样、Continuous","d":"LLM专用：GQA、投机采样、Continuous：LLM专用：GQA、投机采样、Continuous Batching、结构化输出","kids":[],"w":"弄清「LLM专用：GQA、投机采样、Continuous」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c2-9-2","t":"2.9.2 · 档位FP16~NVFP4；PTQ/QAT(STE)+","d":"训练结束后再量化，基本不动原训练流程。上线快，但对校准和可量化图结构敏感。","kids":[],"w":"端侧赶工默认先 PTQ；精度不够再考虑 QAT 或混合精度，别一上来就重训。","b":"","k":1}],"w":"给「基础入门 · 全栈技术」一个可讲可练的切口，让下面的知识点有归属。","b":"引擎全景只告诉你有哪些栈。这段讲编译器和算子怎么把图画成能跑的核；排错章要靠这层语言，不能只记报错原文。","k":0},{"id":"c2-10","t":"2.10 · 端侧部署常见问题排错（全链路调试知识库）","d":"主题「端侧部署常见问题排错（全链路调试知识库）」管端侧链路里这一段，下含：ONNX：opset降11/onnxsim简化/预处、OMC：check_hit_bank→04_sear。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c2-10-1","t":"2.10.1 · ONNX：opset降11/onnxsim简化/预处","d":"跨框架中间格式，常作训练框架到推理引擎的交接面。图对不对、算子齐不齐，先在这里验。","kids":[],"w":"转换失败优先查 ONNX：动态 shape、自定义算子、opset 版本。","b":"","k":2},{"id":"c2-10-2","t":"2.10.2 · OMC：check_hit_bank→04_sear","d":"OMC：check_hit_bank→04_sear：ch→05更新；LLM设HF_ENDPOINT镜像；踩坑记notes周记","kids":[],"w":"弄清「OMC：check_hit_bank→04_sear」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「基础入门 · 全栈技术」一个可讲可练的切口，让下面的知识点有归属。","b":"前面链路都走过，这段按全链路收口排错。先定位卡在转换、量化还是板上，再回头翻对应主题，别从日志第一行猜。","k":0}],"w":"给学习路径一个章节锚点，排障时先回到这一章的目标。","b":"方位认完，用一条可跑的全栈把转换、量化、CV/昇腾/LLM 摸一遍。主链路章再把其中转换、引擎、运行时拆开深讲。","k":0},{"id":"c3","t":"3 · 部署主链路","d":"「部署主链路」这一章回答端侧部署里一块完整问题。下含主题：模型转换、推理引擎与编译、运行时与调度。先建立章目标，再进 1.x 主题与术语，避免跳着背命令","kids":[{"id":"c3-1","t":"3.1 · 模型转换","d":"主题「模型转换」管端侧链路里这一段，下含：转换链路、ONNX opset 与动态shape、算子兼容处理、常量折叠。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c3-1-1","t":"3.1.1 · 转换链路","d":"转换链路：把训练态权重变成推理态图/格式的步骤；断点常出在算子不支持、动态 shape、自定义层","kids":[],"w":"保证训练成果能交到推理引擎，是主链路第一道闸。","b":"","k":1},{"id":"c3-1-2","t":"3.1.2 · ONNX opset 与动态shape","d":"跨框架中间格式，常作训练框架到推理引擎的交接面。图对不对、算子齐不齐，先在这里验。","kids":[],"w":"转换失败优先查 ONNX：动态 shape、自定义算子、opset 版本。","b":"","k":2},{"id":"c3-1-3","t":"3.1.3 · 算子兼容处理","d":"算子兼容处理：不支持算子拆解/替换/CPU fallback，需评估精度与时延","kids":[],"w":"削掉多余访存与启动开销，常是性能优化的杠杆。","b":"","k":1},{"id":"c3-1-4","t":"3.1.4 · 常量折叠","d":"常量折叠：仅依赖常量的计算提前到转换期，减少运行时开销","kids":[],"w":"弄清「常量折叠」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「部署主链路」一个可讲可练的切口，让下面的知识点有归属。","b":"部署主链路从交接面开始：训练框架出图，先转成引擎吃得下的中间格式。图对了才谈编译和 Runtime，转换失败不要先怪板上。","k":1},{"id":"c3-2","t":"3.2 · 推理引擎与编译","d":"主题「推理引擎与编译」管端侧链路里这一段，下含：引擎选型、图优化、算子映射与plugin、codegen 与打包。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c3-2-1","t":"3.2.1 · 引擎选型","d":"引擎选型：QNN、TensorRT、TensorRT Edge-LLM、onnxruntime 定位取舍","kids":[],"w":"把图画成板上可跑的高效执行，关乎真实延迟。","b":"","k":1},{"id":"c3-2-2","t":"3.2.2 · 图优化","d":"图优化：算子融合、重排序、死代码消除、内存复用，离线优化大头","kids":[],"w":"弄清「图优化」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c3-2-3","t":"3.2.3 · 算子映射与plugin","d":"算子映射与plugin：节点匹配内置算子，不匹配则自定义kernel或plugin扩展","kids":[],"w":"削掉多余访存与启动开销，常是性能优化的杠杆。","b":"","k":1},{"id":"c3-2-4","t":"3.2.4 · codegen 与打包","d":"codegen 与打包：权重+执行计划编译成二进制：TensorRT engine / QNN context binary","kids":[],"w":"弄清「codegen 与打包」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「部署主链路」一个可讲可练的切口，让下面的知识点有归属。","b":"转换只交出图。引擎和编译决定融合、精度策略和能跑的 kernel。编出来才有运行时可调度，否则时延账无处落地。","k":1},{"id":"c3-3","t":"3.3 · 运行时与调度","d":"主题「运行时与调度」管端侧链路里这一段，下含：产物加载、Buffer 管理、异步与异构调度、功耗与温控。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c3-3-1","t":"3.3.1 · 产物加载","d":"产物加载：读取engine/so/context binary，反序列化，冷启动与缓存策略","kids":[],"w":"弄清「产物加载」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c3-3-2","t":"3.3.2 · Buffer 管理","d":"Buffer 管理：tensor分配/对齐/生命周期，复用缓冲减少内存拷贝","kids":[],"w":"弄清「Buffer 管理」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c3-3-3","t":"3.3.3 · 异步与异构调度","d":"异步与异构调度：NPU+GPU+CPU 多核并行，流式管线隐藏等待延迟","kids":[],"w":"弄清「异步与异构调度」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c3-3-4","t":"3.3.4 · 功耗与温控","d":"功耗与温控：考虑功耗墙与降频，避免峰值算力致体验抖动","kids":[],"w":"弄清「功耗与温控」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「部署主链路」一个可讲可练的切口，让下面的知识点有归属。","b":"引擎产物要有人加载、排队列、占核。调度不清，转换和编译再漂亮也交不出时延；主链路到这里才算闭环。","k":0}],"w":"给学习路径一个章节锚点，排障时先回到这一章的目标。","b":"全栈走过，把部署收成转换→引擎编译→运行时三截。这三截通了，才回头补模型和硬件底座，量化才有图可压。","k":0},{"id":"c4","t":"4 · 前置底座","d":"「前置底座」这一章回答端侧部署里一块完整问题。下含主题：大模型核心原理、编程与编译基础、硬件体系结构。先建立章目标，再进 1.x 主题与术语，避免跳着背命令","kids":[{"id":"c4-1","t":"4.1 · 大模型核心原理","d":"主题「大模型核心原理」管端侧链路里这一段，下含：Transformer 架构、多头注意力 MHA、GQA / MQA、FFN 与 SwiGLU、归一化 LayerNorm/RMSNorm、位置编码 RoPE。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c4-1-1","t":"4.1.1 · Transformer 架构","d":"堆叠自注意力 + 前馈块做序列建模的主干。端侧大模型几乎都绕不开它。","kids":[],"w":"后面量化、编译、KV、算子支持，默认都假设图是 Transformer 族。","b":"","k":2},{"id":"c4-1-2","t":"4.1.2 · 多头注意力 MHA","d":"按相关度决定每个位置「看」哪些位置的信息。Transformer 里算力与访存大头之一，后面的融合、KV、量化都围着它转。","kids":[],"w":"性能热点图若扎在 Attention，下一步才是融合、量化或改 GQA/MQA。","b":"","k":1},{"id":"c4-1-3","t":"4.1.3 · GQA / MQA","d":"GQA / MQA：多Q头共享少K/V头，降KV-Cache内存带宽，端侧必用","kids":[],"w":"弄清「GQA / MQA」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c4-1-4","t":"4.1.4 · FFN 与 SwiGLU","d":"FFN 与 SwiGLU：SwiGLU=Swish(xW₁)·(xW₃)，参数量最大，量化收益最明显","kids":[],"w":"弄清「FFN 与 SwiGLU」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c4-1-5","t":"4.1.5 · 归一化 LayerNorm/RMSNorm","d":"归一化 LayerNorm/RMSNorm：RMSNorm仅均方根缩放，常与残差融合为单算子省内存","kids":[],"w":"弄清「归一化 LayerNorm/RMSNorm」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c4-1-6","t":"4.1.6 · 位置编码 RoPE","d":"位置编码 RoPE：旋转位置编码注入相对位置，支持长上下文外推，LLM标配","kids":[],"w":"弄清「位置编码 RoPE」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c4-1-7","t":"4.1.7 · KV-Cache 原理","d":"生成时把已算过的 Key/Value 存起来复用，Decode 就不用整段重算 Attention。省算力，但占内存，长度一长就胀。","kids":[],"w":"端侧长对话的内存墙多半在这：优化吞吐前先算清 KV 占多少。","b":"","k":2},{"id":"c4-1-8","t":"4.1.8 · Tokenizer","d":"Tokenizer：BPE/SentencePiece 子词切分，决定词表与实际tokens/s口径","kids":[],"w":"弄清「Tokenizer」，排障和选型时才知道该动哪一环。","b":"","k":1}],"w":"给「前置底座」一个可讲可练的切口，让下面的知识点有归属。","b":"量化、编译默认假设你懂 Transformer。这段把主干原理立住，编程和硬件才接得上，否则后面全是名词。","k":0},{"id":"c4-2","t":"4.2 · 编程与编译基础","d":"主题「编程与编译基础」管端侧链路里这一段，下含：C++ 核心、Python 与 PyTorch、数据布局 NHWC/NCHW、编译基础概念。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c4-2-1","t":"4.2.1 · C++ 核心","d":"C++ 核心：内存指针、RAII、多线程、模板元编程，推理引擎与自定义算子主用C++","kids":[],"w":"弄清「C++ 核心」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c4-2-2","t":"4.2.2 · Python 与 PyTorch","d":"Python 与 PyTorch：torch.export / torch.onnx.export 导出模型，编写量化验证脚本","kids":[],"w":"弄清「Python 与 PyTorch」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c4-2-3","t":"4.2.3 · 数据布局 NHWC/NCHW","d":"数据布局 NHWC/NCHW：张量内存排布影响访存连续性与NPU算子支持度","kids":[],"w":"弄清「数据布局 NHWC/NCHW」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c4-2-4","t":"4.2.4 · 编译基础概念","d":"编译基础概念：静态图vs动态图、中间表示IR、图编译，理解引擎离线优化空间","kids":[],"w":"削掉多余访存与启动开销，常是性能优化的杠杆。","b":"","k":0}],"w":"给「前置底座」一个可讲可练的切口，让下面的知识点有归属。","b":"原理懂了还要会读写图、编译产物。编译基础齐了，硬件体系才不是缓存和位宽的名词表。","k":0},{"id":"c4-3","t":"4.3 · 硬件体系结构","d":"主题「硬件体系结构」管端侧链路里这一段，下含：处理器类型、存储层次与带宽、Roofline 模型、SIMD / 向量化、车规嵌入式。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c4-3-1","t":"4.3.1 · 处理器类型","d":"处理器类型：CPU/GPU/NPU/DSP 定位差异，异构系统负载分派","kids":[],"w":"弄清「处理器类型」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c4-3-2","t":"4.3.2 · 存储层次与带宽","d":"存储层次与带宽：寄存器→L1/L2→DRAM 逐级延迟，DRAM带宽是端侧最大瓶颈","kids":[],"w":"弄清「存储层次与带宽」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c4-3-3","t":"4.3.3 · Roofline 模型","d":"Roofline 模型：算力-带宽屋顶线判定 compute/memory-bound，指引优化方向","kids":[],"w":"弄清「Roofline 模型」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c4-3-4","t":"4.3.4 · SIMD / 向量化","d":"SIMD / 向量化：把权重/激活从高精度数压到更少比特（如 INT8），换内存与算力，但要守住精度验收。它挂在「前置底座」下的「硬件体系结构」里，后面会拆 scale、校准与 PTQ/QAT","kids":[],"w":"让模型塞进端侧预算，是体积与算力交换精度的主手段。","b":"","k":0},{"id":"c4-3-5","t":"4.3.5 · 车规嵌入式","d":"车规嵌入式：交叉编译、RTOS/HAL、ASIL，内存功耗受限的量产边界","kids":[],"w":"弄清「车规嵌入式」，排障和选型时才知道该动哪一环。","b":"","k":1}],"w":"给「前置底座」一个可讲可练的切口，让下面的知识点有归属。","b":"软件栈要落到核、缓存、带宽上。硬件账清楚，后面量化位宽和 KV 才有物理上限，主链路的时延才解释得通。","k":0}],"w":"给学习路径一个章节锚点，排障时先回到这一章的目标。","b":"主链路默认你会模型、编译、硬件。这段把三块底座补齐，量化章才有物理和数学上限，不会把位宽当软件开关。","k":0},{"id":"c5","t":"5 · 量化与压缩","d":"「量化与压缩」这一章回答端侧部署里一块完整问题。下含主题：量化基础、后训练量化 PTQ、量化感知训练 QAT、低比特进阶 INT4/GPTQ/AWQ、精度评估等。先建立章目标，再进 1.x 主题与术语，避免跳着背命令","kids":[{"id":"c5-1","t":"5.1 · 量化基础","d":"主题「量化基础」管端侧链路里这一段，下含：精度位宽、scale 与 zero-point、对称 vs 非对称、量化粒度、量化公式。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c5-1-1","t":"5.1.1 · 精度位宽","d":"用多少比特存一个数：FP16 / INT8 / INT4 等。位宽越低越省内存和带宽，精度也更容易掉。选档要对齐芯片原生算子和业务验收线，别只看体积。","kids":[],"w":"这是端侧「塞不塞得下」的第一扳手：位宽定了，后面的 scale、校准、性能账才有意义。","b":"","k":1},{"id":"c5-1-2","t":"5.1.2 · scale 与 zero-point","d":"浮点和整数之间的映射参数：scale 管「一格代表多大」，zero-point 管「零点落在哪」。量化对不对，先看这两把尺子稳不稳、有没有通道间乱飘。","kids":[],"w":"尺子歪了，后面 PTQ/QAT 再精也像在歪尺子上雕花——排障优先核对 scale/zp。","b":"","k":2},{"id":"c5-1-3","t":"5.1.3 · 对称 vs 非对称","d":"对称量化以 0 为中心、正负共用一套 scale；非对称带 zero-point，更能贴合一边偏的激活分布。实现复杂度和硬件支持不一样。","kids":[],"w":"激活分布偏不偏，决定你能不能省掉 zp、能不能吃到更快的对称 kernel。","b":"","k":1},{"id":"c5-1-4","t":"5.1.4 · 量化粒度","d":"一组数共享一套量化参数的范围：整张张量一份（per-tensor）还是每个通道一份（per-channel）。粒度越细通常越准，也更吃存储与算子支持。","kids":[],"w":"精度掉点时先问粒度够不够细，再问校准集；很多「INT8 崩了」其实是 per-tensor 扛不住通道差异。","b":"","k":0},{"id":"c5-1-5","t":"5.1.5 · 量化公式","d":"典型形式：实数 ≈ scale × (整数量 − zero-point)。正向量化、反向量化、饱和裁剪都围着这条式子转。","kids":[],"w":"公式是共同语言：和工具链、日志、论文对齐时，先把 scale/zp 定义说清楚再比数值。","b":"","k":0}],"w":"给「量化与压缩」一个可讲可练的切口，让下面的知识点有归属。","b":"压缩这一章先立尺子：位宽、scale、粒度、对称与否。尺子没立，后面 PTQ 校准就是空转；PTQ 过线才值得上 QAT。","k":1},{"id":"c5-2","t":"5.2 · 后训练量化 PTQ","d":"主题「后训练量化 PTQ」管端侧链路里这一段，下含：校准方法、校准集选择、误差来源、scale 优化目标。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c5-2-1","t":"5.2.1 · 校准方法","d":"用一小撮代表数据估激活分布，从而定 scale/阈值。校准集不代表线上分布，后面再精的 PTQ 也救不回来。","kids":[],"w":"PTQ 成败大半看校准：集子要覆盖主路径场景，别用「随手抽的几张图」糊弄。","b":"","k":1},{"id":"c5-2-2","t":"5.2.2 · 校准集选择","d":"用一小撮代表数据估激活分布，从而定 scale/阈值。校准集不代表线上分布，后面再精的 PTQ 也救不回来。","kids":[],"w":"PTQ 成败大半看校准：集子要覆盖主路径场景，别用「随手抽的几张图」糊弄。","b":"","k":1},{"id":"c5-2-3","t":"5.2.3 · 误差来源","d":"量化误差常见三块：裁剪（clip）砍掉长尾、舍入（round）丢小数、权重/激活分布不对称导致同一套参数顾此失彼。","kids":[],"w":"掉点时按这三类拆账，比盲目换算法快：先看是不是 clip 太狠，再看 round 与粒度。","b":"","k":0},{"id":"c5-2-4","t":"5.2.4 · scale 优化目标","d":"浮点和整数之间的映射参数：scale 管「一格代表多大」，zero-point 管「零点落在哪」。量化对不对，先看这两把尺子稳不稳、有没有通道间乱飘。","kids":[],"w":"尺子歪了，后面 PTQ/QAT 再精也像在歪尺子上雕花——排障优先核对 scale/zp。","b":"","k":2}],"w":"给「量化与压缩」一个可讲可练的切口，让下面的知识点有归属。","b":"尺子立住了才做后训练量化：不动原训练、靠校准定 scale。PTQ 仍卡验收线，下一步才是 QAT 伪量化，别一上来重训。","k":0},{"id":"c5-3","t":"5.3 · 量化感知训练 QAT","d":"主题「量化感知训练 QAT」管端侧链路里这一段，下含：伪量化算子、直通估计器 STE、QAT vs PTQ、部署一致性。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c5-3-1","t":"5.3.1 · 伪量化算子","d":"伪量化算子：把权重/激活从高精度数压到更少比特（如 INT8），换内存与算力，但要守住精度验收。它挂在「量化与压缩」下的「量化感知训练 QAT」里，后面会拆 scale、校准与 PTQ/QAT","kids":[],"w":"让模型塞进端侧预算，是体积与算力交换精度的主手段。","b":"","k":1},{"id":"c5-3-2","t":"5.3.2 · 直通估计器 STE","d":"直通估计器 STE：反传梯度绕过 round，使量化参数可训练","kids":[],"w":"弄清「直通估计器 STE」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c5-3-3","t":"5.3.3 · QAT vs PTQ","d":"训练结束后再量化，基本不动原训练流程。上线快，但对校准和可量化图结构敏感。","kids":[],"w":"端侧赶工默认先 PTQ；精度不够再考虑 QAT 或混合精度，别一上来就重训。","b":"","k":1},{"id":"c5-3-4","t":"5.3.4 · 部署一致性","d":"部署一致性：训练伪量化细节须与推理引擎量化对齐，否则精度失真","kids":[],"w":"弄清「部署一致性」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「量化与压缩」一个可讲可练的切口，让下面的知识点有归属。","b":"PTQ 走不通才插入伪量化重训。QAT 更准也更贵；过了 INT8 舒适区，低比特 INT4/GPTQ 还要另开一档验收。","k":0},{"id":"c5-4","t":"5.4 · 低比特进阶 INT4/GPTQ/AWQ","d":"主题「低比特进阶 INT4/GPTQ/AWQ」管端侧链路里这一段，下含：INT4 量化、GPTQ、AWQ、SmoothQuant、LLM.int8() 与混合精度。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c5-4-1","t":"5.4.1 · INT4 量化","d":"INT4 量化：把权重/激活从高精度数压到更少比特（如 INT8），换内存与算力，但要守住精度验收。它挂在「量化与压缩」下的「低比特进阶 INT4/GPTQ/AWQ」里，后面会拆 scale、校准与 PTQ/QAT","kids":[],"w":"让模型塞进端侧预算，是体积与算力交换精度的主手段。","b":"","k":1},{"id":"c5-4-2","t":"5.4.2 · GPTQ","d":"训练结束后再量化，基本不动原训练流程。上线快，但对校准和可量化图结构敏感。","kids":[],"w":"端侧赶工默认先 PTQ；精度不够再考虑 QAT 或混合精度，别一上来就重训。","b":"","k":1},{"id":"c5-4-3","t":"5.4.3 · AWQ","d":"AWQ：激活感知权重缩放，仅保护显著通道，无需重训","kids":[],"w":"弄清「AWQ」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c5-4-4","t":"5.4.4 · SmoothQuant","d":"SmoothQuant：激活离群值平滑迁移至权重，解决激活难量化，配INT8激活","kids":[],"w":"弄清「SmoothQuant」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c5-4-5","t":"5.4.5 · LLM.int8() 与混合精度","d":"LLM.int8() 与混合精度：一种具体数值精度/位宽选择；选哪档直接决定内存、速度与精度三角怎么折中。它挂在「量化与压缩」下的「低比特进阶 INT4/GPTQ/AWQ」里，要和硬件原生能力对齐","kids":[],"w":"让模型塞进端侧预算，是体积与算力交换精度的主手段。","b":"","k":0}],"w":"给「量化与压缩」一个可讲可练的切口，让下面的知识点有归属。","b":"尺子立住了才做后训练量化：不动原训练、靠校准定 scale。PTQ 仍卡验收线，下一步才是 QAT 伪量化，别一上来重训。","k":0},{"id":"c5-5","t":"5.5 · 精度评估","d":"主题「精度评估」管端侧链路里这一段，下含：困惑度 Perplexity、任务指标、逐层误差分析、异常值处理。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c5-5-1","t":"5.5.1 · 困惑度 Perplexity","d":"困惑度 Perplexity：语言生成通用指标，越低越好，量化退化常用它衡量","kids":[],"w":"弄清「困惑度 Perplexity」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c5-5-2","t":"5.5.2 · 任务指标","d":"任务指标：MMLU/GSM8K/问答/代码等下游任务准确率对比","kids":[],"w":"弄清「任务指标」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c5-5-3","t":"5.5.3 · 逐层误差分析","d":"逐层误差分析：对比量化前后同输入输出，定位精度损失热点层","kids":[],"w":"弄清「逐层误差分析」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c5-5-4","t":"5.5.4 · 异常值处理","d":"异常值处理：识别隔离影响巨大的权重/激活离群值 outlier","kids":[],"w":"弄清「异常值处理」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「量化与压缩」一个可讲可练的切口，让下面的知识点有归属。","b":"低比特有没有掉点，要有任务级尺子，不能只看 loss。评估过了才谈蒸馏剪枝等轻量化，否则在已经糊的模型上继续压。","k":0},{"id":"c5-6","t":"5.6 · 轻量化技术","d":"主题「轻量化技术」管端侧链路里这一段，下含：剪枝、N:M 稀疏、知识蒸馏、低秩分解、组合拳。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c5-6-1","t":"5.6.1 · 剪枝","d":"剪枝：结构化(通道/头/层)与非结构化稀疏，结构化更适合端侧加速","kids":[],"w":"在精度可接受前提下继续减负，和服务端同款大模型打配合。","b":"","k":1},{"id":"c5-6-2","t":"5.6.2 · N:M 稀疏","d":"N:M 稀疏：每M个权重保留N非零，配合硬件稀疏加速器","kids":[],"w":"弄清「N:M 稀疏」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c5-6-3","t":"5.6.3 · 知识蒸馏","d":"用大模型教小模型学分布或中间特征，换更小体积仍够用的效果。常与量化、剪枝搭着用。","kids":[],"w":"体积还差一截、精度又不能再砍时，蒸馏是「换结构」而不是「换比特」。","b":"","k":1},{"id":"c5-6-4","t":"5.6.4 · 低秩分解","d":"低秩分解：落在「轻量化技术」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数","kids":[],"w":"弄清「低秩分解」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c5-6-5","t":"5.6.5 · 组合拳","d":"组合拳：量化+剪枝/蒸馏+结构化联合优化，端侧量产常用","kids":[],"w":"弄清「组合拳」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「量化与压缩」一个可讲可练的切口，让下面的知识点有归属。","b":"比特砍完体积还不够，才蒸馏、剪枝并与量化协同。轻量化是换结构，不是再拧一次 scale；组合拳打完这章才收口。","k":0}],"w":"给学习路径一个章节锚点，排障时先回到这一章的目标。","b":"底座齐了才动比特。先立量化尺子，再 PTQ/QAT/低比特，最后用精度评估和轻量化收口，附录才摊公式。","k":1},{"id":"c6","t":"6 · 附录 · 量化数学与校准细则","d":"「附录 · 量化数学与校准细则」这一章回答端侧部署里一块完整问题。下含主题：量化基本原理与数学公式、Per-tensor 与 Per-channel 量化粒度、校准集（标定数据）的设计与要求、校准方法：MinMax、KL 散度、Percentile、En…、PTQ 训练后量化完整流程等","kids":[{"id":"c6-1","t":"6.1 · 量化基本原理与数学公式","d":"主题「量化基本原理与数学公式」管端侧链路里这一段，下含：量化映射、核心公式、对称 zp=0、范围[-128,127]、scale、非对称 zp≠0、范围[0,255]，适合 ReLU、round 不可导与 STE、scale 决定误差。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c6-1-1","t":"6.1.1 · 量化映射","d":"典型形式：实数 ≈ scale × (整数量 − zero-point)。正向量化、反向量化、饱和裁剪都围着这条式子转。","kids":[],"w":"公式是共同语言：和工具链、日志、论文对齐时，先把 scale/zp 定义说清楚再比数值。","b":"","k":0},{"id":"c6-1-2","t":"6.1.2 · 核心公式","d":"核心公式：q=round(r/scale)+zero_point，反量化 r=(q-zero_point)×scale","kids":[],"w":"弄清「核心公式」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c6-1-3","t":"6.1.3 · 对称 zp=0、范围[-128,127]、scale","d":"浮点和整数之间的映射参数：scale 管「一格代表多大」，zero-point 管「零点落在哪」。量化对不对，先看这两把尺子稳不稳、有没有通道间乱飘。","kids":[],"w":"尺子歪了，后面 PTQ/QAT 再精也像在歪尺子上雕花——排障优先核对 scale/zp。","b":"","k":1},{"id":"c6-1-4","t":"6.1.4 · 非对称 zp≠0、范围[0,255]，适合 ReLU","d":"对称量化以 0 为中心、正负共用一套 scale；非对称带 zero-point，更能贴合一边偏的激活分布。实现复杂度和硬件支持不一样。","kids":[],"w":"激活分布偏不偏，决定你能不能省掉 zp、能不能吃到更快的对称 kernel。","b":"","k":1},{"id":"c6-1-5","t":"6.1.5 · round 不可导与 STE","d":"量化误差常见三块：裁剪（clip）砍掉长尾、舍入（round）丢小数、权重/激活分布不对称导致同一套参数顾此失彼。","kids":[],"w":"掉点时按这三类拆账，比盲目换算法快：先看是不是 clip 太狠，再看 round 与粒度。","b":"","k":1},{"id":"c6-1-6","t":"6.1.6 · scale 决定误差","d":"浮点和整数之间的映射参数：scale 管「一格代表多大」，zero-point 管「零点落在哪」。量化对不对，先看这两把尺子稳不稳、有没有通道间乱飘。","kids":[],"w":"尺子歪了，后面 PTQ/QAT 再精也像在歪尺子上雕花——排障优先核对 scale/zp。","b":"","k":1},{"id":"c6-1-7","t":"6.1.7 · 符号约定","d":"符号约定：Int-X-Y 首位为权重位数、次位激活位数","kids":[],"w":"弄清「符号约定」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「附录 · 量化数学与校准细则」一个可讲可练的切口，让下面的知识点有归属。","b":"前面量化章讲怎么做，这段把映射公式摊开。公式清了才谈 per-tensor/per-channel，否则粒度和校准都在瞎调参数。","k":0},{"id":"c6-2","t":"6.2 · Per-tensor 与 Per-channel 量化粒度","d":"主题「Per-tensor 与 Per-channel 量化粒度」管端侧链路里这一段，下含：Per-tensor 共享一组 scale/zp，实、Per-channel 每输出通道独立 scale/、权重 per-channel + 激活 per-te、TensorRT、PyTorch QAT 均遵循此策。","kids":[{"id":"c6-2-1","t":"6.2.1 · Per-tensor 共享一组 scale/zp，实","d":"浮点和整数之间的映射参数：scale 管「一格代表多大」，zero-point 管「零点落在哪」。量化对不对，先看这两把尺子稳不稳、有没有通道间乱飘。","kids":[],"w":"尺子歪了，后面 PTQ/QAT 再精也像在歪尺子上雕花——排障优先核对 scale/zp。","b":"","k":1},{"id":"c6-2-2","t":"6.2.2 · Per-channel 每输出通道独立 scale/","d":"浮点和整数之间的映射参数：scale 管「一格代表多大」，zero-point 管「零点落在哪」。量化对不对，先看这两把尺子稳不稳、有没有通道间乱飘。","kids":[],"w":"尺子歪了，后面 PTQ/QAT 再精也像在歪尺子上雕花——排障优先核对 scale/zp。","b":"","k":1},{"id":"c6-2-3","t":"6.2.3 · 权重 per-channel + 激活 per-te","d":"一组数共享一套量化参数的范围：整张张量一份（per-tensor）还是每个通道一份（per-channel）。粒度越细通常越准，也更吃存储与算子支持。","kids":[],"w":"精度掉点时先问粒度够不够细，再问校准集；很多「INT8 崩了」其实是 per-tensor 扛不住通道差异。","b":"","k":1},{"id":"c6-2-4","t":"6.2.4 · TensorRT、PyTorch QAT 均遵循此策","d":"训练时插入伪量化，让网络提前适应低比特。精度通常更好，成本和工具链更重。","kids":[],"w":"当 PTQ 卡在验收线以下、又有训练资源时再上；它不是免费午餐。","b":"","k":2}],"w":"给「附录 · 量化数学与校准细则」一个可讲可练的切口，让下面的知识点有归属。","b":"公式有了，粒度决定一套参数管多宽。粒度选完，校准集才知道要覆盖什么分布；粒度错了，后面校准方法再精也救不回来。","k":0},{"id":"c6-3","t":"6.3 · 校准集（标定数据）的设计与要求","d":"主题「校准集（标定数据）的设计与要求」管端侧链路里这一段，下含：PTQ 前向收集激活 min/max 分布，计算 s、数量 100-500 张，覆盖真实场景分布、np.concatenate 复制填充到目标 bat、海思 DDK 经 config.protxt 指定，。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c6-3-1","t":"6.3.1 · PTQ 前向收集激活 min/max 分布，计算 s","d":"训练结束后再量化，基本不动原训练流程。上线快，但对校准和可量化图结构敏感。","kids":[],"w":"端侧赶工默认先 PTQ；精度不够再考虑 QAT 或混合精度，别一上来就重训。","b":"","k":2},{"id":"c6-3-2","t":"6.3.2 · 数量 100-500 张，覆盖真实场景分布","d":"数量 100-500 张，覆盖真实场景分布：数量 100-500 张，覆盖真实场景分布","kids":[],"w":"弄清「数量 100-500 张，覆盖真实场景分布」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c6-3-3","t":"6.3.3 · np.concatenate 复制填充到目标 bat","d":"np.concatenate 复制填充到目标 bat：np.concatenate 复制填充到目标 batch，存 input.bin","kids":[],"w":"弄清「np.concatenate 复制填充到目标 bat」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c6-3-4","t":"6.3.4 · 海思 DDK 经 config.protxt 指定，","d":"海思 DDK 经 config.protxt 指定，：由 dopt_so.py --cal_conf 加载","kids":[],"w":"弄清「海思 DDK 经 config.protxt 指定，」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「附录 · 量化数学与校准细则」一个可讲可练的切口，让下面的知识点有归属。","b":"粒度定了，校准集必须代表线上分布。集子歪了，MinMax/KL 再精也定不出可用 scale，PTQ 流程会整段空转。","k":0},{"id":"c6-4","t":"6.4 · 校准方法：MinMax、KL 散度、Percentile、En…","d":"主题「校准方法：MinMax、KL 散度、Percentile、En…」管端侧链路里这一段，下含：MinMax、找阈值使量化前后 KL(P||Q) 最小，Tenso、KL(P||Q)=ΣP(x)·log(P(x)/Q(、Percentile/Entropy。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c6-4-1","t":"6.4.1 · MinMax","d":"MinMax：落在「校准方法：MinMax、KL 散度、Percentile、En…」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数","kids":[],"w":"弄清「MinMax」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c6-4-2","t":"6.4.2 · 找阈值使量化前后 KL(P||Q) 最小，Tenso","d":"找阈值使量化前后 KL(P||Q) 最小，Tenso：把权重/激活从高精度数压到更少比特（如 INT8），换内存与算力，但要守住精度验收。它挂在「附录 · 量化数学与校准细则」下的「校准方法：MinMax、KL 散度、Percentile、En…」里，后面会拆 scale、校准与 PTQ/QAT","kids":[],"w":"让模型塞进端侧预算，是体积与算力交换精度的主手段。","b":"","k":1},{"id":"c6-4-3","t":"6.4.3 · KL(P||Q)=ΣP(x)·log(P(x)/Q(","d":"KL(P||Q)=ΣP(x)·log(P(x)/Q(：KL(P||Q)=ΣP(x)·log(P(x)/Q(x))","kids":[],"w":"弄清「KL(P||Q)=ΣP(x)·log(P(x)/Q(」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c6-4-4","t":"6.4.4 · Percentile/Entropy","d":"Percentile/Entropy：Percentile 取百分位阈值跳过极端尾部，Entropy 与 KL 同族","kids":[],"w":"弄清「Percentile/Entropy」，排障和选型时才知道该动哪一环。","b":"","k":1}],"w":"给「附录 · 量化数学与校准细则」一个可讲可练的切口，让下面的知识点有归属。","b":"有了合格校准集，才选 MinMax、KL、百分位。方法定了，PTQ 才能按步复现；方法没选稳，完整流程只是把错误跑一遍。","k":0},{"id":"c6-5","t":"6.5 · PTQ 训练后量化完整流程","d":"主题「PTQ 训练后量化完整流程」管端侧链路里这一段，下含：训练后直接量化，速度快、INT8 常掉 1-3%、标准流程：FP32→标定→统计分布→算 scale/、gpu_quant.py 配置→input.bin→、dopt_so.py 关键参数 --framewor、精度修复清单。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c6-5-1","t":"6.5.1 · 训练后直接量化，速度快、INT8 常掉 1-3%","d":"训练后直接量化，速度快、INT8 常掉 1-3%：把权重/激活从高精度数压到更少比特（如 INT8），换内存与算力，但要守住精度验收。它挂在「附录 · 量化数学与校准细则」下的「PTQ 训练后量化完整流程」里，后面会拆 scale、校准与 PTQ/QAT","kids":[],"w":"让模型塞进端侧预算，是体积与算力交换精度的主手段。","b":"","k":0},{"id":"c6-5-2","t":"6.5.2 · 标准流程：FP32→标定→统计分布→算 scale/","d":"浮点和整数之间的映射参数：scale 管「一格代表多大」，zero-point 管「零点落在哪」。量化对不对，先看这两把尺子稳不稳、有没有通道间乱飘。","kids":[],"w":"尺子歪了，后面 PTQ/QAT 再精也像在歪尺子上雕花——排障优先核对 scale/zp。","b":"","k":0},{"id":"c6-5-3","t":"6.5.3 · gpu_quant.py 配置→input.bin→","d":"gpu_quant.py 配置→input.bin→：config.protxt→dopt_so.py→修重名→OMC","kids":[],"w":"弄清「gpu_quant.py 配置→input.bin→」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c6-5-4","t":"6.5.4 · dopt_so.py 关键参数 --framewor","d":"dopt_so.py 关键参数 --framewor：k 5(--cal_conf/--compress_conf)","kids":[],"w":"弄清「dopt_so.py 关键参数 --framewor」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c6-5-5","t":"6.5.5 · 精度修复清单","d":"精度修复清单：保准好数据→KL 校准→per-channel→敏感层留 FP16/INT16→QAT→蒸馏","kids":[],"w":"弄清「精度修复清单」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「附录 · 量化数学与校准细则」一个可讲可练的切口，让下面的知识点有归属。","b":"先把校准方法的验收做实，这段把PTQ 训练后量化完整流程补上；下一步才动QAT 量化感知训练那层，否则容易跳步。","k":1},{"id":"c6-6","t":"6.6 · QAT 量化感知训练：STE 与 FakeQuant","d":"主题「QAT 量化感知训练：STE 与 FakeQuant」管端侧链路里这一段，下含：STE 直通估计器、FakeQuant 伪量化、PyTorch 官方 QAT 采用 STE；BN 折、学习率取原 1/10，训练 3-10 epoch，m、导出需去 FakeQuant、固化 scale、真量。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c6-6-1","t":"6.6.1 · STE 直通估计器","d":"STE 直通估计器：前向真实量化、反向梯度直接传回（视为1而非0）","kids":[],"w":"弄清「STE 直通估计器」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c6-6-2","t":"6.6.2 · FakeQuant 伪量化","d":"训练时插入伪量化，让网络提前适应低比特。精度通常更好，成本和工具链更重。","kids":[],"w":"当 PTQ 卡在验收线以下、又有训练资源时再上；它不是免费午餐。","b":"","k":1},{"id":"c6-6-3","t":"6.6.3 · PyTorch 官方 QAT 采用 STE；BN 折","d":"训练时插入伪量化，让网络提前适应低比特。精度通常更好，成本和工具链更重。","kids":[],"w":"当 PTQ 卡在验收线以下、又有训练资源时再上；它不是免费午餐。","b":"","k":1},{"id":"c6-6-4","t":"6.6.4 · 学习率取原 1/10，训练 3-10 epoch，m","d":"学习率取原 1/10，训练 3-10 epoch，m：学习率取原 1/10，训练 3-10 epoch，mAP early stopping","kids":[],"w":"弄清「学习率取原 1/10，训练 3-10 epoch，m」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c6-6-5","t":"6.6.5 · 导出需去 FakeQuant、固化 scale、真量","d":"浮点和整数之间的映射参数：scale 管「一格代表多大」，zero-point 管「零点落在哪」。量化对不对，先看这两把尺子稳不稳、有没有通道间乱飘。","kids":[],"w":"尺子歪了，后面 PTQ/QAT 再精也像在歪尺子上雕花——排障优先核对 scale/zp。","b":"","k":1}],"w":"给「附录 · 量化数学与校准细则」一个可讲可练的切口，让下面的知识点有归属。","b":"PTQ 流程跑通仍掉点，才上伪量化与 STE。QAT 会把尺子也卷进训练，后面 LSQ/PACT 才有地方接，低比特另算。","k":1},{"id":"c6-7","t":"6.7 · scale 选择与学习式量化：LSQ、PACT、混合精度","d":"主题「scale 选择与学习式量化：LSQ、PACT、混合精度」管端侧链路里这一段，下含：长尾分布问题、LSQ、PACT、量化坍陷与敏感度、混合精度。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c6-7-1","t":"6.7.1 · 长尾分布问题","d":"长尾分布问题：少数异常值拉大 scale，使主体量化粗糙","kids":[],"w":"弄清「长尾分布问题」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c6-7-2","t":"6.7.2 · LSQ","d":"LSQ：scale 作为 nn.Parameter 梯度下降，通常提升 0.5-1% mAP","kids":[],"w":"弄清「LSQ」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c6-7-3","t":"6.7.3 · PACT","d":"PACT：激活裁剪到可学习阈值 α，砍异常尾部换取主体精细","kids":[],"w":"弄清「PACT」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c6-7-4","t":"6.7.4 · 量化坍陷与敏感度","d":"量化坍陷与敏感度：把权重/激活从高精度数压到更少比特（如 INT8），换内存与算力，但要守住精度验收。它挂在「附录 · 量化数学与校准细则」下的「scale 选择与学习式量化：LSQ、PACT、混合精度」里，后面会拆 scale、校准与 PTQ/QAT","kids":[],"w":"让模型塞进端侧预算，是体积与算力交换精度的主手段。","b":"","k":0},{"id":"c6-7-5","t":"6.7.5 · 混合精度","d":"混合精度：敏感层 FP16、不敏感层 INT8；跳过首层 Conv 与末6层检测头","kids":[],"w":"弄清「混合精度」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「附录 · 量化数学与校准细则」一个可讲可练的切口，让下面的知识点有归属。","b":"QAT 里 scale 不再手估。学习式量化把尺子也训进去，激活长尾的难点才会暴露，下一步才轮到 SmoothQuant 挪难度。","k":1},{"id":"c6-8","t":"6.8 · 激活量化的难点与 SmoothQuant","d":"主题「激活量化的难点与 SmoothQuant」管端侧链路里这一段，下含：激活量化难点、SmoothQuant、激活层选择。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c6-8-1","t":"6.8.1 · 激活量化难点","d":"激活量化难点：把权重/激活从高精度数压到更少比特（如 INT8），换内存与算力，但要守住精度验收。它挂在「附录 · 量化数学与校准细则」下的「激活量化的难点与 SmoothQuant」里，后面会拆 scale、校准与 PTQ/QAT","kids":[],"w":"让模型塞进端侧预算，是体积与算力交换精度的主手段。","b":"","k":0},{"id":"c6-8-2","t":"6.8.2 · SmoothQuant","d":"SmoothQuant：量化迁移：数学等价变换把激活难度迁到权重侧，适配 W8A8","kids":[],"w":"弄清「SmoothQuant」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c6-8-3","t":"6.8.3 · 激活层选择","d":"激活层选择：ReLU 适合非对称量化；SiLU/Sigmoid 值域窄需更细 scale","kids":[],"w":"弄清「激活层选择」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「附录 · 量化数学与校准细则」一个可讲可练的切口，让下面的知识点有归属。","b":"scale 可学之后，激活长尾仍会打爆 INT8。SmoothQuant 把难度挪到权重，Weight-only/GPTQ 那条才接得上。","k":0},{"id":"c6-9","t":"6.9 · Weight-only 量化：GPTQ（Hessian 补偿）…","d":"主题「Weight-only 量化：GPTQ（Hessian 补偿）…」管端侧链路里这一段，下含：Weight-only 路线、GPTQ、AWQ、部署配套。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c6-9-1","t":"6.9.1 · Weight-only 路线","d":"Weight-only 路线：只压权重如 W4A16/W8A16，激活保高精度，LLM 减内存主流","kids":[],"w":"弄清「Weight-only 路线」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c6-9-2","t":"6.9.2 · GPTQ","d":"训练结束后再量化，基本不动原训练流程。上线快，但对校准和可量化图结构敏感。","kids":[],"w":"端侧赶工默认先 PTQ；精度不够再考虑 QAT 或混合精度，别一上来就重训。","b":"","k":1},{"id":"c6-9-3","t":"6.9.3 · AWQ","d":"AWQ：激活感知，保护约 1% 关键通道，为其单独选 scale","kids":[],"w":"弄清「AWQ」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c6-9-4","t":"6.9.4 · 部署配套","d":"部署配套：与 KV Cache 显存优化联合；配 llama.cpp/GGUF、MindIE 落地","kids":[],"w":"弄清「部署配套」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「附录 · 量化数学与校准细则」一个可讲可练的切口，让下面的知识点有归属。","b":"尺子立住了才做后训练量化：不动原训练、靠校准定 scale。PTQ 仍卡验收线，下一步才是 QAT 伪量化，别一上来重训。","k":0},{"id":"c6-10","t":"6.10 · 精度评估：余弦相似度、平均绝对偏差与任务级指标","d":"主题「精度评估：余弦相似度、平均绝对偏差与任务级指标」管端侧链路里这一段，下含：三层评估体系、余弦相似度 cos=(A·B)/(||A||·||B、ave_diff=Σ|A-B|/Σ|A|×100%，、YOLO 用 IoU=0.45、conf=0.4 跑、综合标准：cos>99%、偏差<5%、mAP 降<3。","kids":[{"id":"c6-10-1","t":"6.10.1 · 三层评估体系","d":"三层评估体系：张量级逐层输出、特征级中间图、任务级 mAP","kids":[],"w":"弄清「三层评估体系」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c6-10-2","t":"6.10.2 · 余弦相似度 cos=(A·B)/(||A||·||B","d":"余弦相似度 cos=(A·B)/(||A||·||B：余弦相似度 cos=(A·B)/(||A||·||B||)，>99% 达标","kids":[],"w":"弄清「余弦相似度 cos=(A·B)/(||A||·||B」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c6-10-3","t":"6.10.3 · ave_diff=Σ|A-B|/Σ|A|×100%，","d":"ave_diff=Σ|A-B|/Σ|A|×100%，：ave_diff=Σ|A-B|/Σ|A|×100%，<5% 良好","kids":[],"w":"弄清「ave_diff=Σ|A-B|/Σ|A|×100%，」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c6-10-4","t":"6.10.4 · YOLO 用 IoU=0.45、conf=0.4 跑","d":"YOLO 用 IoU=0.45、conf=0.4 跑：YOLO 用 IoU=0.45、conf=0.4 跑验证集，下降应 <3%","kids":[],"w":"弄清「YOLO 用 IoU=0.45、conf=0.4 跑」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c6-10-5","t":"6.10.5 · 综合标准：cos>99%、偏差<5%、mAP 降<3","d":"综合标准：cos>99%、偏差<5%、mAP 降<3：综合标准：cos>99%、偏差<5%、mAP 降<3%、检测头>99.5%","kids":[],"w":"弄清「综合标准：cos>99%、偏差<5%、mAP 降<3」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「附录 · 量化数学与校准细则」一个可讲可练的切口，让下面的知识点有归属。","b":"低比特有没有掉点，要有任务级尺子，不能只看 loss。评估过了才谈蒸馏剪枝等轻量化，否则在已经糊的模型上继续压。","k":0},{"id":"c6-11","t":"6.11 · LLM 精度评估：Perplexity 与 MMLU 等在生成…","d":"主题「LLM 精度评估：Perplexity 与 MMLU 等在生成…」管端侧链路里这一段，下含：LLM 专用指标、部署指标、评估纪律。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c6-11-1","t":"6.11.1 · LLM 专用指标","d":"LLM 专用指标：Perplexity 度量建模能力、PPL 越低越好；MMLU/GSM8K 看 accuracy 跌幅","kids":[],"w":"弄清「LLM 专用指标」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c6-11-2","t":"6.11.2 · 部署指标","d":"部署指标：TTFT/TPOT/tokens/s 吞吐/KV Cache 显存，Prefill 计算密集、Decode 访存密集","kids":[],"w":"弄清「部署指标」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c6-11-3","t":"6.11.3 · 评估纪律","d":"评估纪律：固定 seed、eval 模式与统一预处理/后处理","kids":[],"w":"弄清「评估纪律」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「附录 · 量化数学与校准细则」一个可讲可练的切口，让下面的知识点有归属。","b":"CV 的 top-1 看不准生成质量。PPL/MMLU 才是 LLM 量化验收；过了这层，蒸馏剪枝协同才有资格上，否则在糊输出上继续压。","k":0},{"id":"c6-12","t":"6.12 · 轻量化组合：知识蒸馏、剪枝与量化的协同","d":"主题「轻量化组合：知识蒸馏、剪枝与量化的协同」管端侧链路里这一段，下含：三术定位、蒸馏分类、结构化剪枝→蒸馏→量化→ONNX→OMC→部署、剪枝按 L1 范数，通道数对齐 4/8/16 倍数。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c6-12-1","t":"6.12.1 · 三术定位","d":"三术定位：剪枝减参数、蒸馏提小模型精度、量化降比特（FP32→INT8 省75%内存）","kids":[],"w":"弄清「三术定位」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c6-12-2","t":"6.12.2 · 蒸馏分类","d":"用大模型教小模型学分布或中间特征，换更小体积仍够用的效果。常与量化、剪枝搭着用。","kids":[],"w":"体积还差一截、精度又不能再砍时，蒸馏是「换结构」而不是「换比特」。","b":"","k":0},{"id":"c6-12-3","t":"6.12.3 · 结构化剪枝→蒸馏→量化→ONNX→OMC→部署","d":"跨框架中间格式，常作训练框架到推理引擎的交接面。图对不对、算子齐不齐，先在这里验。","kids":[],"w":"转换失败优先查 ONNX：动态 shape、自定义算子、opset 版本。","b":"","k":2},{"id":"c6-12-4","t":"6.12.4 · 剪枝按 L1 范数，通道数对齐 4/8/16 倍数","d":"剪枝按 L1 范数，通道数对齐 4/8/16 倍数：剪枝按 L1 范数，通道数对齐 4/8/16 倍数","kids":[],"w":"在精度可接受前提下继续减负，和服务端同款大模型打配合。","b":"","k":1}],"w":"给「附录 · 量化数学与校准细则」一个可讲可练的切口，让下面的知识点有归属。","b":"比特砍完体积还不够，才蒸馏、剪枝并与量化协同。轻量化是换结构，不是再拧一次 scale；组合拳打完这章才收口。","k":1}],"w":"给学习路径一个章节锚点，排障时先回到这一章的目标。","b":"量化流程章讲怎么做，附录把公式、粒度、校准数学摊开。数学清了，性能优化才不会在糊模型上抠时延。","k":0},{"id":"c7","t":"7 · 推理性能优化","d":"「推理性能优化」这一章回答端侧部署里一块完整问题。下含主题：性能分析定位瓶颈、计算图优化与算子融合、KV-Cache 动态内存管理、内存带宽与 DDR 优化、Token 生成速度优化等。先建立章目标，再进 1.x 主题与术语，避免跳着背命令","kids":[{"id":"c7-1","t":"7.1 · 性能分析定位瓶颈","d":"主题「性能分析定位瓶颈」管端侧链路里这一段，下含：性能工具、关键指标、Roofline 判断、阶段拆分、回归基准。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c7-1-1","t":"7.1.1 · 性能工具","d":"性能工具：高通QNN Profiler / NVIDIA Nsight / TensorRT Profiler 逐算子耗时","kids":[],"w":"弄清「性能工具」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c7-1-2","t":"7.1.2 · 关键指标","d":"关键指标：FLOPs、MACs、实际带宽占用、算子时延、总时延","kids":[],"w":"弄清「关键指标」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c7-1-3","t":"7.1.3 · Roofline 判断","d":"Roofline 判断：画算力-带宽屋顶线，判定 compute-bound 或 memory-bound","kids":[],"w":"弄清「Roofline 判断」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c7-1-4","t":"7.1.4 · 阶段拆分","d":"阶段拆分：prefill(计算密集)与decode(访存密集)分开分析，手段不同","kids":[],"w":"弄清「阶段拆分」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c7-1-5","t":"7.1.5 · 回归基准","d":"回归基准：落在「性能分析定位瓶颈」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数","kids":[],"w":"弄清「回归基准」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「推理性能优化」一个可讲可练的切口，让下面的知识点有归属。","b":"量化过线才谈快。先 profiler 定位热点，再动融合或 KV，别一上来改 kernel；找错瓶颈，后面每一招都在空转。","k":0},{"id":"c7-2","t":"7.2 · 计算图优化与算子融合","d":"主题「计算图优化与算子融合」管端侧链路里这一段，下含：算子融合、执行重排序、内存复用。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c7-2-1","t":"7.2.1 · 算子融合","d":"把相邻小算子并成一次 kernel，少写中间结果、少启动开销。编译器/引擎优化的常规招。","kids":[],"w":"Profiling 见一串碎算子，优先问能不能融合，再谈换精度。","b":"","k":1},{"id":"c7-2-2","t":"7.2.2 · 执行重排序","d":"执行重排序：调整执行顺序优化缓冲区复用与数据局部性","kids":[],"w":"弄清「执行重排序」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c7-2-3","t":"7.2.3 · 内存复用","d":"内存复用：落在「计算图优化与算子融合」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数","kids":[],"w":"弄清「内存复用」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「推理性能优化」一个可讲可练的切口，让下面的知识点有归属。","b":"瓶颈若在碎算子，先融合少写回。融合完 KV 内存墙才会露出来；没定位就融，容易把精度和动态 shape 一起融坏。","k":1},{"id":"c7-3","t":"7.3 · KV-Cache 动态内存管理","d":"主题「KV-Cache 动态内存管理」管端侧链路里这一段，下含：Paged KV Cache、KV 量化、GQA 与结构瘦身、前缀共享、内存池。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c7-3-1","t":"7.3.1 · Paged KV Cache","d":"生成时把已算过的 Key/Value 存起来复用，Decode 就不用整段重算 Attention。省算力，但占内存，长度一长就胀。","kids":[],"w":"端侧长对话的内存墙多半在这：优化吞吐前先算清 KV 占多少。","b":"","k":2},{"id":"c7-3-2","t":"7.3.2 · KV 量化","d":"KV 量化：KV Cache：生成时把已算过的 Key/Value 存起来复用，Decode 就不用整段重算 Attention。它挂在「推理性能优化」下的「KV-Cache 动态内存管理」里，后面谈 TTFT/吞吐时会反复用到它","kids":[],"w":"决定 Decode 能否复用历史状态，直接影响吞吐与显存/内存占用。","b":"","k":1},{"id":"c7-3-3","t":"7.3.3 · GQA 与结构瘦身","d":"GQA 与结构瘦身：落在「KV-Cache 动态内存管理」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数","kids":[],"w":"弄清「GQA 与结构瘦身」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c7-3-4","t":"7.3.4 · 前缀共享","d":"前缀共享：多请求共享 system prompt 前缀 KV，省重复计算存储","kids":[],"w":"弄清「前缀共享」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c7-3-5","t":"7.3.5 · 内存池","d":"内存池：预分配大块连续内存按页管理，减少malloc抖动","kids":[],"w":"弄清「内存池」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「推理性能优化」一个可讲可练的切口，让下面的知识点有归属。","b":"图优化省的是计算，长对话吃的是 KV。缓存账管住了再抠 DDR 带宽；KV 没算清，Token 速度优化只是加核空转。","k":1},{"id":"c7-4","t":"7.4 · 内存带宽与 DDR 优化","d":"主题「内存带宽与 DDR 优化」管端侧链路里这一段，下含：数据布局、DDR burst 与对齐、weight 重排、INT4 打包解包、预取与异步。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c7-4-1","t":"7.4.1 · 数据布局","d":"数据布局：NHWC vs NCHW vs tiled，匹配硬件访存模式","kids":[],"w":"弄清「数据布局」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c7-4-2","t":"7.4.2 · DDR burst 与对齐","d":"DDR burst 与对齐：访存对齐 burst 长度，避免跨burst低效读写","kids":[],"w":"弄清「DDR burst 与对齐」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c7-4-3","t":"7.4.3 · weight 重排","d":"weight 重排：落在「内存带宽与 DDR 优化」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数","kids":[],"w":"弄清「weight 重排」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c7-4-4","t":"7.4.4 · INT4 打包解包","d":"INT4 打包解包：一种具体数值精度/位宽选择；选哪档直接决定内存、速度与精度三角怎么折中。它挂在「推理性能优化」下的「内存带宽与 DDR 优化」里，要和硬件原生能力对齐","kids":[],"w":"让模型塞进端侧预算，是体积与算力交换精度的主手段。","b":"","k":1},{"id":"c7-4-5","t":"7.4.5 · 预取与异步","d":"预取与异步：prefetch/DMA异步隐藏访存延迟，提cache命中率","kids":[],"w":"弄清「预取与异步」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「推理性能优化」一个可讲可练的切口，让下面的知识点有归属。","b":"KV 布局再好也要过总线。带宽账清了，Decode 的 Token 速度才有优化空间，否则生成慢会被误判成算力不够。","k":0},{"id":"c7-5","t":"7.5 · Token 生成速度优化","d":"主题「Token 生成速度优化」管端侧链路里这一段，下含：TTFT 首Token延迟、TPOT 与吞吐、Continuous Batching。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c7-5-1","t":"7.5.1 · TTFT 首Token延迟","d":"从发请求到第一个可用 token 出现的等待。端侧体感里它和 Prefill、视觉编码强绑定，常是验收硬指标。","kids":[],"w":"产品说「慢」，先拆成 TTFT 还是 Decode；两者治法完全不同。","b":"","k":2},{"id":"c7-5-2","t":"7.5.2 · TPOT 与吞吐","d":"TPOT 与吞吐：落在「Token 生成速度优化」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数","kids":[],"w":"弄清「TPOT 与吞吐」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c7-5-3","t":"7.5.3 · Continuous Batching","d":"Continuous Batching：落在「Token 生成速度优化」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数","kids":[],"w":"弄清「Continuous Batching」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「推理性能优化」一个可讲可练的切口，让下面的知识点有归属。","b":"带宽和 KV 有数，才优化 Decode 吞吐。自回归一步一 token 仍慢，下一步才上投机采样，别把算法招提前用。","k":0},{"id":"c7-6","t":"7.6 · 投机采样 Speculative Decoding","d":"主题「投机采样 Speculative Decoding」管端侧链路里这一段，下含：基本原理、Draft 来源、加速比与接受率。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c7-6-1","t":"7.6.1 · 基本原理","d":"基本原理：小draft模型连猜K个token，大模型并行验证纠正","kids":[],"w":"弄清「基本原理」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c7-6-2","t":"7.6.2 · Draft 来源","d":"Draft 来源：独立小模型 / 自推测(浅层) / N-gram近似","kids":[],"w":"弄清「Draft 来源」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c7-6-3","t":"7.6.3 · 加速比与接受率","d":"加速比与接受率：加速≈平均接受token数；接受率低反而慢","kids":[],"w":"弄清「加速比与接受率」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「推理性能优化」一个可讲可练的切口，让下面的知识点有归属。","b":"自回归太慢才投机：用小模型猜、大模型验。改的是算法，Attention/GEMM kernel 是另一层；两招别搅成一锅。","k":0},{"id":"c7-7","t":"7.7 · Attention / GEMM 内核","d":"主题「Attention / GEMM 内核」管端侧链路里这一段，下含：FlashAttention、Online Softmax、量化 GEMM、共享内存分块、bank conflict避免、寄存器。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c7-7-1","t":"7.7.1 · FlashAttention","d":"按相关度决定每个位置「看」哪些位置的信息。Transformer 里算力与访存大头之一，后面的融合、KV、量化都围着它转。","kids":[],"w":"性能热点图若 d":"c8-3-1","t":"8.3.1 · prefill 大矩阵乘、compute-bound","d":"提示词整段一次性进模型、算出首段表示并填满 KV 的阶段。往往决定首字等多久出来，算力更密。","kids":[],"w":"TTFT 差，先看 Prefill：序列长、视觉编码、是否多余重算。","b":"","k":2},{"id":"c8-3-2","t":"8.3.2 · decode 逐 token、读几 GB HBM、m","d":"一个接一个吐 token 的阶段，每步主要吃 KV 与带宽。体感「生成慢不慢」常栽在这里。","kids":[],"w":"交互跟手度看 Decode；带宽和 KV 布局比盲目加核数更管用。","b":"","k":2},{"id":"c8-3-3","t":"8.3.3 · decode 本质","d":"一个接一个吐 token 的阶段，每步主要吃 KV 与带宽。体感「生成慢不慢」常栽在这里。","kids":[],"w":"交互跟手度看 Decode；带宽和 KV 布局比盲目加核数更管用。","b":"","k":1},{"id":"c8-3-4","t":"8.3.4 · 阶段诊断","d":"阶段诊断：trtllm verbose 看 per-iteration；nsys 看 kernel 名；ncu 看 DRAM vs SM throughput","kids":[],"w":"弄清「阶段诊断」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c8-3-5","t":"8.3.5 · 优化清单","d":"优化清单：prefill: prompt cache、chunked prefill、bF16/FP8；decode: KV 量化、投机采样、GQA","kids":[],"w":"弄清「优化清单」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「附录 · 性能命令与平台开关」一个可讲可练的切口，让下面的知识点有归属。","b":"KV 布局之后要把生成拆成 Prefill 与 Decode。首字慢和跟手慢不是同一笔账；阶段认清，TTFT 指标才有意义。","k":1},{"id":"c8-4","t":"8.4 · 投机采样 Speculative Decoding","d":"主题「投机采样 Speculative Decoding」管端侧链路里这一段，下含：小 draft 模型猜 γ 个 token，大模型并、上限快 γ 倍，收益受接受率主导、TensorRT-LLM 配置、Medusa 头、收益与门槛。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c8-4-1","t":"8.4.1 · 小 draft 模型猜 γ 个 token，大模型并","d":"小 draft 模型猜 γ 个 token，大模型并：行验证，拒绝首错并以 target 分布重采样","kids":[],"w":"弄清「小 draft 模型猜 γ 个 token，大模型并」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c8-4-2","t":"8.4.2 · 上限快 γ 倍，收益受接受率主导","d":"上限快 γ 倍，收益受接受率主导：落在「投机采样 Speculative Decoding」里的具体点。先弄清它解决哪类问题、验收看什么信号，再去记命令和参数","kids":[],"w":"弄清「上限快 γ 倍，收益受接受率主导」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c8-4-3","t":"8.4.3 · TensorRT-LLM 配置","d":"面向 NVIDIA GPU 的推理栈：图优化、精度策略、引擎构建。车上/工控 GPU 路径常点名它。","kids":[],"w":"GPU 端侧选型时，先确认 TRT 版本与目标芯片是否匹配，再谈插件与精度。","b":"","k":2},{"id":"c8-4-4","t":"8.4.4 · Medusa 头","d":"Medusa 头：target 尾部挂多并行预测头省独立 draft 模型","kids":[],"w":"弄清「Medusa 头」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c8-4-5","t":"8.4.5 · 收益与门槛","d":"收益与门槛：实测常见 1.5×~3× decode 加速；draft 太弱/大 batch/带宽不饱和时无收益","kids":[],"w":"弄清「收益与门槛」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「附录 · 性能命令与平台开关」一个可讲可练的切口，让下面的知识点有归属。","b":"自回归太慢才投机：用小模型猜、大模型验。改的是算法，Attention/GEMM kernel 是另一层；两招别搅成一锅。","k":0},{"id":"c8-5","t":"8.5 · FlashAttention 与算子级认知","d":"主题「FlashAttention 与算子级认知」管端侧链路里这一段，下含：tiling+online softmax+融合，H、prefill 收益巨大，decode 瓶颈在 KV、TRT-LLM 开关、DLA 定点只扛规则 GEMM/量化线，attent、选 Jetson 看带宽而非 TOPS（AGX ~2、算子定位法。","kids":[{"id":"c8-5-1","t":"8.5.1 · tiling+online softmax+融合，H","d":"把相邻小算子并成一次 kernel，少写中间结果、少启动开销。编译器/引擎优化的常规招。","kids":[],"w":"Profiling 见一串碎算子，优先问能不能融合，再谈换精度。","b":"","k":1},{"id":"c8-5-2","t":"8.5.2 · prefill 收益巨大，decode 瓶颈在 KV","d":"提示词整段一次性进模型、算出首段表示并填满 KV 的阶段。往往决定首字等多久出来，算力更密。","kids":[],"w":"TTFT 差，先看 Prefill：序列长、视觉编码、是否多余重算。","b":"","k":2},{"id":"c8-5-3","t":"8.5.3 · TRT-LLM 开关","d":"TRT-LLM 开关：--gemm_plugin、--attention_plugin(auto/bf16/fp8)、--context_fmha","kids":[],"w":"弄清「TRT-LLM 开关」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c8-5-4","t":"8.5.4 · DLA 定点只扛规则 GEMM/量化线，attent","d":"DLA 定点只扛规则 GEMM/量化线，attent：把权重/激活从高精度数压到更少比特（如 INT8），换内存与算力，但要守住精度验收。它挂在「附录 · 性能命令与平台开关」下的「FlashAttention 与算子级认知」里，后面会拆 scale、校准与 PTQ/QAT","kids":[],"w":"让模型塞进端侧预算，是体积与算力交换精度的主手段。","b":"","k":1},{"id":"c8-5-5","t":"8.5.5 · 选 Jetson 看带宽而非 TOPS（AGX ~2","d":"选 Jetson 看带宽而非 TOPS（AGX ~2：选 Jetson 看带宽而非 TOPS（AGX ~204.8GB/s）","kids":[],"w":"弄清「选 Jetson 看带宽而非 TOPS（AGX ~2」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c8-5-6","t":"8.5.6 · 算子定位法","d":"算子定位法：三类算子 GEMM/Attention/RMSNorm・RoPE・Softmax，用 ncu 看 DRAM vs SM","kids":[],"w":"削掉多余访存与启动开销，常是性能优化的杠杆。","b":"","k":1}],"w":"给「附录 · 性能命令与平台开关」一个可讲可练的切口，让下面的知识点有归属。","b":"投机采样改算法，FlashAttention 改的是 Attention 实现。算子级认知立住，才谈 TTFT 指标和后面的引擎开关。","k":0},{"id":"c8-6","t":"8.6 · 性能指标定义与权衡 (TTFT/TPOT/ITL/throug…","d":"主题「性能指标定义与权衡 (TTFT/TPOT/ITL/throug…」管端侧链路里这一段，下含：指标定义、加大并发→吞吐↑但 TTFT/ITL 变长；SLO(、llama.cpp: TTFT=prompt eva。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c8-6-1","t":"8.6.1 · 指标定义","d":"用一小撮代表数据估激活分布，从而定 scale/阈值。校准集不代表线上分布，后面再精的 PTQ 也救不回来。","kids":[],"w":"PTQ 成败大半看校准：集子要覆盖主路径场景，别用「随手抽的几张图」糊弄。","b":"","k":0},{"id":"c8-6-2","t":"8.6.2 · 加大并发→吞吐↑但 TTFT/ITL 变长；SLO(","d":"从发请求到第一个可用 token 出现的等待。端侧体感里它和 Prefill、视觉编码强绑定，常是验收硬指标。","kids":[],"w":"产品说「慢」，先拆成 TTFT 还是 Decode；两者治法完全不同。","b":"","k":2},{"id":"c8-6-3","t":"8.6.3 · llama.cpp: TTFT=prompt eva","d":"从发请求到第一个可用 token 出现的等待。端侧体感里它和 Prefill、视觉编码强绑定，常是验收硬指标。","kids":[],"w":"产品说「慢」，先拆成 TTFT 还是 Decode；两者治法完全不同。","b":"","k":2}],"w":"给「附录 · 性能命令与平台开关」一个可讲可练的切口，让下面的知识点有归属。","b":"算子级认知之后，把体感收成 TTFT/TPOT/吞吐。指标权衡清楚，调参才有基线；没定义就改引擎，绿数字对不上产品。","k":1},{"id":"c8-7","t":"8.7 · 调优实验框架：基线→profiler→逐项改参","d":"主题「调优实验框架：基线→profiler→逐项改参」管端侧链路里这一段，下含：核心纪律、四步闭环、记录模板。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c8-7-1","t":"8.7.1 · 核心纪律","d":"核心纪律：先 nsys/ncu 拿证据再改参，每次只改一个变量","kids":[],"w":"弄清「核心纪律」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c8-7-2","t":"8.7.2 · 四步闭环","d":"四步闭环：Step0 FP16 基线 → Step1 profiler 定位三类瓶颈 → Step2 逐项改参 → Step3 compare_logits 精度护栏","kids":[],"w":"弄清「四步闭环」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c8-7-3","t":"8.7.3 · 记录模板","d":"记录模板：日期/GPU/模型量化/参数/TTFT/ITL/throughput/瓶颈算子/收益","kids":[],"w":"弄清「记录模板」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「附录 · 性能命令与平台开关」一个可讲可练的切口，让下面的知识点有归属。","b":"指标定义清楚，才按基线→profiler→逐项改参跑。实验框架有了，TensorRT-LLM 量化选型才不是碰运气。","k":0},{"id":"c8-8","t":"8.8 · TensorRT-LLM 量化选型与命令流","d":"主题「TensorRT-LLM 量化选型与命令流」管端侧链路里这一段，下含：位宽选型、硬件限制、命令流、KV Cache 量化。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c8-8-1","t":"8.8.1 · 位宽选型","d":"用多少比特存一个数：FP16 / INT8 / INT4 等。位宽越低越省内存和带宽，精度也更容易掉。选档要对齐芯片原生算子和业务验收线，别只看体积。","kids":[],"w":"这是端侧「塞不塞得下」的第一扳手：位宽定了，后面的 scale、校准、性能账才有意义。","b":"","k":1},{"id":"c8-8-2","t":"8.8.2 · 硬件限制","d":"硬件限制：Ampere 无 FP8；LLM 瓶颈在权重带宽 weight-bound，INT4 砍 1/4 搬运","kids":[],"w":"弄清「硬件限制」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c8-8-3","t":"8.8.3 · 命令流","d":"命令流：convert_checkpoint.py --dtype float16 → trtllm-build → quantize.py --qformat int8_sq/awq/gptq →…","kids":[],"w":"弄清「命令流」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c8-8-4","t":"8.8.4 · KV Cache 量化","d":"生成时把已算过的 Key/Value 存起来复用，Decode 就不用整段重算 Attention。省算力，但占内存，长度一长就胀。","kids":[],"w":"端侧长对话的内存墙多半在这：优化吞吐前先算清 KV 占多少。","b":"","k":2}],"w":"给「附录 · 性能命令与平台开关」一个可讲可练的切口，让下面的知识点有归属。","b":"调参框架有了，才在 TensorRT-LLM 里选量化档和命令流。选型落地后，用精度-资源矩阵收口，再决定要不要转 GGUF。","k":1},{"id":"c8-9","t":"8.9 · 量化精度评估与精度-资源权衡矩阵","d":"主题「量化精度评估与精度-资源权衡矩阵」管端侧链路里这一段，下含：PPL 评估、logits 对比、权衡矩阵、校准坑。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c8-9-1","t":"8.9.1 · PPL 评估","d":"PPL 评估：eval_ppl.py stride=512；PPL 增幅 <0.5 且 top-1 一致率 >0.9 可用","kids":[],"w":"弄清「PPL 评估」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c8-9-2","t":"8.9.2 · logits 对比","d":"logits 对比：固定同 prompt+seed，比 KL/余弦/L2/top-k，4 铁律可比","kids":[],"w":"弄清「logits 对比」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c8-9-3","t":"8.9.3 · 权衡矩阵","d":"权衡矩阵：bench_matrix.py 对(模型,位宽)跑 PPL+KL+显存+吞吐，低位宽 ADC 递进验证","kids":[],"w":"弄清「权衡矩阵」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c8-9-4","t":"8.9.4 · 校准坑","d":"用一小撮代表数据估激活分布，从而定 scale/阈值。校准集不代表线上分布，后面再精的 PTQ 也救不回来。","kids":[],"w":"PTQ 成败大半看校准：集子要覆盖主路径场景，别用「随手抽的几张图」糊弄。","b":"","k":0}],"w":"给「附录 · 性能命令与平台开关」一个可讲可练的切口，让下面的知识点有归属。","b":"量化改完必须对账：余弦、偏差、任务指标。尺子没过就动轻量化，等于在误差上叠误差；LLM 还要另加生成向指标。","k":0},{"id":"c8-10","t":"8.10 · GGUF 格式与 Q4_K_M / K-quant 量化","d":"主题「GGUF 格式与 Q4_K_M / K-quant 量化」管端侧链路里这一段，下含：GGUF 格式、量化谱系、Q4_K_M 原理、LLM 量化特殊性、转换命令。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c8-10-1","t":"8.10.1 · GGUF 格式","d":"GGUF 格式：llama.cpp 格式，含 Header/Tensor Info/Tokenizer/超参/Tensor Data","kids":[],"w":"弄清「GGUF 格式」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c8-10-2","t":"8.10.2 · 量化谱系","d":"量化谱系：把权重/激活从高精度数压到更少比特（如 INT8），换内存与算力，但要守住精度验收。它挂在「附录 · 性能命令与平台开关」下的「GGUF 格式与 Q4_K_M / K-quant 量化」里，后面会拆 scale、校准与 PTQ/QAT","kids":[],"w":"让模型塞进端侧预算，是体积与算力交换精度的主手段。","b":"","k":0},{"id":"c8-10-3","t":"8.10.3 · Q4_K_M 原理","d":"Q4_K_M 原理：4bit+K-quant(重要性分组)+Medium 粒度；super-block(32)→sub-block(16) 算 scale/zp","kids":[],"w":"弄清「Q4_K_M 原理」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c8-10-4","t":"8.10.4 · LLM 量化特殊性","d":"LLM 量化特殊性：把权重/激活从高精度数压到更少比特（如 INT8），换内存与算力，但要守住精度验收。它挂在「附录 · 性能命令与平台开关」下的「GGUF 格式与 Q4_K_M / K-quant 量化」里，后面会拆 scale、校准与 PTQ/QAT","kids":[],"w":"让模型塞进端侧预算，是体积与算力交换精度的主手段。","b":"","k":0},{"id":"c8-10-5","t":"8.10.5 · 转换命令","d":"转换命令：convert_hf_to_gguf.py --outtype q4_k_m，或 convert.py→llama-quantize","kids":[],"w":"保证训练成果能交到推理引擎，是主链路第一道闸。","b":"","k":0}],"w":"给「附录 · 性能命令与平台开关」一个可讲可练的切口，让下面的知识点有归属。","b":"精度-资源权衡有了，才落到 GGUF 档位。Q4_K_M 这类格式决定体积和掉点，下一步才是 llama.cpp 后端怎么把档跑起来。","k":0},{"id":"c8-11","t":"8.11 · llama.cpp/GGML 编译后端与 kernel dis…","d":"主题「llama.cpp/GGML 编译后端与 kernel dis…」管端侧链路里这一段，下含：三层关系、GGML 分层、kernel dispatch、CMake 参数、运行卸载。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c8-11-1","t":"8.11.1 · 三层关系","d":"三层关系：GGUF 存权重、GGML 张量计算库、llama.cpp 上层推理应用","kids":[],"w":"弄清「三层关系」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c8-11-2","t":"8.11.2 · GGML 分层","d":"GGML 分层：计算层 ggml_compute_forward_ → 后端 CPU(SSE/AVX2/AVX512)/CUDA/Vulkan/Metal/SYCL","kids":[],"w":"弄清「GGML 分层」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c8-11-3","t":"8.11.3 · kernel dispatch","d":"kernel dispatch：编译期 #if 静态选 AVX512>AVX2>NEON；CUDA 运行时 m==1 走 GEMV、大矩阵走 cuBLAS","kids":[],"w":"弄清「kernel dispatch」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c8-11-4","t":"8.11.4 · CMake 参数","d":"CMake 参数：-DGGML_CUDA=ON、-DCMAKE_CUDA_ARCHITECTURES=\"75;80;86;89\" 钉架构","kids":[],"w":"弄清「CMake 参数」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c8-11-5","t":"8.11.5 · 运行卸载","d":"运行卸载：-ngl 32 分层 GPU offload；llama-bench/llama-cli 实测对比","kids":[],"w":"弄清「运行卸载」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「附录 · 性能命令与平台开关」一个可讲可练的切口，让下面的知识点有归属。","b":"LLM 端侧不是再跑一条 CV 量化。llama.cpp/GGUF 管权重，KV 管生成时内存；这两本账清了，才对照各家车载引擎。","k":0},{"id":"c8-12","t":"8.12 · Jetson/Orin 平台特性与端到端工程化交付","d":"主题「Jetson/Orin 平台特性与端到端工程化交付」管端侧链路里这一段，下含：平台认知、engine 强绑定、build 参数、量化纵深、一键化流水线、端侧验收。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c8-12-1","t":"8.12.1 · 平台认知","d":"平台认知：Orin Ampere 无 FP8、共享 DRAM；LLM 直吃 HF 权重绕开 ONNX","kids":[],"w":"弄清「平台认知」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c8-12-2","t":"8.12.2 · engine 强绑定","d":"engine 强绑定：engine 须 Orin 本地 build；版本铁律 TRT-LLMCUDATRTJP 钉死","kids":[],"w":  视觉语言对齐、AI 编译器栈(LLVM/MLIR/TVM/图编译)","kids":[{"id":"c12-1","t":"12.1 · Transformer 编码器-解码器整体架构与核心算子","d":"主题「Transformer 编码器-解码器整体架构与核心算子」管端侧链路里这一段，下含：架构组成、Self-Attention、计算五步、Multi-Head、FFN、PyTorch 实现。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c12-1-1","t":"12.1.1 · 架构组成","d":"架构组成：Encoder 输出上下文表示，Decoder 自回归生成，串接 Cross-Attention","kids":[],"w":"弄清「架构组成」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c12-1-2","t":"12.1.2 · Self-Attention","d":"按相关度决定每个位置「看」哪些位置的信息。Transformer 里算力与访存大头之一，后面的融合、KV、量化都围着它转。","kids":[],"w":"性能热点图若扎在 Attention，下一步才是融合、量化或改 GQA/MQA。","b":"","k":2},{"id":"c12-1-3","t":"12.1.3 · 计算五步","d":"计算五步：线性投影 Q/K/V→Q·K 得分→√d_k 缩放→softmax→加权求和 V","kids":[],"w":"弄清「计算五步」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c12-1-4","t":"12.1.4 · Multi-Head","d":"Multi-Head：MultiHead(Q,K,V)=Concat(head_1..head_h)·W_O，多子空间增强表达","kids":[],"w":"弄清「Multi-Head」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c12-1-5","t":"12.1.5 · FFN","d":"FFN：(x)=GELU(xW_1+b_1)·W_2+b_2，隐藏维为 mlp_ratio=4 倍","kids":[],"w":"弄清「FFN」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c12-1-6","t":"12.1.6 · PyTorch 实现","d":"PyTorch 实现：qkv=nn.Linear(d,d3) 一次投影，split 出 q/k/v，masked_fill 因果 mask","kids":[],"w":"弄清「PyTorch 实现」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「Transformer/VLM · AI编译器」一个可讲可练的切口，让下面的知识点有归属。","b":"平台对照之前，先把 Transformer 编码器-解码器和核心算子立住。主干不清，Decoder-only 和 KV 变体都像名词卡片。","k":1},{"id":"c12-2","t":"12.2 · Decoder-only 架构与因果注意力（Causal At…","d":"主题「Decoder-only 架构与因果注意力（Causal At…」管端侧链路里这一段，下含：架构特点、因果 mask、Pre-LayerNorm、完整 Decoder、自回归生成。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c12-2-1","t":"12.2.1 · 架构特点","d":"架构特点：GPT/LLaMA/Qwen 用 Decoder-only：RoPE、单向因果、Next Token Prediction","kids":[],"w":"弄清「架构特点」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c12-2-2","t":"12.2.2 · 因果 mask","d":"因果 mask：上三角 -inf 掩码，代码 torch.tril+masked_fill(float('-inf'))","kids":[],"w":"弄清「因果 mask」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c12-2-3","t":"12.2.3 · Pre-LayerNorm","d":"Pre-LayerNorm：归一化先于子层：x=x+Attention(LN1(x)); x=x+FFN(LN2(x))","kids":[],"w":"弄清「Pre-LayerNorm」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c12-2-4","t":"12.2.4 · 完整 Decoder","d":"一个接一个吐 token 的阶段，每步主要吃 KV 与带宽。体感「生成慢不慢」常栽在这里。","kids":[],"w":"交互跟手度看 Decode；带宽和 KV 布局比盲目加核数更管用。","b":"","k":2},{"id":"c12-2-5","t":"12.2.5 · 自回归生成","d":"自回归生成：取最后位置 logits/temperature 后 torch.multinomial 采样拼接","kids":[],"w":"弄清「自回归生成」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「Transformer/VLM · AI编译器」一个可讲可练的切口，让下面的知识点有归属。","b":"KV 布局之后要把生成拆成 Prefill 与 Decode。首字慢和跟手慢不是同一笔账；阶段认清，TTFT 指标才有意义。","k":1},{"id":"c12-3","t":"12.3 · MHA / GQA / MQA 注意力变体与 KV Cache…","d":"主题「MHA / GQA / MQA 注意力变体与 KV Cache…」管端侧链路里这一段，下含：三种变体、KV Cache 复用、显存公式、优化方向。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c12-3-1","t":"12.3.1 · 三种变体","d":"三种变体：MHA 每头独立 K/V；GQA 组内共享 KV(LLaMA 2/3)；MQA 全部头共享一组 KV","kids":[],"w":"弄清「三种变体」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c12-3-2","t":"12.3.2 · KV Cache 复用","d":"生成时把已算过的 Key/Value 存起来复用，Decode 就不用整段重算 Attention。省算力，但占内存，长度一长就胀。","kids":[],"w":"端侧长对话的内存墙多半在这：优化吞吐前先算清 KV 占多少。","b":"","k":2},{"id":"c12-3-3","t":"12.3.3 · 显存公式","d":"显存公式：每 token=2×num_layers×num_heads×head_dim×dtype_size，例 LLaMA-7B 约 512KB/token","kids":[],"w":"弄清「显存公式」，排障和选型时才知道该动哪一环。","b":"","k":1},{"id":"c12-3-4","t":"12.3.4 · 优化方向","d":"优化方向：GQA/MQA 减 KV、INT8/INT4 量化 KV Cache、PageAttention 分页减少碎片","kids":[],"w":"弄清「优化方向」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「Transformer/VLM · AI编译器」一个可讲可练的切口，让下面的知识点有归属。","b":"图优化省的是计算，长对话吃的是 KV。缓存账管住了再抠 DDR 带宽；KV 没算清，Token 速度优化只是加核空转。","k":1},{"id":"c12-4","t":"12.4 · RoPE 旋转位置编码与 RMSNorm 归一化","d":"主题「RoPE 旋转位置编码与 RMSNorm 归一化」管端侧链路里这一段，下含：q'_m=R_m·q_m、k'_n=R_n·k_n，、相对位置感知、超长外推、不影响向量范数、绝对位置编码、RMSNorm(x)=γ·x/RMS(x)，RMS(、端侧更偏好 RMSNorm，效果与 LayerNor。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c12-4-1","t":"12.4.1 · q'_m=R_m·q_m、k'_n=R_n·k_n，","d":"q'_m=R_m·q_m、k'_n=R_n·k_n，：θ_i=base^(-2i/d)，base=10000","kids":[],"w":"弄清「q'_m=R_m·q_m、k'_n=R_n·k_n，」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c12-4-2","t":"12.4.2 · 相对位置感知、超长外推、不影响向量范数","d":"相对位置感知、超长外推、不影响向量范数：相对位置感知、超长外推、不影响向量范数","kids":[],"w":"弄清「相对位置感知、超长外推、不影响向量范数」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c12-4-3","t":"12.4.3 · 绝对位置编码","d":"绝对位置编码：PE(pos,2i)=sin(pos/10000^(2i/d_model)) 余弦对，因 Self-Attention 置换不变","kids":[],"w":"弄清「绝对位置编码」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c12-4-4","t":"12.4.4 · RMSNorm(x)=γ·x/RMS(x)，RMS(","d":"RMSNorm(x)=γ·x/RMS(x)，RMS(：x)=√(mean(x²)+ε)，只除 RMS 不中心化","kids":[],"w":"弄清「RMSNorm(x)=γ·x/RMS(x)，RMS(」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c12-4-5","t":"12.4.5 · 端侧更偏好 RMSNorm，效果与 LayerNor","d":"端侧更偏好 RMSNorm，效果与 LayerNor：端侧更偏好 RMSNorm，效果与 LayerNorm 相当","kids":[],"w":"弄清「端侧更偏好 RMSNorm，效果与 LayerNor」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「Transformer/VLM · AI编译器」一个可讲可练的切口，让下面的知识点有归属。","b":"注意力变体决定 KV 形状，RoPE/RMSNorm 决定位置和数值稳不稳。这两处钉住，FFN 门控变体才好对算子。","k":0},{"id":"c12-5","t":"12.5 · FFN 变体：SwiGLU 激活与门控线性单元","d":"主题「FFN 变体：SwiGLU 激活与门控线性单元」管端侧链路里这一段，下含：SwiGLU、三权重 W_gate/W_up/W_down，中间维、GELU 用于 ViT/标准 Transformer、编译视角。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c12-5-1","t":"12.5.1 · SwiGLU","d":"SwiGLU：Swish(x·W_gate)·(x·W_up)·W_down，Swish(x)=x·sigmoid(x)","kids":[],"w":"弄清「SwiGLU」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c12-5-2","t":"12.5.2 · 三权重 W_gate/W_up/W_down，中间维","d":"三权重 W_gate/W_up/W_down，中间维：三权重 W_gate/W_up/W_down，中间维取标准 FFN 的 2/3、效果更好","kids":[],"w":"弄清「三权重 W_gate/W_up/W_down，中间维」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c12-5-3","t":"12.5.3 · GELU 用于 ViT/标准 Transformer","d":"堆叠自注意力 + 前馈块做序列建模的主干。端侧大模型几乎都绕不开它。","kids":[],"w":"后面量化、编译、KV、算子支持，默认都假设图是 Transformer 族。","b":"","k":2},{"id":"c12-5-4","t":"12.5.4 · 编译视角","d":"编译视角：逐元素激活可与 Linear 算子融合(Fusion)减少中间回写","kids":[],"w":"削掉多余访存与启动开销，常是性能优化的杠杆。","b":"","k":0}],"w":"给「Transformer/VLM · AI编译器」一个可讲可练的切口，让下面的知识点有归属。","b":"位置编码稳定后，看 FFN/SwiGLU 吃掉的那截算力。前馈变体认清，VLM 视觉塔和交叉注意力才好接到同一套算子账。","k":0},{"id":"c12-6","t":"12.6 · VLM 视觉语言模型：ViT 视觉编码器与交叉注意力对齐","d":"主题「VLM 视觉语言模型：ViT 视觉编码器与交叉注意力对齐」管端侧链路里这一段，下含：Patch Embedding 切 16×16 pa、输出 [B,197,768]（224/16=14，1、交叉注意力、跨模态对齐、部署难点。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id": ime；SNPE/QNN/Genie 最终都落到它；系统集成优先 QAIRT C API（ABI 稳定），应…","kids":[],"w":"把图画成板上可跑的高效执行，关乎真实延迟。","b":"","k":0},{"id":"c13-1-4","t":"13.1.4 · Genie / GenAI Inference E…","d":"Genie / GenAI Inference E…：在 QNN 之上做 LLM/VLM 自回归编排（Tokenizer、KV、采样、多 binary）；CLI 常见 genie-t2t-run","kids":[],"w":"弄清「Genie / GenAI Inference E…」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c13-1-5","t":"13.1.5 · 选型口诀","d":"选型口诀：CV/检测快速出包 → SNPE+DLC；要抠算子落点与 HTP 缓存 → QNN+context；要跑生成式 → Genie；要写长期中间件 → QAIRT C","kids":[],"w":"弄清「选型口诀」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c13-1-6","t":"13.1.6 · Hexagon DSP","d":"高通侧把模型搬到 Hexagon/NPU 的工具与运行时一环。手机/车机 Qualcomm 方案会反复遇到。","kids":[],"w":"高通板上「能转不能跑」多半卡在 DSP/NPU 算子覆盖与上下文配置。","b":"","k":1},{"id":"c13-1-7","t":"13.1.7 · HTP （Hexagon Tensor Proces","d":"高通侧把模型搬到 Hexagon/NPU 的工具与运行时一环。手机/车机 Qualcomm 方案会反复遇到。","kids":[],"w":"高通板上「能转不能跑」多半卡在 DSP/NPU 算子覆盖与上下文配置。","b":"","k":0},{"id":"c13-1-8","t":"13.1.8 · HMX","d":"HMX：Hexagon 内矩阵加速，偏 INT4/INT8 GEMM；不是第三个独立 SDK，由 HTP 路径调度","kids":[],"w":"弄清「HMX」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c13-1-9","t":"13.1.9 · HVX","d":"HVX：矢量扩展，偏逐元素/激活/布局变换；与 HMX 分工「矩阵 vs 矢量」","kids":[],"w":"弄清「HVX」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c13-1-10","t":"13.1.10 · 工程含义","d":"工程含义：宣传 TOPS 常含 HMX 峰值；若图大量落 CPU/GPU，实测只有纸面几分之一","kids":[],"w":"弄清「工程含义」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c13-1-11","t":"13.1.11 · 验证","d":"验证：qnn-profiler / 厂商 ADX 看逐算子 backend；目标是敏感大算子（Conv/GEMM/Attention 块）上 HTP","kids":[],"w":"弄清「验证」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c13-1-12","t":"13.1.12 · 坑","d":"坑：同一 SoC「系统设置开了 AI」≠ 你的 .so 链到了正确 libQnnHtp.so；App 打进了 stub 或旧版 so 会 silent 回落","kids":[],"w":"弄清「坑」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c13-1-13","t":"13.1.13 · 坑1 · 版本混用","d":"坑1 · 版本混用：DLC 与 QNN 跨小版本 → Load fail 或诡异数值","kids":[],"w":"弄清「坑1 · 版本混用」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c13-1-14","t":"13.1.14 · 坑2 · 未量化上 HTP","d":"坑2 · 未量化上 HTP：把权重/激活从高精度数压到更少比特（如 INT8），换内存与算力，但要守住精度验收。它挂在「平台工具链扩展」下的「高通：SNPE / QNN / QAIRT / Genie 与…」里，后面会拆 scale、校准与 PTQ/QAT"," line预筛：内存→Decode带宽→Pre、语音助手Decode>20 token/s；蒸馏+量。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c15-9-1","t":"15.9.1 · Roofline预筛：内存→Decode带宽→Pre","d":"一个接一个吐 token 的阶段，每步主要吃 KV 与带宽。体感「生成慢不慢」常栽在这里。","kids":[],"w":"交互跟手度看 Decode；带宽和 KV 布局比盲目加核数更管用。","b":"","k":2},{"id":"c15-9-2","t":"15.9.2 · 语音助手Decode>20 token/s；蒸馏+量","d":"一个接一个吐 token 的阶段，每步主要吃 KV 与带宽。体感「生成慢不慢」常栽在这里。","kids":[],"w":"交互跟手度看 Decode；带宽和 KV 布局比盲目加核数更管用。","b":"","k":2}],"w":"给「端侧工程化 · 量产落地」一个可讲可练的切口，让下面的知识点有归属。","b":"先把车规量产工程约束与量产思维的验收做实，这段把端侧LLM/VLM模型选型与补上；下一步才动VLM多模态端侧部署与差异化那层，否则容易跳步。","k":0},{"id":"c15-10","t":"15.10 · VLM多模态端侧部署与差异化精度策略","d":"主题「VLM多模态端侧部署与差异化精度策略」管端侧链路里这一段，下含：ViT量化敏感留INT8；LLM用W4A16/W4A、量化致特征对齐偏移/幻觉↑，需整体精度验证。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c15-10-1","t":"15.10.1 · ViT量化敏感留INT8；LLM用W4A16/W4A","d":"ViT量化敏感留INT8；LLM用W4A16/W4A：把权重/激活从高精度数压到更少比特（如 INT8），换内存与算力，但要守住精度验收。它挂在「端侧工程化 · 量产落地」下的「VLM多模态端侧部署与差异化精度策略」里，后面会拆 scale、校准与 PTQ/QAT","kids":[],"w":"让模型塞进端侧预算，是体积与算力交换精度的主手段。","b":"","k":0},{"id":"c15-10-2","t":"15.10.2 · 量化致特征对齐偏移/幻觉↑，需整体精度验证","d":"量化致特征对齐偏移/幻觉↑，需整体精度验证：量化致特征对齐偏移/幻觉↑，需整体精度验证","kids":[],"w":"让模型塞进端侧预算，是体积与算力交换精度的主手段。","b":"","k":1}],"w":"给「端侧工程化 · 量产落地」一个可讲可练的切口，让下面的知识点有归属。","b":"模型预筛过了，VLM 要对视觉塔和语言塔用不同精度。策略定了，语音等其它模态才能复用同一套端侧纪律。","k":0},{"id":"c15-11","t":"15.11 · 语音降噪与增强的端侧实现（RNNNoise/DCCRN/Ful…","d":"主题「语音降噪与增强的端侧实现（RNNNoise/DCCRN/Ful…」管端侧链路里这一段，下含：RNNNoise：Bark 22维+3层GRU约70、DCCRN复数卷积+LSTM；FullSubNet全。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c15-11-1","t":"15.11.1 · RNNNoise：Bark 22维+3层GRU约70","d":"RNNNoise：Bark 22维+3层GRU约70：RNNNoise：Bark 22维+3层GRU约70K参数，可跑Cortex-M7","kids":[],"w":"弄清「RNNNoise：Bark 22维+3层GRU约70」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c15-11-2","t":"15.11.2 · DCCRN复数卷积+LSTM；FullSubNet全","d":"DCCRN复数卷积+LSTM；FullSubNet全：DCCRN复数卷积+LSTM；FullSubNet全带+子带双路径最优","kids":[],"w":"弄清「DCCRN复数卷积+LSTM；FullSubNet全」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「端侧工程化 · 量产落地」一个可讲可练的切口，让下面的知识点有归属。","b":"VLM 精度策略之后，语音降噪是另一条端侧网。模型选对了，流式与动态量化才接得上，别把 LLM 的 KV 账抄过来。","k":0},{"id":"c15-12","t":"15.12 · 语音增强端侧部署优化：流式推理与INT8动态量化","d":"主题「语音增强端侧部署优化：流式推理与INT8动态量化」管端侧链路里这一段，下含：OnnxWrapper展平h/c为输入输出，opse、MCU限GRU+INT8参数<200K；INT8后P。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c15-12-1","t":"15.12.1 · OnnxWrapper展平h/c为输入输出，opse","d":"跨框架中间格式，常作训练框架到推理引擎的交接面。图对不对、算子齐不齐，先在这里验。","kids":[],"w":"转换失败优先查 ONNX：动态 shape、自定义算子、opset 版本。","b":"","k":2},{"id":"c15-12-2","t":"15.12.2 · MCU限GRU+INT8参数<200K；INT8后P","d":"MCU限GRU+INT8参数<200K；INT8后P：一种具体数值精度/位宽选择；选哪档直接决定内存、速度与精度三角怎么折中。它挂在「端侧工程化 · 量产落地」下的「语音增强端侧部署优化：流式推理与INT8动态量化」里，要和硬件原生能力对齐","kids":[],"w":"让模型塞进端侧预算，是体积与算力交换精度的主手段。","b":"","k":0}],"w":"给「端侧工程化 · 量产落地」一个可讲可练的切口，让下面的知识点有归属。","b":"语音增强模型定了，再做流式和 INT8 动态量化。实时链路跑稳，算子级 profiling 才有音频路径可对，不跟 LLM 抢同一套指标。","k":0},{"id":"c15-13","t":"15.13 · 算子级性能调优与三层Profiling方法论","d":"主题「算子级性能调优与三层Profiling方法论」管端侧链路里这一段，下含：先确认工具链正常(OMC 20MB正常vs 37MB、双层评估：逐层余弦>99%+任务级mAP；敏感层诊断。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c15-13-1","t":"15.13.1 · 先确认工具链正常(OMC 20MB正常vs 37MB","d":"先确认工具链正常(OMC 20MB正常vs 37MB：先确认工具链正常(OMC 20MB正常vs 37MB异常)再优化","kids":[],"w":"弄清「先确认工具链正常(OMC 20MB正常vs 37MB」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c15-13-2","t":"15.13.2 · 双层评估：逐层余弦>99%+任务级mAP；敏感层诊断","d":"双层评估：逐层余弦>99%+任务级mAP；敏感层诊断：双层评估：逐层余弦>99%+任务级mAP；敏感层诊断量化坍陷","kids":[],"w":"弄清「双层评估：逐层余弦>99%+任务级mAP；敏感层诊断」，排障和选型时才知道该动哪一环。","b":"","k":0}],"w":"给「端侧工程化 · 量产落地」一个可讲可练的切口，让下面的知识点有归属。","b":"语音和 LLM 路径都有了，用三层 profiling 把热点钉到算子。这一层是量产优化的收口，前面 Roofline 没有算子证据就还是估计。","k":0}],"w":"给学习路径一个章节锚点，排障时先回到这一章的目标。","b":"板子会跑了，把 LLM/VLM 从训练到车机、QNN/TRT 迁移、车规约束串成量产路径。路径有了，再收流水线与门禁。","k":0},{"id":"c16","t":"16 · 工程化与量产","d":"「工程化与量产」这一章回答端侧部署里一块完整问题。下含主题：自动化流水线、回归验证、资源评估、落地沉淀与文档。先建立章目标，再进 1.x 主题与术语，避免跳着背命令","kids":[{"id":"c16-1","t":"16.1 · 自动化流水线","d":"主题「自动化流水线」管端侧链路里这一段，下含：编排脚本、CI/CD、版本管理、参数化配置。先搞清这段的验收标准，再逐个点开知识点，别把目录当正文。","kids":[{"id":"c16-1-1","t":"16.1.1 · 编排脚本","d":"编排脚本：Shell/Python 串联 转换→量化→编译→验证，一键跑通","kids":[],"w":"弄清「编排脚本」，排障和选型时才知道该动哪一环。","b":"","k":0},{"id":"c16-1-2","t":"16.1.2 · CI/CD","d":"CI/ /* === SLIDE CONTROLLER === */
class SlidePresentation {
    constructor() {
        this.slides = document.querySelectorAll(".slide");
        this.currentSlide = 0;
        this.stage = document.getElementById("deckStage");
        this.setupStageScale();
        this.setupKeyboardNav();
        this.setupTouchNav();
        this.showSlide(0);
        document.getElementById("prevSlide").onclick = () => this.showSlide(this.currentSlide - 1);
        document.getElementById("nextSlide").onclick = () => this.showSlide(this.currentSlide + 1);
        document.getElementById("enterMap").onclick = () => this.showSlide(1);
    }
    setupStageScale() {
        const scale = () => {
            const factor = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
            const x = (window.innerWidth - 1920 * factor) / 2;
            const y = (window.innerHeight - 1080 * factor) / 2;
            this.stage.style.transform = `translate(${x}px, ${y}px) scale(${factor})`;
        };
        scale();
        window.addEventListener("resize", scale);
    }
    setupKeyboardNav() {
        document.addEventListener("keydown", (e) => {
            if (e.target && (e.target.isContentEditable || ["INPUT","TEXTAREA"].includes(e.target.tagName))) return;
            if (e.key === "e" || e.key === "E") return;
            if (this.currentSlide === 1 && ["ArrowUp","ArrowDown","l","L","r","R","0"].includes(e.key)) return;
            if (["ArrowRight"," ","PageDown"].includes(e.key)) { e.preventDefault(); this.showSlide(this.currentSlide + 1); }
            if (["ArrowLeft","PageUp"].includes(e.key)) { e.preventDefault(); this.showSlide(this.currentSlide - 1); }
        });
    }
    setupTouchNav() {
        let x0 = null;
        this.stage.addEventListener("touchstart", (e) => { x0 = e.changedTouches[0].screenX; }, {passive:true});
        this.stage.addEventListener("touchend", (e) => {
            if (this.currentSlide === 1) { x0 = null; return; }
            if (x0 == null) return;
            const dx = e.changedTouches[0].screenX - x0;
            if (dx < -60) this.showSlide(this.currentSlide + 1);
            if (dx > 60) this.showSlide(this.currentSlide - 1);
            x0 = null;
        });
        this.stage.addEventListener("wheel", (e) => {
            if (this.currentSlide === 1) return;
            if (Math.abs(e.deltaY) < 30) return;
            e.preventDefault();
            this.showSlide(this.currentSlide + (e.deltaY > 0 ? 1 : -1));
        }, {passive:false});
    }
    showSlide(index) {
        this.currentSlide = Math.max(0, Math.min(index, this.slides.length - 1));
        this.slides.forEach((slide, i) => {
            slide.classList.toggle("active", i === this.currentSlide);
            slide.classList.toggle("visible", i === this.currentSlide);
        });
        document.getElementById("pageLabel").textContent = `${this.currentSlide + 1} / ${this.slides.length}`;
        if (this.currentSlide === 1) requestAnimationFrame(() => {
            MapApp.syncCanvasSize();
            MapApp.drawWires();
        });
    }
}
